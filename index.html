// ===== To-Do's Pop-up (persönlich, an den Microsoft-Login gebunden) =====
let personalTodos = [];
let currentUserId = null;
let currentUserName = null;

function getCoachName(){
  if(currentUserName) return currentUserName;
  let saved = localStorage.getItem('coach_display_name');
  if(saved) return saved;
  const entered = prompt('Wie heißt du? (wird bei deinen Coachings angezeigt)');
  if(entered && entered.trim()){
    saved = entered.trim();
    localStorage.setItem('coach_display_name', saved);
    return saved;
  }
  return 'Unbekannt';
}

async function fetchCurrentUser(){
  try{
    const resp = await graphFetch('/me?$select=mail,userPrincipalName,displayName,id');
    if(resp && resp.ok){
      const data = await resp.json();
      currentUserId = (data.mail || data.userPrincipalName || data.id || '').toLowerCase();
      currentUserName = data.displayName || '';
      const nameEl = document.getElementById('logged-in-name');
      if(nameEl){
        nameEl.textContent = currentUserName ? ('Angemeldet als ' + currentUserName) : '';
        nameEl.style.display = currentUserName ? '' : 'none';
      }
      // Excel-Sync greift direkt auf Ioannis' persönliches OneDrive zu und funktioniert deshalb
      // nur bei ihm - bei allen anderen Führungskräften kommt sonst ein 403 accessDenied.
      // Button daher nur zeigen, wenn wirklich Ioannis eingeloggt ist.
      const eb = document.getElementById('excel-sync-btn');
      if(eb) eb.style.display = (currentUserName === 'Ioannis Fasoulas') ? '' : 'none';
      // Falls vorher lokal (ohne Login) Einträge gesammelt wurden, einmalig übernehmen
      if(currentUserId){
        const local = JSON.parse(localStorage.getItem('personal_todos')||'[]');
        if(local.length && !(state.todosByUser[currentUserId] && state.todosByUser[currentUserId].length)){
          state.todosByUser[currentUserId] = local;
          localStorage.removeItem('personal_todos');
          scheduleSave();
        }
      }
      loadTodos();
      updateTodoFabBadge();
      updateTodoTicker();
      const overlay = document.getElementById('todo-modal-overlay');
      if(overlay) renderTodoBody();
    } else if(resp) {
      console.warn('fetchCurrentUser fehlgeschlagen:', resp.status);
    }
  }catch(e){ console.warn('fetchCurrentUser Fehler:', e.message); }
}

function loadTodos(){
  if(currentUserId){
    personalTodos = state.todosByUser[currentUserId] || (state.todosByUser[currentUserId] = []);
  } else {
    try{ personalTodos = JSON.parse(localStorage.getItem('personal_todos')||'[]'); }
    catch(e){ personalTodos = []; }
  }
}
function saveTodos(){
  if(currentUserId){
    state.todosByUser[currentUserId] = personalTodos;
    scheduleSave();
  } else {
    try{ localStorage.setItem('personal_todos', JSON.stringify(personalTodos)); }
    catch(e){ /* localStorage evtl. nicht verfügbar */ }
  }
}
function updateTodoFabBadge(){
  const badge = document.getElementById('todo-fab-badge');
  if(!badge) return;
  const openCount = personalTodos.filter(t=>!t.done).length;
  badge.textContent = openCount;
  badge.style.display = openCount > 0 ? '' : 'none';
}
function updateTodoTicker(){
  let ticker = document.getElementById('todo-ticker');
  const openTodos = personalTodos.filter(t=>!t.done);
  if(!openTodos.length){
    if(ticker) ticker.remove();
    return;
  }
  const content = openTodos.map(t=>{
    let label = t.text;
    if(t.datum || t.uhrzeit){
      const dateLabel = t.datum ? new Date(t.datum).toLocaleDateString('de-DE') : '';
      label += ' (' + [dateLabel, t.uhrzeit].filter(Boolean).join(' · ') + ')';
    }
    return label;
  }).join('   •   ');
  if(!ticker){
    ticker = document.createElement('div');
    ticker.id = 'todo-ticker';
    ticker.className = 'todo-ticker';
    ticker.addEventListener('click', openTodoModal);
    ticker.innerHTML = '<div class="todo-ticker-inner" id="todo-ticker-inner"></div>';
    document.body.appendChild(ticker);
  }
  document.getElementById('todo-ticker-inner').textContent = content;
}
function renderTodoBody(){
  const body = document.getElementById('todo-modal-body');
  if(!body) return;
  body.innerHTML = '';

  if(!currentUserId){
    const hint = document.createElement('div');
    hint.style.cssText = 'font-family:"Inter",sans-serif;font-size:11.5px;color:var(--muted);background:#FEF3E8;border-radius:8px;padding:8px 10px;margin-bottom:12px;';
    hint.textContent = '⚠️ Nicht mit Microsoft angemeldet — diese Liste bleibt vorerst nur lokal auf diesem Gerät. Melde dich an, damit sie geräteübergreifend synchronisiert wird.';
    body.appendChild(hint);
  }

  const inputRow = document.createElement('div');
  inputRow.className = 'todo-input-row';
  const input = document.createElement('input');
  input.className = 'todo-input';
  input.placeholder = 'Neue Notiz / Aufgabe...';
  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.className = 'todo-date-input';
  dateInput.title = 'Datum (optional)';
  const timeInput = document.createElement('input');
  timeInput.type = 'time';
  timeInput.className = 'todo-time-input';
  timeInput.title = 'Uhrzeit (optional)';
  const addBtn = document.createElement('button');
  addBtn.className = 'todo-add-btn';
  addBtn.textContent = '+ Hinzufügen';
  function addTodo(){
    const val = input.value.trim();
    if(!val) return;
    personalTodos.unshift({
      id: uid(), text: val, done: false,
      erstelltAm: new Date().toLocaleDateString('de-DE'),
      datum: dateInput.value || null,
      uhrzeit: timeInput.value || null
    });
    saveTodos();
    input.value = ''; dateInput.value = ''; timeInput.value = '';
    renderTodoBody();
    updateTodoFabBadge();
    updateTodoTicker();
  }
  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') addTodo(); });
  inputRow.appendChild(input);
  inputRow.appendChild(dateInput);
  inputRow.appendChild(timeInput);
  inputRow.appendChild(addBtn);
  body.appendChild(inputRow);

  if(!personalTodos.length){
    const empty = document.createElement('div');
    empty.className = 'todo-empty';
    empty.textContent = 'Noch keine Einträge.';
    body.appendChild(empty);
  } else {
    personalTodos.forEach(t=>{
      const item = document.createElement('div');
      item.className = 'todo-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'todo-checkbox';
      cb.checked = t.done;
      cb.addEventListener('change', ()=>{ t.done = cb.checked; saveTodos(); renderTodoBody(); updateTodoFabBadge(); updateTodoTicker(); });
      const textWrap = document.createElement('div');
      textWrap.className = 'todo-text-wrap';
      const txt = document.createElement('div');
      txt.className = 'todo-text' + (t.done ? ' done' : '');
      txt.textContent = t.text;
      textWrap.appendChild(txt);
      if(t.datum || t.uhrzeit){
        const dt = document.createElement('div');
        dt.className = 'todo-item-datetime';
        const dateLabel = t.datum ? new Date(t.datum).toLocaleDateString('de-DE') : '';
        dt.textContent = '🕒 ' + [dateLabel, t.uhrzeit].filter(Boolean).join(' · ');
        textWrap.appendChild(dt);
      }
      const del = document.createElement('button');
      del.className = 'todo-del';
      del.innerHTML = '🗑';
      del.addEventListener('click', ()=>{
        personalTodos = personalTodos.filter(x=>x.id!==t.id);
        saveTodos();
        renderTodoBody();
        updateTodoFabBadge();
        updateTodoTicker();
      });
      item.appendChild(cb);
      item.appendChild(textWrap);
      item.appendChild(del);
      body.appendChild(item);
    });
  }
  input.focus();
}
function openTodoModal(){
  if(document.getElementById('todo-modal-overlay')) return;
  const overlay = document.createElement('div');
  overlay.className = 'todo-modal-overlay';
  overlay.id = 'todo-modal-overlay';
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeTodoModal(); });

  const modal = document.createElement('div');
  modal.className = 'todo-modal';

  const head = document.createElement('div');
  head.className = 'todo-modal-head';
  head.innerHTML = `<div class="todo-modal-title">✅ To-Do's${currentUserName ? ' · ' + currentUserName : ''}</div>`;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'todo-modal-close';
  closeBtn.innerHTML = '✕';
  closeBtn.addEventListener('click', closeTodoModal);
  head.appendChild(closeBtn);
  modal.appendChild(head);

  const body = document.createElement('div');
  body.className = 'todo-modal-body';
  body.id = 'todo-modal-body';
  modal.appendChild(body);

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  renderTodoBody();
}
function closeTodoModal(){
  const overlay = document.getElementById('todo-modal-overlay');
  if(overlay) overlay.remove();
}
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeTodoModal(); });

<style id="fx-layer">
@keyframes fxShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes fxPulseRing{0%{box-shadow:0 0 0 0 rgba(180,66,58,.5)}70%{box-shadow:0 0 0 12px rgba(180,66,58,0)}100%{box-shadow:0 0 0 0 rgba(180,66,58,0)}}
@keyframes fxSlideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fxPopIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fxBarGrow{from{width:0}}

/* 01 – 3D Tilt */
.cards{perspective:1200px;}
.card{transition:transform .16s ease-out, box-shadow .25s ease;transform-style:preserve-3d;will-change:transform;}
.card.fx-tilting{box-shadow:0 22px 44px -24px rgba(28,39,51,.45);}

/* 02 – Toast */
#fx-toasts{position:fixed;right:18px;bottom:18px;z-index:4000;display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none;}
.fx-toast{background:#1C2733;color:#fff;padding:11px 16px;border-radius:10px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 14px 32px -14px rgba(0,0,0,.6);animation:fxSlideUp .26s ease-out;max-width:360px;}
.fx-toast .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(14,124,123,.25);flex-shrink:0;}
.fx-toast.warn .dot{background:var(--amber);box-shadow:0 0 0 4px rgba(194,121,43,.25);}
.fx-toast.err .dot{background:var(--red);box-shadow:0 0 0 4px rgba(180,66,58,.25);}
.fx-toast.out{opacity:0;transform:translateY(8px);transition:opacity .3s, transform .3s;}

/* 03 – Pop-ups mit Blur */
.chart-overlay,.todo-modal-overlay{backdrop-filter:blur(7px) saturate(1.05);-webkit-backdrop-filter:blur(7px) saturate(1.05);background:rgba(28,39,51,.42);}
.chart-popup,.todo-modal{animation:fxPopIn .24s cubic-bezier(.2,.8,.2,1);}
.fx-confirm{background:#fff;border-radius:14px;padding:20px 22px;width:300px;box-shadow:0 26px 54px -20px rgba(0,0,0,.5);animation:fxPopIn .22s ease-out;font-family:'Inter',sans-serif;}
.fx-confirm h4{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 6px;}
.fx-confirm p{margin:0 0 16px;font-size:13px;color:var(--muted);}

/* 04 – Ringe / 10 – Heatmap: Kopfleiste */
#fx-pulse{display:flex;align-items:center;gap:26px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:18px;}
.fx-cnt-total{flex-shrink:0;padding-right:20px;border-right:1px solid var(--border);}
.fx-cnt-teams{display:flex;gap:28px;flex-wrap:wrap;flex:1;}
.fx-cnt-team-head{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:6px;}
.fx-cnt-team-head b{font-family:'Space Grotesk',sans-serif;font-size:15px;margin-left:6px;color:var(--tmg);}
.fx-cnt-chips{display:flex;gap:6px;flex-wrap:wrap;}
.fx-cnt-chip{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;background:#F1F4F7;color:var(--muted);padding:3px 9px;border-radius:980px;}
.fk-wrap{display:flex;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:20px;}
.fk-role{flex:1;min-width:150px;}
.fk-role-title{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
.fk-inputs{display:flex;flex-direction:column;gap:6px;}
.fk-input{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:#FAFBFC;color:var(--text);width:100%;box-sizing:border-box;}
.fk-input:focus{outline:none;border-color:var(--tmg);background:#fff;box-shadow:0 0 0 3px rgba(226,0,116,.08);}
.fk-input::placeholder{color:#B8BEC5;}
#fx-pulse .fx-ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .5s;}
#fx-pulse .fx-ring-in{width:72px;height:72px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;}
#fx-pulse .fx-ring-val{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;}
#fx-pulse .fx-cap{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;}
#fx-pulse .fx-heat{display:grid;gap:4px;}
#fx-pulse .fx-heat i{width:14px;height:14px;border-radius:3px;display:block;}
#fx-pulse .fx-legend{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);margin-top:7px;}
#fx-pulse .fx-legend b{width:11px;height:11px;border-radius:2px;display:inline-block;}

/* 06 – Shimmer */
.fx-skel{display:flex;flex-direction:column;gap:11px;padding:16px 2px;}
.fx-skel i{display:block;height:15px;border-radius:8px;background:linear-gradient(90deg,#EDEFF2 25%,#F8F9FA 50%,#EDEFF2 75%);background-size:200% 100%;animation:fxShimmer 1.4s linear infinite;}

/* 07 – Karten-Stapel (Tiefe hinter jedem Team-Block) */
.team-block{position:relative;}
.team-block .cards{position:relative;z-index:1;}
.team-block.fx-stacked{margin-bottom:44px;}
.team-block.fx-stacked::after{content:'';position:absolute;left:14px;right:14px;bottom:-7px;height:12px;border-radius:0 0 12px 12px;background:var(--panel);border:1px solid var(--border);border-top:none;opacity:.6;z-index:0;}
.team-block.fx-stacked::before{content:'';position:absolute;left:26px;right:26px;bottom:-13px;height:12px;border-radius:0 0 12px 12px;background:var(--panel);border:1px solid var(--border);border-top:none;opacity:.35;z-index:0;}

/* 08 – Pulsierender kritischer Status */
.status-dot.critical{animation:fxPulseRing 1.9s ease-out infinite;}

/* 09 – Tabs mit gleitender Pille */
/* .tabs braucht hier kein position:relative mehr - position:sticky (siehe Basis-CSS weiter oben)
   erfüllt denselben Zweck als Positionierungs-Kontext für die Pille und bleibt beim Scrollen oben sichtbar. */
#coachdash-subtabs,#ov-subtabs{position:relative;}
.fx-pill{position:absolute;border-radius:8px;background:var(--text);transition:left .32s cubic-bezier(.4,0,.2,1),width .32s cubic-bezier(.4,0,.2,1),top .32s,height .32s;z-index:0;pointer-events:none;}
.tabs .tab-btn,#coachdash-subtabs .tab-btn,#ov-subtabs .tab-btn{position:relative;z-index:1;transition:color .22s;}
.tabs .tab-btn.active,#coachdash-subtabs .tab-btn.active,#ov-subtabs .tab-btn.active{background:transparent;border-color:transparent;color:#fff;}

/* 12 – Balken laufen ein + Ziel-Marke */
.cp-co-bar-track{position:relative;}
.cp-co-bar-fill{animation:fxBarGrow .9s cubic-bezier(.2,.8,.2,1);}
.cp-co-bar-track[data-target]::after{content:'';position:absolute;top:0;bottom:0;left:var(--fx-target,80%);width:2px;background:repeating-linear-gradient(var(--text) 0 3px,transparent 3px 6px);}

@media (prefers-reduced-motion: reduce){.card,.fx-pill{transition:none!important}.status-dot.critical,.cp-co-bar-fill,.fx-skel i{animation:none!important}}
</style>
<script>
(function(){
  var touch = matchMedia('(hover:none)').matches;

  /* 02 Toast */
  function toastHost(){ var h=document.getElementById('fx-toasts'); if(!h){h=document.createElement('div');h.id='fx-toasts';document.body.appendChild(h);} return h; }
  window.fxToast = function(msg, type, ms){
    var t=document.createElement('div'); t.className='fx-toast'+(type?' '+type:'');
    t.innerHTML='<span class="dot"></span><span></span>'; t.lastChild.textContent=msg;
    toastHost().appendChild(t);
    setTimeout(function(){ t.classList.add('out'); setTimeout(function(){t.remove();},320); }, ms||2800);
  };
  var nativeAlert = window.alert;
  window.alert = function(m){ var s=String(m); fxToast(s.replace(/^[✓✔]\s*/,''), /fehl|error|nicht/i.test(s)?'err':'', 3200); };
  window.fxAlertNative = nativeAlert;

  /* 03 Bestätigungs-Dialog */
  window.fxConfirm = function(title, text, onOk, okLabel){
    var ov=document.createElement('div'); ov.className='chart-overlay'; ov.style.zIndex=3000;
    var box=document.createElement('div'); box.className='fx-confirm';
    box.innerHTML='<h4></h4><p></p><div style="display:flex;gap:8px"><button class="fx-ok" style="flex:1;background:var(--red);color:#fff;border:none;padding:9px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer">'+(okLabel||'Löschen')+'</button><button class="fx-no" style="flex:1;background:#fff;border:1px solid var(--border);padding:9px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer">Abbrechen</button></div>';
    box.querySelector('h4').textContent=title; box.querySelector('p').textContent=text||'';
    box.querySelector('.fx-no').onclick=function(){ov.remove();};
    box.querySelector('.fx-ok').onclick=function(){ov.remove(); onOk&&onOk();};
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    ov.appendChild(box); document.body.appendChild(ov);
  };

  /* 01 3D-Tilt (entfernt auf Wunsch - fühlte sich wie ein "Wackeln" an) */

  /* 09 Gleitende Pille */
  function pill(bar){
    if(!bar) return;
    var p=bar.querySelector(':scope > .fx-pill');
    if(!p){ p=document.createElement('div'); p.className='fx-pill'; bar.insertBefore(p, bar.firstChild); }
    var a=bar.querySelector('.tab-btn.active');
    if(!a){ p.style.opacity=0; return; }
    p.style.opacity=1;
    p.style.left=a.offsetLeft+'px'; p.style.top=a.offsetTop+'px';
    p.style.width=a.offsetWidth+'px'; p.style.height=a.offsetHeight+'px';
  }
  function pills(){ /* v152: Seitenleiste + Unterstrich-Tabs, keine gleitende Pille mehr */ }
  addEventListener('resize', pills);
  document.addEventListener('click', function(e){ if(e.target.closest && e.target.closest('.tab-btn')) setTimeout(pills, 30); }, true);

  /* 06 Shimmer beim Umschalten */
  window.fxSkeleton = function(el, rows){
    if(!el) return function(){};
    var s=document.createElement('div'); s.className='fx-skel';
    var w=[62,88,74,45,80,58];
    for(var i=0;i<(rows||5);i++){ var b=document.createElement('i'); b.style.width=w[i%w.length]+'%'; s.appendChild(b); }
    el.insertBefore(s, el.firstChild);
    return function(){ s.remove(); };
  };

  /* 04 + 10 Kopfleiste: Ring + Heatmap, aus den sichtbaren Karten berechnet */
  function ringHTML(pct){
    var col = pct>=80 ? 'var(--teal)' : pct>=50 ? 'var(--amber)' : 'var(--red)';
    return '<div class="fx-ring" style="background:conic-gradient('+col+' '+(pct*3.6)+'deg,#EDEFF2 0deg)">'+
      '<div class="fx-ring-in"><div class="fx-ring-val">'+pct+'%</div><div class="fx-cap">im Ziel</div></div></div>';
  }
  function stacks(){
    document.querySelectorAll('.team-block').forEach(function(b){
      b.classList.toggle('fx-stacked', b.querySelectorAll('.card').length > 0);
    });
  }
  function updatePulse(){
    stacks();
    var host=document.getElementById('coaching-teams'); if(!host) return;
    var strip=document.getElementById('fx-pulse');
    if(typeof state === 'undefined' || !state.agents){ if(strip) strip.remove(); return; }
    var agents = state.agents.filter(function(a){ return a.name && a.name.trim()!==''; });
    if(!agents.length){ if(strip) strip.remove(); return; }
    if(!strip){ strip=document.createElement('div'); strip.id='fx-pulse'; host.parentNode.insertBefore(strip, host); }

    var catLabel = { regular:'8-Stündler', '6h':'6-Stündler', helpline:'Helpline' };
    var teamOrder = Object.keys(TEAM_CONFIGS);
    var teamsHtml = teamOrder.map(function(teamId){
      var cfg = TEAM_CONFIGS[teamId];
      var teamAgents = agents.filter(function(a){ return String(a.team) === String(teamId); });
      if(!teamAgents.length) return '';
      var counts = { regular:0, '6h':0, helpline:0 };
      teamAgents.forEach(function(a){ var c = a.category||'regular'; if(counts[c]===undefined) counts[c]=0; counts[c]++; });
      var breakdown = ['regular','6h','helpline'].map(function(c){
        return '<span class="fx-cnt-chip">'+counts[c]+' '+catLabel[c]+'</span>';
      }).join('');
      return '<div class="fx-cnt-team">'+
        '<div class="fx-cnt-team-head">'+cfg.label+' — '+cfg.project+' <b>'+teamAgents.length+'</b></div>'+
        '<div class="fx-cnt-chips">'+breakdown+'</div>'+
      '</div>';
    }).join('');

    strip.innerHTML =
      '<div class="fx-cnt-total"><div class="fx-cap">Mitarbeiter gesamt</div>'+
      '<div style="font-family:\'Space Grotesk\',sans-serif;font-size:28px;font-weight:700">'+agents.length+'</div></div>'+
      '<div class="fx-cnt-teams">'+teamsHtml+'</div>';
  }
  window.fxUpdatePulse = updatePulse;

  var raf;
  function schedule(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(function(){ pills(); updatePulse(); }); }
  document.addEventListener('input', function(e){ if(e.target.closest('#coaching-teams')) schedule(); });

  function boot(){
    pills(); updatePulse();
    var host=document.getElementById('coaching-teams');
    if(host) new MutationObserver(schedule).observe(host,{childList:true,subtree:true});
    var main=document.querySelector('.wrap')||document.body;
    new MutationObserver(function(){ pills(); }).observe(main,{attributes:true,attributeFilter:['class'],subtree:true});
    if(typeof switchTab==='function'){
      var orig=switchTab;
      window.switchTab=function(t){
        var pane=document.querySelector('.wrap');
        var done=fxSkeleton(null);
        orig.apply(this,arguments);
        setTimeout(function(){ pills(); updatePulse(); },20);
      };
      ['coachdash','teamziele','monatsabschluss','coaching','verlauf','overview','halloffame','kianalyse'].forEach(function(id){
        var b=document.getElementById('tab-'+id);
        if(b) b.addEventListener('click', function(){ setTimeout(function(){pills();updatePulse();},20); });
      });
    }
  }
  if(document.readyState==='complete') setTimeout(boot,60);
  else addEventListener('load', function(){ setTimeout(boot,60); });
})();
</script>


<!-- ===== Effekt-Layer 2: Hintergrund 13 · Dark-Mode 15 · Symbole 19 ===== -->
<style id="fx-layer-2">
@keyframes fxDrift{0%{transform:translate(0,0) scale(1)}33%{transform:translate(5%,-4%) scale(1.12)}66%{transform:translate(-4%,3%) scale(.94)}100%{transform:translate(0,0) scale(1)}}
@keyframes fxDrift2{0%{transform:translate(0,0) scale(1.06)}50%{transform:translate(-6%,5%) scale(.92)}100%{transform:translate(0,0) scale(1.06)}}

/* 13 – Zweifarbiger Blur-Nebel */
body{background:transparent;}
#fx-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#FAFAFB;pointer-events:none;}
#fx-bg .b{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform;}
#fx-bg .b1{width:44vw;height:44vw;min-width:420px;min-height:420px;background:var(--tmg);opacity:.20;top:-14vw;left:-10vw;animation:fxDrift 24s ease-in-out infinite;}
#fx-bg .b2{width:40vw;height:40vw;min-width:380px;min-height:380px;background:var(--teal);opacity:.17;bottom:-14vw;right:-8vw;animation:fxDrift2 30s ease-in-out infinite;}
#fx-bg .b3{width:28vw;height:28vw;min-width:280px;min-height:280px;background:var(--sixh);opacity:.10;top:38%;left:52%;animation:fxDrift 36s ease-in-out infinite;}

/* Karten als Milchglas über dem Nebel */
.card,.agent-panel,.topbar,.cv-agent-block,.ranking-box,.ma-chart-box,.hof-month-card,.vl-chart-wrap,.cp-card,#fx-pulse{
  background-color:rgba(255,255,255,.82);backdrop-filter:blur(12px) saturate(1.05);-webkit-backdrop-filter:blur(12px) saturate(1.05);
}

/* 15 – Dark Mode */
#fx-theme-btn{background:var(--panel);border:1px solid var(--border);border-radius:999px;width:36px;height:36px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
#fx-theme-btn:hover{border-color:var(--tmg);color:var(--tmg);}
#fx-theme-btn i{width:14px;height:14px;border-radius:50%;background:currentColor;display:block;box-shadow:inset -4px -1px 0 0 var(--panel);}

html[data-fx-theme="dark"]{color-scheme:dark;}
html[data-fx-theme="dark"] :root,html[data-fx-theme="dark"] body{
  --bg:#141A21;--panel:#1C242E;--border:#2C3742;--text:#E7ECF1;--muted:#93A2B3;
  --teal-soft:#12332F;--amber-soft:#33270F;--red-soft:#361A18;--sixh-soft:#16273A;--helpline-soft:#241C3A;
  --tmg-soft:#3A0E27;--tmg-light:#232B35;--tmg-gray:#93A2B3;
}

/* 16 – Dark Mode, Ergänzung (generiert, v148): alle fest eingebauten Hell-Farben aus CSS und

#fx-logo{display:flex;align-items:center;gap:12px;margin-bottom:10px;}

<script>
(function(){
  /* 21 Logo */
  function logo(){
    if(document.getElementById('fx-logo')) return;
    var tb=document.querySelector('.title-block'); if(!tb) return;
    var eyebrow=tb.querySelector('.eyebrow');
    var d=document.createElement('div'); d.id='fx-logo';
    d.innerHTML='<span class="mark"><span class="ring"></span><span class="orb"><b></b></span></span>'+
                '<span><span class="word">Standort-Portal</span><br><span class="sub">Trikala</span></span>';
    tb.insertBefore(d, eyebrow || tb.firstChild);
  }

  /* 22 Hochzählende Zahlen */
  var COUNT_SEL = '.fx-ring-val,.cp-co-pct,.cp-bar-value,.panel-avg-val,.ma-kpi-value,.cp-kpi-value';
  function countUp(el){
    var raw = el.textContent.trim();
    var m = raw.match(/^(-?\d+(?:[.,]\d+)?)(\s*[%A-Za-zÄÖÜäöüß.]{0,12})$/);
    if(!m) return;
    var target = parseFloat(m[1].replace(',','.'));
    if(!isFinite(target) || Math.abs(target) < 1) return;
    var dec = (m[1].split(/[.,]/)[1]||'').length, suf = m[2] || '';
    var t0 = performance.now(), dur = 700;
    el.dataset.fxCounted = '1';
    function step(t){
      var k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3), v = target*e;
      el.textContent = (dec ? v.toFixed(dec).replace('.',',') : Math.round(v)) + suf;
      if(k<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function countAll(scope){
    (scope||document).querySelectorAll(COUNT_SEL).forEach(function(el){
      if(el.dataset.fxCounted) return;
      countUp(el);
    });
  }

  /* 24 Stagger */
  var STAGGER_SEL = '#coaching-teams .card, #coachplan-container .cp-card, #coachplan-container .cp-chart-card, #coachverlauf-container .cv-agent-block, #halloffame-container .hof-month-card, .ranking-box, .ma-chart-box';
  function stagger(){
    var els = document.querySelectorAll(STAGGER_SEL), i = 0;
    els.forEach(function(el){
      if(el.offsetParent === null) return;
      el.classList.remove('fx-in'); void el.offsetWidth;
      el.style.animationDelay = Math.min(i,10)*0.055 + 's';
      el.classList.add('fx-in');
      setTimeout(function(){ el.classList.remove('fx-in'); el.style.animationDelay=''; }, 900 + i*55);
      i++;
    });
  }

  function refresh(){
    document.querySelectorAll('[data-fx-counted]').forEach(function(el){ delete el.dataset.fxCounted; });
    countAll(); stagger();
  }
  window.fxRefreshLife = refresh;

  function boot(){
    logo(); countAll(); stagger();
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.addEventListener('click', function(){ setTimeout(refresh, 60); });
    });
  }
  if(document.readyState==='complete') setTimeout(boot,140);
  else addEventListener('load', function(){ setTimeout(boot,140); });
})();
</script>

.ma-chart-box{min-width:0!important;border-radius:12px!important;box-shadow:none!important;border:1px solid var(--border);padding:16px 18px 10px!important;}
.ma-chart-box-title{font-family:'Inter',sans-serif!important;font-size:13px!important;font-weight:600!important;color:var(--text);}
.ma-table th{background:var(--ink)!important;color:#AEB8C4!important;font-weight:600!important;}
.ma-table th:first-child{color:#fff!important;}
.ma-table td{border-bottom:1px solid var(--border)!important;color:var(--text);}
.ma-table tr td,.ma-table tr:nth-child(even) td{background:var(--panel);}
.ma-table tr td:first-child{color:var(--muted)!important;font-weight:600!important;}
.ma-table tr.ma-row-erreicht td:first-child,.ma-table tr.ma-row-cr td:first-child{color:var(--text)!important;}
.ma-table tr.ma-row-cr td{border-top:2px solid var(--border);}
.ma-table tr.ma-row-crziel td:not(:first-child){color:var(--muted);font-weight:500;}
.ma-table tr.ma-row-storno td:not(:first-child){color:var(--warn);}
.ma-nps-row td{background:var(--panel)!important;color:var(--text)!important;}
.ma-month-tabs{gap:4px!important;}
.ma-month-btn{border-radius:8px!important;font-family:'Inter',sans-serif!important;font-size:12.5px!important;background:var(--panel)!important;color:var(--muted)!important;}
.ma-month-btn.active{background:var(--ink)!important;border-color:var(--ink)!important;color:#fff!important;}
.ma-side-box > div{border-radius:12px!important;}
.ma-tip{position:fixed;z-index:5000;pointer-events:none;background:var(--ink);color:#fff;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:6px 9px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap;font-variant-numeric:tabular-nums;}

.ma-table tr.ma-row-plan td,.ma-table tr.ma-row-erreicht td,.ma-table tr.ma-row-cr td,.ma-table tr.ma-row-crziel td,.ma-table tr.ma-row-storno td{background:var(--panel);}
.ma-table tr.ma-row-plan td:first-child,.ma-table tr.ma-row-crziel td:first-child,.ma-table tr.ma-row-storno td:first-child{color:var(--muted)!important;}
.ma-table tr.ma-row-erreicht td:first-child,.ma-table tr.ma-row-cr td:first-child{color:var(--text)!important;}
.cr-box .cr-box-val{color:var(--text)!important;}
@media (max-width: 1000px){ .ma-charts-wrap{grid-template-columns:1fr;} }


/* ===== Allgemein: doppelte Überschriften weg (Seitentitel steht oben), einheitliche Karten ===== */

.hof-month-card,.vl-chart-wrap,.ranking-box,.cp-card,.cp-chart-card,.cv-agent-block,.tw-team-wrap,#fx-pulse,.fk-wrap,.card{

.tw-team-head,.ov-team-head{background:var(--ink)!important;}

/* ===== Seitenleiste einklappbar (v157) ===== */
.app-side,.wrap{transition:width .22s ease, margin-left .22s ease, padding .22s ease;}
.side-collapse{display:flex;align-items:center;gap:11px;width:100%;background:transparent;border:0;border-radius:8px;color:var(--side-muted);padding:9px 10px;margin-top:10px;font:500 12.5px 'Inter',sans-serif;cursor:pointer;text-align:left;}
.side-collapse:hover{background:var(--side-hover);color:#fff;}
body.side-collapsed{--side-w:68px;}
body.side-collapsed .app-side{padding-left:10px;padding-right:10px;overflow-x:hidden;}
body.side-collapsed .app-side .side-link span:not(.todo-fab-badge),
body.side-collapsed .side-collapse span,
body.side-collapsed #fx-logo > span:not(.mark),
body.side-collapsed .side-foot .user-label{display:none;}
body.side-collapsed .side-label{font-size:0;padding:10px 0 6px;margin:0 6px;border-top:1px solid var(--side-border);}
body.side-collapsed .side-label:first-child{border-top:0;}
body.side-collapsed .app-side .side-link,body.side-collapsed .side-collapse{justify-content:center;padding:10px 0;}
body.side-collapsed .app-side .side-link.active::before{left:-10px;}
body.side-collapsed .app-side #fx-logo{justify-content:center;margin:0 0 14px;}
body.side-collapsed .app-side .todo-fab-badge{position:absolute;top:3px;right:8px;margin:0;font-size:9.5px;padding:0 5px;}
body.side-collapsed .side-collapse svg{transform:scaleX(-1);}
body.side-collapsed .side-foot{align-items:center;padding:12px 0 0;}
body.side-collapsed .side-foot .board-version-label{font-size:9px;text-align:center;}
@media (max-width: 900px){
  body.side-collapsed{--side-w:244px;}
  .side-collapse{display:none;}
}

@media (max-width: 900px){

  body.side-open .app-side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35);}

<script>
(function(){
  function setTitle(){
    var a=document.querySelector('.app-side .side-link.active'), t=document.getElementById('app-page-title');
    if(a && t){ t.textContent = a.dataset.title || a.textContent.trim(); }
  }

  // Tooltip für Diagrammpunkte (Monatsabschluss)
  var tip=null;
  document.addEventListener('mouseover',function(e){
    var t=e.target.closest && e.target.closest('.ma-pt'); if(!t) return;
    if(!tip){ tip=document.createElement('div'); tip.className='ma-tip'; document.body.appendChild(tip); }
    tip.textContent=t.getAttribute('data-tip'); tip.hidden=false;
    var r=t.getBoundingClientRect(); tip.style.left=(r.left+r.width/2 - tip.offsetWidth/2)+'px'; tip.style.top=(r.top-tip.offsetHeight-6)+'px';
  });
  document.addEventListener('mouseout',function(e){ if(tip && e.target.closest && e.target.closest('.ma-pt')) tip.hidden=true; });

  // Seitenleiste einklappen (Zustand wird im Browser gemerkt)
  var CKEY='side-collapsed';
  function setCollapsed(on){
    document.body.classList.toggle('side-collapsed', on);
    var b=document.getElementById('side-collapse');
    if(b){ b.title = on ? 'Menü ausklappen' : 'Menü einklappen'; var t=b.querySelector('span'); if(t) t.textContent = on ? 'Menü ausklappen' : 'Menü einklappen'; }
    try{ localStorage.setItem(CKEY, on ? '1' : '0'); }catch(e){}
    // Inhalte (z.B. mitlaufende Kopfzeile in Tageswerte, Diagramme) an die neue Breite anpassen
    setTimeout(function(){ window.dispatchEvent(new Event('resize')); window.dispatchEvent(new Event('scroll')); }, 260);
  }
  function initCollapse(){
    document.querySelectorAll('.app-side .side-link').forEach(function(l){ if(!l.title) l.title = l.dataset.title || l.textContent.trim(); });
    var on=false; try{ on = localStorage.getItem(CKEY)==='1'; }catch(e){}
    if(on) setCollapsed(true);
    var b=document.getElementById('side-collapse');
    if(b) b.addEventListener('click', function(){ setCollapsed(!document.body.classList.contains('side-collapsed')); });
  }
  function closeSide(){ document.body.classList.remove('side-open'); }
  function boot(){
    var side=document.getElementById('app-side');
    if(side) new MutationObserver(setTitle).observe(side,{attributes:true,attributeFilter:['class'],subtree:true});
    var bu=document.getElementById('side-burger'); if(bu) bu.addEventListener('click',function(){ document.body.classList.toggle('side-open'); });
    var sc=document.getElementById('side-scrim'); if(sc) sc.addEventListener('click',closeSide);
    if(side) side.addEventListener('click',function(e){ if(e.target.closest('.side-link')) setTimeout(closeSide,60); });
    addEventListener('keydown',function(e){ if(e.key==='Escape') closeSide(); });
    initCollapse();
    setTitle();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>

function renderStandortHero(){
  const host = document.getElementById('standort-hero');
  if(!host) return;
  const g = STANDORT_GEO.g, d = STANDORT_GEO.d, S = STANDORT_INFO;
  const agents = (state.agents||[]).filter(a => a.name && a.name.trim());
  const catLabel = { regular:'8-Stündler', '6h':'6-Stündler', helpline:'Helpline', schulung:'Schulung', work:'Work' };
  const teams = Object.keys(TEAM_CONFIGS).map(id => {
    const cfg = TEAM_CONFIGS[id];
    const list = agents.filter(a => String(a.team) === String(id));
    const counts = {};
    list.forEach(a => { const c = a.category || 'regular'; counts[c] = (counts[c]||0) + 1; });
    const chips = Object.keys(catLabel).filter(c => counts[c]).map(c => `<span class="sh-chip">${counts[c]} ${catLabel[c]}</span>`).join('');
    return `<div class="sh-team"><div class="sh-team-h"><span>${cfg.project}</span><b>${list.length}</b></div><div class="sh-team-s">${cfg.label} · Mitarbeiter</div>${chips ? `<div class="sh-chips">${chips}</div>` : ''}</div>`;
  }).join('');
  let zeit = '';
  try{ zeit = new Date().toLocaleTimeString('de-DE', { timeZone:S.tz, hour:'2-digit', minute:'2-digit' }); }catch(e){}
  const fmtCoord = (v, pos, neg) => Math.abs(v).toFixed(2).replace('.', ',') + '° ' + (v >= 0 ? pos : neg);
  const pin = (x, y, r) => `<circle class="sh-ring" cx="${x}" cy="${y}" r="${r}"/><circle class="sh-ring r2" cx="${x}" cy="${y}" r="${r}"/><circle class="sh-dot" cx="${x}" cy="${y}" r="${r}"/>`;

          <path class="sh-greece" d="${g.greece}"/>
          <path d="${g.sphere}" fill="url(#shShade)"/>
          <rect class="sh-zoom" x="${bx0-5}" y="${by0-5}" width="${bx1-bx0+10}" height="${by1-by0+10}" rx="3"/>

        </svg>
      </div>
      <div class="sh-map-wrap">
        <svg class="sh-map" viewBox="0 0 ${d.W} ${d.H}" aria-label="Karte ${S.land} mit Standort ${S.name}" role="img">

            <mask id="shMask"><rect width="${d.W}" height="${d.H}" fill="url(#shFade)"/></mask>

          <circle class="sh-city" cx="${d.athen[0]}" cy="${d.athen[1]}" r="2"/><text class="sh-city-l" x="${d.athen[0]+5}" y="${d.athen[1]+3}">Athen</text>
          <circle class="sh-city" cx="${d.thess[0]}" cy="${d.thess[1]}" r="2"/><text class="sh-city-l" x="${d.thess[0]+5}" y="${d.thess[1]-3}">Thessaloniki</text>
          ${pin(d.trikala[0], d.trikala[1], 4)}
          <text class="sh-pin-l" x="${d.trikala[0]-9}" y="${d.trikala[1]+4}" text-anchor="end">${S.name}</text>
        </svg>
        <div class="sh-map-cap">${S.land}</div>
      </div>
      <div class="sh-info">
        <div>
          <div class="sh-eyebrow"><span class="sh-live"></span>Standort · ${S.firma}</div>
          <h2 class="sh-name">${S.name}</h2>
          <div class="sh-sub">${S.region} · ${S.land} · Inbound Privatkunden</div>
        </div>
        <div class="sh-meta">
          <span><b>${agents.length}</b> Mitarbeiter</span>
          <span><b>${Object.keys(TEAM_CONFIGS).length}</b> Teams</span>
          ${zeit ? `<span>Ortszeit <b>${zeit}</b></span>` : ''}
          <span>${fmtCoord(S.lat,'N','S')} · ${fmtCoord(S.lon,'O','W')}</span>
        </div>
        <div class="sh-teams">${teams}</div>
      </div>
    </div>`;
}
setInterval(()=>{ try{ if(typeof currentTab !== 'undefined' && currentTab === 'coaching') renderStandortHero(); }catch(e){} }, 60000);
try{ if(typeof currentTab === 'undefined' || currentTab === 'coaching') renderStandortHero(); }catch(e){}
</script>
</body>
</html>
