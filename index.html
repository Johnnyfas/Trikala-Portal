// ============================================================
// AGENT-SYNC (ab v134): zellgenaues Zusammenführen der Mitarbeiterdaten
// ------------------------------------------------------------
// Jede einzelne Zahl (Tageswert pro Mitarbeiter/Tag/Produkt, Calls, NPS, LQ, CHT, Notiz, ...)
// ist eine eigene "Zelle" mit Zeitstempel der letzten Änderung. Beim Zusammenführen mit dem
// Server gewinnt pro Zelle die NEUERE Änderung - egal wer sie gemacht hat. Vorher galt
// "lokal gewinnt immer", wodurch ein bloß veralteter lokaler Stand frische Einträge anderer
// Führungskräfte überschrieben hat.
//
// Lokale Änderungen werden erkannt, indem der aktuelle Stand mit dem Stand beim letzten
// Abgleich (agentSyncBaseline) verglichen wird - dadurch werden ALLE Eingabewege erfasst
// (Tippen, Mehrfach-Löschen, Rückgängig, Monat zurücksetzen, Helpsense-Import, ...).
//
// Zeitstempel: Tageswerte in dv._t[produkt], alle anderen Zellen in agent._ts[schlüssel].
// Zellschlüssel: 'f|feld' (Agent-Feld), 's|produkt' (Monatsstand), 't|monat|tag|produkt'.
// ============================================================
// AGENT_SYNC_START
const AGENT_SYNC_SKIP = new Set(['id','_ts','tageswerte','sales','coachingDatum']);
let agentSyncBaseline = null; // { agentId: { zellSchlüssel: JSON-Wert } } - Stand beim letzten Abgleich
let agLastMergeChangedLocal = false; // hat der letzte Abgleich Einträge anderer übernommen?

function agNorm(v){ return v === undefined ? null : v; }
function agCellsOf(agent){
  const out = {};
  Object.keys(agent).forEach(k=>{ if(!AGENT_SYNC_SKIP.has(k)) out['f|'+k] = agNorm(agent[k]); });
  if(agent.sales) Object.keys(agent.sales).forEach(p=>{ out['s|'+p] = agNorm(agent.sales[p]); });
  const tw = agent.tageswerte;
  if(tw) Object.keys(tw).forEach(m=>{
    const mo = tw[m]; if(!mo || typeof mo !== 'object') return;
    Object.keys(mo).forEach(d=>{
      const dv = mo[d]; if(!dv || !dv.sales) return;
      Object.keys(dv.sales).forEach(p=>{ out['t|'+m+'|'+d+'|'+p] = agNorm(dv.sales[p]); });
    });
  });
  return out;
}
function agEnsureDay(agent, m, d){
  if(!agent.tageswerte) agent.tageswerte = {};
  if(!agent.tageswerte[m]) agent.tageswerte[m] = {};
  if(!agent.tageswerte[m][d]) agent.tageswerte[m][d] = { sales:{} };
  if(!agent.tageswerte[m][d].sales) agent.tageswerte[m][d].sales = {};
  return agent.tageswerte[m][d];
}
function agSetCell(agent, key, val){
  const v = (val && typeof val === 'object') ? JSON.parse(JSON.stringify(val)) : agNorm(val);
  const parts = key.split('|');
  if(parts[0] === 'f'){ agent[parts[1]] = v; return; }
  if(parts[0] === 's'){ if(!agent.sales) agent.sales = {}; agent.sales[parts[1]] = v; return; }
  if(parts[0] === 't'){ agEnsureDay(agent, parts[1], parts[2]).sales[parts[3]] = v; }
}
function agGetTs(agent, key){
  const parts = key.split('|');
  if(parts[0] === 't'){
    const dv = agent.tageswerte && agent.tageswerte[parts[1]] && agent.tageswerte[parts[1]][parts[2]];
    return (dv && dv._t && dv._t[parts[3]]) || 0;
  }
  return (agent._ts && agent._ts[key]) || 0;
}
function agSetTs(agent, key, ts){
  const parts = key.split('|');
  if(parts[0] === 't'){
    const dv = agEnsureDay(agent, parts[1], parts[2]);
    if(!dv._t) dv._t = {};
    dv._t[parts[3]] = ts;
    return;
  }
  if(!agent._ts) agent._ts = {};
  agent._ts[key] = ts;
}
function agCaptureBaseline(){
  agentSyncBaseline = {};
  (state.agents||[]).forEach(a=>{
    if(!a || !a.id) return;
    const cells = agCellsOf(a);
    const b = {};
    Object.keys(cells).forEach(k=>{ b[k] = JSON.stringify(cells[k]); });
    agentSyncBaseline[a.id] = b;
  });
}
// Alles, was sich seit dem letzten Abgleich lokal geändert hat, bekommt einen frischen Zeitstempel.
function agStampLocalEdits(){
  if(!agentSyncBaseline) return; // noch nie abgeglichen → nichts zu vergleichen
  const ts = Date.now();
  (state.agents||[]).forEach(a=>{
    if(!a || !a.id) return;
    const base = agentSyncBaseline[a.id];
    const cur = agCellsOf(a);
    if(!base){
      // lokal neu angelegter Mitarbeiter: alle befüllten Zellen sind neue Eingaben
      Object.keys(cur).forEach(k=>{ if(cur[k] !== null) agSetTs(a, k, ts); });
      return;
    }
    const keys = new Set([...Object.keys(cur), ...Object.keys(base)]);
    keys.forEach(k=>{
      const cv = JSON.stringify(k in cur ? cur[k] : null);
      const bv = (k in base) ? base[k] : 'null';
      if(cv !== bv){
        if(!(k in cur)) agSetCell(a, k, null); // z.B. ganzer Monat gelöscht → als "geleert" festhalten
        agSetTs(a, k, ts);
        base[k] = cv; // erfasst - nicht beim nächsten Durchlauf erneut (mit späterer Zeit) stempeln
      }
    });
  });
  // Baseline wird erst am Ende von mergeAgentsFromServer() neu gesetzt - bis dahin muss erkennbar
  // bleiben, welche Mitarbeiter beim letzten Abgleich schon auf dem Server waren.
}
// Pro Zelle die neuere Änderung übernehmen. Rückgabe: true, wenn lokal etwas Neueres liegt,
// das dem Server noch fehlt (→ es muss gespeichert werden).
function agMergeAgentCells(la, sa){
  const lc = agCellsOf(la), sc = agCellsOf(sa);
  let localAhead = false;
  const keys = new Set([...Object.keys(lc), ...Object.keys(sc)]);
  keys.forEach(k=>{
    const lt = agGetTs(la, k), st = agGetTs(sa, k);
    const inL = k in lc, inS = k in sc;
    const lv = inL ? lc[k] : null, sv = inS ? sc[k] : null;
    if(st > lt){
      if(JSON.stringify(lv) !== JSON.stringify(sv)) agLastMergeChangedLocal = true;
      agSetCell(la, k, sv);
      agSetTs(la, k, st);
    } else if(lt > st){
      localAhead = true; // Server kennt unsere neuere Änderung noch nicht
    } else if(JSON.stringify(lv) !== JSON.stringify(sv)){
      // Gleich alt (meist: beide ohne Zeitstempel = Altdaten) → Server-Stand ist maßgeblich,
      // denn eigene Änderungen wurden vorher durch agStampLocalEdits() gestempelt.
      // Ausnahme: Agent-Felder, die der Server gar nicht kennt, nicht wegwerfen.
      if(!inS && k.startsWith('f|')) return;
      agSetCell(la, k, sv);
      agLastMergeChangedLocal = true;
    }
  });
  return localAhead;
}
// Zeitstempel sehr alter Monate entfernen (hält die Datenmenge klein).
function agPruneOldTs(){
  const now = new Date();
  const cutoff = new Date(now.getFullYear(), now.getMonth() - 2, 1);
  const cutoffKey = `${cutoff.getFullYear()}-${String(cutoff.getMonth()+1).padStart(2,'0')}`;
  (state.agents||[]).forEach(a=>{
    if(!a || !a.tageswerte) return;
    Object.keys(a.tageswerte).forEach(m=>{
      if(m >= cutoffKey) return;
      const mo = a.tageswerte[m]; if(!mo) return;
      Object.values(mo).forEach(dv=>{ if(dv && dv._t) delete dv._t; });
    });
  });
}
// Server-Mitarbeiterliste in den lokalen Stand einarbeiten (Liste + jede einzelne Zelle).
// Rückgabe: true, wenn lokal Änderungen liegen, die der Server noch nicht hat.
function mergeAgentsFromServer(serverAgents, serverDeletedAgentIds){
  agLastMergeChangedLocal = false;
  agStampLocalEdits();
  if(!state.deletedAgentIds) state.deletedAgentIds = [];
  (serverDeletedAgentIds||[]).forEach(id=>{ if(!state.deletedAgentIds.includes(id)) state.deletedAgentIds.push(id); });
  const deleted = new Set(state.deletedAgentIds);
  const localById = {};
  (state.agents||[]).forEach(a=>{ if(a && a.id) localById[a.id] = a; });
  const result = [];
  const seen = new Set();
  let localAhead = false;
  (serverAgents||[]).forEach(sa=>{
    if(!sa) return;
    if(sa.id && deleted.has(sa.id)){ localAhead = true; return; } // gelöscht, Server weiß es evtl. noch nicht
    if(sa.id) seen.add(sa.id);
    const la = sa.id && localById[sa.id];
    if(!la){ result.push(JSON.parse(JSON.stringify(sa))); agLastMergeChangedLocal = true; return; }
    if(agMergeAgentCells(la, sa)) localAhead = true;
    result.push(la);
  });
  (state.agents||[]).forEach(la=>{
    if(!la || !la.id || seen.has(la.id) || deleted.has(la.id)) return;
    // War beim letzten Abgleich schon auf dem Server und ist jetzt weg → woanders entfernt, nicht wiederbeleben
    if(agentSyncBaseline && agentSyncBaseline[la.id]){ agLastMergeChangedLocal = true; return; }
    result.push(la); // lokal neu angelegt, noch nicht gespeichert
    localAhead = true;
  });
  state.agents = result;
  agPruneOldTs();
  // Monatssummen aus den (jetzt vollständigen) Tageswerten neu berechnen
  state.agents.forEach(a=>{ const cfg = TEAM_CONFIGS[a.team]; if(cfg && a.sales) twRecomputeAgent(a, cfg); });
  agCaptureBaseline();
  return localAhead;
}
// AGENT_SYNC_END

// ============================================================
// BEREICHS-SYNC (ab v138): Team Ziele, Monatsabschluss, Mitarbeiter-Verlauf
// ------------------------------------------------------------
// Gleiches Prinzip wie AGENT-SYNC: jeder einzelne Wert (z.B. monatsabschluss.mf.Oktober.plan.BB)
// bekommt beim Ändern einen Zeitstempel, beim Zusammenführen gewinnt pro Wert die neuere Änderung.
// Gelöschte Werte werden als "Grabstein" (negativer Zeitstempel) festgehalten, damit Löschungen
// sich ebenfalls durchsetzen. Zeitstempel liegen in state._lww[bereich][pfad].
// ============================================================
// LWW_START
const LWW_SECTIONS = ['teamziele', 'monatsabschluss', 'verlauf', 'fuehrungskraefte', 'tagesziele', 'coachReviews'];
// Bereiche, die als Liste gespeichert sind, werden für das Zusammenführen nach id aufgeschlüsselt
const LWW_LIST_SECTIONS = { tagesziele: true };
function lwwListToObj(arr){ const o = {}; (Array.isArray(arr) ? arr : []).forEach(e=>{ if(e && e.id) o[e.id] = e; }); return o; }
// Arbeits-Objekt eines Bereichs (bei Listen: {id: eintrag} - die Einträge sind dieselben Objekte)
function lwwRoot(section){
  if(LWW_LIST_SECTIONS[section]) return lwwListToObj(state[section]);
  if(!state[section] || typeof state[section] !== 'object') state[section] = {};
  return state[section];
}
// Nach dem Zusammenführen Listen wieder als Liste ablegen (Reihenfolge bleibt, Neues hinten,
// leere/gelöschte Einträge fallen weg)
function lwwPutRoot(section, root){
  if(!LWW_LIST_SECTIONS[section]) return;
  const del = new Set(state.deletedEntryIds || []);
  const order = (Array.isArray(state[section]) ? state[section] : []).map(e=>e && e.id).filter(Boolean);
  Object.keys(root).forEach(id=>{ if(!order.includes(id)) order.push(id); });
  state[section] = order.map(id=>root[id]).filter(e => e && Object.keys(e).length && !del.has(e.id));
}
// Beim allerersten Laden einer Sitzung: Server-Stand ab dieser Tiefe übernehmen (wie bisher)
const LWW_FIRSTLOAD_DEPTH = { teamziele: 2, monatsabschluss: 2, verlauf: 1, fuehrungskraefte: 1, tagesziele: 1, coachReviews: 1 };
const LWW_KEEP_MS = 120 * 24 * 3600 * 1000; // Zeitstempel älter als ~4 Monate verwerfen
let lwwBaseline = {};          // bereich → { pfad: JSON-Wert } - Stand beim letzten Abgleich
let lwwLastMergeChanged = false;

function lwwClone(v){ return (v && typeof v === 'object') ? JSON.parse(JSON.stringify(v)) : v; }
function lwwFlatten(obj, path, out){
  out = out || {}; path = path || [];
  if(!obj || typeof obj !== 'object') return out;
  Object.keys(obj).forEach(k=>{
    const v = obj[k];
    const p = path.concat(k);
    if(v && typeof v === 'object' && !Array.isArray(v)) lwwFlatten(v, p, out);
    else out[JSON.stringify(p)] = JSON.stringify(v === undefined ? null : v);
  });
  return out;
}
function lwwSetPath(root, path, val){
  let cur = root;
  for(let i=0;i<path.length-1;i++){
    if(!cur[path[i]] || typeof cur[path[i]] !== 'object' || Array.isArray(cur[path[i]])) cur[path[i]] = {};
    cur = cur[path[i]];
  }
  cur[path[path.length-1]] = val;
}
function lwwDelPath(root, path){
  let cur = root;
  for(let i=0;i<path.length-1;i++){
    if(!cur || typeof cur !== 'object') return;
    cur = cur[path[i]];
  }
  if(cur && typeof cur === 'object') delete cur[path[path.length-1]];
}
function lwwTsMap(section){
  if(!state._lww || typeof state._lww !== 'object') state._lww = {};
  if(!state._lww[section]) state._lww[section] = {};
  return state._lww[section];
}
function lwwCaptureBaseline(section){
  lwwBaseline[section] = lwwFlatten(lwwRoot(section));
}
// Lokale Änderungen seit dem letzten Abgleich mit Zeitstempel versehen
function lwwStamp(section){
  const base = lwwBaseline[section];
  if(!base) return;
  const cur = lwwFlatten(lwwRoot(section));
  const tsMap = lwwTsMap(section);
  const ts = Date.now();
  const keys = new Set([...Object.keys(cur), ...Object.keys(base)]);
  keys.forEach(k=>{
    if(cur[k] === base[k]) return;
    if(k in cur){ tsMap[k] = ts; base[k] = cur[k]; }
    else { tsMap[k] = -ts; delete base[k]; } // gelöscht → Grabstein
  });
}
function lwwStampAll(){ LWW_SECTIONS.forEach(lwwStamp); }
function lwwPrune(section){
  const tsMap = lwwTsMap(section);
  const limit = Date.now() - LWW_KEEP_MS;
  Object.keys(tsMap).forEach(k=>{ if(Math.abs(tsMap[k]) < limit) delete tsMap[k]; });
}
function lwwFirstLoad(local, server, depth){
  Object.keys(server).forEach(k=>{
    const sv = server[k];
    if(depth > 1 && sv && typeof sv === 'object' && !Array.isArray(sv) && local[k] && typeof local[k] === 'object' && !Array.isArray(local[k])){
      lwwFirstLoad(local[k], sv, depth - 1);
    } else {
      local[k] = lwwClone(sv);
    }
  });
}
// Server-Stand eines Bereichs einarbeiten. Rückgabe: true, wenn lokal Neueres liegt (→ speichern).
function lwwMerge(section, serverSection, serverTsAll){
  const serverTs = (serverTsAll && serverTsAll[section]) || {};
  const tsMap = lwwTsMap(section);
  if(LWW_LIST_SECTIONS[section]) serverSection = lwwListToObj(serverSection);
  if(!serverSection || typeof serverSection !== 'object') serverSection = {};
  if(!lwwBaseline[section]){
    // Erstes Laden in dieser Sitzung: Server-Stand übernehmen (lokal ist nur die Code-Vorlage)
    const root = lwwRoot(section);
    lwwFirstLoad(root, serverSection, LWW_FIRSTLOAD_DEPTH[section] || 1);
    lwwPutRoot(section, root);
    Object.keys(serverTs).forEach(k=>{ if(Math.abs(serverTs[k]) > Math.abs(tsMap[k]||0)) tsMap[k] = serverTs[k]; });
    lwwPrune(section);
    lwwCaptureBaseline(section);
    lwwLastMergeChanged = true;
    return false;
  }
  lwwStamp(section);
  const root = lwwRoot(section);
  const lc = lwwFlatten(root);
  const sc = lwwFlatten(serverSection);
  let localAhead = false;
  const keys = new Set([...Object.keys(lc), ...Object.keys(sc), ...Object.keys(tsMap), ...Object.keys(serverTs)]);
  keys.forEach(k=>{
    const lt = Math.abs(tsMap[k] || 0), st = Math.abs(serverTs[k] || 0);
    if(st > lt){
      const path = JSON.parse(k);
      if(serverTs[k] < 0){
        if(k in lc){ lwwDelPath(root, path); lwwLastMergeChanged = true; }
      } else if(k in sc){
        if(lc[k] !== sc[k]){ lwwSetPath(root, path, JSON.parse(sc[k])); lwwLastMergeChanged = true; }
      }
      tsMap[k] = serverTs[k];
    } else if(lt > st){
      localAhead = true;
    } else if((k in sc) && lc[k] !== sc[k]){
      // gleich alt (meist Altdaten ohne Zeitstempel): Server-Stand gilt
      lwwSetPath(root, JSON.parse(k), JSON.parse(sc[k]));
      lwwLastMergeChanged = true;
    }
  });
  lwwPutRoot(section, root);
  lwwPrune(section);
  lwwCaptureBaseline(section);
  return localAhead;
}
function lwwMergeAll(serverData){
  let ahead = false;
  LWW_SECTIONS.forEach(sec=>{
    if(serverData[sec] === undefined && lwwBaseline[sec]) return;
    if(lwwMerge(sec, serverData[sec], serverData._lww)) ahead = true;
  });
  return ahead;
}
// LWW_END

async function loadFromSharePoint(){
  setSyncStatus('syncing');
  const epochAtStart = saveEpoch;
  try {
    let appToken = getKIAppToken();
    if(!appToken){
      const entered = prompt('Bitte gemeinsames Zugangs-Passwort für das Board eingeben:');
      if(entered && entered.trim()){
        appToken = entered.trim();
        setKIAppToken(appToken);
      } else {
        showSyncDebug('⚠️ Kein Zugangs-Passwort eingegeben. Daten konnten nicht geladen werden.', true);
        setSyncStatus('error');
        return;
      }
    }
    const resp = await fetch(KI_PROXY_URL + '/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-app-token': appToken },
      body: JSON.stringify({ action: 'load' })
    });
    if(resp.ok){
      const data = await resp.json();
      if(data && data.agents && data.agents.length){
        // Versionsprüfung ZUERST (vor jedem Zusammenführen): läuft hier eine ältere Board-Fassung
        // als die zuletzt gespeicherte, wird Speichern sofort gesperrt.
        if(typeof data.boardVersion === 'number' && data.boardVersion > BOARD_VERSION){
          if(!saveBlockedByVersion){
            saveBlockedByVersion = true;
            showSyncDebug('⚠️ Dieses Fenster nutzt eine veraltete Fassung des Boards. Speichern ist gesperrt, damit keine alten Daten zurückgeschrieben werden. Bitte die Seite neu laden (Strg+F5).', true);
          }
          setSyncStatus('error');
          return;
        }
        showSyncDebug(`✅ Daten geladen: ${data.agents.length} Mitarbeiter (HTTP ${resp.status}, ${new Date().toLocaleTimeString('de-DE')})`, false);
        // Mitarbeiter + Tageswerte zellgenau zusammenführen (pro Zahl gewinnt die neuere Änderung,
        // egal von welcher Führungskraft) - siehe AGENT-SYNC oben.
        const agentsLocalAhead = mergeAgentsFromServer(data.agents, data.deletedAgentIds);
        // Team Ziele, Monatsabschluss und Mitarbeiter-Verlauf: pro Wert zusammenführen (siehe BEREICHS-SYNC)
        lwwLastMergeChanged = false;
        if(!state.deletedEntryIds) state.deletedEntryIds = [];
        (data.deletedEntryIds||[]).forEach(id=>{ if(!state.deletedEntryIds.includes(id)) state.deletedEntryIds.push(id); });
        const sectionsLocalAhead = lwwMergeAll(data);
        // (Führungskräfte-Rollen und Tagesziele werden oben per lwwMergeAll() zusammengeführt)
        // Dauerhafte Löschliste zusammenführen (server + lokal), BEVOR Einträge gemerged werden -
        // damit Löschungen auch nach einem Neuladen oder bei einer anderen Person mit älterem
        // Stand nicht versehentlich wiederhergestellt werden.
        if(!state.deletedEntryIds) state.deletedEntryIds = [];
        if(data.deletedEntryIds){
          data.deletedEntryIds.forEach(id=>{ if(!state.deletedEntryIds.includes(id)) state.deletedEntryIds.push(id); });
        }
        const deletedSet = new Set(state.deletedEntryIds);
        if(data.coachverlauf){
          Object.keys(data.coachverlauf).forEach(key=>{
            const serverCv = data.coachverlauf[key];
            const localCv = state.coachverlauf[key];
            if(!localCv){
              state.coachverlauf[key] = serverCv;
              state.coachverlauf[key].eintraege = (state.coachverlauf[key].eintraege||[]).filter(e=>!deletedSet.has(e.id));
            } else {
              const localIds = new Set(localCv.eintraege.map(e=>e.id));
              const merged = [...localCv.eintraege].filter(e=>!deletedSet.has(e.id));
              (serverCv.eintraege||[]).forEach(e=>{ if(!localIds.has(e.id) && !deletedSet.has(e.id)) merged.push(e); });
              merged.sort((a,b)=>{
                const da = (a.datum||'').split('.').reverse().join('-');
                const db = (b.datum||'').split('.').reverse().join('-');
                return db.localeCompare(da);
              });
              localCv.eintraege = merged;
            }
          });
        }
        if(data.coachingPlan){
          const localIds = new Set((state.coachingPlan||[]).map(p=>p.id));
          const extra = data.coachingPlan.filter(p=>!localIds.has(p.id) && !deletedSet.has(p.id));
          state.coachingPlan = [...(state.coachingPlan||[]), ...extra].filter(p=>!deletedSet.has(p.id));
        }
        if(data.todosByUser) Object.assign(state.todosByUser, data.todosByUser);
        // (Tagesziele: per lwwMergeAll() zusammengeführt)
        // "Letztes Coaching" pro Mitarbeiter anhand der echten Verlaufsdaten geraderücken
        // (behebt veraltete Werte, die vor einem früheren Fix entstanden sind)
        state.agents.forEach(agent=>{
          const cv = Object.values(state.coachverlauf).find(v => v.name === agent.name && v.team === agent.team);
          if(cv && cv.eintraege && cv.eintraege.length){
            const newest = cv.eintraege.slice().sort((a,b)=>{
              const da = (a.datum||'').split('.').reverse().join('-');
              const db = (b.datum||'').split('.').reverse().join('-');
              return db.localeCompare(da);
            })[0];
            agent.coachingDatum = newest.datum;
          } else {
            agent.coachingDatum = '';
          }
        });
        // Ungültige Verlauf-Einträge entfernen
        const INVALID_NAMES = ['6','Helpline','helpline','Michas','Lekaki','Manachiari','Tstisoula'];
        // Alte Alias-Keys entfernen
        ['Antoniou_Trikala01','Antoniou_Pia_Trikala01','Antoniou Ioannis_Trikala01','Antoniou Pia_Trikala01'].forEach(k=>{ if(state.verlauf[k]) delete state.verlauf[k]; });
        Object.keys(state.verlauf).forEach(k=>{
          if(INVALID_NAMES.includes(state.verlauf[k].name)) delete state.verlauf[k];
        });
        // Seed-Daten für alle MA sicherstellen (fehlende Monate aus Seed ergänzen)
        Object.keys(VERLAUF_SEED).forEach(k=>{
          if(!state.verlauf[k]){
            state.verlauf[k] = JSON.parse(JSON.stringify(VERLAUF_SEED[k]));
          } else {
            // Fehlende Monate aus Seed ergänzen
            Object.keys(VERLAUF_SEED[k].monate).forEach(m=>{
              if(!state.verlauf[k].monate[m]){
                state.verlauf[k].monate[m] = JSON.parse(JSON.stringify(VERLAUF_SEED[k].monate[m]));
              } else {
                // NPS aus Seed wenn 0 in gespeicherter Version
                const seed = VERLAUF_SEED[k].monate[m];
                if(seed.nps > 0 && state.verlauf[k].monate[m].nps === 0)
                  state.verlauf[k].monate[m].nps = seed.nps;
                if(seed.cr > 0 && state.verlauf[k].monate[m].cr === 0)
                  state.verlauf[k].monate[m].cr = seed.cr;
              }
            });
          }
        });

        // (Mitarbeiter-Verlauf wird oben per lwwMergeAll() zusammengeführt)
        if(data.monatsabschluss){
          // Versionsprüfung: läuft hier eine ältere Board-Fassung als die zuletzt gespeicherte,
          // darf dieser Tab nichts mehr speichern (siehe BOARD_VERSION oben).
          if(typeof data.boardVersion === 'number' && data.boardVersion > BOARD_VERSION){
            if(!saveBlockedByVersion){
              saveBlockedByVersion = true;
              showSyncDebug('⚠️ Dieses Fenster nutzt eine veraltete Fassung des Boards. Speichern ist gesperrt, damit keine alten Daten zurückgeschrieben werden. Bitte die Seite neu laden (Strg+F5).', true);
            }
            return;
          }
          // (Monatsabschluss wird oben per lwwMergeAll() zusammengeführt)
        }
        // Einmalige automatische Bereinigung: September-Dezember enthielten noch alte
        // Platzhalter-/Testzahlen aus einer früheren Ersteinrichtung. Wird nur einmal ausgeführt
        // (per localStorage-Merker), danach nie wieder - damit spätere echte Eingaben nicht
        // versehentlich erneut überschrieben werden.
        // (Die frühere "einmalige Bereinigung" September-Dezember wurde entfernt: sie lief in jedem
        // NEUEN Browser erneut und hätte dort echte, inzwischen eingetragene Werte auf 0 gesetzt.)
        // BOJ global sicherstellen (falls in älteren Datensätzen nicht vorhanden)
        // Nur einfügen wenn BOJ noch in md.plan ist – nicht wenn User es gelöscht hat
        Object.keys(state.monatsabschluss||{}).forEach(team=>{
          Object.values(state.monatsabschluss[team]||{}).forEach(md=>{
            if(!md.plan || !('BOJ' in md.plan)) return; // BOJ wurde vom User entfernt → nicht wieder einfügen
            ['plan','erreicht','cr'].forEach(f=>{ if(md[f] && !('BOJ' in md[f])) md[f]['BOJ']=0; });
          });
        });
        // (Zwischenspeichern für den 401/403-Fehlerfall wurde entfernt - siehe Fehlerzweig weiter
        // unten: das Zurückholen eines evtl. veralteten Zwischenstands war riskanter als hilfreich.)
        // Kein automatisches Rückspeichern mehr direkt nach dem Laden: das war früher nötig, um
        // Korrekturen an der Code-Vorlage sofort festzuschreiben - diese Vorlagen-Logik gibt es
        // nicht mehr. Ein automatisches Speichern bei jedem Laden (auch beim Hintergrund-Sync alle
        // 2 Minuten) hätte sonst das Risiko, frische Eingaben mit einem zwischenzeitlich leicht
        // abweichenden Stand zu überschreiben. Speichern passiert jetzt ausschließlich, wenn
        // tatsächlich etwas bearbeitet wird (scheduleSave()).
        applyChtVerlaufData();
        renderAll();
        setSyncStatus('ok');
        // Selbstheilung: Liegen lokal Einträge, die dem Server fehlen (z.B. weil ein früherer
        // Speichervorgang gescheitert ist oder von einem parallelen Speichern verdrängt wurde),
        // werden sie jetzt automatisch nachgespeichert.
        const verlaufUpdated = updateLiveVerlaufSnapshot();
        if((agentsLocalAhead || sectionsLocalAhead || verlaufUpdated) && !saveBlockedByVersion) scheduleSave();
        return;
      }
      showSyncDebug(`⚠️ Datei geladen (HTTP ${resp.status}), aber keine Mitarbeiterdaten enthalten. Nichts wurde überschrieben.`, true);
      setSyncStatus('error');
      return;
    }
    if(resp.status === 404){
      // Datei existiert noch nicht - einmalige Ersteinrichtung
      showSyncDebug('ℹ️ Noch keine Datei in SharePoint gefunden - lege sie jetzt neu an.', false);
      await saveToSharePoint();
      setSyncStatus('ok');
      return;
    }
    // Jeder andere Fehler (z.B. 401/403 Berechtigung, 500, o.ä.) - NICHT automatisch überschreiben
    let errDetail = '';
    try{ const errBody = await resp.json(); const em = errBody.error && (errBody.error.message || errBody.error.code); const ec = errBody.error && errBody.error.code; errDetail = em ? ` — ${ec ? ec+': ' : ''}${em}` : ''; }catch(e){}
    if(resp.status === 401 || resp.status === 403){
      // Früher wurde hier automatisch der letzte im Browser zwischengespeicherte Stand
      // zurückgeholt und ALLES überschrieben (Object.assign(state, cachedState)) - das barg
      // aber ein ernstes Risiko: dieser zwischengespeicherte Stand kann veraltet sein und hat
      // wiederholt frisch gespeicherte Werte (z.B. Planmenge) still und heimlich wieder
      // zurückgesetzt. Jetzt lieber eine ehrliche Fehlermeldung statt einer stillen, riskanten
      // Überschreibung mit womöglich alten Daten.
      showSyncDebug(`❌ Zugang abgelaufen (HTTP ${resp.status}). Der hinterlegte Microsoft-Zugang von Ioannis ist nicht mehr gültig - bitte Ioannis bitten, im Portal auf "🔒 Einloggen" zu klicken. Danach diese Seite neu laden.`, true);
    } else {
      showSyncDebug(`❌ Fehler beim Laden: HTTP ${resp.status} ${resp.statusText}${errDetail}. Nichts wurde überschrieben - bitte im Team melden.`, true);
    }
    setSyncStatus('error');
  } catch(e){
    console.error('SharePoint load error', e);
    showSyncDebug(`❌ Netzwerk-/Skriptfehler beim Laden: ${e.message}`, true);
    setSyncStatus('error');
  }

}

// Server-Stand in den lokalen Stand einarbeiten, unmittelbar bevor gespeichert wird.
// Danach enthält state alles: die eigenen Änderungen UND alle Änderungen der anderen.
function mergeServerIntoLocalForSave(serverData){
  // Dauerhafte Löschliste zusammenführen (server + lokal), BEVOR Einträge gemerged werden -
  // verhindert, dass ein älterer lokaler Stand einen andernorts gelöschten Eintrag zurückbringt.
  if(!state.deletedEntryIds) state.deletedEntryIds = [];
  if(serverData.deletedEntryIds){
    serverData.deletedEntryIds.forEach(id=>{ if(!state.deletedEntryIds.includes(id)) state.deletedEntryIds.push(id); });
  }
  const deletedSet = new Set(state.deletedEntryIds);

  // Coaching Verlauf: pro Mitarbeiter die Einträge beider Seiten vereinen (nach id)
  if(serverData.coachverlauf){
    Object.keys(serverData.coachverlauf).forEach(key=>{
      const serverCv = serverData.coachverlauf[key];
      const localCv = state.coachverlauf[key];
      if(!localCv){
        state.coachverlauf[key] = serverCv;
        state.coachverlauf[key].eintraege = (state.coachverlauf[key].eintraege||[]).filter(e=>!deletedSet.has(e.id));
      } else {
        const localIds = new Set(localCv.eintraege.map(e=>e.id));
        const merged = [...localCv.eintraege].filter(e=>!deletedSet.has(e.id));
        (serverCv.eintraege||[]).forEach(e=>{ if(!localIds.has(e.id) && !deletedSet.has(e.id)) merged.push(e); });
        merged.sort((a,b)=>{
          const da = (a.datum||'').split('.').reverse().join('-');
          const db = (b.datum||'').split('.').reverse().join('-');
          return db.localeCompare(da);
        });
        localCv.eintraege = merged;
      }
    });
  }

  // Geplante Coachings: nach id vereinen
  if(serverData.coachingPlan){
    const localIds = new Set((state.coachingPlan||[]).map(p=>p.id));
    const extra = serverData.coachingPlan.filter(p=>!localIds.has(p.id) && !deletedSet.has(p.id));
    state.coachingPlan = [...(state.coachingPlan||[]), ...extra].filter(p=>!deletedSet.has(p.id));
  }

  // To-Do's: jede Person behält nur ihre eigenen lokal, fremde Personen vom Server übernehmen
  if(serverData.todosByUser){
    Object.keys(serverData.todosByUser).forEach(uid=>{
      if(uid !== currentUserId) state.todosByUser[uid] = serverData.todosByUser[uid];
    });
  }

  // Mitarbeiter + Tageswerte + Monatsstand (Calls/NPS/LQ/CHT/...): zellgenau, neuere Änderung gewinnt.
  if(serverData.agents){
    mergeAgentsFromServer(serverData.agents, serverData.deletedAgentIds);
  }
  // Team Ziele, Monatsabschluss, Mitarbeiter-Verlauf: pro Wert, neuere Änderung gewinnt.
  lwwMergeAll(serverData);
  // Laufenden Monat automatisch in den Verlauf schreiben (= automatischer Monats-Snapshot)
  updateLiveVerlaufSnapshot();
  lwwStamp('verlauf');
}

function blockSaveOutdated(){
  if(!saveBlockedByVersion){
    saveBlockedByVersion = true;
    showSyncDebug('⚠️ Dieses Fenster nutzt eine veraltete Fassung des Boards. Speichern ist gesperrt, damit keine alten Daten zurückgeschrieben werden. Bitte die Seite neu laden (Strg+F5).', true);
  }
  setSyncStatus('error');
}

// Nach einem gescheiterten Speichern automatisch erneut versuchen (die Änderungen liegen
// weiterhin lokal mit Zeitstempel vor und gehen nicht verloren).
let saveRetryTimer = null;
function scheduleSaveRetry(){
  if(saveBlockedByVersion) return;
  clearTimeout(saveRetryTimer);
  saveRetryTimer = setTimeout(()=>{ if(!saveBlockedByVersion) scheduleSave(); }, 20000);
}

async function saveToSharePoint(){
  if(saveBlockedByVersion){
    console.warn('Speichern gesperrt: dieses Fenster nutzt eine veraltete Board-Fassung.');
    setSyncStatus('error');
    return;
  }
  const appToken = getKIAppToken();
  if(!appToken){
    console.warn('Kein Zugangs-Passwort hinterlegt - Speichern übersprungen.');
    setSyncStatus('error');
    return;
  }
  setSyncStatus('syncing');
  try {
    // 1) Aktuellsten Serverstand holen. Klappt das nicht, wird NICHT blind gespeichert -
    //    sonst würde ein lokaler Stand ohne Abgleich die Einträge anderer überschreiben.
    let serverData = null;
    const freshResp = await fetch(KI_PROXY_URL + '/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-app-token': appToken },
      body: JSON.stringify({ action: 'load' })
    });
    if(freshResp.ok){
      serverData = await freshResp.json();
    } else if(freshResp.status === 404){
      serverData = {}; // noch gar keine Daten auf dem Server (allererster Start)
    } else {
      console.error('Abgleich vor dem Speichern fehlgeschlagen:', freshResp.status);
      setSyncStatus('error');
      scheduleSaveRetry();
      return;
    }

    // 2) Zusammenführen + speichern. Der Server (ab worker-d1 v2) speichert nur, wenn sich sein
    //    Stand seit unserem Abruf nicht verändert hat (baseRev). Hat zwischenzeitlich jemand
    //    anderes gespeichert, kommt 409 mit dem neuen Stand zurück → erneut zusammenführen.
    for(let attempt = 0; attempt < 5; attempt++){
      if(typeof serverData.boardVersion === 'number' && serverData.boardVersion > BOARD_VERSION){
        blockSaveOutdated();
        return;
      }
      lwwLastMergeChanged = false;
      mergeServerIntoLocalForSave(serverData);
      const baseRev = (typeof serverData._rev === 'number') ? serverData._rev : null;
      const payload = { ...state, boardVersion: BOARD_VERSION };
      delete payload._rev;
      const resp = await fetch(KI_PROXY_URL + '/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-app-token': appToken },
        body: JSON.stringify({ action: 'save', baseRev, data: payload })
      });
      if(resp.ok){
        setSyncStatus('ok');
        saveEpoch++;
        console.log('Gespeichert:', new Date().toLocaleTimeString(), attempt ? `(nach ${attempt} Wiederholung(en))` : '');
        if(agLastMergeChangedLocal || lwwLastMergeChanged) renderAfterRemoteMerge();
        return;
      }
      if(resp.status === 409){
        let body = null;
        try{ body = await resp.json(); }catch(e){}
        if(body && body.outdated){ blockSaveOutdated(); return; }
        if(body && body.data){ serverData = body.data; continue; } // parallel gespeichert → neu zusammenführen
      }
      console.error('Speichern fehlgeschlagen:', resp.status);
      setSyncStatus('error');
      scheduleSaveRetry();
      return;
    }
    console.error('Speichern nach mehreren Versuchen nicht möglich (zu viele parallele Änderungen).');
    setSyncStatus('error');
    scheduleSaveRetry();
  } catch(e){
    console.error('Speicherfehler', e);
    setSyncStatus('error');
    scheduleSaveRetry();
  }
}

// Nach dem Speichern sind ggf. Einträge anderer Führungskräfte dazugekommen → Ansicht auffrischen,
// aber nicht, während jemand gerade in ein Feld tippt (sonst springt der Cursor weg).
function renderAfterRemoteMerge(){
  const ae = document.activeElement;
  const typing = ae && ae.matches && ae.matches('input, textarea, select');
  if(!typing){ try{ renderAll(); }catch(e){ console.warn(e); } }
}

function setSyncStatus(s){
  syncStatus = s;
  const el = document.getElementById('sync-status');
  if(!el) return;
  const map = {
    idle:    { text: 'Nicht verbunden', cls: 'sync-idle' },
    syncing: { text: 'Speichert …',     cls: 'sync-syncing' },
    ok:      { text: '✓ Gespeichert',   cls: 'sync-ok' },
    error:   { text: '⚠ Sync-Fehler',  cls: 'sync-error' }
  };
  el.textContent = map[s].text;
  el.className = 'sync-badge ' + map[s].cls;
}

// Spalten: A=Name, B=Calls, C=MF NG, E=SU, G=BB, I=TV, K=VVM, Q=GESAMT CR, R=NPS
// ============================================================
const EXCEL_FILES = {
  "Trikala01": { path: "Trikala-Portal/MF ScozTR_ 01 Live Ticker.xlsx" },
  "Trikala06": { path: "Trikala-Portal/FN ScozTR_06 Live Ticker.xlsx" }
};

// Einmalige Notfall-Wiederherstellung: Board-Daten liefen bis zur Umstellung auf Cloudflare KV
// über diese OneDrive-Datei. Seit der Umstellung wird sie nicht mehr beschrieben, sollte also
// noch den letzten echten Stand von vorher enthalten. Ergänzt nur, was aktuell leer/fehlend ist -
// überschreibt nichts, was seit der Umstellung neu eingetragen wurde.
async function loadFromExcel(){
  if(!graphToken) return;
  // Die Excel-Dateien liegen in Ioannis' persönlichem OneDrive - bei jeder anderen Führungskraft
  // schlägt der direkte Zugriff mit "403 accessDenied" fehl. Deshalb hier komplett überspringen,
  // wenn nicht sicher feststeht, dass Ioannis eingeloggt ist (schützt auch den automatischen
  // 5-Minuten-Hintergrund-Sync und den Aufruf direkt nach dem Login).
  if(currentUserName !== 'Ioannis Fasoulas') return;
  setSyncStatus('syncing');
  let totalUpdated = 0;
  const excelErrors = [];

  for(const [teamId, cfg] of Object.entries(EXCEL_FILES)){
    try {
      // Datei als Rohdatei laden (wie die JSON-Datei) statt über die Excel-Online-API,
      // da diese bei manchen Dateien/Tenants blockiert ist ("Could not obtain a WAC access token").
      const url = `/drives/${OWNER_DRIVE_ID}/root:/${cfg.path}:/content?_cb=${Date.now()}`;
      const resp = await graphFetch(url);
      if(!resp.ok){
        const errText = await resp.text();
        console.error(`Excel ${teamId} fehlgeschlagen:`, resp.status, errText);
        let detail = '';
        try{ const eb = JSON.parse(errText); detail = eb.error ? ` — ${eb.error.code}: ${eb.error.message}` : ''; }catch(e){}
        excelErrors.push(`${teamId}: HTTP ${resp.status}${detail}`);
        continue;
      }
      const arrayBuffer = await resp.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: 'array' });
      const sheetName = workbook.SheetNames[0];
      if(!sheetName){
        excelErrors.push(`${teamId}: Kein Tabellenblatt in der Datei gefunden`);
        continue;
      }
      const sheet = workbook.Sheets[sheetName];
      // Bereich A5:S80 als Zeilen-Array auslesen (gleiche Spaltenzuordnung wie bisher)
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, range: 'A5:S80', defval: '' });

      rows.forEach(row => {
        const name = (row[0] || '').toString().trim();
        if(!name) return;
        const agent = state.agents.find(a =>
          a.name.trim().toLowerCase() === name.toLowerCase() &&
          String(a.team) === String(teamId)
        );
        if(!agent) return;
        const cellVal = v => (v !== null && v !== undefined && v !== '') ? (parseFloat(v) || 0) : null;
        agent.calls = cellVal(row[1]);
        agent.sales['MF'] = cellVal(row[2]);
        agent.sales['SU'] = cellVal(row[4]);
        agent.sales['BB'] = cellVal(row[6]);
        agent.sales['TV'] = cellVal(row[8]);
        const vvmKey = agent.team === 'Trikala06' ? 'VVM+NVM' : 'VVM+BOJ';
        if(agent.team === 'Trikala06'){
          const vvmVal = cellVal(row[10]);
          const nvmVal = cellVal(row[12]);
          agent.sales[vvmKey] = (vvmVal === null && nvmVal === null) ? null : (vvmVal||0) + (nvmVal||0);
        } else {
          agent.sales[vvmKey] = cellVal(row[10]);
        }
        agent.nps = cellVal(row[17]);
        agent.lq = cellVal(row[18]);
        window.__npsDebug = window.__npsDebug || [];
        window.__npsDebug.push({ name: agent.name, team: agent.team, rawNps: row[17], rawLq: row[18], setNps: agent.nps, setLq: agent.lq });
        totalUpdated++;
      });
    } catch(e){
      console.error(`Excel ${teamId} Fehler:`, e);
    }
  }

  if(window.__npsDebug){
    const problem = window.__npsDebug.filter(d =>
      ((d.rawNps !== undefined && d.rawNps !== null && d.rawNps !== '') && d.setNps === null) ||
      ((d.rawLq !== undefined && d.rawLq !== null && d.rawLq !== '') && d.setLq === null)
    );
    if(problem.length){
      showSyncDebug('🔍 NPS/LQ-Diagnose (Wert vorhanden, aber nicht übernommen): ' + problem.map(p=>`${p.name} (${p.team}): roh-NPS=${JSON.stringify(p.rawNps)} roh-LQ=${JSON.stringify(p.rawLq)}`).join(' | '), true);
    }
    window.__npsDebug = [];
  }

  if(totalUpdated > 0){
    renderAll();
    scheduleSave();
    setSyncStatus('ok');
    const now = new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    const lbl = document.getElementById('excel-sync-label');
    if(lbl) lbl.textContent = `Excel: ${totalUpdated} MA · ${now}`;
    if(excelErrors.length){
      showSyncDebug(`⚠️ Excel teilweise aktualisiert (${totalUpdated} MA), aber Fehler bei: ${excelErrors.join(' | ')}`, true);
    }
  } else {
    setSyncStatus('error');
    showSyncDebug(`❌ Excel-Aktualisierung fehlgeschlagen. ${excelErrors.join(' | ') || 'Keine passenden Mitarbeiter gefunden.'}`, true);
  }
}

function scheduleSave(){
  // Zeitstempel im Moment der Eingabe vergeben (nicht erst beim Speichern) - so gewinnt bei zwei
  // Eingaben in dieselbe Zelle wirklich die zuletzt gemachte.
  try{ agStampLocalEdits(); lwwStampAll(); }catch(e){ console.warn('Zeitstempel konnten nicht gesetzt werden', e); }
  clearTimeout(saveTimer);
  // 2.5s statt 400ms: bündelt mehrere schnelle Änderungen (z.B. beim Ausfüllen der Tageswerte)
  // zu einem einzigen Speichervorgang.
  pendingSave = true;
  setSyncStatus('syncing');
  saveTimer = setTimeout(async ()=>{
    pendingSave = false;
    await runSave();
  }, 2500);
}
let pendingSave = false;
// Verhindert überlappende Speichervorgänge: saveToSharePoint() fragt vor dem eigentlichen
// Speichern erst nochmal beim Server nach (dauert einen Moment) - wenn währenddessen ein
// weiterer Speichervorgang ausgelöst wird, würden beide parallel laufen und könnten sich in
// der falschen Reihenfolge gegenseitig überschreiben. runSave() sorgt dafür, dass immer nur
// ein Speichervorgang gleichzeitig läuft; ein währenddessen ausgelöster weiterer wird einmal
// nachgeholt, sobald der aktuelle fertig ist (nicht öfter, um kein Aufschaukeln zu riskieren).
let saveInProgress = false;
let saveQueued = false;
// Zählt jeden erfolgreichen Speichervorgang hoch. Damit erkennt ein noch laufender Ladevorgang,
// ob währenddessen ein frischerer Speichervorgang durchgekommen ist - falls ja, verwirft er sein
// eigenes (dann veraltetes) Ergebnis für die Monatsabschluss-Daten, statt es zu übernehmen.
let saveEpoch = 0;
// Monatsabschluss wird pro Browser-Sitzung nur EIN einziges Mal vom Server übernommen (siehe
// loadFromSharePoint). Danach gilt der lokale Stand als maßgeblich, egal was ein späterer
// Ladevorgang (Hintergrund-Sync, Excel-Sync-Speichern, o.ä.) liefert - nur echte Eingaben von
// dir können ihn noch ändern. Das schließt jede denkbare zeitliche Überschneidung endgültig aus,
// unabhängig von der genauen Ursache.
// Verhindert, dass Monatsabschluss während einer laufenden Eingabe (Feld hat gerade Fokus) im
// Hintergrund neu geladen wird - das könnte eine noch unfertige Eingabe überschreiben.
function maIsTyping(){
  const el = document.activeElement;
  return !!(el && el.classList && el.classList.contains('ma-input'));
}
async function runSave(){
  if(saveInProgress){ saveQueued = true; return; }
  saveInProgress = true;
  try{
    await saveToSharePoint();
  } finally {
    saveInProgress = false;
    if(saveQueued){
      saveQueued = false;
      await runSave();
    }
  }
}
// Warnt beim Schließen/Neuladen der Seite, falls eine Eingabe noch nicht gespeichert wurde
// (die letzte Änderung wird erst 2,5s nach der Eingabe tatsächlich gespeichert) - verhindert,
// dass ein zu schnelles Neuladen eine gerade erst eingetragene Änderung verwirft.
window.addEventListener('beforeunload', (e)=>{
  if(pendingSave || saveInProgress){
    e.preventDefault();
    e.returnValue = 'Deine letzte Änderung wird noch gespeichert - bitte kurz warten.';
    return e.returnValue;
  }
});

function trafficStatus(val, target){
  if(val >= target) return 'good';
  if(!val || val <= 0) return 'zero';
  return 'mid';
}
// Nach einem Kategorie-Wechsel wandert die Karte in einen anderen Block (z.B. "In Schulung") -
// dorthin scrollen und kurz hervorheben, damit sie nicht "verschwunden" wirkt.
function focusAgentCard(agentId){
  if(!agentId) return;
  requestAnimationFrame(()=>{
    const card = document.querySelector(`.card[data-agent-id="${agentId}"]`);
    if(!card) return;
    card.scrollIntoView({behavior:'smooth', block:'center'});
    const prev = card.style.boxShadow;
    card.style.transition = 'box-shadow .3s';
    card.style.boxShadow = '0 0 0 3px var(--tmg)';
    setTimeout(()=>{ card.style.boxShadow = prev; }, 1600);
    const nameInp = card.querySelector('.name-input');
    if(nameInp && !nameInp.value.trim()) nameInp.focus();
  });
}

function makeAgent(team){
  const cfg = TEAM_CONFIGS[team];
  const sales = {};
  cfg.products.forEach(p=>{ sales[p] = 0; });
  return { id: uid(), name: '', team: team, category: 'regular', calls: 0, nps: 0, lq: 0, sales, coachingplan: '' };
}

function totalStk(agent){
  const cfg = TEAM_CONFIGS[agent.team];
  // BOJ (= HV) wird aus der Gesamt-CR ausgeschlossen - genau wie in Team Ziele und Monatsabschluss
  return cfg.products.filter(p => p !== 'BOJ').reduce((s,p)=> s + (agent.sales[p]||0), 0);
}
function totalCr(agent){
  if(!agent.calls || agent.calls <= 0) return 0;
  return (totalStk(agent) / agent.calls) * 100;
}
function agentTargets(agent){
  const cfg = TEAM_CONFIGS[agent.team];
  if(!cfg) return [];
  return cfg.targets[agent.category || 'regular'] || cfg.targets['regular'] || [];
}
function evaluateAgent(agent){
  const cfg = TEAM_CONFIGS[agent.team];
  if(!cfg) return { tags: [], status: 'ok' };
  const targets = agentTargets(agent);
  const tags = [];
  if(agent.nps && agent.nps > 0 && agent.nps < cfg.npsTarget) tags.push('NPS');
  if(agent.lq && agent.lq > 0 && agent.lq < cfg.lqTarget) tags.push('LQ');
  cfg.products.forEach((p,i)=>{
    const val = agent.sales[p]||0;
    if(targets[i] !== undefined && val < targets[i]) tags.push(p + ' Stück');
  });
  if(totalCr(agent) < cfg.crTarget) tags.push('Gesamt-CR');

  let status = 'ok';
  if(tags.length === 1) status = 'warn';
  if(tags.length >= 2) status = 'critical';
  return { tags, status };
}

// Kurze automatische Zusammenfassung aus KPI-Verlauf (Monatsarchiv) + Coaching-Verlauf,
// für die kompakte Mitarbeiterkarte im Standort Überblick.
function buildAgentSummary(agent){
  const MONATE_ORDER = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  // KPI-Verlauf: Trend über die erfassten Monate (rein rechnerisch, immer aktuell verfügbar)
  const vlEntry = Object.values(state.verlauf).find(v=>v.name===agent.name && v.team===agent.team);
  const monKeys = (vlEntry && vlEntry.monate) ? Object.keys(vlEntry.monate).sort((a,b)=>{
    const [ya,ma] = a.split('-'); const [yb,mb] = b.split('-');
    if(ya !== yb) return ya.localeCompare(yb);
    return MONATE_ORDER.indexOf(ma) - MONATE_ORDER.indexOf(mb);
  }) : [];
  if(monKeys.length >= 2){
    const erstesCr = vlEntry.monate[monKeys[0]].cr || 0;
    const letztesCr = vlEntry.monate[monKeys[monKeys.length-1]].cr || 0;
    const diff = letztesCr - erstesCr;
    const richtung = Math.abs(diff) < 0.3 ? 'stabil' : (diff > 0 ? 'steigend' : 'fallend');
    return `CR-Trend über ${monKeys.length} erfasste Monate: ${richtung} (${erstesCr.toFixed(1)}% → ${letztesCr.toFixed(1)}%).`;
  } else if(monKeys.length === 1){
    return `Erst ein Monat archiviert (${monKeys[0].split('-')[1]}) – noch kein Trend erkennbar.`;
  }
  return 'Noch keine Monatsdaten archiviert.';
}

// Mitarbeiter eines Teams, die genug Coaching-Notizen für eine KI-Zusammenfassung haben.
function agentsWithNotesForTeam(teamAgents){
  return teamAgents.filter(agent=>{
    if(!agent.name.trim()) return false;
    const eintraege = kiAgentEntries(agent).filter(e=>e.stil !== 'Workshop' && e.stil !== 'Einzelgespräch');
    const echteNotizen = eintraege.filter(e=>e.text && e.text.trim() && e.text !== '(Coaching ohne Notiz)');
    return echteNotizen.length >= 2;
  });
}

// Holt für ein ganzes Team in EINEM KI-Aufruf (verbraucht nur 1 von den 5 Tages-Anfragen) ein
// kurzes, inhaltliches Feedback je Mitarbeiter, basierend auf dessen Coaching-Notizen.
async function generateTeamKiSummaries(teamId, cfg, teamAgents, btn){
  const kandidaten = agentsWithNotesForTeam(teamAgents);
  if(!kandidaten.length){
    alert('Kein Mitarbeiter in diesem Team hat aktuell genug Coaching-Notizen (mind. 2) für eine Zusammenfassung.');
    return;
  }
  const origLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ Wird generiert...';

  const payload = kandidaten.map(agent=>{
    const eintraege = kiAgentEntries(agent).filter(e=>e.stil !== 'Workshop' && e.stil !== 'Einzelgespräch');
    const notizen = eintraege
      .filter(e=>e.text && e.text.trim() && e.text !== '(Coaching ohne Notiz)')
      .sort((a,b)=>{
        const da = (a.datum||'').split('.').reverse().join('-');
        const db = (b.datum||'').split('.').reverse().join('-');
        return db.localeCompare(da);
      })
      .slice(0,6)
      .map(e=>({ datum: e.datum, notiz: e.text }));
    return { name: agent.name, coaching_notizen: notizen };
  });

  const systemPrompt = `Du bist Assistent eines Salescoaches bei der Telekom (Inbound Mobilfunk/Festnetz Privatkunden). Für jeden Mitarbeiter unten bekommst du seine letzten Coaching-Notizen. Schreibe pro Mitarbeiter EIN kurzes, konkretes Feedback (max. 20 Wörter, ein Satz), das die inhaltlichen Muster über die Notizen hinweg zusammenfasst - keine reine Wortliste, keine wörtliche Wiedergabe der Notizen. Sag klar, worauf es hinausläuft (z.B. eine wiederkehrende Schwäche, ein klarer Fortschritt, oder ein gemischtes Bild) und wenn möglich einen kurzen Hinweis fürs nächste Coaching. Antworte AUSSCHLIESSLICH mit einem validen JSON-Array, ohne Markdown-Codeblock, ohne weiteren Text, in genau diesem Format:
[{"name":"Vorname Nachname","feedback":"..."}]

MITARBEITERDATEN:
${JSON.stringify(payload, null, 2)}`;

  try {
    const appToken = getKIAppToken();
    const response = await fetch(KI_PROXY_URL + '/analyze', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-app-token': appToken,
        'x-user-id': currentUserId || currentUserName || getCoachName()
      },
      body: JSON.stringify({
        system: systemPrompt,
        messages: [{ role: 'user', content: 'Erstelle die Zusammenfassungen im geforderten JSON-Format.' }]
      })
    });
    if(!response.ok){
      const errData = await response.json().catch(()=>({}));
      if(response.status === 429) throw new Error(errData.error?.message || 'Tageslimit erreicht. Bitte morgen wieder versuchen.');
      throw new Error(errData.error?.message || ('HTTP ' + response.status));
    }
    const data = await response.json();
    let raw = data.content?.[0]?.text || '[]';
    raw = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
    const results = JSON.parse(raw);
    const heute = new Date().toLocaleDateString('de-DE');
    results.forEach(r=>{
      const agent = kandidaten.find(a=>a.name === r.name);
      if(agent && r.feedback){
        agent.kiSummary = r.feedback;
        agent.kiSummaryDatum = heute;
      }
    });
    scheduleSave();
    renderAll();
  } catch(e){
    alert('KI-Zusammenfassung fehlgeschlagen: ' + e.message);
    btn.disabled = false;
    btn.textContent = origLabel;
  }
}

function numField(labelText, value, onChange, step){
  const wrap = document.createElement('div');
  wrap.className = 'metric-field';
  const label = document.createElement('label');
  label.textContent = labelText;
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = step ? 'decimal' : 'numeric';
  const parsed = parseFloat(value) || 0;
  input.value = step ? parsed.toFixed(2) : Math.round(parsed).toString();
  input.addEventListener('change', e=>{ onChange(parseFloat(e.target.value.replace(',','.'))||0); scheduleSave(); renderAll(); });
  wrap.appendChild(label); wrap.appendChild(input);
  return wrap;
}

            <span class="panel-avg-label">${label}</span>
            <div class="panel-avg-vals">
              <span class="panel-avg-agent">${agentVal.toFixed(1)}${suffix}</span>
              <span class="panel-avg-arrow ${arrowCls}">${arrow}</span>
              <span class="panel-avg-team">Ø${teamVal.toFixed(1)}${suffix}</span>
            </div>`;
          return row;
        };

        if(myCum && myCum.cr > 0) avgSection.appendChild(mkAvgRow('CR', myCum.cr, teamAvg('cr'), '%'));
        if(myCum && myCum.nps > 0) avgSection.appendChild(mkAvgRow('NPS', myCum.nps, teamAvg('nps'), '%'));
        if(myCum && myCum.lq > 0) avgSection.appendChild(mkAvgRow('LQ', myCum.lq, teamAvg('lq'), '%'));
        if(myCum && myCum.cht > 0){
          // CHT: für die Farbrichtung ist niedriger besser (umgekehrt zu NPS/CR),
          // deshalb kehren wir das Arrow-Vorzeichen in mkAvgRow um
          const chtTeam = teamAvg('cht');

          const diff = myCum.cht - chtTeam;
          // Für CHT: ▼ = gut (kürzer als Schnitt), ▲ = schlecht
          const arrowCls = diff < -5 ? 'up' : diff > 5 ? 'down' : 'eq';
          const arrow = diff < -5 ? '▼' : diff > 5 ? '▲' : '—';
          chtRow.innerHTML = `
            <span class="panel-avg-label">CHT</span>
            <div class="panel-avg-vals">
              <span class="panel-avg-agent">${Math.round(myCum.cht)}</span>
              <span class="panel-avg-arrow ${arrowCls}">${arrow}</span>
              <span class="panel-avg-team">Ø${Math.round(chtTeam)}</span>
            </div>`;
          avgSection.appendChild(chtRow);
        }
        cfg.products.forEach(p=>{
          const av = myCum ? myCum.sales[p]||0 : 0;
          const tv = teamAvgProd(p);
          if(av > 0 || tv > 0) avgSection.appendChild(mkAvgRow(p, av, tv, ''));
        });
        if(!myCum || (myCum.cr===0 && myCum.nps===0 && myCum.lq===0 && myCum.cht===0)){
          const none = document.createElement('div');
          none.className = 'panel-coaching-none';
          none.textContent = 'Noch keine Daten vorhanden.';
          avgSection.appendChild(none);
        }
      }
      card.appendChild(avgSection);

      // === Notizen ===
      const notesSection = document.createElement('div');
      notesSection.className = 'panel-section';
      const notesTitle = document.createElement('div');
      notesTitle.className = 'panel-section-title';
      notesTitle.textContent = '📝 Notizen';
      notesSection.appendChild(notesTitle);

      notesSection.appendChild(notesArea);

      // vs. Teamdurchschnitt (kompakt, Werte direkt neben dem Namen) und Notizen (füllt den Rest)

      const topPairRow = document.createElement('div');
      topPairRow.style.cssText = 'display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;';

      // === Kurz-Zusammenfassung: CR-Trend (rechnerisch) + KI-Feedback aus Coaching-Notizen (gecacht) ===

        ? `${agent.kiSummary}${agent.kiSummaryDatum ? ' (KI-Feedback vom ' + agent.kiSummaryDatum + ')' : ''}`
        : 'Noch keine KI-Zusammenfassung – oben am Team-Titel generieren.';

  // Hilfsfunktion: Karte für Schulungs- und Work-Mitarbeiter (gleicher Aufbau wie normale Karten)
  function buildSpecialCard(agent, borderColor){
    const cfg = TEAM_CONFIGS[agent.team] || Object.values(TEAM_CONFIGS)[0];

    card.className = 'card';
    card.dataset.agentId = agent.id || '';

    const ortSelect = document.createElement('select');
    ortSelect.className = 'pylon-input'; ortSelect.title = 'Arbeitsort';
    ortSelect.style.cursor = 'pointer'; ortSelect.style.width = 'auto';
    [['','🏢/🏠'],['buero','🏢 Büro'],['homeoffice','🏠 Homeoffice']].forEach(([val,lbl])=>{
      const opt = document.createElement('option');
      opt.value = val; opt.textContent = lbl;
      if((agent.arbeitsort||'') === val) opt.selected = true;
      ortSelect.appendChild(opt);
    });
    ortSelect.addEventListener('change', e=>{ agent.arbeitsort = e.target.value; scheduleSave(); });
    topLeft.appendChild(ortSelect);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn'; removeBtn.textContent = '✕'; removeBtn.title = 'Entfernen';
    removeBtn.addEventListener('click', ()=>{
      if(!confirm(`"${agent.name || 'Dieser Mitarbeiter'}" wirklich löschen?`)) return;
      state.agents = state.agents.filter(a=>a.id!==agent.id);
        if(!state.deletedAgentIds) state.deletedAgentIds = [];

      scheduleSave(); renderAll();

    topRow.appendChild(topLeft); topRow.appendChild(removeBtn);

    // === vs. Teamdurchschnitt ===
    const vlEntry = Object.values(state.verlauf).find(v=>v.name===agent.name && v.team===agent.team);

    avgSection.appendChild(avgTitle);

    {
      const useArchiv2 = monatsListe.length > 0;
      const myCr  = useArchiv2 ? (()=>{ const vals=monatsListe.map(m=>m.cr).filter(v=>v>0); return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0; })() : (totalCr(agent)||0);
      const myNps = useArchiv2 ? (()=>{ const vals=monatsListe.map(m=>m.nps).filter(v=>v>0); return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0; })() : (agent.nps||0);
      const myLq  = useArchiv2 ? (()=>{ const vals=monatsListe.map(m=>m.lq).filter(v=>v>0); return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0; })() : (agent.lq||0);
      const myCht = useArchiv2 ? (()=>{ const vals=monatsListe.map(m=>m.cht).filter(v=>v>0); return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0; })() : (agent.cht||0);

      const teamAgentsAll = state.agents.filter(a=>a.team===agent.team && a.name.trim());
      const teamCums = teamAgentsAll.map(a=>{
        if(useArchiv2){
          const vl=Object.values(state.verlauf).find(v=>v.name===a.name&&v.team===a.team);
          const mon=(vl&&vl.monate)?Object.values(vl.monate):[];
          if(!mon.length) return null;
          const av=(f)=>{const vs=mon.map(m=>m[f]).filter(v=>v>0); return vs.length?vs.reduce((s,v)=>s+v,0)/vs.length:0;};
          return {cr:av('cr'),nps:av('nps'),lq:av('lq'),cht:av('cht')};
        } else {
          return {cr:totalCr(a)||0,nps:a.nps||0,lq:a.lq||0,cht:a.cht||0};
        }
      }).filter(Boolean);
      const tAvg = (field) => { const vals=teamCums.map(c=>c[field]).filter(v=>v>0); return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0; };
      const mkRow = (label, av, tv, suffix) => {
        const row = document.createElement('div'); row.className='panel-avg-row';
        const diff=av-tv; const arrowCls=diff>0.1?'up':diff<-0.1?'down':'eq'; const arrow=diff>0.1?'▲':diff<-0.1?'▼':'—';
        row.innerHTML=`<span class="panel-avg-label">${label}</span><div class="panel-avg-vals"><span class="panel-avg-agent">${av.toFixed(1)}${suffix}</span><span class="panel-avg-arrow ${arrowCls}">${arrow}</span><span class="panel-avg-team">Ø${tv.toFixed(1)}${suffix}</span></div>`;

      if(myCr>0) avgSection.appendChild(mkRow('CR',myCr,tAvg('cr'),'%'));
      if(myNps>0) avgSection.appendChild(mkRow('NPS',myNps,tAvg('nps'),'%'));
      if(myLq>0) avgSection.appendChild(mkRow('LQ',myLq,tAvg('lq'),'%'));
      if(myCht>0){
        const row=document.createElement('div'); row.className='panel-avg-row';
        const diff=myCht-tAvg('cht'); const arrowCls=diff<-5?'up':diff>5?'down':'eq'; const arrow=diff<-5?'▼':diff>5?'▲':'—';
        row.innerHTML=`<span class="panel-avg-label">CHT</span><div class="panel-avg-vals"><span class="panel-avg-agent">${Math.round(myCht)}</span><span class="panel-avg-arrow ${arrowCls}">${arrow}</span><span class="panel-avg-team">Ø${Math.round(tAvg('cht'))}</span></div>`;
        avgSection.appendChild(row);
      }
      if(myCr===0 && myNps===0 && myLq===0 && myCht===0){
        const none = document.createElement('div'); none.className='panel-coaching-none';
        none.textContent='Noch keine Daten vorhanden.';
        avgSection.appendChild(none);
      }
    }

    // === Notizen ===
    const notesSection = document.createElement('div');
    notesSection.className = 'panel-section';
    const notesTitle = document.createElement('div');
    notesTitle.className = 'panel-section-title';
    notesTitle.textContent = '📝 Notizen';
    notesSection.appendChild(notesTitle);
    const notesArea = document.createElement('textarea');
    notesArea.className = 'agent-notes';
    notesArea.placeholder = 'Notizen zu diesem Mitarbeiter...';
    notesArea.value = agent.notiz || '';
    notesArea.addEventListener('input', e=>{ agent.notiz = e.target.value; scheduleSave(); });
    notesSection.appendChild(notesArea);

    const pairRow = document.createElement('div');
    pairRow.style.cssText = 'display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;';
    avgSection.style.cssText = 'flex:0 0 auto;min-width:220px;';
    notesSection.style.cssText = 'flex:1 1 240px;display:flex;flex-direction:column;';
    notesArea.style.flex = '1';
    pairRow.appendChild(avgSection);
    pairRow.appendChild(notesSection);
    card.appendChild(pairRow);
    return card;
  }

  // Schulungs-Mitarbeiter Block
  // Auch Karten ohne Namen zeigen - ein frisch angelegter Mitarbeiter hat noch keinen Namen und
  // wäre sonst nach dem Umstellen auf "Schulung" nirgends mehr sichtbar.

      <div style="font-family:'Inter',sans-serif;font-size:12px;color:#B7770D;margin-bottom:12px;">Kategorie ändern, sobald sie einem Team zugeordnet werden.</div>`;

      <div style="font-family:'Inter',sans-serif;font-size:12px;color:#388E3C;margin-bottom:12px;">Erscheinen nur im Standort Überblick. Kategorie ändern um sie in Mitarbeiter Ziele einzublenden.</div>`;
    const workWrap = document.createElement('div');

    workAgents.forEach(agent=> workWrap.appendChild(buildSpecialCard(agent, '#66BB6A')));

function renderHallOfFame(){
  const container = document.getElementById('halloffame-container');
  container.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'hof-wrap';
  wrap.innerHTML = `
    <div class="hof-trophy">🏆</div>
    <div class="hof-title">Hall of Fame</div>
    <div class="hof-sub">Mitarbeiter die NPS-Ziel erreicht haben UND mindestens 4 von 5 Produktzielen erfüllt haben.</div>
    <div class="hof-criteria">
      <strong>Kriterien:</strong> NPS ≥ Ziel &nbsp;+&nbsp; CR ≥ Ziel (MF: 7%, FN: 11%) &nbsp;+&nbsp; mindestens 4 von 5 Produkten ≥ Ziel &nbsp;·&nbsp;
      <strong>MF Ziele:</strong> MF 24, SU 3, BB 4, TV 3, VVM+BOJ 5 &nbsp;·&nbsp;
      <strong>FN Ziele:</strong> SU 16, BB 17, TV 9, VVM+NVM 20, MF 2
    </div>
    <div style="font-family:'Inter',sans-serif;font-size:12px;color:#888;margin-top:8px;padding:8px 12px;background:#f8f9fa;border-radius:8px;display:inline-block;">
      💡 Aktueller Monat: Live-Daten. Vergangene Monate: NPS, LQ und CR aus dem Mitarbeiter-Verlauf, Stückzahlen aus den Tageswerten (falls erfasst) bzw. dem Verlauf.
    </div>
  `;
  container.appendChild(wrap);

  const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const MEDALS = ['🥇','🥈','🥉','🎖️','🎖️','🎖️','🎖️','🎖️','🎖️','🎖️'];

  // Aktueller Monat-Key (z.B. "2026-Oktober")
  const jetzt = new Date();
  const aktuellesJahr = jetzt.getFullYear();
  const aktuellerMonatName = jetzt.toLocaleString('de-DE',{month:'long'});
  const aktuellerMonatKey = `${aktuellesJahr}-${aktuellerMonatName}`;

  // Hilfs-Map: Monatsname → zweistellige Nummer
  const MONAT_ZU_NR = {
    'Januar':'01','Februar':'02','März':'03','April':'04','Mai':'05','Juni':'06',
    'Juli':'07','August':'08','September':'09','Oktober':'10','November':'11','Dezember':'12'
  };

  // Verlaufs-Eintrag eines Mitarbeiters finden. Im Verlauf sind viele Mitarbeiter nur mit Nachnamen
  // gespeichert (z.B. "Rizou" statt "Rizou Maria") - deshalb wie im Reiter "Mitarbeiter Verlauf"
  // unscharf abgleichen: exakter Schlüssel → exakter Name → Vor-/Nachname passt.
  function findVerlauf(agent){
    const vlAll = state.verlauf || {};
    if(vlAll[agent.name + '_' + agent.team]) return vlAll[agent.name + '_' + agent.team];
    const sameTeam = Object.values(vlAll).filter(v => v && v.team === agent.team && v.monate);
    const exact = sameTeam.find(v => v.name === agent.name);
    if(exact) return exact;
    const fuzzy = sameTeam.filter(v => v.name && (
      agent.name.startsWith(v.name + ' ') || agent.name.endsWith(' ' + v.name) ||
      v.name.startsWith(agent.name + ' ') || v.name.endsWith(' ' + agent.name)
    ));
    if(fuzzy.length === 1) return fuzzy[0];
    if(fuzzy.length > 1){
      // mehrere Treffer (gleicher Nachname) → den mit den meisten Monatsdaten nehmen
      return fuzzy.sort((a,b)=>Object.keys(b.monate).length - Object.keys(a.monate).length)[0];
    }
    return null;
  }
  // Monatsdaten aus dem Verlauf holen - Schlüssel kann "2026-Oktober" oder (ältere Einträge) nur "Oktober" sein.
  function verlaufMonat(vl, monatKey){
    if(!vl || !vl.monate) return null;
    if(vl.monate[monatKey]) return vl.monate[monatKey];
    const [j, m] = monatKey.split('-');
    if(j === '2026' && vl.monate[m]) return vl.monate[m];
    return null;
  }
  // Produktsummen eines Monats aus den Tageswerten (falls dort erfasst)
  function salesAusTageswerten(agent, monatKey){
    const [mkJahr, mkMonat] = monatKey.split('-');
    const mkNr = MONAT_ZU_NR[mkMonat];
    const tw = mkNr && agent.tageswerte && agent.tageswerte[`${mkJahr}-${mkNr}`];
    if(!tw) return null;
    const cfg2 = TEAM_CONFIGS[agent.team];
    if(!cfg2) return null;
    const extraProds = teamExtraProducts(agent.team);
    const alleProds = [...cfg2.products, ...extraProds];
    const sum = {}; let any = false;
    alleProds.forEach(p=>{ sum[p] = 0; });
    Object.values(tw).forEach(dv=>{
      if(!dv || !dv.sales) return;
      alleProds.forEach(p=>{ const v = dv.sales[p]; if(v !== null && v !== undefined){ sum[p] += v; any = true; } });
    });
    return any ? sum : null;
  }

  // Diagnose pro Monat: wie viele Mitarbeiter hatten überhaupt Daten?
  const hofDatenProMonat = {};

  // Prüfe ob ein MA die Hall of Fame Kriterien erfüllt
  function checkHOF(agent, monatKey){
    let md;
    if(monatKey === aktuellerMonatKey){
      // Aktueller Monat: Live-Daten aus dem Monatsstand
      md = {
        nps: agent.nps || 0,
        lq: agent.lq || 0,
        cr: totalCr(agent) || 0,
        cht: agent.cht || 0,
        sales: agent.sales ? JSON.parse(JSON.stringify(agent.sales)) : {}
      };
    } else {
      // Vergangene Monate: NPS/LQ/CR aus dem Mitarbeiter-Verlauf dieses Monats.
      // Ohne Monats-NPS kann das NPS-Kriterium nicht geprüft werden → kein Eintrag
      // (früher wurde hier fälschlich der AKTUELLE NPS verwendet).
      const vm = agentVerlaufMonat(agent, monatKey.split('-')[0], monatKey.split('-').slice(1).join('-'));
      if(!vm) return null;
      const twSales = salesAusTageswerten(agent, monatKey);
      md = {
        nps: vm.nps || 0,
        lq: vm.lq || 0,
        cr: vm.cr || 0,
        cht: vm.cht || 0,
        // Stückzahlen: Tageswerte, falls für diesen Monat erfasst, sonst Verlaufs-Snapshot
        sales: twSales || vm.sales || {}
      };
      if(!md.nps) return null;
    }
    hofDatenProMonat[monatKey] = (hofDatenProMonat[monatKey] || 0) + 1;
    const cfg = TEAM_CONFIGS[agent.team];
    if(!cfg) return null;

    // Monatsspezifisches NPS-Ziel
    const NPS_ZIELE = {
      'Trikala01': {'2026-Januar':67,'2026-Februar':67,'2026-März':67,'2026-April':67,'2026-Mai':68,'2026-Juni':68,'2026-Juli':69},
      'Trikala06': {'2026-Januar':66,'2026-Februar':66,'2026-März':66,'2026-April':66,'2026-Mai':67,'2026-Juni':67,'2026-Juli':63}
    };
    const npsZielMonat = (NPS_ZIELE[agent.team] && NPS_ZIELE[agent.team][monatKey]) || cfg.npsTarget;
    const npsOk = (md.nps || 0) >= npsZielMonat;
    if(!npsOk) return null;

    // LQ Ziel prüfen (ab September 2026)
    const [monatJahr, monatName] = monatKey.split('-');
    const MONATE_ORDER = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    const monatIdx = MONATE_ORDER.indexOf(monatName);
    const isAbSeptember2026 = parseInt(monatJahr) > 2026 || (parseInt(monatJahr) === 2026 && monatIdx >= 8);
    if(isAbSeptember2026 && md.lq !== undefined && md.lq > 0){
      const lqOk = md.lq >= cfg.lqTarget;
      if(!lqOk) return null;
    }

    // CR Ziel prüfen (nur wenn CR-Daten vorhanden)
    if(md.cr && md.cr > 0){
      const crOk = md.cr >= cfg.crTarget;
      if(!crOk) return null;
    }

    // Produkt-Ziele prüfen
    const targets = agentTargets({team: agent.team, category: agent.category || 'regular'});
    const prods = cfg.products;
    let goalsHit = 0;
    prods.forEach((p, i) => {
      const val = (md.sales && md.sales[p]) || 0;
      if(val >= targets[i]) goalsHit++;
    });

    if(goalsHit < 4) return null;

    return {
      name: agent.name,
      team: agent.team,
      nps: md.nps,
      lq: md.lq,
      npsTarget: npsZielMonat,
      lqTarget: cfg.lqTarget,
      crTarget: cfg.crTarget,
      goalsHit,
      totalGoals: prods.length,
      cr: md.cr || 0,
    };
  }

  const monthsWrap = document.createElement('div');
  monthsWrap.className = 'hof-months';

  // Für jeden Monat eine Karte
  MONATE.forEach(monat => {
    const periode = '2026-' + monat;

    // Prüfe alle MA
    const winners = { Trikala01: [], Trikala06: [] };

    state.agents.forEach(agent => {
      const result = checkHOF(agent, periode);
      if(result) winners[agent.team]?.push(result);
    });

    const hasAny = winners.Trikala01.length > 0 || winners.Trikala06.length > 0;

    // Karte erstellen
    const card = document.createElement('div');
    card.className = 'hof-month-card';

    const title = document.createElement('div');
    title.className = 'hof-month-title';
    title.innerHTML = `🗓️ ${monat} 2026`;
    card.appendChild(title);

    if(!hasAny){
      const empty = document.createElement('div');
      empty.className = 'hof-empty';
      empty.textContent = 'Keine Einträge';
      card.appendChild(empty);
      const nDaten = hofDatenProMonat[periode] || 0;
      const istZukunft = MONATE.indexOf(monat) > jetzt.getMonth() && aktuellesJahr === 2026;
      const hint = document.createElement('div');
      hint.style.cssText = "font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);margin-top:6px;";
      if(istZukunft) hint.style.display = 'none';
      hint.textContent = nDaten
        ? `${nDaten} Mitarbeiter mit Monatsdaten – Kriterien nicht erfüllt`
        : 'Keine Monatsdaten (NPS) gespeichert';
      card.appendChild(hint);
    } else {
      Object.entries(winners).forEach(([teamId, list]) => {
        if(!list.length) return;
        const cfg = TEAM_CONFIGS[teamId];

        const teamLbl = document.createElement('div');
        teamLbl.className = 'hof-team-label';
        teamLbl.textContent = cfg.label;
        card.appendChild(teamLbl);

        // Sortieren: 50% CR + 30% Stückzahl + 20% NPS
        list.sort((a,b) => {
          // Sales-Score: erreichte Ziele % (0-100)
          const salesScoreA = (a.goalsHit / a.totalGoals) * 100;
          const salesScoreB = (b.goalsHit / b.totalGoals) * 100;
          // CR-Score: CR / CRZiel * 100 (max 200)
          const crScoreA = a.crTarget > 0 ? Math.min((a.cr / a.crTarget) * 100, 200) : 50;
          const crScoreB = b.crTarget > 0 ? Math.min((b.cr / b.crTarget) * 100, 200) : 50;
          // NPS-Score: NPS / NPSZiel * 100
          const npsScoreA = a.npsTarget > 0 ? (a.nps / a.npsTarget) * 100 : 0;
          const npsScoreB = b.npsTarget > 0 ? (b.nps / b.npsTarget) * 100 : 0;
          // Gesamtpunktzahl: 50% CR + 30% Stückzahl + 20% NPS
          const totalA = crScoreA * 0.5 + salesScoreA * 0.3 + npsScoreA * 0.2;
          const totalB = crScoreB * 0.5 + salesScoreB * 0.3 + npsScoreB * 0.2;
          return totalB - totalA;
        });

        list.forEach((w, i) => {
          const entry = document.createElement('div');
          entry.className = 'hof-entry';
          entry.innerHTML = `
            <span class="hof-medal">${MEDALS[i]||'⭐'}</span>
            <span class="hof-name">${w.name}</span>
            <div class="hof-stats">
              <span class="hof-stat good">NPS ${w.nps.toFixed(1)}%</span>
              ${w.lq !== undefined && w.lq > 0 ? `<span class="hof-stat good">LQ ${w.lq.toFixed(1)}%</span>` : ''}
              <span class="hof-stat good">${w.goalsHit}/${w.totalGoals} Ziele</span>
              ${w.cr > 0 ? `<span class="hof-stat ok">CR ${w.cr.toFixed(2)}%</span>` : ''}
            </div>
          `;
          card.appendChild(entry);
        });
      });
    }

    monthsWrap.appendChild(card);
  });

  wrap.appendChild(monthsWrap);
}

function buildKIContext(){
  // Kompakte Datensammlung für Claude
  const ctx = { teams: {} };

  Object.keys(TEAM_CONFIGS).forEach(teamId=>{
    const cfg = TEAM_CONFIGS[teamId];
    const agents = state.agents.filter(a=>a.team===teamId);
    const teamCtx = {
      name: cfg.label + ' — ' + cfg.project,
      ziele: { cr: cfg.crTarget, nps: cfg.npsTarget, lq: cfg.lqTarget },
      mitarbeiter: agents.map(a=>{
        const cv = state.coachverlauf[a.id];
        const coachingHistorie = ((cv && cv.eintraege) || []).slice(0, 8).map(e=>({
          datum: e.datum,
          thema: e.thema || null,
          stil: e.stil || null,
          tcap_id: e.tcapId || null,
          dauer_min: e.dauer || null,
          performance_note: (e.performance !== undefined && e.performance !== null) ? e.performance + '/10' : null,
          notiz: e.text || null,
          leitfaden_checkliste: e.checkliste || null,
          coach: e.coach || null
        }));
        const verlaufEntry = Object.values(state.verlauf).find(v => v.name === a.name && v.team === teamId);
        const monatsverlauf = verlaufEntry ? Object.keys(verlaufEntry.monate).map(m=>({
          monat: m,
          cr: verlaufEntry.monate[m].cr,
          nps: verlaufEntry.monate[m].nps,
          lq: verlaufEntry.monate[m].lq,
          calls: verlaufEntry.monate[m].calls,
          stueckzahl: Object.values(verlaufEntry.monate[m].sales||{}).reduce((s,v)=>s+v,0),
          sales: verlaufEntry.monate[m].sales
        })) : [];
        return {
          name: a.name,
          kategorie: CATEGORY_LABELS[a.category]||a.category,
          calls: a.calls,
          nps: a.nps,
          lq: a.lq,
          cr: parseFloat(totalCr(a).toFixed(2)),
          sales: a.sales,
          letztes_coaching: a.coachingDatum || 'nie',
          coaching_historie: coachingHistorie,
          monatsverlauf_alle_monate: monatsverlauf
        };
      }),
      monatsabschluss: {}
    };

    // Monatsabschluss-Daten für ALLE vorhandenen Monate (nicht nur den aktuellen)
    const maData = state.monatsabschluss[teamId==='Trikala01'?'mf':'fn'] || {};
    Object.keys(maData).forEach(m=>{
      const md = maData[m];
      if(md){
        teamCtx.monatsabschluss[m] = {
          cr_gesamt: md.crGesamtErreicht,
          cr_ziel: md.crGesamtZiel,
          nps_ist: md.nps_ist,
          nps_plan: md.nps_plan
        };
      }
    });

    // Team Ziele (Soll/Ist, CR-Stand)
    const tz = state.teamziele[teamId==='Trikala01'?'mf':'fn'];
    if(tz){
      teamCtx.team_ziele_aktuell = {
        monat: tz.monat,
        nps_ziel: tz.nps,
        cr_gestern: tz.crGestern,
        cr_monat: tz.crMonat,
        cr_ziel: tz.crZiel,
        produkte_soll: tz.soll,
        produkte_ist: tz.ist
      };
    }

    ctx.teams[teamId] = teamCtx;
  });

  return ctx;
}

  kiHistory.forEach(msg=>addMsgBubble(msg.role, msg.content, historyEl));

  function renderMarkdown(text){
    const lines = text.split('\n');
    let html = '';
    let i = 0;
    let inList = false;
    while(i < lines.length){
      const line = lines[i];

      // Tabelle erkennen
      if(/^\s*\|.*\|\s*$/.test(line)){
        const tableLines = [];
        while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
          tableLines.push(lines[i]);
          i++;
        }
        const rows = tableLines
          .filter(l => !/^\s*\|[\s:|-]+\|\s*$/.test(l)) // Trennzeile |---|---| rauswerfen
          .map(l => l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
        if(rows.length){
          html += '<table class="ki-table"><thead><tr>' +
            rows[0].map(c=>`<th>${inlineMd(c)}</th>`).join('') +
            '</tr></thead><tbody>' +
            rows.slice(1).map(r=>'<tr>' + r.map(c=>`<td>${inlineMd(c)}</td>`).join('') + '</tr>').join('') +
            '</tbody></table>';
        }
        continue;
      }

      // Überschriften
      let m;
      if((m = /^###\s+(.*)/.exec(line))){ html += `<h4 class="ki-h">${inlineMd(m[1])}</h4>`; i++; continue; }
      if((m = /^##\s+(.*)/.exec(line))){ html += `<h3 class="ki-h">${inlineMd(m[1])}</h3>`; i++; continue; }
      if((m = /^#\s+(.*)/.exec(line))){ html += `<h2 class="ki-h">${inlineMd(m[1])}</h2>`; i++; continue; }

      // Horizontale Linie
      if(/^\s*---+\s*$/.test(line)){ html += '<hr class="ki-hr">'; i++; continue; }

      // Listenpunkte
      if((m = /^\s*[-*]\s+(.*)/.exec(line))){
        if(!inList){ html += '<ul class="ki-list">'; inList = true; }
        html += `<li>${inlineMd(m[1])}</li>`;
        i++;
        continue;
      }
      if(inList){ html += '</ul>'; inList = false; }

      // Leerzeile
      if(line.trim() === ''){ html += '<div class="ki-gap"></div>'; i++; continue; }

      // Normaler Absatz
      html += `<p class="ki-p">${inlineMd(line)}</p>`;
      i++;
    }
    if(inList) html += '</ul>';
    return html;
  }
  function inlineMd(s){
    return s
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  }

  function addMsgBubble(role, text, parent){
    const el = document.createElement('div');
    el.className = 'ki-msg ' + role;
    if(role === 'assistant'){
      el.innerHTML = kiRenderMarkdown(text);
    } else {
      el.innerHTML = kiEsc(text).split(String.fromCharCode(10)).join('<br>');
    }
    parent.appendChild(el);
    el.scrollIntoView({behavior:'smooth',block:'nearest'});
    return el;
  }

  async function sendMessage(){
    const question = inputEl.value.trim();

    inputEl.value = '';
    sendBtn.disabled = true;

    addMsgBubble('user', question, historyEl);

    const loadingEl = addMsgBubble('loading', '🤔 Analysiere deine Daten...', historyEl);

    // Datenbasis: genannte Mitarbeiter, sonst gewählter Umfang
    const sel = kiAgentsForQuestion(question);

    const systemPrompt = kiSystemPrompt(ctx, 'AUFGABE: Beantworte die Frage der Führungskraft auf Basis der Daten. Antworte so, dass die Antwort direkt als Grundlage für Coachings und Mitarbeitergespräche dienen kann – klar strukturiert (kurze Abschnitte, Aufzählungen oder Tabellen) statt Fließtext.');
    try {
      const answer = await kiCall(systemPrompt, kiHistory.slice(-6), 4000);
      loadingEl.remove();
      const shown = answer + '\n\n*Datenbasis: ' + sel.grund + '*';
      addMsgBubble('assistant', shown, historyEl);
      kiHistory.push({role:'assistant', content:answer});
    } catch(e){
      loadingEl.className = 'ki-msg assistant';
      loadingEl.textContent = 'Fehler bei der Analyse: ' + e.message;
    }

    sendBtn.disabled = false;
    sendBtn.textContent = 'Analysieren';
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });

  // Löschen-Button
  if(kiHistory.length > 0){
    const clearBtn = document.createElement('button');
    clearBtn.style.cssText = 'background:none;border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-size:12px;color:var(--muted);cursor:pointer;margin-top:8px;';
    clearBtn.textContent = '🗑 Verlauf löschen';
    clearBtn.addEventListener('click', ()=>{ kiHistory=[]; renderKIAnalyse(); });
    wrap.appendChild(clearBtn);
  }
}
