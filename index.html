<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standort-Portal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#E20074">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Standort-Portal">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#F5F5F5;
  --panel:#FFFFFF;
  --border:#E0E0E0;
  --text:#1C2733;
  --muted:#64748B;
  --teal:#0E7C7B;
  --teal-soft:#E3F1F0;
  --amber:#C2792B;
  --amber-soft:#FBEEDD;
  --red:#B4423A;
  --red-soft:#FBE9E7;
  --sixh:#3B6FA0;
  --sixh-soft:#E4ECF5;
  --helpline:#7C5CBF;
  --helpline-soft:#EFE9F7;
  /* Telekom Farben */
  --tmg:#E20074;
  --tmg-soft:#FCE4F1;
  --tmg-dark:#B5005C;
  --tmg-gray:#6C6C6C;
  --tmg-light:#F2F2F2;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding:32px 24px 80px;}
.wrap{max-width:1320px;margin:0 auto;}

header.board-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:22px;border-bottom:2px solid var(--text);padding-bottom:18px;}
.title-block .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tmg);font-weight:600;margin-bottom:6px;}
h1{font-family:'Space Grotesk',sans-serif;font-size:28px;margin:0;letter-spacing:-.01em;}
.title-block p{margin:6px 0 0;color:var(--muted);font-size:13.5px;}

.tabs{display:flex;gap:8px;margin-bottom:0;flex-wrap:wrap;position:relative;}
.tabs-sticky-wrap{position:sticky;top:0;z-index:60;background:var(--bg);padding:10px 0 12px;margin-bottom:18px;box-shadow:0 6px 12px -6px rgba(0,0,0,.08);}
.tabs-secondary{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
@media (max-width: 900px){
  .top-fab-row{position:static;margin-bottom:14px;justify-content:flex-start;}
}
.tab-btn{
  background:var(--panel);border:1px solid var(--border);color:var(--muted);
  padding:9px 18px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;
}
.tab-btn.active{background:var(--text);color:#fff;border-color:var(--text);}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
button.primary{background:var(--tmg);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;}
button.primary:hover{background:var(--tmg-dark);}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--border);padding:10px 16px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;}
button.secondary:hover{border-color:var(--teal);color:var(--teal);}

/* ===== Coaching view (cards) ===== */
.team-block{margin-bottom:26px;}
.team-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin:0 0 8px;}
.targets-legend{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.targets-legend .line{font-family:'IBM Plex Mono',monospace;font-size:15px;}
.targets-legend .cat-label{display:inline-block;min-width:100px;font-weight:700;font-size:15px;}
.targets-legend .cat-label.standard{color:var(--tmg-gray);}
.targets-legend .cat-label.sixh{color:var(--sixh);}
.targets-legend .cat-label.helpline{color:var(--helpline);}
.targets-legend .vals{color:var(--muted);font-size:15px;}

.cat-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;font-weight:700;}
.cat-badge.regular{background:#EEF1F4;color:var(--muted);}
.cat-badge.sixh{background:var(--sixh-soft);color:var(--sixh);}
.cat-badge.helpline{background:var(--helpline-soft);color:var(--helpline);}
.cat-badge.schulung{background:#FFF8E1;color:#F57F17;border:1px dashed #F9A825;}
.status-dot.schulung{background:#F9A825;box-shadow:0 0 0 4px #FFF8E1;}
.cat-badge.work{background:#E8F5E9;color:#2E7D32;border:1px dashed #66BB6A;}
.status-dot.work{background:#66BB6A;box-shadow:0 0 0 4px #E8F5E9;}

.cat-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.cat-dot.sixh{background:var(--sixh);}
.cat-dot.helpline{background:var(--helpline);}

.cards{display:flex;flex-direction:column;gap:14px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.card-top-left{display:flex;align-items:center;gap:12px;flex:1;min-width:200px;flex-wrap:wrap;}
.status-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;background:var(--tmg-gray);box-shadow:0 0 0 4px var(--tmg-light);}
.status-dot.regular{background:var(--tmg-gray);box-shadow:0 0 0 4px var(--tmg-light);}
.status-dot.sixh{background:var(--sixh);box-shadow:0 0 0 4px var(--sixh-soft);}
.status-dot.helpline{background:var(--helpline);box-shadow:0 0 0 4px var(--helpline-soft);}

.name-input{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;border:none;background:transparent;padding:4px 0;outline:none;width:180px;border-bottom:1px solid transparent;}
.pylon-input{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:4px 8px;width:78px;text-align:center;}
.akennung-input{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:4px 8px;width:120px;text-align:center;}
.pylon-input:focus{outline:none;border-color:var(--tmg);color:var(--text);}
.name-input:focus{border-bottom:1px solid var(--teal);}

.calls-field{display:flex;flex-direction:column;gap:4px;}
.calls-field label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.calls-field input{width:74px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;background:#FFF7EC;outline:none;}

.remove-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;flex-shrink:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;padding:0;}
.remove-btn:hover{background:#F5F7F9;color:var(--red);}
.remove-btn:hover{color:var(--red);}

.metrics-row{display:flex;gap:14px;flex-wrap:wrap;}
.metric-group{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#FAFBFC;}
.metric-group .group-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:8px;}
.metric-group.quality .group-label{color:var(--teal);}
.metric-group.sales .group-label{color:var(--amber);}
.metric-group.extra .group-label{color:var(--muted);}
.metric-group .fields{display:flex;gap:10px;flex-wrap:wrap;}
.metric-field{display:flex;flex-direction:column;gap:4px;}
.metric-field label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.metric-field input{width:56px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;background:#fff;outline:none;}
.metric-field input:focus{border-color:var(--teal);}
.metric-field.wide input{width:150px;font-family:'Inter',sans-serif;font-weight:500;}

.product-block{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:6px;background:#fff;border:1px solid var(--border);}
.product-block .product-name{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;}
.product-block .product-inputs{display:flex;gap:8px;align-items:flex-end;}
.product-block .stk-input{width:52px;border:1px solid var(--border);border-radius:5px;padding:5px 6px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;}
.product-block .stk-input:focus{border-color:var(--teal);outline:none;}
.mini-label{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;}
.cr-readout{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;padding:5px 8px;border-radius:5px;background:var(--teal-soft);color:var(--teal);}
.cr-readout.good{background:var(--teal-soft);color:var(--teal);}
.cr-readout.mid{background:var(--amber-soft);color:var(--amber);}
.cr-readout.zero{background:var(--red-soft);color:var(--red);}

.bottom-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.plan-block{flex:1;min-width:240px;}
.plan-block label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.plan-block textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.4;min-height:54px;resize:vertical;outline:none;background:#FAFBFC;}
.plan-block textarea:focus{border-color:var(--teal);background:#fff;}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 7px;border-radius:5px;background:var(--amber-soft);color:var(--amber);font-weight:600;}
.tag.ok{background:var(--teal-soft);color:var(--teal);}

.empty{color:var(--muted);font-size:13px;font-style:italic;padding:20px 0;text-align:center;}
.empty-illus{display:flex;flex-direction:column;align-items:center;padding:32px 20px;text-align:center;}
.empty-illus svg{margin-bottom:12px;}
.empty-illus-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--text);margin-bottom:4px;}
.empty-illus-sub{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);max-width:340px;}
/* tw-team-wrap: äußerer Container pro Team */
.cd-new-wrap{margin-left:auto;position:relative;display:inline-block;}
.cd-new-wrap .cp-type-menu{right:0;left:auto;top:calc(100% + 6px);}
.cp-history{margin:6px 0 10px;}
.cp-history-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.cp-history-toggle{display:flex;gap:6px;}
.ki-scope{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px;font-family:'Inter',sans-serif;font-size:12px;color:var(--muted);font-weight:600;}
.ki-scope em{font-weight:400;font-style:normal;margin-left:6px;}
.cf-prep-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 10px;padding:10px 12px;background:var(--tmg-soft);border-radius:10px;}
.cf-prep-row span{font-family:'Inter',sans-serif;font-size:12px;color:var(--text);flex:1;min-width:220px;line-height:1.45;}
.ki-prep-overlay{position:fixed;inset:0;background:rgba(15,20,26,.45);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.ki-prep-box{background:var(--panel);color:var(--text);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:760px;padding:20px 24px;}
.ki-prep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
.ki-prep-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;}
.ki-prep-sub{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);margin-top:2px;}
.ki-prep-x{background:none;border:1px solid var(--border);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--muted);font-size:14px;flex-shrink:0;}
.ki-prep-body{max-width:none!important;margin:0 0 6px!important;}
.board-version-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);background:var(--tmg-light);border:1px solid var(--border);border-radius:999px;padding:3px 9px;}
.zo-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.zo-sum-card{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 14px;cursor:pointer;font-family:'Inter',sans-serif;min-width:130px;text-align:left;color:var(--text);}
.zo-sum-card b{font-family:'IBM Plex Mono',monospace;font-size:20px;} .zo-sum-card span{font-weight:700;font-size:13px;} .zo-sum-card em{font-style:normal;font-size:11px;color:var(--muted);}
.zo-sum-card.active{border-color:var(--tmg);box-shadow:0 0 0 2px var(--tmg-soft);}
.zo-sum-card.warn b,.zo-sum-card.warn em{color:var(--amber);}
.zo-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.zo-bulk{display:flex;gap:8px;align-items:center;} .zo-bulk select{min-width:220px;}
.zo-table{width:100%;border-collapse:collapse;font-family:'Inter',sans-serif;}
.zo-table th{background:#FAFAFA;border-bottom:2px solid var(--border);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;text-align:left;}
.zo-table td{border-bottom:1px solid #F0F0F2;padding:6px 10px;font-size:13.5px;}
.zo-table td:first-child,.zo-table th:first-child{text-align:center;padding-left:16px;}
.zo-name{font-weight:600;} .zo-table select{max-width:320px;width:100%;}
.zo-ohne{background:#FFFBF3;}
.fk-btn:disabled{opacity:.45;cursor:default;}
.fk-assign-row{display:flex;align-items:center;gap:6px;margin:6px 0 2px;font-size:13px;}
.fk-assign{flex:1;min-width:0;border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-family:'Inter',sans-serif;font-size:12.5px;background:#fff;color:var(--text);}
.fk-assign-overview{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:-4px 0 18px;line-height:1.7;}
.fk-assign-overview b{color:var(--text);} .fk-assign-overview span{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--text);background:#F1F4F7;border-radius:6px;padding:0 6px;}
.fk-assign-overview em{color:var(--amber);font-style:normal;} .fk-assign-overview em span{color:var(--amber);background:var(--amber-soft);}
.fk-assign-overview .ok{color:var(--teal);background:none;font-family:'Inter',sans-serif;}
.fk-leader-filter{display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--muted);}
.fk-leader-filter select{border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;background:#fff;color:var(--text);max-width:280px;}
.fg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:6px;}
.fg-box{background:#FAFBFC;border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;}
.fg-box-head{display:flex;align-items:center;gap:10px;}
.fg-box-head div{display:flex;flex-direction:column;flex:1;min-width:0;} .fg-box-head b{font-family:'Space Grotesk',sans-serif;font-size:14px;} .fg-box-head span{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);}
.fg-icon{font-size:20px;line-height:1;color:var(--tmg);font-weight:700;}
.fg-box-head .fg-score{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;flex:0 0 auto;}
.fg-row{display:flex;align-items:center;gap:8px;justify-content:space-between;}
.fg-row-text{font-family:'Inter',sans-serif;font-size:12.5px;line-height:1.35;flex:1;min-width:0;}
.fg-btns{display:flex;gap:4px;flex-shrink:0;}
.fg-btn{width:30px;height:28px;border-radius:7px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted);}
.fg-btn.fg-ok.active{background:var(--teal);border-color:var(--teal);color:#fff;}
.fg-btn.fg-half.active{background:var(--amber);border-color:var(--amber);color:#fff;}
.fg-btn.fg-nok.active{background:var(--red);border-color:var(--red);color:#fff;}
.fg-note{border:1px dashed var(--border);border-radius:8px;padding:6px 9px;font-family:'Inter',sans-serif;font-size:12px;background:#fff;width:100%;box-sizing:border-box;}
.fg-guide{background:#fff;border:1px solid var(--border);border-left:4px solid var(--tmg);border-radius:12px;padding:12px 16px;margin-bottom:8px;}
.fg-guide-empty{font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);line-height:1.5;}
.fg-steps{margin:0;padding-left:20px;font-family:'Inter',sans-serif;}
.fg-steps li{margin-bottom:10px;} .fg-steps li::marker{font-weight:700;color:var(--tmg);}
.fg-step-t{font-weight:700;font-size:13.5px;margin-bottom:2px;}
.fg-step-b{font-size:12.5px;line-height:1.5;color:var(--text);} .fg-step-b ul{margin:4px 0;padding-left:18px;} .fg-step-b i{color:#475569;}
.cf-details{margin:4px 0 6px;} .cf-details summary{cursor:pointer;list-style:revert;}
.fg-bars{display:flex;gap:6px;align-items:flex-end;}
.fg-bar{display:flex;flex-direction:column;align-items:center;gap:3px;} .fg-bar span{font-size:12px;color:var(--muted);font-weight:700;}
.fg-bar-track{width:16px;height:46px;background:#F1F4F7;border-radius:5px;display:flex;align-items:flex-end;overflow:hidden;}
.fg-bars.small .fg-bar-track{height:28px;width:12px;}
.fg-bar-fill{width:100%;border-radius:5px;}
.fg-profile{display:flex;gap:16px;align-items:center;padding:10px 16px;background:#FAFBFC;border-bottom:1px solid #F0F0F2;font-family:'Inter',sans-serif;font-size:12.5px;flex-wrap:wrap;}
.fg-profile-right{display:flex;flex-direction:column;gap:2px;min-width:0;}
.fg-profile-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px;}
.fg-trends{color:var(--muted);} .fg-trend{margin-right:6px;font-weight:700;} .fg-trend.up{color:var(--teal);} .fg-trend.down{color:var(--red);}
.fg-team{display:flex;gap:24px;align-items:flex-start;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.04);padding:14px 16px;flex-wrap:wrap;}
.fg-team .fg-bar-track{height:70px;width:22px;}
.fg-team-gaps{flex:1;min-width:240px;font-family:'Inter',sans-serif;}
.fg-gap{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid #F0F0F2;font-size:13px;}
.fg-gap b{font-family:'IBM Plex Mono',monospace;color:var(--red);min-width:44px;} .fg-gap span{flex:1;} .fg-gap em{font-size:11px;color:var(--muted);font-style:normal;white-space:nowrap;}
.fk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.fk-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;margin-bottom:4px;}
.fk-sub{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);max-width:720px;line-height:1.5;}
.fk-filters{display:flex;gap:6px;flex-wrap:wrap;}
.fk-chip{background:#fff;border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--text);}
.fk-chip.active{background:var(--tmg);border-color:var(--tmg);color:#fff;}
.fk-section{margin-bottom:26px;}
.fk-sec-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.fk-sec-title span{font-family:'IBM Plex Mono',monospace;font-size:12px;background:#EEF1F4;color:var(--muted);border-radius:999px;padding:1px 9px;}
.fk-hint{font-family:'Inter',sans-serif;font-size:12px;color:var(--muted);margin:-4px 0 10px;}

/* ===== KI Analyse ===== */
.ki-wrap{max-width:860px;margin:0 auto;}
.ki-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:0 0 6px;color:var(--text);}
.ki-sub{font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);margin:0 0 20px;}
.ki-suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.ki-chip{background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:7px 14px;font-family:'Inter',sans-serif;font-size:12.5px;cursor:pointer;transition:all .15s;color:var(--text);}
.ki-chip:hover{border-color:var(--tmg);color:var(--tmg);background:#FCE4F1;}
.ki-input-row{display:flex;gap:10px;margin-bottom:20px;}
.ki-input{flex:1;padding:12px 16px;border-radius:10px;border:1.5px solid var(--border);font-family:'Inter',sans-serif;font-size:14px;outline:none;}
.ki-input:focus{border-color:var(--tmg);}
.ki-send{background:var(--tmg);color:#fff;border:none;padding:12px 22px;border-radius:10px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;}
.ki-send:hover{background:var(--tmg-dark);}
.ki-send:disabled{opacity:.5;cursor:not-allowed;}
.ki-history{display:flex;flex-direction:column;gap:14px;}
.ki-msg{padding:14px 18px;border-radius:14px;font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.6;}
.ki-h{font-family:'Space Grotesk',sans-serif;font-weight:700;margin:10px 0 6px;}
h3.ki-h{font-size:15.5px;color:var(--tmg);}
h4.ki-h{font-size:13.5px;color:var(--text);}
.ki-p{margin:4px 0;}
.ki-gap{height:6px;}
.ki-hr{border:none;border-top:1px solid var(--border);margin:10px 0;}
.ki-list{margin:4px 0 8px 18px;padding:0;}
.ki-list li{margin-bottom:3px;}
.ki-table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:12.5px;}
.ki-table th{background:#1C2733;color:#9FC5C4;font-weight:700;text-align:left;padding:7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.ki-table td{padding:7px 10px;border-bottom:1px solid var(--border);}
.ki-table tr:nth-child(even) td{background:#FAFBFC;}
.ki-msg.user{background:linear-gradient(135deg,var(--tmg),var(--tmg-dark));color:#fff;align-self:flex-end;max-width:80%;}
.ki-msg.assistant{background:#fff;border:1px solid var(--border);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.ki-msg.loading{background:#f8f9fa;color:var(--muted);font-style:italic;}
.ki-badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.ki-badge{background:#F1F4F7;border-radius:8px;padding:5px 10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}


/* ===== Hall of Fame ===== */
.hof-wrap{max-width:1100px;}
.hof-title{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:26px;margin:0 0 4px;color:var(--text);}
.hof-sub{font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);margin:0 0 24px;}
.hof-months{display:flex;flex-wrap:wrap;gap:20px;}
.hof-month-card{background:#fff;border-radius:20px;padding:20px 24px;box-shadow:0 2px 16px rgba(0,0,0,0.08);flex:1;min-width:260px;}
.hof-month-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px;color:var(--text);}
.hof-team-label{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 6px;}
.hof-entry{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F5F7F9;}
.hof-entry:last-child{border-bottom:none;}
.hof-medal{font-size:20px;width:28px;text-align:center;}
.hof-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;flex:1;}
.hof-stats{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.hof-stat{font-family:'IBM Plex Mono',monospace;font-size:10.5px;}
.hof-stat.good{color:#0A7C70;}
.hof-stat.ok{color:#C2792B;}
.hof-empty{color:var(--muted);font-style:italic;font-size:13px;padding:8px 0;}
.hof-trophy{font-size:40px;text-align:center;margin-bottom:8px;}
.hof-criteria{background:#F7F9FA;border-radius:12px;padding:12px 16px;margin-bottom:20px;font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);}
.hof-criteria strong{color:var(--text);}


/* ===== Mitarbeiter Ziele Panel ===== */
.card-wrap{display:flex;gap:12px;margin-bottom:12px;}
.card-wrap .card{flex:1;margin-bottom:0;}
.agent-panel{width:240px;min-width:240px;background:#fff;border-radius:16px;border:1px solid var(--border);padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.panel-section{font-family:'Inter',sans-serif;}
.panel-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;}
.panel-avg-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;}
.agent-notes{width:100%;min-height:60px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text);background:#F7F9FA;box-sizing:border-box;}
.agent-notes:focus{outline:none;border-color:var(--tmg);}
.panel-avg-label{font-size:12px;color:var(--text);}
.panel-avg-vals{display:flex;gap:6px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;}
.panel-avg-agent{color:var(--text);}
.panel-avg-team{color:var(--muted);}
.panel-avg-arrow{font-size:12px;}
.panel-avg-arrow.up{color:#4CAF50;}
.panel-avg-arrow.down{color:#E20074;}
.panel-avg-arrow.eq{color:#94A3B8;}
.panel-coaching{background:#F7F9FA;border-radius:10px;padding:10px 12px;}
.panel-coaching-date{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;margin-bottom:4px;}
.panel-coaching-date.green{color:#0A7C70;}
.panel-coaching-date.orange{color:#C2792B;}
.panel-coaching-date.red{color:#B4423A;}
.panel-coaching-text{font-size:12px;color:var(--text);line-height:1.4;max-height:80px;overflow:auto;}
.panel-coaching-none{font-size:12px;color:var(--muted);font-style:italic;}

/* ===== Coaching Plan view ===== */
.cp-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.cp-card-header{display:flex;align-items:center;gap:12px;}
.cp-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;flex:1;}
.cp-team{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);padding:3px 8px;border-radius:5px;background:#F1F4F7;}
.cp-plan-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.cp-plan-area{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;min-height:70px;resize:vertical;outline:none;background:#FAFBFC;}
.cp-plan-area:focus{border-color:var(--teal);background:#fff;}
.cp-team-block{margin-bottom:26px;}
.cp-team-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin:0 0 10px;color:var(--text);}

#overview-capture{
  background:
    radial-gradient(circle at 8% 8%, rgba(226,0,116,.30), transparent 42%),
    radial-gradient(circle at 95% 15%, rgba(14,124,123,.26), transparent 45%),
    radial-gradient(circle at 90% 92%, rgba(226,0,116,.20), transparent 40%),
    linear-gradient(160deg, #FFF5FA 0%, #F3FBFA 100%);
  padding:26px;
  border-radius:28px;
  border:1px solid rgba(226,0,116,.15);
  box-shadow:0 32px 70px -24px rgba(28,39,51,.32), 0 6px 20px rgba(28,39,51,.10);
  position:relative;
  overflow:hidden;
}
#overview-capture::before{
  content:'';
  position:absolute;
  top:-90px; right:-90px;
  width:340px; height:340px;
  border-radius:50%;
  border:44px solid rgba(226,0,116,.10);
  pointer-events:none;
  z-index:0;
}
#overview-capture::after{
  content:'';
  position:absolute;
  bottom:-110px; left:-60px;
  width:280px; height:280px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(14,124,123,.20), transparent 70%);
  pointer-events:none;
  z-index:0;
}
#overview-capture > *{position:relative;z-index:1;}
.ov-watermark{
  position:absolute;
  bottom:18px; right:28px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:20px;
  letter-spacing:.14em;
  color:rgba(226,0,116,.16);
  z-index:0;
  pointer-events:none;
}
.ov-banner{
  display:flex;
  align-items:center;
  gap:12px;
  background:linear-gradient(120deg, var(--tmg), #FF4FA8);
  color:#fff;
  border-radius:16px;
  padding:14px 22px;
  margin-bottom:20px;
  box-shadow:0 10px 26px -10px rgba(226,0,116,.5);
}
.ov-banner .icon{font-size:20px;flex-shrink:0;}
.ov-banner .text{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;}
.ov-banner .text strong{font-weight:800;}
.ov-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:0 0 4px;color:var(--text);}
.ov-sub{font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);margin:0 0 20px;}
.ov-team{margin-bottom:24px;border-radius:20px;overflow-x:auto;overflow-y:hidden;box-shadow:0 2px 16px rgba(0,0,0,0.08);}
.ov-team-head{background:#1D1D1F;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.ov-team-head .name{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:600;font-size:17px;letter-spacing:-.015em;}
.ov-team-head .targets{font-family:'Inter',-apple-system,sans-serif;font-size:12px;font-weight:500;color:rgba(255,255,255,.6);}
.ov-columns-wrap{display:flex;align-items:stretch;}
.ov-column-divider{width:10px;flex-shrink:0;background:#F0F0F2;}
.ov-grid{width:100%;background:#fff;font-size:0;}
.ov-header-row,.ov-data-row{display:grid;align-items:stretch;}
.cht-group-start{border-left:5px solid rgba(120,120,128,0.35);}
.cht-group-end{border-right:5px solid rgba(120,120,128,0.35);}
.cht-group-first{border-top:5px solid rgba(120,120,128,0.35);}
.cht-group-last{border-bottom:5px solid rgba(120,120,128,0.35);}
.ov-header-row{border-bottom:1px solid #E5E5EA;background:#FAFAFA;}
.ov-data-row{border-bottom:1px solid #F0F0F2;}
.ov-data-row:last-child{border-bottom:none;}
.ov-data-row:nth-child(even){background:#FBFBFC;}
.ov-data-row:hover{background:#F5F5F7;}
.ov-cell{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:12px;font-weight:500;color:#1D1D1F;padding:8px 4px;text-align:center;display:flex;align-items:center;justify-content:center;box-sizing:border-box;overflow:hidden;min-width:0;}
.ov-cell.head{font-family:'Inter',-apple-system,sans-serif;font-size:11px;font-weight:600;color:#86868B;text-transform:none;letter-spacing:0;padding:11px 4px;flex-direction:column;gap:2px;}
.ov-cell.name-cell{font-weight:600;font-size:14px;color:#1D1D1F;text-align:left;justify-content:flex-start;padding-left:20px;flex:0 1 auto;white-space:normal;overflow-wrap:break-word;line-height:1.2;position:relative;}
.ov-name-pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:10px;font-weight:600;font-size:12px;}
.ov-cat-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;flex-shrink:0;}
.ov-cell.name-cell.head{justify-content:flex-start;padding-left:20px;}
.ov-cell.qual-cell{flex:0 0 78px;background:#fff;min-width:78px;}
.ov-cell.qual-cell.head{background:#FAFAFA;border-bottom:1px solid #E5E5EA;}
.ov-cell.sales-cell{flex:0 0 80px;background:linear-gradient(160deg,rgba(120,150,210,.10),rgba(255,255,255,.35));}
.ov-cell.sales-cell.head{background:#FAFAFA;border-bottom:1px solid #E5E5EA;font-size:11px;font-weight:600;}
.ov-cell.cr-cell{background:transparent;}
.ov-cell.cr-cell.head{background:transparent;color:#8A6D00;font-weight:800;border-bottom:2px solid #F2A900;}
.ov-cell.cr-cell .ov-badge{font-size:13px;font-weight:800;padding:3px 7px;}
.ov-cell.cr-cell .ov-badge.good{background:#E6F9EC;color:#1D8A3E;}
.ov-cell.cr-cell .ov-badge.mid{background:#FFF3DE;color:#B9770E;}
.ov-cell.cr-cell .ov-badge.zero{background:#FFEBEB;color:#C4291C;}
.ov-badge{display:inline-block;padding:3px 4px;border-radius:980px;font-size:11px;font-weight:600;font-family:'Inter',-apple-system,sans-serif;letter-spacing:-.005em;white-space:nowrap;min-width:46px;text-align:center;box-sizing:border-box;}
.ov-badge.good{background:#E6F9EC;color:#1D8A3E;}
.ov-badge.mid{background:#FFF3DE;color:#B9770E;}
.ov-badge.zero{background:#FFEBEB;color:#D70015;}
.ov-badge-glass{padding:5px 12px;background:rgba(255,255,255,.55) !important;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(30,40,60,.10), inset 0 1px 0 rgba(255,255,255,.8);}
.ov-badge-glass.good{color:#1D8A3E;}
.ov-badge-glass.mid{color:#B9770E;}
.ov-badge-glass.zero{color:#D70015;}

/* ===== To-Do's Pop-up ===== */
.todo-fab{position:static;background:var(--tmg);color:#fff;border:none;border-radius:999px;padding:10px 18px;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 10px rgba(226,0,116,.35);display:flex;align-items:center;gap:7px;transition:background .15s;white-space:nowrap;}
.top-fab-row{position:fixed;top:16px;right:16px;z-index:1000;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.coachdash-fab{background:var(--sixh);box-shadow:0 2px 10px rgba(59,111,160,.35);}
.coachdash-fab.active{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--sixh);}
.undo-fab{background:var(--tmg-gray);box-shadow:0 2px 10px rgba(108,108,108,.25);}
.undo-fab:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.undo-mini{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
.undo-mini:hover:not(:disabled){background:var(--tmg-soft);border-color:var(--tmg);color:var(--tmg);}
.undo-mini:disabled{opacity:.3;cursor:not-allowed;}
.todo-fab:hover{background:var(--tmg-dark);}
.todo-fab-badge{background:#fff;color:var(--tmg);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:800;min-width:16px;text-align:center;}
.todo-modal-overlay{position:fixed;inset:0;background:rgba(20,20,25,.45);z-index:1001;display:flex;align-items:center;justify-content:center;padding:20px;}
.todo-modal{background:#fff;border-radius:16px;width:460px;max-width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 44px rgba(0,0,0,.28);}
.todo-modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.todo-modal-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}
.todo-modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 4px;}
.todo-modal-close:hover{color:var(--red);}
.todo-modal-body{padding:16px 20px 20px;overflow-y:auto;flex:1;}
.todo-input-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.todo-date-input,.todo-time-input{border:1px solid var(--border);border-radius:8px;padding:9px 8px;font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none;color:var(--text);}
.todo-date-input:focus,.todo-time-input:focus{border-color:var(--tmg);}
.todo-text-wrap{flex:1;display:flex;flex-direction:column;gap:2px;}
.todo-item-datetime{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--tmg);}
.todo-ticker{position:fixed;top:60px;right:16px;z-index:999;width:280px;max-width:60vw;height:30px;overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;}
.todo-ticker-inner{position:absolute;top:50%;left:-100%;white-space:nowrap;transform:translateY(-50%);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--tmg);animation:todoTickerScroll 16s linear infinite;}
@keyframes todoTickerScroll{
  0%{ left:-100%; }
  100%{ left:100%; }
}
.todo-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:'Inter',sans-serif;font-size:13px;outline:none;}
.todo-input:focus{border-color:var(--tmg);}
.todo-add-btn{background:var(--tmg);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap;}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #F5F7F9;}
.todo-item:last-child{border-bottom:none;}
.todo-checkbox{margin-top:3px;width:17px;height:17px;accent-color:var(--tmg);cursor:pointer;flex-shrink:0;}
.todo-text{flex:1;font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
.todo-text.done{text-decoration:line-through;color:var(--muted);}
.todo-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;opacity:.5;flex-shrink:0;}
.todo-del:hover{opacity:1;color:var(--red);}
.todo-empty{color:var(--muted);font-size:13px;font-style:italic;text-align:center;padding:20px 0;}
.site-copyright{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--muted);text-align:center;padding:24px 16px 12px;line-height:1.5;max-width:680px;margin:0 auto;}
.ov-foot{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:12px;}
</style>

// ============================================================
// MITARBEITER-VERLAUF (ab v138)
// - Verlaufs-Einträge werden fest mit der Mitarbeiter-ID verknüpft (Feld agentId). Vorher lief die
//   Zuordnung nur über den Namen - im Verlauf stehen aber oft nur Nachnamen ("Rizou").
// - Der laufende Monat wird automatisch fortlaufend in den Verlauf geschrieben (bei jedem Speichern).
//   Am Monatsende bleibt der Stand einfach stehen = automatischer Monats-Snapshot.
// ============================================================
const VL_MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

// Unscharfer Namensabgleich (nur für noch nicht verknüpfte Einträge)
function vlNameMatches(vName, aName){
  if(!vName || !aName) return false;
  const n = aName.trim(), v = vName.trim();
  return v === n || n.startsWith(v + ' ') || n.endsWith(' ' + v) || v.startsWith(n + ' ') || v.endsWith(' ' + n);
}
// Alle Verlaufs-Einträge eines Mitarbeiters: zuerst die fest verknüpften (meiste Monate zuerst),
// sonst Fallback über den Namen.
function verlaufEntriesForAgent(agent){
  if(!agent) return [];
  const all = Object.values(state.verlauf || {}).filter(v => v && v.monate);
  const linked = all.filter(v => agent.id && v.agentId === agent.id)
    .sort((a,b)=>Object.keys(b.monate).length - Object.keys(a.monate).length);
  // Danach (als Rückfall für ältere Monate) ein noch nicht verknüpfter Eintrag mit passendem Namen
  const unlinked = all.filter(v => !v.agentId && v.team === agent.team);
  const fb = unlinked.find(v => v.name === agent.name)
    || unlinked.filter(v => vlNameMatches(v.name, agent.name)).sort((a,b)=>Object.keys(b.monate).length - Object.keys(a.monate).length)[0];
  if(linked.length) return fb ? [...linked, fb] : linked;
  const f = findVerlaufForAgent(agent);
  return f ? [f] : [];
}
function findVerlaufForAgent(agent){
  const vlAll = state.verlauf || {};
  if(!agent || !agent.name) return null;
  const all = Object.values(vlAll).filter(v => v && v.monate);
  if(agent.id){
    const linked = all.filter(v => v.agentId === agent.id)
      .sort((a,b)=>Object.keys(b.monate).length - Object.keys(a.monate).length);
    if(linked.length) return linked[0];
  }
  if(vlAll[agent.name + '_' + agent.team] && vlAll[agent.name + '_' + agent.team].monate) return vlAll[agent.name + '_' + agent.team];
  const sameTeam = all.filter(v => v.team === agent.team && !(v.agentId && v.agentId !== agent.id));
  const exact = sameTeam.find(v => v.name === agent.name);
  if(exact) return exact;
  const fuzzy = sameTeam.filter(v => vlNameMatches(v.name, agent.name));
  if(!fuzzy.length) return null;
  return fuzzy.sort((a,b)=>Object.keys(b.monate).length - Object.keys(a.monate).length)[0];
}
// Monatsdaten aus einem Verlaufs-Eintrag - Schlüssel "2026-Oktober" oder (ältere Einträge) nur "Oktober".
function verlaufMonatOf(vl, jahr, monat){
  if(!vl || !vl.monate) return null;
  return vl.monate[`${jahr}-${monat}`] || (String(jahr) === '2026' ? vl.monate[monat] : null) || null;
}
// Monatsdaten eines Mitarbeiters aus allen zu ihm gehörenden Verlaufs-Einträgen
function agentVerlaufMonat(agent, jahr, monat){
  for(const vl of verlaufEntriesForAgent(agent)){
    const md = verlaufMonatOf(vl, jahr, monat);
    if(md) return md;
  }
  return null;
}
// Einmalige, eindeutige Verknüpfung alter Verlaufs-Einträge mit Mitarbeitern. Verknüpft wird nur,
// wenn die Zuordnung in BEIDE Richtungen eindeutig ist (z.B. nicht bei zwei Mitarbeitern mit
// gleichem Nachnamen im selben Team) - lieber gar nicht als falsch verknüpfen.
function linkVerlaufToAgents(){
  if(!state.verlauf) return false;
  let changed = false;
  const agents = (state.agents||[]).filter(a => a && a.id && a.name && a.name.trim());
  Object.values(state.verlauf).forEach(v=>{
    if(!v || !v.monate || v.agentId || !v.name) return;
    const team = agents.filter(a => a.team === v.team);
    // Eindeutigkeit gegen ALLE Mitarbeiter des Teams prüfen (auch bereits verknüpfte), damit z.B.
    // ein alter Eintrag "Papa" nie einer von zwei Personen namens Papa zugeschlagen wird.
    let m = team.filter(a => a.name === v.name);
    if(!m.length) m = team.filter(a => vlNameMatches(v.name, a.name));
    if(m.length === 1){ v.agentId = m[0].id; changed = true; }
  });
  return changed;
}
// Ziel-Eintrag für neue Monatsdaten eines Mitarbeiters (verknüpfter Eintrag oder neu anlegen)
function verlaufTargetEntry(agent){
  if(!state.verlauf) state.verlauf = {};
  const linked = verlaufEntriesForAgent(agent).filter(v => v.agentId === agent.id);
  if(linked.length) return linked[0];
  const key = agent.name + '_' + agent.team;
  const ex = state.verlauf[key];
  if(ex && (!ex.agentId || ex.agentId === agent.id)){
    if(!ex.monate) ex.monate = {};
    ex.agentId = agent.id;
    return ex;
  }
  const k2 = ex ? key + '_' + agent.id : key;
  state.verlauf[k2] = { name: agent.name, team: agent.team, agentId: agent.id, monate: {} };
  return state.verlauf[k2];
}
// Monatswerte eines Mitarbeiters für den laufenden Monat - nur Werte, die sicher zu diesem Monat
// gehören: Stückzahlen aus den Tageswerten des Monats, Calls/NPS/LQ/CHT nur, wenn sie in diesem
// Monat eingetragen/importiert wurden (Zeitstempel). So landet nach dem Monatswechsel nicht
// versehentlich der NPS vom Vormonat im neuen Monat.
function liveMonthSnapshot(agent, now){
  const cfg = TEAM_CONFIGS[agent.team];
  if(!cfg) return null;
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const mKey = `${now.getFullYear()}-${VL_MONATE[now.getMonth()]}`;
  const snap = {};
  const tw = agent.tageswerte && agent.tageswerte[twMonthKey(now)];
  if(tw){
    const extra = teamExtraProducts(agent.team);
    const prods = [...cfg.products, ...extra];
    const sum = {}; let any = false;
    prods.forEach(p=>{ sum[p] = 0; });
    Object.values(tw).forEach(dv=>{
      if(!dv || !dv.sales) return;
      prods.forEach(p=>{ const v = dv.sales[p]; if(v !== null && v !== undefined){ sum[p] += v; any = true; } });
    });
    if(any) snap.sales = sum;
  }
  ['calls','nps','lq','cht'].forEach(f=>{
    const v = agent[f];
    if(typeof v !== 'number' || !(v > 0)) return;
    const ts = (typeof agGetTs === 'function') ? agGetTs(agent, 'f|' + f) : 0;
    // ts 0 = Wert stammt aus der Zeit vor den Zeitstempeln (Oktober 2026) → nur für diesen Monat übernehmen
    if(ts >= monthStart || (ts === 0 && mKey === '2026-Oktober')) snap[f] = v;
  });
  if(snap.sales && snap.calls){
    const stk = cfg.products.filter(p => p !== 'BOJ').reduce((s,p)=> s + (snap.sales[p]||0), 0);
    snap.cr = Math.round((stk / snap.calls) * 10000) / 100;
  }
  return Object.keys(snap).length ? { key: mKey, snap } : null;
}
// ---- Vormonat nachträglich vervollständigen (endgültige Werte kommen oft erst Anfang des Folgemonats) ----
function vormonatDate(now){ now = now || new Date(); return new Date(now.getFullYear(), now.getMonth() - 1, 1); }
function vormonatKey(now){ const d = vormonatDate(now); return `${d.getFullYear()}-${VL_MONATE[d.getMonth()]}`; }
// Monatsdaten eines Mitarbeiters zum Bearbeiten holen (legt den Monat im verknüpften Eintrag an und
// übernimmt dabei vorhandene Werte aus älteren Einträgen, damit nichts "verschwindet").
function verlaufMonatForEdit(agent, d){
  const key = `${d.getFullYear()}-${VL_MONATE[d.getMonth()]}`;
  const vl = verlaufTargetEntry(agent);
  if(!vl.monate[key]){
    const existing = agentVerlaufMonat(agent, d.getFullYear(), VL_MONATE[d.getMonth()]);
    vl.monate[key] = existing ? JSON.parse(JSON.stringify(existing)) : {};
  }
  if(!vl.monate[key].sales || typeof vl.monate[key].sales !== 'object') vl.monate[key].sales = {};
  return vl.monate[key];
}
function verlaufRecalcCr(agent, md){
  const cfg = TEAM_CONFIGS[agent.team];
  if(!cfg || !md) return;
  if(md.sales && md.calls > 0){
    const stk = cfg.products.filter(p => p !== 'BOJ').reduce((s,p)=> s + (md.sales[p]||0), 0);
    md.cr = Math.round((stk / md.calls) * 10000) / 100;
  }
}
// Stückzahlen des Vormonats aus dessen Tageswerten in den Verlauf übernehmen (Nachträge).
function syncVormonatSales(agent, now){
  const d = vormonatDate(now);
  const tw = agent.tageswerte && agent.tageswerte[twMonthKey(d)];
  if(!tw) return false;
  const cfg = TEAM_CONFIGS[agent.team]; if(!cfg) return false;
  const extra = teamExtraProducts(agent.team);
  const prods = [...cfg.products, ...extra];
  const sum = {}; let any = false;
  prods.forEach(p=>{ sum[p] = 0; });
  Object.values(tw).forEach(dv=>{
    if(!dv || !dv.sales) return;
    prods.forEach(p=>{ const v = dv.sales[p]; if(typeof v === 'number'){ sum[p] += v; any = true; } });
  });
  if(!any) return false;
  const md = verlaufMonatForEdit(agent, d);
  let changed = false;
  prods.forEach(p=>{ if(md.sales[p] !== sum[p]){ md.sales[p] = sum[p]; changed = true; } });
  const crBefore = md.cr;
  verlaufRecalcCr(agent, md);
  return changed || md.cr !== crBefore;
}

// Laufenden Monat aller Mitarbeiter in den Verlauf schreiben. Rückgabe: true, wenn sich etwas geändert hat.
function updateLiveVerlaufSnapshot(){
  if(!state.verlauf) state.verlauf = {};
  let changed = linkVerlaufToAgents();
  const now = new Date();
  (state.agents||[]).forEach(agent=>{
    if(!agent || !agent.id || !agent.name || !agent.name.trim()) return;
    if(agent.category === 'schulung' || agent.category === 'work') return;
    if(syncVormonatSales(agent, now)) changed = true;
    const res = liveMonthSnapshot(agent, now);
    if(!res) return;
    const vl = verlaufTargetEntry(agent);
    if(!vl.monate[res.key]) vl.monate[res.key] = {};
    const md = vl.monate[res.key];
    // Ältere Ansichten erwarten immer ein sales-Objekt
    if(!md.sales || typeof md.sales !== 'object'){ md.sales = {}; changed = true; }
    Object.keys(res.snap).forEach(f=>{
      if(f === 'sales'){
        if(!md.sales || typeof md.sales !== 'object') md.sales = {};
        Object.keys(res.snap.sales).forEach(p=>{
          if(md.sales[p] !== res.snap.sales[p]){ md.sales[p] = res.snap.sales[p]; changed = true; }
        });
      } else if(md[f] !== res.snap[f]){ md[f] = res.snap[f]; changed = true; }
    });
  });
  return changed;
}

function applyChtVerlaufData(){
  // Erst die falsch angelegten Einträge (z.B. "2026-01" statt "2026-Januar") bereinigen
  let chtCleaned = false;
  Object.values(state.verlauf).forEach(vl=>{
    if(!vl.monate) return;
    Object.keys(vl.monate).forEach(key=>{
      // Falsches Format: "2026-01", "2026-02" etc. (durch früheren Bug entstanden, korrekt wäre "2026-Januar")
      if(/^\d{4}-\d{2}$/.test(key)) { delete vl.monate[key]; chtCleaned = true; }
    });
  });
  // CHT-Werte korrekt in "2026-Januar"-Format einpflegen
  state.agents.forEach(agent=>{
    if(!agent.pylon) return;
    const chtData = CHT_VERLAUF_DATA[String(parseInt(agent.pylon))];
    if(!chtData) return;
    let vl = Object.values(state.verlauf).find(v=>v.name===agent.name && v.team===agent.team);
    if(!vl) return;
    Object.entries(chtData).forEach(([monat, cht])=>{
      const key = `2026-${monat}`;
      // Nur in vorhandene Monate eintragen - keine fast leeren Monate (NPS 0, Stück 0) mehr anlegen,
      // die den Verlauf verfälschen würden. Das CHT-Diagramm liest diese Werte ohnehin direkt.
      if(vl.monate[key] && !(vl.monate[key].cht > 0)) vl.monate[key].cht = cht;
    });
  });
  if(chtCleaned) scheduleSave();
}
let saveBlockedByVersion = false;
let saveTimer = null;

// === Allgemeines Rückgängig (wie Strg+Z / Rückgängig-Button in Excel) ===
// Arbeitet mit kompletten Zustands-Schnappschüssen (statt einzelnen Eingabefeldern zu merken) -
// das übersteht zuverlässig, dass fast jede Eingabe im Board sofort ein Neu-Aufbauen der Ansicht
// auslöst (wodurch die alten Eingabefeld-Referenzen sonst ungültig würden).
let undoStack = [];
const UNDO_MAX = 20;
function captureUndoSnapshot(){
  try{
    undoStack.push(JSON.stringify(state));
    if(undoStack.length > UNDO_MAX) undoStack.shift();
    updateUndoBtn();
  }catch(e){ /* z.B. bei sehr großem state - dann einfach nichts gemerkt */ }
}
function updateUndoBtn(){
  const btn = document.getElementById('undo-btn');
  if(btn) btn.disabled = undoStack.length === 0;
}
function performUndo(){
  if(!undoStack.length) return false;
  const snap = undoStack.pop();
  try{
    const restored = JSON.parse(snap);
    Object.keys(state).forEach(k=>{ delete state[k]; });
    Object.assign(state, restored);
    renderAll();
    scheduleSave();
  }catch(e){ console.error('Rückgängig fehlgeschlagen:', e); }
  updateUndoBtn();
  return true;
}
// Vor jeder Eingabe (Fokus in einem Feld, kurz bevor der Wert geändert wird) einen Schnappschuss
// des Stands DAVOR anlegen - "change" feuert in der Capture-Phase, also bevor das Feld seinen
// eigenen Handler ausführt und den state verändert.
document.addEventListener('change', e=>{
  const el = e.target;
  if(el && el.matches && el.matches('input, textarea, select')){
    captureUndoSnapshot();
  }
}, true);
document.addEventListener('keydown', e=>{
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey){
    e.preventDefault();
    performUndo();
  }
});

// === Tageswerte: Mehrfachauswahl von Zellen (wie in Excel per Ziehen markieren, dann gemeinsam löschen) ===
let twSelectedCells = [];      // aktuell markierte Zellen: [{td, input, setVal}, ...]
let twIsDragging = false;
let twClearActiveSelection = null; // Funktion, die die Markierung der zuletzt aktiven Tabelle aufhebt
let twActiveTableExtend = null;    // Funktion(rowIdx, colIdx), erweitert die Auswahl der aktiven Tabelle
let twLastMouseX = null, twLastMouseY = null;
document.addEventListener('mouseup', ()=>{ twIsDragging = false; twActiveTableExtend = null; });
document.addEventListener('mousemove', (e)=>{ twLastMouseX = e.clientX; twLastMouseY = e.clientY; });
document.addEventListener('keydown', (e)=>{
  if((e.key === 'Delete' || e.key === 'Backspace') && twSelectedCells.length >= 2 &&
     document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('tw-input')){
    e.preventDefault();
    captureUndoSnapshot();
    twSelectedCells.forEach(cell=>{ cell.setVal(null); cell.input.value = ''; });
    scheduleSave();
  }
});
// Während des Ziehens: Seite automatisch scrollen, wenn die Maus nah an den oberen/unteren
// Bildschirmrand kommt, und die Auswahl per Hit-Test an die (sich unter dem stehenden Mauszeiger
// wegscrollende) Zelle anpassen - ein reines mouseenter-Event würde beim Scrollen ohne
// Mausbewegung sonst nicht feuern.
setInterval(()=>{
  if(!twIsDragging || twLastMouseY === null) return;
  const margin = 70;
  const vh = window.innerHeight;
  if(twLastMouseY < margin){
    window.scrollBy(0, -(Math.ceil((margin - twLastMouseY) / 4) + 2));
  } else if(twLastMouseY > vh - margin){
    window.scrollBy(0, Math.ceil((margin - (vh - twLastMouseY)) / 4) + 2);
  }
  if(twActiveTableExtend && twLastMouseX !== null){
    const el = document.elementFromPoint(twLastMouseX, twLastMouseY);
    const td = el && el.closest ? el.closest('td[data-tw-row]') : null;
    if(td) twActiveTableExtend(parseInt(td.dataset.twRow, 10), parseInt(td.dataset.twCol, 10));
  }
}, 16);
// Merkt sich lokal gelöschte Coaching-Einträge, damit die Zusammenführung beim Speichern

// ---- PKCE Helpers ----
function base64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function generatePKCE(){
  const verifier = base64url(crypto.getRandomValues(new Uint8Array(32)));
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return { verifier, challenge: base64url(digest) };
}

// ---- Sign In ----
async function signIn(){
  const pkce = await generatePKCE();
  sessionStorage.setItem('pkce_verifier', pkce.verifier);
  const params = new URLSearchParams({
    client_id: GRAPH_CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge: pkce.challenge,
    code_challenge_method: 'S256',
    response_mode: 'query'
  });
  window.location.href = `https://login.microsoftonline.com/${GRAPH_TENANT_ID}/oauth2/v2.0/authorize?${params}`;
}

async function handleAuthRedirect(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(!code) return false;
  const isAdminFlow = params.get('admin') === '1';
  // Clean URL
  window.history.replaceState({}, '', window.location.pathname);
  const verifier = sessionStorage.getItem(isAdminFlow ? 'pkce_verifier_admin' : 'pkce_verifier');
  if(!verifier){
    if(isAdminFlow) alert('❌ Login fehlgeschlagen: Kein PKCE-Verifier gefunden (Sitzung ggf. abgelaufen). Bitte "Einloggen" erneut versuchen.');
    return false;
  }

  if(isAdminFlow){
    // Für den öffentlichen Client-Zugang muss der Code-Austausch serverseitig (im Worker) passieren -
    // Microsoft blockiert das direkt aus dem Browser für diesen Kontotyp.
    const appToken = getKIAppToken();
    if(!appToken){
      alert('❌ Kein Zugangs-Passwort hinterlegt. Bitte zuerst in der KI Analyse das gemeinsame Passwort eingeben, dann erneut einloggen.');
      return false;
    }
    try{
      const resp = await fetch(KI_PROXY_URL + '/exchange-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-app-token': appToken },
        body: JSON.stringify({ code, code_verifier: verifier, redirect_uri: ADMIN_REDIRECT_URI })
      });
      const data = await resp.json();
      if(resp.ok && data.success){
        alert('✅ Zugang erfolgreich übertragen. Alle Führungskräfte können die Daten jetzt über das gemeinsame Passwort laden.');
      } else {
        alert('❌ Fehler: ' + (data.error?.message || resp.status));
      }
    } catch(e){
      alert('❌ Fehler beim Übertragen: ' + e.message);
    }
    return false;
  }

  const body = new URLSearchParams({
    client_id: GRAPH_CLIENT_ID,
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier,
    scope: SCOPES
  });
  const resp = await fetch(`https://login.microsoftonline.com/${GRAPH_TENANT_ID}/oauth2/v2.0/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString()
  });
  const data = await resp.json();
  if(data.access_token){
    graphToken = data.access_token;
    sessionStorage.setItem('graph_token', graphToken);
    if(data.refresh_token) sessionStorage.setItem('refresh_token', data.refresh_token);
    updateLoginUI(true);
    return true;
  }
  return false;
}

  });
  const resp = await fetch(`https://login.microsoftonline.com/${GRAPH_TENANT_ID}/oauth2/v2.0/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },

          Object.values(state.monatsabschluss[team]||{}).forEach(md=>{
            ['plan','erreicht','cr'].forEach(f=>{ if(md[f] && !('BOJ' in md[f])) md[f]['BOJ']=0; });
          });
        });
        // Seed-Werte IMMER übernehmen (haben Vorrang über alte SharePoint-Nullwerte)
        Object.keys(MA_SEED).forEach(team=>{
          Object.keys(MA_SEED[team]).forEach(monat=>{
            const seed = MA_SEED[team][monat];
            if(!state.monatsabschluss[team]) return;
            if(!state.monatsabschluss[team][monat]) state.monatsabschluss[team][monat] = JSON.parse(JSON.stringify(seed));
            const md = state.monatsabschluss[team][monat];
            // Seed-Werte übernehmen wenn Seed > 0 und gespeicherter Wert = 0
            // NUR für Produkte die noch in md.plan vorhanden sind (User kann Produkte löschen/umbenennen)
            const planKeys = md.plan ? Object.keys(md.plan) : [];
            ['erreicht','cr','storno'].forEach(f=>{
              if(seed[f]){
                if(!md[f]) md[f] = {};
                Object.keys(seed[f]).forEach(p=>{
                  if(!planKeys.includes(p)) return; // Produkt wurde gelöscht/umbenannt → nicht wieder einfügen
                  if(seed[f][p] !== 0 && (md[f][p] === 0 || md[f][p] === undefined)) md[f][p] = seed[f][p];
                });
              }
            });
            ['crZiel','crZielText'].forEach(f=>{
              if(seed[f]) {
                md[f] = md[f]||{};
                Object.keys(seed[f]).forEach(p=>{
                  if(planKeys.includes(p)) md[f][p] = md[f][p] !== undefined ? md[f][p] : seed[f][p];
                });
              }
            });
            if(!md.nps_plan && seed.nps_plan > 0) md.nps_plan = seed.nps_plan;
            if(!md.nps_ist && seed.nps_ist > 0) md.nps_ist = seed.nps_ist;

            if(seed.crGesamtZiel > 0 && !md.crGesamtZiel) md.crGesamtZiel = seed.crGesamtZiel;
            // Plan: Seed füllt nur Lücken – aber nur wenn der Monat noch keine eigene Produktliste hat
            // (d.h. md.plan leer ist). Hat der User Produkte umbenannt oder gelöscht, soll der Seed
            // diese nicht wieder einsetzen.
            if(seed.plan){
              md.plan = md.plan || {};
              const hasPlanKeys = Object.keys(md.plan).length > 0;
              if(!hasPlanKeys){
                // Leerer Monat: komplett aus Seed initialisieren
                Object.keys(seed.plan).forEach(p=>{
                  if(seed.plan[p] > 0) md.plan[p] = seed.plan[p];

              // Wenn bereits Produkte vorhanden: nichts aus Seed hinzufügen (User-Konfiguration bleibt)

            // BOJ: nur sicherstellen wenn BOJ noch in md.plan vorhanden ist (nicht wenn User es gelöscht hat)
            ['plan','erreicht','cr'].forEach(f=>{ if(md[f] && md.plan && 'BOJ' in md.plan && !('BOJ' in md[f])) md[f]['BOJ']=0; });
          });
        });

        renderAll();
