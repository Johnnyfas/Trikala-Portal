function showChartPopup(title, drawFn){
  const overlay = document.createElement('div');
  overlay.className = 'chart-overlay';
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  const popup = document.createElement('div');
  popup.className = 'chart-popup';

  const closeBtn = document.createElement('button');
  closeBtn.className = 'chart-popup-close';
  closeBtn.innerHTML = '×';
  closeBtn.addEventListener('click', ()=>overlay.remove());

  const titleEl = document.createElement('div');
  titleEl.className = 'chart-popup-title';
  titleEl.textContent = title;

  const canvas = document.createElement('canvas');
  canvas.height = 400;

  popup.appendChild(closeBtn);
  popup.appendChild(titleEl);
  popup.appendChild(canvas);
  overlay.appendChild(popup);
  document.body.appendChild(overlay);

  setTimeout(()=>{
    canvas.width = canvas.offsetWidth;
    canvas.height = 400;
    drawFn(canvas);
  }, 50);
}


const MONATE_ORDER = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
let vlSelectedAgent = {};

function saveMonatSnapshot(){
  const monat = new Date().toLocaleString('de-DE', {month:'long'});
  if(!state.verlauf) state.verlauf = {};
  state.agents.forEach(agent => {
    if(!agent.name.trim()) return;
    const key = agent.name + '_' + agent.team;
    if(!state.verlauf[key]) state.verlauf[key] = { name: agent.name, team: agent.team, monate: {} };
    state.verlauf[key].monate[monat] = {
      sales: JSON.parse(JSON.stringify(agent.sales)),
      calls: agent.calls,
      nps: agent.nps,
      lq: agent.lq,
      cr: totalCr(agent)
    };
  });
  scheduleSave();
  alert(`Snapshot für ${monat} gespeichert!`);
  renderVerlauf();
}

function renderVerlauf(){
  const container = document.getElementById('verlauf-container');
  container.innerHTML = '';

  // ===== TOP 5 / BOTTOM 5 =====
  const rankWrap = document.createElement('div');
  rankWrap.className = 'ranking-wrap';

  Object.keys(TEAM_CONFIGS).forEach(teamId => {
    const cfg = TEAM_CONFIGS[teamId];
    const teamAgents = state.agents.filter(a => a.team === teamId);
    if(!teamAgents.length) return;

    // Top 5 CR
    const sorted = [...teamAgents].filter(a=>totalCr(a)>0).sort((a,b)=>totalCr(b)-totalCr(a));
    const top5 = sorted.slice(0,5);
    const bot5 = sorted.slice(-5).reverse();

    const mkRankBox = (title, emoji, agents, valFn, colorFn) => {
      const box = document.createElement('div');
      box.className = 'ranking-box';
      box.innerHTML = `<div class="rb-title">${emoji} ${title} — ${cfg.label}</div>`;
      agents.forEach((a,i) => {
        const row = document.createElement('div');
        row.className = 'ranking-row';
        const val = valFn(a);
        row.innerHTML = `<span class="rr-rank">${i+1}.</span><span class="rr-name">${a.name}</span><span class="rr-val" style="color:${colorFn(val)}">${val}</span>`;
        box.appendChild(row);
      });
      return box;
    };

    rankWrap.appendChild(mkRankBox('Top 5 CR', '🏆', top5,
      a => totalCr(a).toFixed(2)+'%',
      v => '#0A7C70'
    ));
    rankWrap.appendChild(mkRankBox('Coaching Bedarf', '⚠️', bot5,
      a => totalCr(a).toFixed(2)+'%',
      v => '#B4423A'
    ));
  });
  container.appendChild(rankWrap);

  // ===== COACHING FREQUENZ =====
  const freqWrap = document.createElement('div');
  freqWrap.className = 'ranking-wrap';
  freqWrap.style.marginBottom = '24px';

  Object.keys(TEAM_CONFIGS).forEach(teamId => {
    const cfg = TEAM_CONFIGS[teamId];
    const box = document.createElement('div');
    box.className = 'ranking-box';
    box.style.flex = '2';
    box.innerHTML = `<div class="rb-title">📋 Coaching Frequenz — ${cfg.label}</div>`;

    const teamAgents = state.agents.filter(a=>a.team===teamId).sort((a,b)=>{
      const da = a.coachingDatum ? new Date(a.coachingDatum.split('.').reverse().join('-')) : new Date(0);
      const db = b.coachingDatum ? new Date(b.coachingDatum.split('.').reverse().join('-')) : new Date(0);
      return da - db; // älteste zuerst
    });

    teamAgents.forEach(a => {
      const row = document.createElement('div');
      row.className = 'ranking-row';
      let badge, days;
      if(!a.coachingDatum){
        badge = '<span class="coaching-freq-badge freq-late">⚠ Noch nie</span>';
        days = 999;
      } else {
        days = Math.floor((new Date()-new Date(a.coachingDatum.split('.').reverse().join('-')))/(1000*60*60*24));
        const cls = days<=7?'freq-ok':days<=14?'freq-warn':'freq-late';
        const icon = days<=7?'✓':days<=14?'~':'!';
        badge = `<span class="coaching-freq-badge ${cls}">${icon} ${a.coachingDatum} (${days}d)</span>`;
      }
      row.innerHTML = `<span class="rr-name">${a.name}</span>${badge}`;
      box.appendChild(row);
    });
    freqWrap.appendChild(box);
  });
  container.appendChild(freqWrap);

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'vl-toolbar';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'vl-save-btn';
  saveBtn.textContent = '📸 Aktuellen Monat speichern';
  saveBtn.addEventListener('click', saveMonatSnapshot);
  toolbar.appendChild(saveBtn);
  const infoSpan = document.createElement('span');
  infoSpan.style.cssText = 'font-family:"Inter",sans-serif;font-size:12px;color:var(--muted);';
  const gespeicherteSnapshots = Object.keys(state.verlauf||{}).length;
  infoSpan.textContent = gespeicherteSnapshots > 0 ? `${gespeicherteSnapshots} Mitarbeiter mit Verlaufsdaten` : 'Noch keine Snapshots gespeichert';
  toolbar.appendChild(infoSpan);
  container.appendChild(toolbar);

  if(!state.verlauf || Object.keys(state.verlauf).length === 0){
    const empty = document.createElement('div');
    empty.className = 'vl-no-data';
    empty.textContent = 'Noch keine Verlaufsdaten vorhanden. Klicke auf "Aktuellen Monat speichern" um den ersten Snapshot zu erstellen.';
    container.appendChild(empty);
    return;
  }

  // Teams
  Object.keys(TEAM_CONFIGS).forEach(teamId => {
    const cfg = TEAM_CONFIGS[teamId];
    const teamAgents = Object.values(state.verlauf).filter(v => v.team === teamId);
    if(!teamAgents.length) return;

    const teamBlock = document.createElement('div');
    teamBlock.className = 'vl-team-block';
    teamBlock.innerHTML = `<div class="vl-team-title">${cfg.label} — ${cfg.project}</div>`;

    // Mitarbeiter-Auswahl
    const agentToolbar = document.createElement('div');
    agentToolbar.className = 'vl-toolbar';
    agentToolbar.innerHTML = '<label style="font-family:Inter,sans-serif;font-size:13px;font-weight:600;">Mitarbeiter: </label>';
    const sel = document.createElement('select');
    sel.className = 'vl-agent-select';
    teamAgents.forEach(av => {
      const opt = document.createElement('option');
      opt.value = av.name + '_' + av.team;
      opt.textContent = av.name;
      if(vlSelectedAgent[teamId] === opt.value) opt.selected = true;
      sel.appendChild(opt);
    });
    if(!vlSelectedAgent[teamId]) vlSelectedAgent[teamId] = teamAgents[0].name + '_' + teamAgents[0].team;
    sel.addEventListener('change', e => { vlSelectedAgent[teamId] = e.target.value; renderVerlauf(); });
    agentToolbar.appendChild(sel);
    teamBlock.appendChild(agentToolbar);

    const agentKey = vlSelectedAgent[teamId];
    const agentData = state.verlauf[agentKey];
    if(!agentData){ container.appendChild(teamBlock); return; }

    const MONATE_NAMEN = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    // Keys können "April" oder "2024-April" sein
    const alleMonatKeys = Object.keys(agentData.monate);
    const monate = alleMonatKeys.sort((a, b) => {
      // Sortierung: Jahr-Monat Format
      const parseKey = k => {
        const parts = k.split('-');
        if(parts.length === 2){ const [j,m] = parts; return parseInt(j)*100 + MONATE_NAMEN.indexOf(m); }
        return 2024*100 + MONATE_NAMEN.indexOf(k);
      };
      return parseKey(a) - parseKey(b);
    });
    if(!monate.length){
      teamBlock.innerHTML += '<div class="vl-no-data">Keine Monatsdaten für diesen Mitarbeiter.</div>';
      container.appendChild(teamBlock);
      return;
    }

    // 3 Diagramme: Stückzahl, CR, NPS
    const chartsRow = document.createElement('div');
    chartsRow.style.cssText = 'display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;';

    // Diagramm 1: Gesamt Stückzahl
    const chartWrap1 = document.createElement('div');
    chartWrap1.className = 'vl-chart-wrap';
    chartWrap1.style.flex = '1';
    chartWrap1.style.minWidth = '280px';
    chartWrap1.innerHTML = `<div class="vl-chart-title">${agentData.name} — Gesamt Stückzahl</div>`;
    chartWrap1.addEventListener('click', ()=>showChartPopup(agentData.name+' — Gesamt Stückzahl', c=>drawStkChart(c, monate, stkValues, stkZiel, agentData, cfg)));
    const canvas1 = document.createElement('canvas');
    canvas1.height = 200;
    chartWrap1.appendChild(canvas1);
    chartsRow.appendChild(chartWrap1);

    // Diagramm 2: CR
    const chartWrap = document.createElement('div');
    chartWrap.className = 'vl-chart-wrap';
    chartWrap.style.flex = '1';
    chartWrap.style.minWidth = '280px';
    chartWrap.innerHTML = `<div class="vl-chart-title">${agentData.name} — Gesamt-CR Entwicklung</div>`;
    chartWrap.addEventListener('click', ()=>showChartPopup(agentData.name+' — Gesamt-CR Entwicklung', c=>drawCRChart(c, monate, crValues, cfg, agentData)));
    const canvas = document.createElement('canvas');
    canvas.height = 200;
    chartWrap.appendChild(canvas);
    chartsRow.appendChild(chartWrap);

    // Diagramm 3: NPS
    const chartWrapNPS = document.createElement('div');
    chartWrapNPS.className = 'vl-chart-wrap';
    chartWrapNPS.style.flex = '1';
    chartWrapNPS.style.minWidth = '280px';
    chartWrapNPS.innerHTML = `<div class="vl-chart-title">${agentData.name} — NPS Entwicklung</div>`;
    chartWrapNPS.addEventListener('click', ()=>showChartPopup(agentData.name+' — NPS Entwicklung', c=>drawNPSChart(c, monate, npsValues, cfg, agentData)));
    const canvasNPS = document.createElement('canvas');
    canvasNPS.height = 200;
    chartWrapNPS.appendChild(canvasNPS);
    chartsRow.appendChild(chartWrapNPS);
    teamBlock.appendChild(chartsRow);

    // Chart mit Canvas zeichnen
    const crValues = monate.map(m => agentData.monate[m].cr || 0);
    const npsValues = monate.map(m => agentData.monate[m].nps || 0);

    // Stückzahl-Diagramm
    const stkValues = monate.map(m => {
      const md = agentData.monate[m];
      return Object.values(md.sales||{}).reduce((s,v)=>s+v,0);
    });
    const stkZiel = agentTargets({team:teamId,category:'regular'}).reduce((s,v)=>s+v,0);

    function drawStkChart(cnv, monate, stkValues, stkZiel, agentData, cfg){
      const ctx1 = cnv.getContext('2d');
      const w1 = cnv.width||cnv.offsetWidth||400; const h1 = cnv.height||200;
      cnv.width = w1; cnv.height = h1;
      const cfg1 = cfg;
      const maxStk = Math.max(...stkValues, stkZiel * 1.2, 1);
      const pad1 = {l:40,r:20,t:20,b:30};
      const cw1 = w1-pad1.l-pad1.r; const ch1 = h1-pad1.t-pad1.b;
      ctx1.clearRect(0,0,w1,h1);
      // Ziel-Linie
      const yZ1 = pad1.t + ch1 - (stkZiel/maxStk)*ch1;
      ctx1.setLineDash([6,3]); ctx1.strokeStyle='#E20074'; ctx1.lineWidth=1.5;
      ctx1.beginPath(); ctx1.moveTo(pad1.l,yZ1); ctx1.lineTo(pad1.l+cw1,yZ1); ctx1.stroke();
      ctx1.setLineDash([]); ctx1.fillStyle='#E20074'; ctx1.font='10px Inter';
      ctx1.fillText('Ziel '+stkZiel, pad1.l+cw1-50, yZ1-4);
      // Linie
      if(monate.length>1){
        ctx1.strokeStyle='#0E7C7B'; ctx1.lineWidth=2.5; ctx1.beginPath();
        monate.forEach((m,i)=>{
          const x=pad1.l+(i/(monate.length-1))*cw1;
          const y=pad1.t+ch1-(stkValues[i]/maxStk)*ch1;
          i===0?ctx1.moveTo(x,y):ctx1.lineTo(x,y);
        }); ctx1.stroke();
      }
      monate.forEach((m,i)=>{
        const x=pad1.l+(monate.length>1?(i/(monate.length-1))*cw1:cw1/2);
        const y=pad1.t+ch1-(stkValues[i]/maxStk)*ch1;
        const ok=stkValues[i]>=stkZiel;
        ctx1.fillStyle=ok?'#4CAF50':'#E20074'; ctx1.beginPath(); ctx1.arc(x,y,5,0,Math.PI*2); ctx1.fill();
        ctx1.fillStyle='#1C2733'; ctx1.font='bold 10px IBM Plex Mono'; ctx1.textAlign='center';
        ctx1.fillText(Math.round(stkValues[i]),x,y-10);
        ctx1.fillStyle='#64748B'; ctx1.font='9px Inter';
        ctx1.fillText(m.includes('-')?m.split('-')[1].substring(0,3)+' '+m.split('-')[0].slice(2):m.substring(0,3),x,h1-5);
      });
      // Y-Achse
      ctx1.strokeStyle='#E0E0E0'; ctx1.lineWidth=1;
      ctx1.beginPath(); ctx1.moveTo(pad1.l,pad1.t); ctx1.lineTo(pad1.l,pad1.t+ch1); ctx1.stroke();
      ctx1.fillStyle='#64748B'; ctx1.font='9px Inter'; ctx1.textAlign='right';
      for(let i=0;i<=4;i++){
        const val=Math.round(maxStk*i/4); const y=pad1.t+ch1-(i/4)*ch1;
        ctx1.fillText(val,pad1.l-4,y+3);
        ctx1.strokeStyle='#F5F5F5'; ctx1.beginPath(); ctx1.moveTo(pad1.l,y); ctx1.lineTo(pad1.l+cw1,y); ctx1.stroke();
      }
    }

    function drawCRChart(cnv, monate, crValues, cfg, agentData){
      const ctx = cnv.getContext('2d');
      const w = cnv.width||cnv.offsetWidth||400; const h = cnv.height||200;
      cnv.width = w;
      const maxCR = Math.max(...crValues, cfg.crTarget * 1.5);
      const pad = {l:40, r:20, t:20, b:30};
      const chartW = w - pad.l - pad.r;
      const chartH = h - pad.t - pad.b;

      ctx.clearRect(0,0,w,h);

      // Ziel-Linie
      const yZiel = pad.t + chartH - (cfg.crTarget / maxCR) * chartH;
      ctx.setLineDash([6,3]);
      ctx.strokeStyle = '#E20074';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(pad.l, yZiel);
      ctx.lineTo(pad.l + chartW, yZiel);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#E20074';
      ctx.font = '10px Inter';
      ctx.fillText(`Ziel ${cfg.crTarget}%`, pad.l + chartW - 50, yZiel - 4);

      // CR Linie
      if(monate.length > 1){
        ctx.strokeStyle = '#0E7C7B';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        monate.forEach((m, i) => {
          const x = pad.l + (i / (monate.length - 1)) * chartW;
          const y = pad.t + chartH - (crValues[i] / maxCR) * chartH;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      // Punkte
      monate.forEach((m, i) => {
        const x = pad.l + (monate.length > 1 ? (i / (monate.length - 1)) * chartW : chartW/2);
        const y = pad.t + chartH - (crValues[i] / maxCR) * chartH;
        const ok = crValues[i] >= cfg.crTarget;
        ctx.fillStyle = ok ? '#4CAF50' : '#E20074';
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#1C2733';
        ctx.font = 'bold 10px IBM Plex Mono';
        ctx.textAlign = 'center';
        ctx.fillText(crValues[i].toFixed(1)+'%', x, y - 10);
        ctx.fillStyle = '#64748B';
        ctx.font = '9px Inter';
        ctx.fillText(m.includes('-') ? m.split('-')[1].substring(0,3)+' '+m.split('-')[0].slice(2) : m.substring(0,3), x, h - 5);
      });

      // Y-Achse
      ctx.strokeStyle = '#E0E0E0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.l, pad.t);
      ctx.lineTo(pad.l, pad.t + chartH);
      ctx.stroke();
      ctx.fillStyle = '#64748B';
      ctx.font = '9px Inter';
      ctx.textAlign = 'right';
      for(let i=0; i<=4; i++){
        const val = (maxCR * i/4).toFixed(1);
        const y = pad.t + chartH - (i/4) * chartH;
        ctx.fillText(val+'%', pad.l - 4, y + 3);
        ctx.strokeStyle = '#F5F5F5';
        ctx.beginPath();
        ctx.moveTo(pad.l, y);
        ctx.lineTo(pad.l + chartW, y);
        ctx.stroke();
      }
    }

    function drawNPSChart(cnv, monate, npsValues, cfg, agentData){
      const ctxN = cnv.getContext('2d');
      const wN = cnv.width||cnv.offsetWidth || 400; const hN = cnv.height||200;
      const npsZiel = cfg.npsTarget || 70;
      const maxNPS = 100;
      const padN = {l:40,r:20,t:20,b:30};
      const cwN = wN-padN.l-padN.r; const chN = hN-padN.t-padN.b;
      ctxN.clearRect(0,0,wN,hN);
      // Ziel-Linie
      const yZN = padN.t + chN - (npsZiel/maxNPS)*chN;
      ctxN.setLineDash([6,3]); ctxN.strokeStyle='#E20074'; ctxN.lineWidth=1.5;
      ctxN.beginPath(); ctxN.moveTo(padN.l,yZN); ctxN.lineTo(padN.l+cwN,yZN); ctxN.stroke();
      ctxN.setLineDash([]); ctxN.fillStyle='#E20074'; ctxN.font='10px Inter';
      ctxN.fillText('Ziel '+npsZiel+'%', padN.l+cwN-50, yZN-4);
      // Linie
      const hasNPS = npsValues.some(v=>v>0);
      if(hasNPS && monate.length>1){
        ctxN.strokeStyle='#5B6FA6'; ctxN.lineWidth=2.5; ctxN.beginPath();
        let first = true;
        monate.forEach((m,i)=>{
          if(npsValues[i]===0) return;
          const x=padN.l+(i/(monate.length-1))*cwN;
          const y=padN.t+chN-(npsValues[i]/maxNPS)*chN;
          if(first){ctxN.moveTo(x,y);first=false;}else{ctxN.lineTo(x,y);}
        }); ctxN.stroke();
      }
      monate.forEach((m,i)=>{
        if(npsValues[i]===0) return;
        const x=padN.l+(monate.length>1?(i/(monate.length-1))*cwN:cwN/2);
        const y=padN.t+chN-(npsValues[i]/maxNPS)*chN;
        const ok=npsValues[i]>=npsZiel;
        ctxN.fillStyle=ok?'#4CAF50':'#E20074';
        ctxN.beginPath(); ctxN.arc(x,y,5,0,Math.PI*2); ctxN.fill();
        ctxN.fillStyle='#1C2733'; ctxN.font='bold 10px IBM Plex Mono'; ctxN.textAlign='center';
        ctxN.fillText(npsValues[i].toFixed(1)+'%',x,y-10);
        ctxN.fillStyle='#64748B'; ctxN.font='9px Inter';
        ctxN.fillText(m.includes('-')?m.split('-')[1].substring(0,3)+' '+m.split('-')[0].slice(2):m.substring(0,3),x,hN-5);
      });
      // Y-Achse
      ctxN.strokeStyle='#E0E0E0'; ctxN.lineWidth=1;
      ctxN.beginPath(); ctxN.moveTo(padN.l,padN.t); ctxN.lineTo(padN.l,padN.t+chN); ctxN.stroke();
      ctxN.fillStyle='#64748B'; ctxN.font='9px Inter'; ctxN.textAlign='right';
      for(let i=0;i<=4;i++){
        const val=Math.round(maxNPS*i/4); const y=padN.t+chN-(i/4)*chN;
        ctxN.fillText(val+'%',padN.l-4,y+3);
        ctxN.strokeStyle='#F5F5F5'; ctxN.beginPath(); ctxN.moveTo(padN.l,y); ctxN.lineTo(padN.l+cwN,y); ctxN.stroke();
      }
    }

    // Charts zeichnen
    setTimeout(()=>{ drawStkChart(canvas1, monate, stkValues, stkZiel, agentData, cfg); }, 50);
    setTimeout(()=>{ drawCRChart(canvas, monate, crValues, cfg, agentData); }, 50);
    setTimeout(()=>{ drawNPSChart(canvasNPS, monate, npsValues, cfg, agentData); }, 50);

    // Tabelle mit allen Monaten
    const t = document.createElement('table');
    t.className = 'vl-table';
    const prods = cfg.products;
    t.innerHTML = `<tr><th>Monat</th>${prods.map(p=>`<th>${p}</th>`).join('')}<th>CR</th><th>NPS</th><th>Trend</th></tr>`;
    monate.forEach(m => {
      const md = agentData.monate[m];
      const cr = md.cr || 0;
      const crOk = cr >= cfg.crTarget;
      const tr = document.createElement('tr');
      let html = `<td>${m.includes('-') ? m.split('-')[1]+' '+m.split('-')[0] : m}</td>`;
      prods.forEach((p,i) => {
        const val = md.sales[p]||0;
        const tgt = agentTargets({team:teamId, category:'regular'})[i];
        const cls = val >= tgt ? 'ok' : val > 0 ? 'mid' : 'bad';
        html += `<td><span class="vl-badge ${cls}">${Math.round(val)}</span></td>`;
      });
      html += `<td><span class="vl-badge ${crOk?'ok':'bad'}">${cr.toFixed(2)}%</span></td>`;
      html += `<td><span class="vl-badge ${(md.nps||0)>=cfg.npsTarget?'ok':'bad'}">${(md.nps||0).toFixed(1)}%</span></td>`;
      // Trend: Vergleich mit Vormonat
      const prevM = monate[monate.indexOf(m)-1];
      let trendHtml = '<span class="trend-flat">—</span>';
      if(prevM){
        const prevCr = agentData.monate[prevM].cr||0;
        const diff = cr - prevCr;
        if(Math.abs(diff) >= 0.1){
          const cls = diff>0?'trend-up':'trend-down';
          const arrow = diff>0?'▲':'▼';
          trendHtml = `<span class="${cls}">${arrow} ${Math.abs(diff).toFixed(2)}%</span>`;
        }
      }
      html += `<td>${trendHtml}</td>`;
      tr.innerHTML = html;
      t.appendChild(tr);
    });
    teamBlock.appendChild(t);
    container.appendChild(teamBlock);
  });
}


let maSelectedMonth = { mf: 'Juli', fn: 'Juli' };

function renderMonatsabschluss(){
  const container = document.getElementById('monatsabschluss-container');
  container.innerHTML = '';
  const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  const renderTeamMA = (teamKey, label) => {
    const data = state.monatsabschluss[teamKey];
    const section = document.createElement('div');
    section.className = 'ma-section';
    section.innerHTML = `<div class="ma-title">${label}</div>`;

    // Monats-Tabs
    const tabsDiv = document.createElement('div');
    tabsDiv.className = 'ma-month-tabs';
    MONATE.forEach(m => {
      if(!data[m]) return;
      const btn = document.createElement('button');
      btn.className = 'ma-month-btn' + (maSelectedMonth[teamKey] === m ? ' active' : '');
      btn.textContent = m;
      btn.addEventListener('click', ()=>{
        maSelectedMonth[teamKey] = m;
        renderMonatsabschluss();
      });
      tabsDiv.appendChild(btn);
    });
    section.appendChild(tabsDiv);

    const monat = maSelectedMonth[teamKey];
    const md = data[monat];
    if(!md){ container.appendChild(section); return; }

    // Feste Reihenfolge: BB, SU, BOJ, VVM, TV, MF (NA und andere ausgeschlossen)
    const PROD_ORDER = ['BB','NG (BB)','SU','BOJ','VVM','TV','MF NG','MF'];
    const EXCLUDE = ['NA'];
    const allProds = Object.keys(md.plan).filter(p => !EXCLUDE.includes(p));
    const produkte = PROD_ORDER.filter(p => allProds.includes(p))
      .concat(allProds.filter(p => !PROD_ORDER.includes(p) && !EXCLUDE.includes(p)));

    const t = document.createElement('table');
    t.className = 'ma-table';

    // Header
    t.innerHTML = `<tr><th>${monat}</th>${produkte.map(p=>`<th>${p}</th>`).join('')}</tr>`;

    const mkEditRow = (label, dataKey, rowClass) => {
      const row = document.createElement('tr');
      if(rowClass) row.className = rowClass;
      const labelTd = document.createElement('td'); labelTd.textContent = label;
      row.appendChild(labelTd);
      produkte.forEach(p => {
        const td = document.createElement('td');
        const val = md[dataKey][p] !== undefined ? md[dataKey][p] : 0;
        const isErreicht = dataKey === 'erreicht';
        const isPlan = dataKey === 'plan';
        const isZiel = dataKey === 'ziel';
        // Grün wenn Erreicht >= Planenmenge
        if(isErreicht){
          const plan = md.plan[p]||0;
          if(val >= plan && val > 0) td.style.background = '#E6F7F4';
        }
        const inp = document.createElement('input');
        inp.className = 'ma-input';
        inp.type = 'text';
        inp.inputMode = 'decimal';
        inp.value = val;
        inp.addEventListener('focus', e=>e.target.select());
        inp.addEventListener('change', e=>{
          md[dataKey][p] = parseFloat(e.target.value)||0;
          scheduleSave();
          renderMonatsabschluss();
        });
        td.appendChild(inp);
        row.appendChild(td);
      });
      return row;
    };

    const mkReadRow = (label, dataKey, suffix, cls, colorFn) => {
      const row = document.createElement('tr');
      if(cls) row.className = cls;
      row.innerHTML = `<td>${label}</td>${produkte.map(p=>{
        const val = md[dataKey] ? (md[dataKey][p]||0) : 0;
        const badgeCls = colorFn ? colorFn(p, val) : 'neutral';
        return `<td><span class="ma-badge ${badgeCls}">${typeof val === 'number' ? val.toFixed(val < 10 ? 4 : 0) : val}${suffix}</span></td>`;
      }).join('')}`;
      return row;
    };

    // Planenmenge (editierbar)
    t.appendChild(mkEditRow('Planenmenge', 'plan', 'ma-row-plan'));

    // Erreicht (editierbar, grün wenn >= Planenmenge)
    const errRow = document.createElement('tr'); errRow.className = 'ma-row-erreicht';
    const errLabelTd = document.createElement('td'); errLabelTd.textContent = 'Erreicht';
    errRow.appendChild(errLabelTd);
    produkte.forEach(p => {
      const td = document.createElement('td');
      const val = md.erreicht[p] || 0;
      const plan = md.plan[p] || 0;
      if(val > 0 && val >= plan){
        td.style.cssText = 'background:#E6F7F4;'; // grün
      } else if(val > 0 && val < plan){
        td.style.cssText = 'background:#FEF0EF;'; // hellrot
      }
      const inp = document.createElement('input');
      inp.className = 'ma-input'; inp.type='text'; inp.inputMode='decimal';
      inp.value = val;
      inp.style.color = (val > 0 && val < plan) ? '#B4423A' : (val >= plan && val > 0) ? '#0A7C70' : 'inherit';
      inp.addEventListener('focus', e=>e.target.select());
      inp.addEventListener('change', e=>{
        md.erreicht[p] = parseFloat(e.target.value)||0;
        scheduleSave(); renderMonatsabschluss();
      });
      td.appendChild(inp);
      errRow.appendChild(td);
    });
    t.appendChild(errRow);

    // CR% (editierbar, grün wenn >= CR Ziel)
    if(!md.crZiel) md.crZiel = {};
    if(!md.storno) md.storno = {};

    const mkPctRow = (label, dataKey, compareKey, rowCls) => {
      const row = document.createElement('tr');
      if(rowCls) row.className = rowCls;
      const lTd = document.createElement('td'); lTd.textContent = label;
      row.appendChild(lTd);
      produkte.forEach(p => {
        const td = document.createElement('td');
        const val = md[dataKey][p] || 0;
        if(compareKey){
          const cmp = md[compareKey][p] || 0;
          if(val >= cmp && val > 0) td.style.cssText = 'background:#E6F7F4;';
        }
        const inp = document.createElement('input');
        inp.className = 'ma-input'; inp.type='text'; inp.inputMode='decimal';
        inp.value = parseFloat(val).toFixed(2) + '%';
        inp.addEventListener('focus', e=>e.target.select());
        inp.addEventListener('change', e=>{
          md[dataKey][p] = parseFloat(e.target.value.replace('%','').replace(',','.'))||0;
          scheduleSave(); renderMonatsabschluss();
        });
        td.appendChild(inp);
        row.appendChild(td);
      });
      return row;
    };

    t.appendChild(mkPctRow('CR%', 'cr', 'crZiel', 'ma-row-cr'));
    // CR Ziel als freies Textfeld (z.B. "3%-4.5%-5%")
    if(!md.crZielText) md.crZielText = {};
    const crZielRow = document.createElement('tr');
    const crZielLabelTd = document.createElement('td'); crZielLabelTd.textContent = 'CR Ziel';
    crZielRow.className = 'ma-row-crziel'; crZielRow.appendChild(crZielLabelTd);
    produkte.forEach(p => {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.className = 'ma-input';
      inp.type = 'text';
      inp.style.width = '100%';
      inp.style.minWidth = '80px';
      inp.placeholder = 'z.B. 3%-4.5%';
      inp.value = md.crZielText[p] || '';
      inp.addEventListener('focus', e=>e.target.select());
      inp.addEventListener('change', e=>{
        md.crZielText[p] = e.target.value;
        // Auch numerisch speichern für Grün-Vergleich (erste Zahl nehmen)
        const firstNum = parseFloat(e.target.value.replace(',','.'));
        md.crZiel[p] = isNaN(firstNum) ? 0 : firstNum;
        scheduleSave(); renderMonatsabschluss();
      });
      td.appendChild(inp);
      crZielRow.appendChild(td);
    });
    t.appendChild(crZielRow);
    t.appendChild(mkPctRow('Storno', 'storno', null, 'ma-row-storno'));

    // NPS Kasten (rechts neben der Tabelle, wie Gesamt CR im Team Ziele)
    const npsBox = document.createElement('div');
    npsBox.style.cssText = 'display:flex;flex-direction:column;gap:12px;min-width:150px;';

    const mkNpsBox = (cls, labelTxt, val, onChange) => {
      const box = document.createElement('div');
      box.style.cssText = `border-radius:16px;padding:14px 18px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,0.09);`;
      if(cls === 'ziel') box.style.background = 'linear-gradient(135deg,#E3F2FD,#90CAF9)';
      else if(val >= md.nps_plan && val > 0) box.style.background = 'linear-gradient(135deg,#E8F5E9,#A5D6A7)';
      else box.style.background = 'linear-gradient(135deg,#FFF8E1,#FFE082)';
      const lbl = document.createElement('div');
      lbl.style.cssText = 'font-family:"Inter",sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;opacity:.75;';
      lbl.textContent = labelTxt;
      const valDiv = document.createElement('div');
      valDiv.style.cssText = 'font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:700;';
      const inp = document.createElement('input');
      inp.type = 'text'; inp.inputMode = 'decimal';
      inp.style.cssText = 'background:transparent;border:none;outline:none;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:700;width:100%;text-align:center;color:inherit;';
      inp.value = parseFloat(val||0).toFixed(1) + '%';
      inp.addEventListener('focus', e=>e.target.select());
      inp.addEventListener('change', e=>{ onChange(parseFloat(e.target.value.replace('%','').replace(',','.'))||0); scheduleSave(); renderMonatsabschluss(); });
      valDiv.appendChild(inp);
      box.appendChild(lbl); box.appendChild(valDiv);
      return box;
    };

    // CR Gesamt Ziel und Erreicht (über NPS)
    if(!md.crGesamtZiel) md.crGesamtZiel = 0;
    if(!md.crGesamtErreicht) md.crGesamtErreicht = 0;

    const mkCrGesamtBox = (cls, labelTxt, val, onChange, compareVal) => {
      const box = document.createElement('div');
      box.style.cssText = `border-radius:16px;padding:14px 18px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,0.09);`;
      if(cls === 'ziel') box.style.background = 'linear-gradient(135deg,#E3F2FD,#90CAF9)';
      else if(compareVal !== undefined && val >= compareVal && val > 0)
        box.style.background = 'linear-gradient(135deg,#E8F5E9,#A5D6A7)';
      else
        box.style.background = 'linear-gradient(135deg,#FFF8E1,#FFE082)';

      const lbl = document.createElement('div');
      lbl.style.cssText = 'font-family:"Inter",sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;opacity:.75;';
      lbl.textContent = labelTxt;

      const valDiv = document.createElement('div');
      valDiv.style.cssText = 'display:flex;align-items:center;justify-content:center;';

      const isReached = compareVal !== undefined && val >= compareVal && val > 0;
      if(isReached && cls !== 'ziel'){
        // Grüner Kreis
        const circle = document.createElement('div');
        circle.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:#4CAF50;color:#fff;font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:700;cursor:pointer;';
        circle.textContent = parseFloat(val||0).toFixed(2) + '%';
        circle.addEventListener('click', ()=>{ valDiv.innerHTML=''; valDiv.appendChild(inp); inp.focus(); inp.select(); });
        valDiv.appendChild(circle);
      } else {
        const inp = document.createElement('input');
        inp.type = 'text'; inp.inputMode = 'decimal';
        inp.style.cssText = 'background:transparent;border:none;outline:none;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:700;width:100%;text-align:center;color:inherit;';
        inp.value = parseFloat(val||0).toFixed(2) + '%';
        inp.addEventListener('focus', e=>e.target.select());
        inp.addEventListener('change', e=>{ onChange(parseFloat(e.target.value.replace(',','.').replace('%',''))||0); scheduleSave(); renderMonatsabschluss(); });
        valDiv.appendChild(inp);
      }

      box.appendChild(lbl); box.appendChild(valDiv);
      return box;
    };

    // NPS Box links
    const npsLeftBox = document.createElement('div');
    npsLeftBox.style.cssText = 'display:flex;flex-direction:column;gap:12px;min-width:130px;max-width:130px;';
    npsLeftBox.appendChild(mkNpsBox('ziel', 'NPS Ziel', md.nps_plan, v=>{ md.nps_plan=v; }));
    npsLeftBox.appendChild(mkNpsBox('ist', 'NPS Erreicht', md.nps_ist, v=>{ md.nps_ist=v; }));

    // CR Box rechts
    const crRightBox = document.createElement('div');
    crRightBox.style.cssText = 'display:flex;flex-direction:column;gap:12px;min-width:130px;max-width:130px;';
    crRightBox.appendChild(mkCrGesamtBox('ziel', 'CR Gesamt Ziel', md.crGesamtZiel, v=>{ md.crGesamtZiel=v; }, undefined));
    crRightBox.appendChild(mkCrGesamtBox('ist', 'CR Gesamt Erreicht', md.crGesamtErreicht, v=>{ md.crGesamtErreicht=v; }, md.crGesamtZiel));

    // Layout: NPS links | Tabelle mitte | CR rechts
    const maLayout = document.createElement('div');
    maLayout.style.cssText = 'display:flex;gap:20px;align-items:flex-start;';
    const tableWrapMA = document.createElement('div');
    tableWrapMA.style.cssText = 'flex:1;min-width:0;overflow-x:auto;';
    tableWrapMA.appendChild(t);
    maLayout.appendChild(npsLeftBox);
    maLayout.appendChild(tableWrapMA);
    maLayout.appendChild(crRightBox);
    section.appendChild(maLayout);
    container.appendChild(section);
  };

  renderTeamMA('mf', 'MF PK Standort — Mobilfunk');
  renderTeamMA('fn', 'FN PK Standort — Festnetz');
}


function renderTeamZiele(){
  const container = document.getElementById('teamziele-container');
  container.innerHTML = '';

  function mkInput(val, onChange){
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'decimal';
    inp.value = val;
    inp.style.cssText = 'width:100%;background:transparent;border:none;outline:none;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700;text-align:center;color:inherit;';
    inp.addEventListener('focus', e=>e.target.select());
    inp.addEventListener('change', e=>{ onChange(parseFloat(e.target.value.replace(',','.'))||0); scheduleSave(); renderTeamZiele(); });
    return inp;
  }
  function cell(content, cls, colspan, rowspan){
    const td = document.createElement('td');
    if(cls) td.className = cls;
    if(colspan) td.colSpan = colspan;
    if(rowspan) td.rowSpan = rowspan;
    if(typeof content === 'string' || typeof content === 'number') td.textContent = content;
    else if(content && content.nodeType) td.appendChild(content);
    return td;
  }

  function crStuffeStyle(val, tz){
    const v = parseFloat(val)||0;
    // Stufe 3 (höchste) - nur MF
    if(tz.crZiel3 && v >= parseFloat(Object.values(tz.crZiel3)[0]||0)) return 'background:#1B5E20;color:#fff;';
    // Stufe 2
    if(tz.crZiel2 && v >= parseFloat(Object.values(tz.crZiel2)[0]||0)) return 'background:#4CAF50;color:#fff;';
    // Stufe 1
    if(tz.crZiel1 && v >= parseFloat(Object.values(tz.crZiel1)[0]||0)) return 'background:#81C784;color:#1B5E20;';
    // Unter Stufe 1
    return 'background:#CE93D8;color:#4A148C;';
  }

  function crStuffeProd(p, val, tz){
    const v = parseFloat(val)||0;
    const s1 = parseFloat(tz.crZiel1[p]||0);
    const s2 = parseFloat(tz.crZiel2[p]||0);
    // Stufe 3 nur für MF-Produkt
    const s3 = (p === 'MF' && tz.crZiel3) ? parseFloat(tz.crZiel3[p]||0) : null;
    if(s3 !== null && v >= s3) return 'background:#1B5E20;color:#fff;border-radius:6px;';
    if(v >= s2) return 'background:#4CAF50;color:#fff;border-radius:6px;';
    if(v >= s1) return 'background:#81C784;color:#1B5E20;border-radius:6px;';
    return 'background:#CE93D8;color:#4A148C;border-radius:6px;';
  }

  function addRow(t, rowCls, labelTxt, leftCells, prodCells){
    const tr = document.createElement('tr');
    tr.className = rowCls;
    tr.appendChild(cell(labelTxt, 'tz-label'));
    leftCells.forEach(c => tr.appendChild(c));
    prodCells.forEach(c => tr.appendChild(c));
    t.appendChild(tr);
    return tr;
  }

  const heute = new Date().toLocaleDateString('de-DE');

  const renderTeam = (key, label, cols, colLabels) => {
    const tz = state.teamziele[key];
    const section = document.createElement('div');
    section.className = 'tz-section';
    section.innerHTML = `<div class="tz-title">${label}</div>`;
    // Layout: Tabelle links, CR-Sidebar rechts
    const teamLayout = document.createElement('div');
    teamLayout.className = 'tz-team-layout';
    const tableWrap = document.createElement('div');
    tableWrap.className = 'tz-table-wrap';
    const sidebar = document.createElement('div');
    sidebar.className = 'cr-sidebar';

    const mkCrSideBox = (cls, labelTxt, val, onChange, isCalc) => {
      const box = document.createElement('div');
      box.className = 'cr-box ' + cls;
      const lbl = document.createElement('div'); lbl.className = 'cr-box-label'; lbl.textContent = labelTxt;
      const valDiv = document.createElement('div'); valDiv.className = 'cr-box-val';
      if(isCalc){
        valDiv.textContent = parseFloat(val||0).toFixed(2) + '%';
      } else {
        const inp = document.createElement('input');
        inp.type = 'text'; inp.inputMode = 'decimal';
        inp.value = parseFloat(val||0).toFixed(2) + '%';
        inp.addEventListener('focus', e=>e.target.select());
        inp.addEventListener('change', e=>{ onChange(parseFloat(e.target.value.replace(',','.').replace('%',''))||0); scheduleSave(); renderTeamZiele(); });
        valDiv.appendChild(inp);
      }
      box.appendChild(lbl); box.appendChild(valDiv);
      return box;
    };

    sidebar.appendChild(mkCrSideBox('gestern', 'CR Gestern', tz.crGestern||0, v=>{ tz.crGestern=v; }, false));
    const crAktSide = tz.crAktuell || {};
    let crMonatSide;
    if(key === 'fn'){
      crMonatSide = cols.filter(p=>p!=='BOJ').reduce((s,p)=>s+(parseFloat(crAktSide[p]||0)),0);
    } else {
      crMonatSide = cols.reduce((s,p)=>s+(parseFloat(crAktSide[p]||0)),0);
    }
    sidebar.appendChild(mkCrSideBox('monat', 'CR Monat', crMonatSide, null, true));
    sidebar.appendChild(mkCrSideBox('ziel', 'CR Ziel', tz.crZiel||0, v=>{ tz.crZiel=v; }, false));

    const t = document.createElement('table');
    t.className = 'tz-table';
    t.style.cssText = 'width:100%;border-collapse:collapse;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.07);';

    // === HEADER ===
    const hRow = document.createElement('tr');
    hRow.className = 'tz-row-header';
    hRow.appendChild(cell(heute, 'tz-label'));
    hRow.appendChild(cell('Monat'));
    hRow.appendChild(cell(tz.monat));

    cols.forEach(p => hRow.appendChild(cell(colLabels[p]||p)));
    t.appendChild(hRow);

    // === SOLL NETTO ===
    const sollRow = document.createElement('tr'); sollRow.className = 'tz-row-soll';
    sollRow.appendChild(cell('Soll Netto', 'tz-label'));
    sollRow.appendChild(cell('')); sollRow.appendChild(cell(''));

    cols.forEach(p => sollRow.appendChild(cell(mkInput(tz.soll[p]||0, v=>{ tz.soll[p]=v; }))));
    t.appendChild(sollRow);

    // === IST NETTO ===
    const istRow = document.createElement('tr'); istRow.className = 'tz-row-ist';
    istRow.appendChild(cell('Ist Netto', 'tz-label'));
    istRow.appendChild(cell('')); istRow.appendChild(cell(''));
    cols.forEach(p => {
      const td = document.createElement('td');
      const val = tz.ist[p]||0;
      const soll = tz.soll[p]||0;
      const erreicht = val > 0 && val >= soll;

      const inp = document.createElement('input');
      inp.type='text'; inp.inputMode='decimal';
      inp.style.cssText='width:52px;background:transparent;border:none;outline:none;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700;text-align:center;color:inherit;';
      inp.value = val;
      inp.addEventListener('focus', e=>e.target.select());
      inp.addEventListener('change', e=>{ tz.ist[p]=parseFloat(e.target.value)||0; scheduleSave(); renderTeamZiele(); });

      if(erreicht){
        const circle = document.createElement('div');
        circle.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#4CAF50;color:#fff;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700;cursor:pointer;margin:auto;';
        circle.textContent = val;
        circle.title = 'Klicken zum Bearbeiten';
        circle.addEventListener('click', ()=>{ circle.replaceWith(inp); inp.focus(); inp.select(); });
        td.style.textAlign = 'center';
        td.appendChild(circle);
      } else {
        td.appendChild(inp);
      }
      istRow.appendChild(td);
    });
    t.appendChild(istRow);

    // === NOCH NETTO (berechnet) ===
    const nochRow = document.createElement('tr'); nochRow.className = 'tz-row-noch';
    nochRow.appendChild(cell('Noch Netto', 'tz-label'));
    nochRow.appendChild(cell('')); nochRow.appendChild(cell(''));
    cols.forEach(p => {
      const noch = (tz.soll[p]||0)-(tz.ist[p]||0);
      const td = cell(noch);
      if(noch < 0) td.style.color='#B71C1C';
      nochRow.appendChild(td);
    });
    t.appendChild(nochRow);

    // === CR Zeilen (mit Produkt-CRs) ===
    // Stufen: MF hat 3, FN hat 2
    const stufenMF = [
      {cls:'tz-row-cr',      label:'CR',           dataKey:'crAktuell'},
      {cls:'tz-row-crziel1', label:'CR Ziel St.1', dataKey:'crZiel1'},
      {cls:'tz-row-crziel2', label:'CR Ziel St.2', dataKey:'crZiel2'},
      {cls:'tz-row-crziel3', label:'CR Ziel St.3', dataKey:'crZiel3'},
    ];
    const stufenFN = [
      {cls:'tz-row-cr',      label:'CR',           dataKey:'crAktuell'},
      {cls:'tz-row-crziel1', label:'CR Ziel St.1', dataKey:'crZiel1'},
      {cls:'tz-row-crziel2', label:'CR Ziel St.2', dataKey:'crZiel2'},
    ];
    const stufen = key==='mf' ? stufenMF : stufenFN;

    // Sicherstellen dass crAktuell im State vorhanden ist
    if(!tz.crAktuell){
      tz.crAktuell = {};
      cols.forEach(p => tz.crAktuell[p] = 0);
    }

    stufen.forEach(({cls, label:lbl, dataKey}) => {
      const r = document.createElement('tr'); r.className = cls;
      r.appendChild(cell(lbl, 'tz-label'));
      r.appendChild(cell('')); r.appendChild(cell(''));

      cols.forEach(p => {
        const val = (tz[dataKey] && tz[dataKey][p] !== undefined) ? parseFloat(tz[dataKey][p]) : 0;
        const isCR = dataKey === 'crAktuell';
        const isSt3 = dataKey === 'crZiel3';

        // Stufe 3 nur für MF-Produkt anzeigen (leere Zelle für andere)
        if(isSt3 && p !== 'MF'){
          r.appendChild(cell('—'));
          return;
        }

        const td = document.createElement('td');
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.inputMode = 'decimal';
        inp.value = val.toFixed(2) + '%';
        inp.style.cssText = 'width:100%;background:transparent;border:none;outline:none;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700;text-align:center;color:inherit;';
        inp.addEventListener('focus', e => e.target.select());
        inp.addEventListener('change', e => {
          const v = parseFloat(e.target.value.replace(',','.').replace('%',''))||0;
          if(!tz[dataKey]) tz[dataKey] = {};
          tz[dataKey][p] = v;
          scheduleSave();
          renderTeamZiele();
        });
        td.appendChild(inp);

        // Farbe basierend auf erreichter Stufe (nur für CR-Zeile)
        if(isCR){
          td.style.cssText = crStuffeProd(p, val, tz);
          inp.style.color = 'inherit';
        }
        r.appendChild(td);
      });
      t.appendChild(r);
    });

    // === STORNO ===
    const stRow = document.createElement('tr'); stRow.className = 'tz-row-storno';
    stRow.appendChild(cell('Storno', 'tz-label'));
    stRow.appendChild(cell('')); stRow.appendChild(cell(''));
    cols.forEach(p => stRow.appendChild(cell(mkInput((parseFloat(tz.storno[p]||0)).toFixed(2)+'%', v=>{ tz.storno[p]=(parseFloat(v)||0); }))));
    t.appendChild(stRow);

    tableWrap.appendChild(t);
    teamLayout.appendChild(tableWrap);
    teamLayout.appendChild(sidebar);
    section.appendChild(teamLayout);
    container.appendChild(section);
  };

  renderTeam('mf', 'MF Trikala — Mobilfunk PK',
    ['MF','BB','SU','TV','BOJ'],
    {MF:'MF',BB:'BB',SU:'SU',TV:'TV',BOJ:'BOJ'}
  );
  renderTeam('fn', 'FN Team — Festnetz PK',
    ['BB','SU','BOJ','VVM','TV','MF'],
    {BB:'BB',SU:'SU',BOJ:'BOJ',VVM:'VVM Gesamt',TV:'TV',MF:'MF'}
  );
}


function renderOverview(){
  document.getElementById('ov-count').textContent = state.agents.length + ' Mitarbeiter';
  const container = document.getElementById('overview-capture');
  container.innerHTML = '';
  const title = document.createElement('div');
  title.innerHTML = '<div class="ov-title">Team-Übersicht — Vertrieb &amp; Gesamt-CR</div><div class="ov-sub">Inbound Mobilfunk &amp; Festnetz Privatkunden · Stand aktuell</div>';
  container.appendChild(title);

  Object.keys(TEAM_CONFIGS).forEach(teamId=>{
    const cfg = TEAM_CONFIGS[teamId];
    const teamAgents = state.agents.filter(a => String(a.team) === String(teamId) && a.name.trim() !== '');
    if(!teamAgents.length) return;
    const teamDiv = document.createElement('div');
    teamDiv.className = 'ov-team';
    const legendLine = (catKey) => cfg.products.map((p,i)=>`${p} ${cfg.targets[catKey][i]}`).join(' · ') + (catKey==='regular' ? ` · CR ${cfg.crTarget}%` : '');
    teamDiv.innerHTML = `
      <div class="ov-team-head">
        <span class="name">${cfg.label} — ${cfg.project}</span>
      </div>
      <div style="background:#F7F9FA;padding:8px 16px;border-bottom:1px solid var(--border);">
        <div class="line" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);">Standard: ${legendLine('regular')}</div>
        <div class="line" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sixh);">6-Stündler: ${legendLine('6h')}</div>
        <div class="line" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--helpline);">Helpline: ${legendLine('helpline')}</div>
      </div>`;

    const grid = document.createElement('div');
    grid.className = 'ov-grid';
    // Grid: Name | NPS | LQ | Produkte... | CR
    // Name bekommt 2fr, alle anderen 1fr
    const totalCols = 1 + 2 + cfg.products.length + 1;
    const nameWidth = '160px';
    const colWidth = '80px';
    const gridCols = `${nameWidth} repeat(${totalCols - 1}, ${colWidth})`;
    grid.style.setProperty('--ov-cols', gridCols);

    // Header row
    const headerRow = document.createElement('div');
    headerRow.className = 'ov-header-row';
    headerRow.style.gridTemplateColumns = gridCols;
    headerRow.innerHTML =
      `<div class="ov-cell name-cell head">Mitarbeiter</div>` +
      `<div class="ov-cell qual-cell head">NPS<span style="font-size:9px;font-weight:400;">Ziel ${cfg.npsTarget}%</span></div>` +
      `<div class="ov-cell qual-cell head">LQ<span style="font-size:9px;font-weight:400;">Ziel ${cfg.lqTarget}%</span></div>` +
      cfg.products.map(p=>`<div class="ov-cell sales-cell head">${p}</div>`).join('') +
      `<div class="ov-cell cr-cell head">CR<span style="font-size:9px;font-weight:400;">Ziel ${cfg.crTarget}%</span></div>`;
    grid.appendChild(headerRow);

    teamAgents.forEach(agent=>{
      const row = document.createElement('div');
      row.className = 'ov-data-row';
      row.style.gridTemplateColumns = gridCols;
      const myTargets = agentTargets(agent);
      const dotHtml = (agent.category && agent.category !== 'regular') ? `<span class="cat-dot ${CATEGORY_CSS[agent.category]}"></span>` : '';
      const npsTarget = cfg.npsTarget || 70;
      const lqTarget  = cfg.lqTarget  || 75;
      const npsVal = agent.nps || 0;
      const npsClass = npsVal >= npsTarget ? 'good' : 'zero';
      const lqVal = agent.lq || 0;
      const lqClass = lqVal >= lqTarget ? 'good' : 'zero';
      const cr = totalCr(agent);
      const crStatus = trafficStatus(parseFloat(cr.toFixed(2)), cfg.crTarget);

      let html = `<div class="ov-cell name-cell">${dotHtml}${agent.name}</div>`;
      html += `<div class="ov-cell qual-cell"><span class="ov-badge ${npsClass}">${npsVal.toFixed(2)}%</span></div>`;
      html += `<div class="ov-cell qual-cell"><span class="ov-badge ${lqClass}">${lqVal.toFixed(2)}%</span></div>`;
      cfg.products.forEach((p,i)=>{
        const val = agent.sales[p]||0;
        const status = trafficStatus(val, myTargets[i]);
        html += `<div class="ov-cell sales-cell"><span class="ov-badge ${status}" style="font-size:14px;padding:4px 10px;">${Math.round(val)}</span></div>`;
      });
      html += `<div class="ov-cell cr-cell"><span class="ov-badge ${crStatus}">${cr.toFixed(2)}%</span></div>`;
      row.innerHTML = html;
      grid.appendChild(row);
    });

    teamDiv.appendChild(grid);
    container.appendChild(teamDiv);
  });

  const foot = document.createElement('div');
  foot.className = 'ov-foot';
  foot.innerHTML = 'Grün = Ziel erreicht · Rot = unter Ziel &nbsp;·&nbsp; <span class="cat-dot sixh"></span>6-Stündler &nbsp; <span class="cat-dot helpline"></span>Helpline';
  container.appendChild(foot);
}

document.getElementById('add-agent-btn').addEventListener('click', ()=>{
  state.agents.push(makeAgent('Trikala01'));
  scheduleSave();
  renderAll();
});

document.getElementById('export-png-btn').addEventListener('click', ()=>{
  const target = document.getElementById('overview-capture');
  html2canvas(target, { backgroundColor: '#EDF1F4', scale: 2 }).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'team-uebersicht.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

loadState();
