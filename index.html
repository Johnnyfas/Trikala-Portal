        const zoomInBtn = document.createElement('button'); zoomInBtn.className='chart-zoom-btn'; zoomInBtn.textContent='+';
        const zoomResetBtn = document.createElement('button'); zoomResetBtn.className='chart-zoom-btn chart-zoom-reset'; zoomResetBtn.textContent='⟲'; zoomResetBtn.title='Zurücksetzen';
        zoomBar.appendChild(zoomOutBtn); zoomBar.appendChild(zoomLabel); zoomBar.appendChild(zoomInBtn); zoomBar.appendChild(zoomResetBtn);

        const viewport = document.createElement('div');
        viewport.className = 'chart-zoom-viewport';
        const svgWrap = document.createElement('div');
        svgWrap.style.cssText = 'width:100%;transform-origin:center center;transition:transform .05s linear;';
        svgWrap.innerHTML = makeSVGChart(buildFn(), isPercent, 820, 400, fixedMax);
        viewport.appendChild(svgWrap);

        popup.appendChild(closeBtn); popup.appendChild(titleEl); popup.appendChild(zoomBar); popup.appendChild(viewport);
        overlay.appendChild(popup); document.body.appendChild(overlay);

        attachZoomPan(svgWrap, viewport, zoomLabel);
      });
    },80);
  };

  // Wiederverwendbare Zoom/Pan-Steuerung für ein Element innerhalb eines Viewports
  function attachZoomPan(el, viewport, zoomLabel){
    let scale = 1, panX = 0, panY = 0;
    let dragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;
    const MIN_SCALE = 1, MAX_SCALE = 4;
    function applyTransform(){
      el.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      zoomLabel.textContent = Math.round(scale*100) + '%';
      viewport.style.cursor = scale > 1 ? 'grab' : 'default';
    }
    function clampPan(){
      const maxOffset = (scale - 1) * 300 + 40;
      panX = Math.max(-maxOffset, Math.min(maxOffset, panX));
      panY = Math.max(-maxOffset, Math.min(maxOffset, panY));
    }
    function setScale(newScale){
      scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      if(scale === 1){ panX = 0; panY = 0; }
      clampPan(); applyTransform();
    }
    const zoomBar = viewport.parentElement.querySelector('.chart-zoom-bar');
    if(zoomBar){
      const [outBtn, , inBtn, resetBtn] = zoomBar.children;
      outBtn.addEventListener('click', ()=>setScale(scale - 0.25));
      inBtn.addEventListener('click', ()=>setScale(scale + 0.25));
      resetBtn.addEventListener('click', ()=>setScale(1));
    }
    viewport.addEventListener('wheel', e=>{ e.preventDefault(); setScale(scale + (e.deltaY<0?0.2:-0.2)); }, { passive:false });
    viewport.addEventListener('mousedown', e=>{
      if(scale<=1) return;
      dragging=true; dragStartX=e.clientX; dragStartY=e.clientY; panStartX=panX; panStartY=panY;
      viewport.style.cursor='grabbing';
    });
    window.addEventListener('mousemove', e=>{
      if(!dragging) return;
      panX=panStartX+(e.clientX-dragStartX); panY=panStartY+(e.clientY-dragStartY);
      clampPan(); applyTransform();
    });
    window.addEventListener('mouseup', ()=>{ dragging=false; if(scale>1) viewport.style.cursor='grab'; });
    let touchStartDist=null, touchStartScale=1;
    viewport.addEventListener('touchstart', e=>{
      if(e.touches.length===2){
        touchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        touchStartScale = scale;
      } else if(e.touches.length===1 && scale>1){
        dragging=true; dragStartX=e.touches[0].clientX; dragStartY=e.touches[0].clientY; panStartX=panX; panStartY=panY;
      }
    }, { passive:true });
    viewport.addEventListener('touchmove', e=>{
      if(e.touches.length===2 && touchStartDist){
        const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        setScale(touchStartScale * (dist/touchStartDist));
      } else if(e.touches.length===1 && dragging){
        panX=panStartX+(e.touches[0].clientX-dragStartX); panY=panStartY+(e.touches[0].clientY-dragStartY);
        clampPan(); applyTransform();
      }
    }, { passive:true });
    viewport.addEventListener('touchend', ()=>{ dragging=false; touchStartDist=null; });
  }

  mkBox('Gesamt CR — Monatsverlauf', ()=>[
    { label:'MF', color:'#E20074', labels:availMonate, values:availMonate.map(m=>{ const md=state.monatsabschluss.mf[m]; if(!md) return 0; return md.crGesamtErreicht||Object.entries(md.cr||{}).filter(([k])=>k!=='BOJ').reduce((s,[,v])=>s+v,0); }) },

  ], false);

  mkBox('NPS — Monatsverlauf', ()=>[
    { label:'MF', color:'#E20074', labels:availMonate, values:availMonate.map(m=>{ const md=state.monatsabschluss.mf[m]; return md?md.nps_ist||0:0; }) },
    { label:'FN', color:'#0E7C7B', labels:availMonate, values:availMonate.map(m=>{ const md=state.monatsabschluss.fn[m]; return md?md.nps_ist||0:0; }) }
  ], true, 100);

  // CHT-Monatsverlauf: Ø pro Team. Quelle je Mitarbeiter und Monat (erste vorhandene gewinnt):
  //  1. aktueller Monat → Monatsstand (agent.cht, z.B. aus dem Helpsense-Import)
  //  2. Mitarbeiter-Verlauf des Monats (unscharfer Namensabgleich)
  //  3. hinterlegte Helpsense-Werte Januar–Juli (per Pylon-Nr.)
  const chtMonate = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const chtJetzt = new Date();
  const chtTeamAvg = (teamId) => chtMonate.map((monat, idx)=>{
    if(chtJetzt.getFullYear() === 2026 && idx > chtJetzt.getMonth()) return 0; // Zukunft
    const istAktuell = chtJetzt.getFullYear() === 2026 && idx === chtJetzt.getMonth();
    const agents = state.agents.filter(a=>a.team===teamId && a.name && a.name.trim() && a.category !== 'schulung' && a.category !== 'work');
    const vals = [];
    agents.forEach(a=>{
      let cht = 0;
      if(istAktuell && a.cht > 0) cht = a.cht;
      if(!cht){
        const vm = agentVerlaufMonat(a, 2026, monat);
        if(vm && vm.cht > 0) cht = vm.cht;
      }
      if(!cht && a.pylon){
        const hs = CHT_VERLAUF_DATA[String(parseInt(a.pylon))];
        if(hs && hs[monat] > 0) cht = hs[monat];
      }
      if(cht > 0) vals.push(cht);
    });
    return vals.length ? Math.round(vals.reduce((s,v)=>s+v,0)/vals.length) : 0;
  });
  mkBox('CHT — Monatsverlauf (Ø pro Team)', ()=>[
    { label:'MF', color:'#E20074', labels:chtMonate, values:chtTeamAvg('Trikala01') },
    { label:'FN', color:'#0E7C7B', labels:chtMonate, values:chtTeamAvg('Trikala06') }
  ], false);

  container.appendChild(chartsWrap);

  const renderTeamMA = (teamKey, label) => {
    const data = state.monatsabschluss[teamKey];
    const section = document.createElement('div');
    section.className = 'ma-section';
    section.innerHTML = `<div class="ma-title">${label}</div>`;

    // Monats-Tabs
    const tabsDiv = document.createElement('div');
    tabsDiv.className = 'ma-month-tabs';
    MONATE.forEach(m => {
      if(!data[m]) return;
      const btn = document.createElement('button');
      btn.className = 'ma-month-btn' + (maSelectedMonth[teamKey] === m ? ' active' : '');
      btn.textContent = m;
      btn.addEventListener('click', ()=>{
        setMaSelectedMonth(teamKey, m);
        renderMonatsabschluss();
      });
      tabsDiv.appendChild(btn);
    });
    section.appendChild(tabsDiv);

    const monat = maSelectedMonth[teamKey];
    const md = data[monat];
    if(!md){ container.appendChild(section); return; }

    // Reihenfolge wie in Team Ziele: MF Team: MF NG, BB, SU, HV(BOJ), VVM Gesamt(VVM), TV, MF
    //                                  FN Team: NG(BB), SU, BOJ, VVM, TV, MF
    const PROD_ORDER = teamKey === 'mf'
      ? ['MF NG', 'BB', 'SU', 'BOJ', 'VVM', 'TV', 'MF']
      : ['NG (BB)', 'SU', 'BOJ', 'VVM', 'TV', 'MF'];
    const EXCLUDE = ['NA'];
    // Anzeige-Labels pro Schlüssel (team-spezifisch): BOJ → HV, VVM → VVM Gesamt für mf-Team
    const PROD_LABELS = teamKey === 'mf'
      ? { 'BOJ': 'HV', 'VVM': 'Avia', 'MF NG': 'MF NG' }
      : {};
    const prodLabel = p => PROD_LABELS[p] || p;
    const allProds = Object.keys(md.plan).filter(p => !EXCLUDE.includes(p));
    // Reihenfolge: zuerst aus md._prodOrder (user-definiert), dann Rest nach PROD_ORDER
    if(!md._prodOrder) md._prodOrder = [];
    // Ungültige Einträge entfernen (gelöschte Produkte)
    md._prodOrder = md._prodOrder.filter(p => allProds.includes(p));
    // Neue Produkte ans Ende anhängen (nicht in _prodOrder aber in allProds)
    allProds.forEach(p => { if(!md._prodOrder.includes(p)) md._prodOrder.push(p); });
    const produkte = [...md._prodOrder];

    // === PRODUKTE VERWALTEN ===
    const prodMgmtWrap = document.createElement('div');
    prodMgmtWrap.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;';

    let prodEditMode = false;
    const prodEditBtn = document.createElement('button');
    prodEditBtn.style.cssText = 'font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--muted);';
    prodEditBtn.textContent = '✏️ Produkte bearbeiten';

    const prodEditRow = document.createElement('div');
    prodEditRow.style.cssText = 'display:none;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;background:var(--card);border-radius:10px;border:1px solid var(--border);width:100%;';

    let dragSrcKey = null;
    const rebuildProdEditRow = () => {
      prodEditRow.innerHTML = '';
      // Reihenfolge aus md._prodOrder (bereits synchronisiert mit allProds)
      const orderedKeys = [...md._prodOrder];
      orderedKeys.forEach(p => {
        const chip = document.createElement('div');
        chip.dataset.key = p;
        chip.draggable = true;
        chip.style.cssText = 'display:inline-flex;align-items:center;gap:4px;background:#F0F0F8;border-radius:8px;padding:3px 6px 3px 8px;border:1px solid #DDD;cursor:grab;user-select:none;';

        // Drag-Handle
        const handle = document.createElement('span');
        handle.textContent = '⠿';
        handle.style.cssText = 'font-size:13px;color:#AAA;cursor:grab;margin-right:2px;';
        handle.title = 'Ziehen zum Verschieben';

        chip.addEventListener('dragstart', e => {
          dragSrcKey = p;
          chip.style.opacity = '0.4';
          e.dataTransfer.effectAllowed = 'move';
        });
        chip.addEventListener('dragend', () => {
          chip.style.opacity = '1';
          prodEditRow.querySelectorAll('[data-key]').forEach(c => c.style.outline = '');
        });
        chip.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if(p !== dragSrcKey) chip.style.outline = '2px solid #9B59B6';
        });
        chip.addEventListener('dragleave', () => { chip.style.outline = ''; });
        chip.addEventListener('drop', e => {
          e.preventDefault();
          chip.style.outline = '';
          if(!dragSrcKey || dragSrcKey === p) return;
          // Reihenfolge in md._prodOrder tauschen
          const fromIdx = md._prodOrder.indexOf(dragSrcKey);
          const toIdx = md._prodOrder.indexOf(p);
          if(fromIdx < 0 || toIdx < 0) return;
          md._prodOrder.splice(fromIdx, 1);
          md._prodOrder.splice(toIdx, 0, dragSrcKey);
          dragSrcKey = null;
          scheduleSave(); renderMonatsabschluss();
        });

        const nameInp = document.createElement('input');
        nameInp.type = 'text';
        nameInp.value = p; // echten Key anzeigen
        nameInp.style.cssText = 'border:none;outline:none;background:transparent;font-size:12px;font-weight:600;width:' + Math.max(30, nameInp.value.length * 8) + 'px;cursor:text;';
        nameInp.addEventListener('mousedown', e => e.stopPropagation()); // kein drag beim Tippen
        nameInp.addEventListener('input', ()=>{ nameInp.style.width = Math.max(30, nameInp.value.length * 8) + 'px'; });
        nameInp.addEventListener('change', ()=>{
          const newName = nameInp.value.trim();
          if(!newName || newName === p) return;
          // Alle Datenfelder umbenennen
          ['plan','erreicht','cr','crZiel','storno'].forEach(key=>{
            if(md[key] && p in md[key]){ md[key][newName] = md[key][p]; delete md[key][p]; }
          });
          // _prodOrder aktualisieren
          const idx = md._prodOrder.indexOf(p);
          if(idx >= 0) md._prodOrder[idx] = newName;
          scheduleSave(); renderMonatsabschluss();
        });

        const delBtn = document.createElement('button');
        delBtn.textContent = '×';
        delBtn.style.cssText = 'border:none;background:none;cursor:pointer;color:#B00;font-size:14px;line-height:1;padding:0 2px;';
        delBtn.title = 'Produkt löschen';
        delBtn.addEventListener('click', ()=>{
          if(!confirm(`Produkt "${p}" wirklich aus diesem Monat löschen?`)) return;
          ['plan','erreicht','cr','crZiel','storno'].forEach(key=>{ if(md[key]) delete md[key][p]; });
          md._prodOrder = md._prodOrder.filter(k => k !== p);
          scheduleSave(); renderMonatsabschluss();
        });

        chip.appendChild(handle); chip.appendChild(nameInp); chip.appendChild(delBtn);
        prodEditRow.appendChild(chip);
      });
      // "+ Neu" Button
      const addBtn = document.createElement('button');
      addBtn.textContent = '+ Produkt';
      addBtn.style.cssText = 'font-size:12px;padding:4px 10px;border-radius:20px;border:1px dashed #9B59B6;background:transparent;color:var(--muted);cursor:pointer;';
      addBtn.addEventListener('click', ()=>{
        const name = prompt('Name des neuen Produkts:');
        if(!name || !name.trim()) return;
        const key = name.trim();
        if(md.plan[key] !== undefined){ alert('Produkt existiert bereits.'); return; }
        ['plan','erreicht','cr','crZiel','storno'].forEach(k=>{ if(!md[k]) md[k]={}; md[k][key]=0; });
        if(!md._prodOrder) md._prodOrder = [];
        md._prodOrder.push(key);
        scheduleSave(); renderMonatsabschluss();
      });
      prodEditRow.appendChild(addBtn);
    };

    prodEditBtn.addEventListener('click', ()=>{
      prodEditMode = !prodEditMode;
      if(prodEditMode){
        rebuildProdEditRow();
        prodEditRow.style.display = 'flex';
        prodEditBtn.style.background = '#E8EAFF';
        prodEditBtn.style.color = '#3B4FC8';
        prodEditBtn.textContent = '✓ Fertig';
      } else {
        prodEditRow.style.display = 'none';
        prodEditBtn.style.background = 'var(--card)';
        prodEditBtn.style.color = 'var(--muted)';
        prodEditBtn.textContent = '✏️ Produkte bearbeiten';
      }
    });

    prodMgmtWrap.appendChild(prodEditBtn);
    prodMgmtWrap.appendChild(prodEditRow);

    const t = document.createElement('table');
    t.className = 'ma-table';

    // Header
    t.innerHTML = `<tr><th>${monat}</th>${produkte.map(p=>`<th>${prodLabel(p)}</th>`).join('')}</tr>`;

    const mkEditRow = (label, dataKey, rowClass) => {
      const row = document.createElement('tr');
      if(rowClass) row.className = rowClass;
      const labelTd = document.createElement('td'); labelTd.textContent = label;
      row.appendChild(labelTd);
      produkte.forEach(p => {
        const td = document.createElement('td');
        const val = md[dataKey][p] !== undefined ? md[dataKey][p] : 0;
        const isErreicht = dataKey === 'erreicht';
        const isPlan = dataKey === 'plan';
        const isZiel = dataKey === 'ziel';
        // Grün wenn Erreicht >= Planenmenge
        if(isErreicht){
          const plan = md.plan[p]||0;
          if(val >= plan && val > 0) td.style.background = '#E6F7F4';
        }
        const inp = document.createElement('input');
        inp.className = 'ma-input';
        inp.type = 'text';
        inp.inputMode = 'decimal';
        inp.value = val;
        inp.addEventListener('focus', e=>e.target.select());
        inp.addEventListener('change', e=>{
          md[dataKey][p] = parseFloat(e.target.value)||0;
          scheduleSave();
          renderMonatsabschluss();
        });
        td.appendChild(inp);
        row.appendChild(td);
      });
      return row;
    };

    const mkReadRow = (label, dataKey, suffix, cls, colorFn) => {
      const row = document.createElement('tr');
      if(cls) row.className = cls;
      row.innerHTML = `<td>${label}</td>${produkte.map(p=>{
        const val = md[dataKey] ? (md[dataKey][p]||0) : 0;
        const badgeCls = colorFn ? colorFn(p, val) : 'neutral';
        return `<td><span class="ma-badge ${badgeCls}">${typeof val === 'number' ? val.toFixed(val < 10 ? 4 : 0) : val}${suffix}</span></td>`;
      }).join('')}`;
      return row;
    };

    // Planenmenge (editierbar)
    t.appendChild(mkEditRow('Planenmenge', 'plan', 'ma-row-plan'));

    // Erreicht (editierbar, grün wenn >= Planenmenge)
    const errRow = document.createElement('tr'); errRow.className = 'ma-row-erreicht';
    const errLabelTd = document.createElement('td'); errLabelTd.textContent = 'Erreicht';
    errRow.appendChild(errLabelTd);
    produkte.forEach(p => {
      const td = document.createElement('td');
      const val = md.erreicht[p] || 0;
      const plan = md.plan[p] || 0;
      if(val > 0 && val >= plan){
        td.style.cssText = 'background:var(--good-soft);color:var(--good);'; // grün
      } else if(val > 0 && val < plan){
        td.style.cssText = 'background:#FEF0EF;'; // hellrot
      }
      const inp = document.createElement('input');
      inp.className = 'ma-input'; inp.type='text'; inp.inputMode='decimal';
      inp.value = val;
      inp.style.color = (val > 0 && val < plan) ? '#B4423A' : (val >= plan && val > 0) ? '#0A7C70' : 'inherit';
      inp.addEventListener('focus', e=>e.target.select());
      inp.addEventListener('change', e=>{
        md.erreicht[p] = parseFloat(e.target.value)||0;
        scheduleSave(); renderMonatsabschluss();
      });
      td.appendChild(inp);
      errRow.appendChild(td);
    });
    t.appendChild(errRow);

    // CR% (editierbar, grün wenn >= CR Ziel)
    if(!md.crZiel) md.crZiel = {};
    if(!md.storno) md.storno = {};

    const mkPctRow = (label, dataKey, compareKey, rowCls) => {
      const row = document.createElement('tr');
      if(rowCls) row.className = rowCls;
      const lTd = document.createElement('td'); lTd.textContent = label;
      row.appendChild(lTd);
      produkte.forEach(p => {
        const td = document.createElement('td');
        const val = md[dataKey][p] || 0;
        if(dataKey === 'cr'){
          // Priorität: manuell eingetragenes CR-Ziel (md.crZiel[p]) hat Vorrang vor Teamziel-Stufen
          const manualCrZiel = md.crZiel && md.crZiel[p] ? parseFloat(md.crZiel[p]) : 0;
          if(manualCrZiel > 0){
            // Manuelles CR-Ziel vorhanden → einfacher Vergleich: grün wenn erreicht, lila wenn nicht
            if(val > 0 && val >= manualCrZiel){
              td.style.cssText = 'background:var(--st2-bg);color:var(--st2-fg);';
            } else if(val > 0){
              td.style.cssText = 'background:var(--st0-bg);color:var(--st0-fg);';
            }
          } else {
            // Kein manuelles Ziel → Teamziel-Stufen als Fallback
            const tzProduct = MA_TO_TZ_PRODUCT[teamKey] && MA_TO_TZ_PRODUCT[teamKey][p];
            const tz = state.teamziele[teamKey];
            if(tzProduct && tz){
              td.style.cssText = crStuffeProd(tzProduct, val, tz);
            } else if(val > 0){
              td.style.cssText = 'background:var(--st0-bg);color:var(--st0-fg);';
            }
          }
        } else if(compareKey){
          const cmp = md[compareKey][p] || 0;
          if(val >= cmp && val > 0) td.style.cssText = 'background:var(--good-soft);color:var(--good);';
        }
        const inp = document.createElement('input');
        inp.className = 'ma-input'; inp.type='text'; inp.inputMode='decimal';
        inp.value = parseFloat(val).toFixed(2) + '%';
        inp.addEventListener('focus', e=>e.target.select());
        inp.addEventListener('change', e=>{
          md[dataKey][p] = parseFloat(e.target.value.replace('%','').replace(',','.'))||0;
          scheduleSave(); renderMonatsabschluss();
        });
        td.appendChild(inp);
        row.appendChild(td);
      });
      return row;
    };

    t.appendChild(mkPctRow('CR%', 'cr', 'crZiel', 'ma-row-cr'));
    // CR Ziel als freies Textfeld (z.B. "3%-4.5%-5%")
    if(!md.crZielText) md.crZielText = {};
    const crZielRow = document.createElement('tr');
    const crZielLabelTd = document.createElement('td'); crZielLabelTd.textContent = 'CR Ziel';
    crZielRow.className = 'ma-row-crziel'; crZielRow.appendChild(crZielLabelTd);
    produkte.forEach(p => {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.className = 'ma-input';
      inp.type = 'text';
      inp.style.width = '100%';
      inp.style.minWidth = '80px';
      inp.placeholder = 'z.B. 3%-4.5%';
      inp.value = md.crZielText[p] || '';
      inp.addEventListener('focus', e=>e.target.select());
      inp.addEventListener('change', e=>{
        md.crZielText[p] = e.target.value;
        // Auch numerisch speichern für Grün-Vergleich (erste Zahl nehmen)
        const firstNum = parseFloat(e.target.value.replace(',','.'));
        md.crZiel[p] = isNaN(firstNum) ? 0 : firstNum;
        scheduleSave(); renderMonatsabschluss();
      });
      td.appendChild(inp);
      crZielRow.appendChild(td);
    });
    t.appendChild(crZielRow);
    t.appendChild(mkPctRow('Storno', 'storno', null, 'ma-row-storno'));

    // NPS Kasten (rechts neben der Tabelle, wie Gesamt CR im Team Ziele)
    const npsBox = document.createElement('div');
    npsBox.style.cssText = 'display:flex;flex-direction:column;gap:12px;min-width:150px;';

    const mkNpsBox = (cls, labelTxt, val, onChange) => {
      const box = document.createElement('div');
      box.style.cssText = `border-radius:16px;padding:14px 18px;text-align:center;border:1px solid var(--border);`;
      if(cls === 'ziel') box.style.background = 'var(--kpi-bg)';
      else if(val >= md.nps_plan && val > 0) box.style.background = 'var(--good-soft)';
      else box.style.background = 'var(--warn-soft)';
      const lbl = document.createElement('div');
      lbl.style.cssText = 'font-family:"Inter",sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;opacity:.75;';
      lbl.textContent = labelTxt;
      const valDiv = document.createElement('div');
      valDiv.style.cssText = 'font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:700;';
      const inp = document.createElement('input');
      inp.type = 'text'; inp.inputMode = 'decimal';
      inp.style.cssText = 'background:transparent;border:none;outline:none;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:700;width:100%;text-align:center;color:inherit;';
      inp.value = parseFloat(val||0).toFixed(1) + '%';
      inp.addEventListener('focus', e=>e.target.select());
      inp.addEventListener('change', e=>{ onChange(parseFloat(e.target.value.replace('%','').replace(',','.'))||0); scheduleSave(); renderMonatsabschluss(); });
      valDiv.appendChild(inp);
      box.appendChild(lbl); box.appendChild(valDiv);
      return box;
    };

    // CR Gesamt Ziel und Erreicht (über NPS)
    if(!md.crGesamtZiel) md.crGesamtZiel = 0;
    if(!md.crGesamtErreicht) md.crGesamtErreicht = 0;

    const mkCrGesamtBox = (cls, labelTxt, val, onChange, compareVal) => {
      const box = document.createElement('div');
      box.style.cssText = `border-radius:16px;padding:14px 18px;text-align:center;border:1px solid var(--border);`;
      if(cls === 'ziel') box.style.background = 'var(--kpi-bg)';
      else if(compareVal !== undefined && val >= compareVal && val > 0)
        box.style.background = 'var(--good-soft)';
      else
        box.style.background = 'var(--warn-soft)';

      const lbl = document.createElement('div');
      lbl.style.cssText = 'font-family:"Inter",sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;opacity:.75;';
      lbl.textContent = labelTxt;

      const valDiv = document.createElement('div');
      valDiv.style.cssText = 'display:flex;align-items:center;justify-content:center;';

      // Input immer erstellen
      const inp = document.createElement('input');
      inp.type = 'text'; inp.inputMode = 'decimal';
      inp.style.cssText = 'background:transparent;border:none;outline:none;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:700;width:100%;text-align:center;color:inherit;';
      inp.value = parseFloat(val||0).toFixed(2) + '%';
      inp.addEventListener('focus', e=>e.target.select());
      inp.addEventListener('change', e=>{ onChange(parseFloat(e.target.value.replace(',','.').replace('%',''))||0); scheduleSave(); renderMonatsabschluss(); });

      const isReached = compareVal !== undefined && val >= compareVal && val > 0;
      if(isReached && cls !== 'ziel'){
        // Grüner Kreis
        const circle = document.createElement('div');
        circle.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--good);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:700;cursor:pointer;';
        circle.textContent = parseFloat(val||0).toFixed(2) + '%';
        circle.addEventListener('click', ()=>{ valDiv.innerHTML=''; valDiv.appendChild(inp); inp.focus(); inp.select(); });
        valDiv.appendChild(circle);
      } else {
        valDiv.appendChild(inp);
      }

      box.appendChild(lbl); box.appendChild(valDiv);
      return box;
    };

    // NPS Box links
    const npsLeftBox = document.createElement('div');
    npsLeftBox.className = 'ma-side-box';
    npsLeftBox.appendChild(mkNpsBox('ziel', 'NPS Ziel', md.nps_plan, v=>{ md.nps_plan=v; }));
    npsLeftBox.appendChild(mkNpsBox('ist', 'NPS Erreicht', md.nps_ist, v=>{ md.nps_ist=v; }));

    // CR Box rechts
    const crRightBox = document.createElement('div');
    crRightBox.className = 'ma-side-box';
    // CR Gesamt automatisch berechnen aus Produkt-CRs - HV (intern: BOJ) wird bei beiden Teams
    // ausgeschlossen, da HV/BOJ eine eigene Produktkategorie ist und nicht in die Gesamt-CR fließt.
    const EXCL_CR = ['BOJ'];
    const crGesamtCalc = Object.entries(md.cr||{})
      .filter(([k])=>!EXCL_CR.includes(k))
      .reduce((s,[,v])=>s+(parseFloat(v)||0), 0);
    // Gerundeter Wert (2 Dezimalstellen)
    const crGesamtDisplay = Math.round(crGesamtCalc * 100) / 100;

    crRightBox.appendChild(mkCrGesamtBox('ziel', 'CR Gesamt Ziel', md.crGesamtZiel, v=>{ md.crGesamtZiel=v; }, undefined));

    // CR Gesamt Erreicht: berechnet, nicht editierbar
    const crErrBox = document.createElement('div');
    crErrBox.style.cssText = `border-radius:16px;padding:14px 18px;text-align:center;border:1px solid var(--border);`;
    const isGreen = md.crGesamtZiel > 0 && crGesamtDisplay >= md.crGesamtZiel;
    crErrBox.style.background = isGreen
      ? 'var(--good-soft)'
      : 'var(--warn-soft)';
    const crErrLbl = document.createElement('div');
    crErrLbl.style.cssText = 'font-family:"Inter",sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;opacity:.75;';
    crErrLbl.textContent = 'CR Gesamt Erreicht';
    const crErrVal = document.createElement('div');
    crErrVal.style.cssText = 'font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:700;text-align:center;';
    if(isGreen){
      const circle = document.createElement('div');
      circle.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--good);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:700;';
      circle.textContent = crGesamtDisplay.toFixed(2) + '%';
      crErrVal.appendChild(circle);
    } else {
      crErrVal.textContent = crGesamtDisplay.toFixed(2) + '%';
    }
    crErrBox.appendChild(crErrLbl); crErrBox.appendChild(crErrVal);
    crRightBox.appendChild(crErrBox);

    // Layout: NPS links | Tabelle mitte | CR rechts
    const maLayout = document.createElement('div');
    maLayout.className = 'ma-layout';
    const tableWrapMA = document.createElement('div');
    tableWrapMA.className = 'ma-table-wrap';
    tableWrapMA.appendChild(prodMgmtWrap);
    tableWrapMA.appendChild(t);

    // CHT & Calls Luftbalsen (unter der NPS-Seite)
    const mkSimpleBox = (labelTxt, val, onChange, colorFn) => {
      const box = document.createElement('div');
      box.style.cssText = 'border-radius:16px;padding:10px 8px;text-align:center;border:1px solid var(--border);';
      box.style.background = colorFn ? colorFn(val) : 'var(--kpi-bg)';
      const lbl = document.createElement('div');
      lbl.style.cssText = 'font-family:"Inter",sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;opacity:.75;';
      lbl.textContent = labelTxt;
      const valDiv = document.createElement('div');
      valDiv.style.cssText = 'font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:700;';
      const inp = document.createElement('input');
      inp.type = 'text'; inp.inputMode = 'decimal';
      inp.style.cssText = 'background:transparent;border:none;outline:none;font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:700;width:100%;text-align:center;color:inherit;';
      inp.value = Math.round(val||0);
      inp.addEventListener('focus', e=>e.target.select());
      inp.addEventListener('change', e=>{
        const v = parseFloat(e.target.value.replace(',','.'))||0;
        onChange(v);
        scheduleSave();
        renderMonatsabschluss();
      });
      valDiv.appendChild(inp);
      box.appendChild(lbl); box.appendChild(valDiv);
      return box;
    };

    const chtCalls = document.createElement('div');

function renderTeamZiele(){
  const container = document.getElementById('teamziele-container');
  container.innerHTML = '';

  // Monat immer auf den echten aktuellen Kalendermonat abgleichen (statt eines evtl. veralteten gespeicherten Werts)
  const aktuellerMonatLabel = new Date().toLocaleString('de-DE', {month:'long'});
  let monatKorrigiert = false;
  Object.values(state.teamziele).forEach(tzObj=>{
    if(tzObj && tzObj.monat !== aktuellerMonatLabel){
      tzObj.monat = aktuellerMonatLabel;
      monatKorrigiert = true;
    }
  });
  if(monatKorrigiert) scheduleSave();

  function mkInput(val, onChange){
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'decimal';
    inp.value = val;
    inp.style.cssText = 'width:100%;background:transparent;border:none;outline:none;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700;text-align:center;color:inherit;';
    inp.addEventListener('focus', e=>e.target.select());
    inp.addEventListener('change', e=>{ onChange(parseFloat(e.target.value.replace(',','.'))||0); scheduleSave(); renderTeamZiele(); });
    return inp;
  }
  function cell(content, cls, colspan, rowspan){
    const td = document.createElement('td');
    if(cls) td.className = cls;
    if(colspan) td.colSpan = colspan;
    if(rowspan) td.rowSpan = rowspan;
    if(typeof content === 'string' || typeof content === 'number') td.textContent = content;
    else if(content && content.nodeType) td.appendChild(content);
    return td;
  }

  function crStuffeStyle(val, tz){
    const v = parseFloat(val)||0;
    // Stufe 3 (höchste) - nur MF
    if(tz.crZiel3 && v >= parseFloat(Object.values(tz.crZiel3)[0]||0)) return 'background:var(--st3-bg);color:var(--st3-fg);';
    // Stufe 2
    if(tz.crZiel2 && v >= parseFloat(Object.values(tz.crZiel2)[0]||0)) return 'background:var(--st2-bg);color:var(--st2-fg);';
    // Stufe 1
    if(tz.crZiel1 && v >= parseFloat(Object.values(tz.crZiel1)[0]||0)) return 'background:var(--st1-bg);color:var(--st1-fg);';
    // Unter Stufe 1
    return 'background:var(--st0-bg);color:var(--st0-fg);';
  }

  function crStuffeProd(p, val, tz){
    const v = parseFloat(val)||0;
    const s1 = parseFloat(tz.crZiel1[p]||0);
    const s2 = parseFloat(tz.crZiel2[p]||0);
    // Stufe 3 nur für MF-Produkt
    const s3 = (p === 'MF' && tz.crZiel3) ? parseFloat(tz.crZiel3[p]||0) : null;
    if(s3 !== null && v >= s3) return 'background:var(--st3-bg);color:var(--st3-fg);';
    if(v >= s2) return 'background:var(--st2-bg);color:var(--st2-fg);';
    if(v >= s1) return 'background:var(--st1-bg);color:var(--st1-fg);';
    return 'background:var(--st0-bg);color:var(--st0-fg);';
  }

  function addRow(t, rowCls, labelTxt, leftCells, prodCells){
    const tr = document.createElement('tr');
    tr.className = rowCls;
    tr.appendChild(cell(labelTxt, 'tz-label'));
    leftCells.forEach(c => tr.appendChild(c));
    prodCells.forEach(c => tr.appendChild(c));
    t.appendChild(tr);
    return tr;
  }

  const heute = new Date().toLocaleDateString('de-DE');

  const renderTeam = (key, label, cols, colLabels) => {
    const tz = state.teamziele[key];
    const section = document.createElement('div');
    section.className = 'tz-section';
    section.innerHTML = `<div class="tz-title">${label}</div>`;
    // Layout: Tabelle links, CR-Sidebar rechts
    const teamLayout = document.createElement('div');
    teamLayout.className = 'tz-team-layout';
    const tableWrap = document.createElement('div');
    tableWrap.className = 'tz-table-wrap';
    const sidebar = document.createElement('div');
    sidebar.className = 'cr-sidebar';

    const mkCrSideBox = (cls, labelTxt, val, onChange, isCalc) => {
      const box = document.createElement('div');
      box.className = 'cr-box ' + cls;
      const lbl = document.createElement('div'); lbl.className = 'cr-box-label'; lbl.textContent = labelTxt;
      const valDiv = document.createElement('div'); valDiv.className = 'cr-box-val';
      if(isCalc){
        valDiv.textContent = parseFloat(val||0).toFixed(2) + '%';
      } else {
        const inp = document.createElement('input');
        inp.type = 'text'; inp.inputMode = 'decimal';
        inp.value = parseFloat(val||0).toFixed(2) + '%';
        inp.addEventListener('focus', e=>e.target.select());
        inp.addEventListener('change', e=>{ onChange(parseFloat(e.target.value.replace(',','.').replace('%',''))||0); scheduleSave(); renderTeamZiele(); });
        valDiv.appendChild(inp);
      }
      box.appendChild(lbl); box.appendChild(valDiv);
      return box;
    };

    sidebar.appendChild(mkCrSideBox('gestern', 'CR Gestern', tz.crGestern||0, v=>{ tz.crGestern=v; }, false));
    const crAktSide = tz.crAktuell || {};
    // BOJ (= HV) und DA werden aus der CR-Gesamt-Berechnung ausgeschlossen
    const crMonatSide = cols.filter(p=>p!=='BOJ'&&p!=='DA').reduce((s,p)=>s+(parseFloat(crAktSide[p]||0)),0);
    sidebar.appendChild(mkCrSideBox('monat', 'CR Monat', crMonatSide, null, true));
    sidebar.appendChild(mkCrSideBox('ziel', 'CR Ziel', tz.crZiel||0, v=>{ tz.crZiel=v; }, false));

    // DA-Kachel wird in der Tabelle eingebaut (rowspan=2 in Soll/Ist-Zeile)

    const t = document.createElement('table');
    t.className = 'tz-table';
    t.style.cssText = 'width:100%;border-collapse:collapse;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.07);';

    // === HEADER ===
    const hRow = document.createElement('tr');
    hRow.className = 'tz-row-header';
    hRow.appendChild(cell(heute, 'tz-label'));
    hRow.appendChild(cell('Monat'));
    hRow.appendChild(cell(tz.monat));

    cols.forEach(p => hRow.appendChild(cell(colLabels[p]||p)));
    t.appendChild(hRow);

    // === SOLL NETTO ===
    const sollRow = document.createElement('tr'); sollRow.className = 'tz-row-soll';
    sollRow.appendChild(cell('Soll Netto', 'tz-label'));

    // DA-Kachel (nur MF-Team): rowspan=2 überspannt Soll+Ist-Zeile, colspan=2 die zwei leeren Spalten
    if(key === 'mf'){
      if(tz.daNettoStand === undefined) tz.daNettoStand = 0;
      if(tz.daQteAssisted === undefined) tz.daQteAssisted = 0;
      const daTd = document.createElement('td');
      daTd.rowSpan = 2; daTd.colSpan = 2;
      daTd.style.cssText = 'border:1px solid var(--border);border-radius:10px;padding:8px 10px;text-align:center;vertical-align:middle;background:var(--kpi-bg);';
      const mkDaField = (labelTxt, val, onChange) => {
        const wrap = document.createElement('div');
        wrap.style.marginBottom = '4px';
        const lbl = document.createElement('div');
        lbl.style.cssText = 'font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.07em;margin-bottom:2px;';
        lbl.textContent = labelTxt;
        const inp = document.createElement('input');
        inp.type = 'text'; inp.inputMode = 'decimal';
        inp.value = val;
        inp.style.cssText = 'width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);outline:none;font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:700;text-align:center;color:var(--muted);';
        inp.addEventListener('focus', e=>e.target.select());
        inp.addEventListener('change', e=>{ onChange(parseFloat(e.target.value.replace(',','.'))||0); scheduleSave(); renderTeamZiele(); });
        wrap.appendChild(lbl); wrap.appendChild(inp);
        return wrap;
      };
      const daTitle = document.createElement('div');
      daTitle.style.cssText = 'font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px;letter-spacing:.06em;';
      daTitle.textContent = 'DA';
      daTd.appendChild(daTitle);
      daTd.appendChild(mkDaField('NETTO STAND', tz.daNettoStand, v=>{ tz.daNettoStand=v; }));
      daTd.appendChild(mkDaField('QTE. ASSISTED', tz.daQteAssisted, v=>{ tz.daQteAssisted=v; }));
      sollRow.appendChild(daTd);
    } else {
      sollRow.appendChild(cell('')); sollRow.appendChild(cell(''));
    }

    cols.forEach(p => sollRow.appendChild(cell(mkInput(tz.soll[p]||0, v=>{ tz.soll[p]=v; }))));
    t.appendChild(sollRow);

    // === IST NETTO ===
    const istRow = document.createElement('tr'); istRow.className = 'tz-row-ist';
    istRow.appendChild(cell('Ist Netto', 'tz-label'));
    // Keine leeren Zellen hier wenn DA-Kachel via rowspan abgedeckt
    if(key !== 'mf'){
      istRow.appendChild(cell('')); istRow.appendChild(cell(''));
    }
    cols.forEach(p => {
      const td = document.createElement('td');
      const val = tz.ist[p]||0;
      const soll = tz.soll[p]||0;
      const erreicht = val > 0 && val >= soll;

      const inp = document.createElement('input');
      inp.type='text'; inp.inputMode='decimal';
      inp.style.cssText='width:52px;background:transparent;border:none;outline:none;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700;text-align:center;color:inherit;';
      inp.value = val;
      inp.addEventListener('focus', e=>e.target.select());
      inp.addEventListener('change', e=>{ tz.ist[p]=parseFloat(e.target.value)||0; scheduleSave(); renderTeamZiele(); });

      if(erreicht){
        const circle = document.createElement('div');
        circle.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--good);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700;cursor:pointer;margin:auto;';
        circle.textContent = val;
        circle.title = 'Klicken zum Bearbeiten';
        circle.addEventListener('click', ()=>{ circle.replaceWith(inp); inp.focus(); inp.select(); });

        td.appendChild(circle);
      } else {
        td.appendChild(inp);
      }
      istRow.appendChild(td);
    });
    t.appendChild(istRow);

    // === NOCH NETTO (berechnet) ===
    const nochRow = document.createElement('tr'); nochRow.className = 'tz-row-noch';
    nochRow.appendChild(cell('Noch Netto', 'tz-label'));
    nochRow.appendChild(cell('')); nochRow.appendChild(cell(''));
    cols.forEach(p => {
      const noch = (tz.soll[p]||0)-(tz.ist[p]||0);
      const td = cell(noch);
      if(noch < 0) td.style.color='#B71C1C';
      nochRow.appendChild(td);
    });
    t.appendChild(nochRow);

    // === Absätze pro Arbeitstag (berechnet, Basis: verbleibende Arbeitstage Mo-Fr, automatisch) ===
    function computeRemainingWorkdaysMoFr(){
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const lastDay = new Date(year, month+1, 0).getDate();
      let count = 0;
      for(let d = now.getDate(); d <= lastDay; d++){
        const dow = new Date(year, month, d).getDay(); // 0=So, 6=Sa
        if(dow !== 0 && dow !== 6) count++;
      }
      return count || 1;
    }
    const verbleibendeAT = computeRemainingWorkdaysMoFr();
    const proTagRow = document.createElement('tr'); proTagRow.className = 'tz-row-protag';
    proTagRow.appendChild(cell(`Absätze/Tag (${verbleibendeAT} verb. AT, Mo–Fr)`, 'tz-label'));
    proTagRow.appendChild(cell('')); proTagRow.appendChild(cell(''));
    cols.forEach(p => {
      const soll = tz.soll[p]||0;
      const ist = tz.ist[p]||0;
      const noch = soll - ist;
      const proTag = noch / verbleibendeAT;
      const erfuellung = soll > 0 ? (ist / soll) * 100 : 0;
      const td = cell(`${proTag.toFixed(2)} (${erfuellung.toFixed(0)}%)`);
      if(noch < 0) td.style.color='#B71C1C';
      else if(noch === 0) td.style.color = 'var(--muted)';

    const stufenMF = [
      {cls:'tz-row-cr',      label:'CR',           dataKey:'crAktuell'},
      {cls:'tz-row-crziel1', label:'CR Ziel St.1', dataKey:'crZiel1'},
      {cls:'tz-row-crziel2', label:'CR Ziel St.2', dataKey:'crZiel2'},
      {cls:'tz-row-crziel3', label:'CR Ziel St.3', dataKey:'crZiel3'},
    ];
    const stufenFN = [
      {cls:'tz-row-cr',      label:'CR',           dataKey:'crAktuell'},
      {cls:'tz-row-crziel1', label:'CR Ziel St.1', dataKey:'crZiel1'},
      {cls:'tz-row-crziel2', label:'CR Ziel St.2', dataKey:'crZiel2'},
    ];
    const stufen = key==='mf' ? stufenMF : stufenFN;

    // Sicherstellen dass crAktuell im State vorhanden ist
    if(!tz.crAktuell){
      tz.crAktuell = {};
      cols.forEach(p => tz.crAktuell[p] = 0);
    }

    stufen.forEach(({cls, label:lbl, dataKey}) => {
      const r = document.createElement('tr'); r.className = cls;
      r.appendChild(cell(lbl, 'tz-label'));
      r.appendChild(cell('')); r.appendChild(cell(''));

      cols.forEach(p => {
        const val = (tz[dataKey] && tz[dataKey][p] !== undefined) ? parseFloat(tz[dataKey][p]) : 0;
        const isCR = dataKey === 'crAktuell';
        const isSt3 = dataKey === 'crZiel3';

        // Stufe 3 nur für MF-Produkt anzeigen (leere Zelle für andere)
        if(isSt3 && p !== 'MF'){
          r.appendChild(cell('—'));
          return;
        }

        const td = document.createElement('td');
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.inputMode = 'decimal';
        inp.value = val.toFixed(2) + '%';
        inp.style.cssText = 'width:100%;background:transparent;border:none;outline:none;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700;text-align:center;color:inherit;';
        inp.addEventListener('focus', e => e.target.select());
        inp.addEventListener('change', e => {
          const v = parseFloat(e.target.value.replace(',','.').replace('%',''))||0;
          if(!tz[dataKey]) tz[dataKey] = {};
          tz[dataKey][p] = v;
          scheduleSave();
          renderTeamZiele();
        });
        td.appendChild(inp);

        // Farbe basierend auf erreichter Stufe (nur für CR-Zeile)
        if(isCR){
          td.style.cssText = crStuffeProd(p, val, tz);
          inp.style.color = 'inherit';
        }
        r.appendChild(td);
      });
      t.appendChild(r);
    });

    // === STORNO ===
    if(!tz.stornoHistory) tz.stornoHistory = {};
    const stRow = document.createElement('tr'); stRow.className = 'tz-row-storno';
    stRow.appendChild(cell('Storno', 'tz-label'));
    stRow.appendChild(cell('')); stRow.appendChild(cell(''));
    cols.forEach(p => stRow.appendChild(cell(mkInput((parseFloat(tz.storno[p]||0)).toFixed(2)+'%', v=>{
      const neu = parseFloat(v)||0;
      const alt = parseFloat(tz.storno[p]||0);
      // Den Stand VOR der ersten Änderung des Tages im Verlauf ablegen (das ist der echte "Vortages-Wert").
      // Wird am selben Tag nochmal korrigiert, bleibt dieser Ausgangswert unangetastet -
      // nur der zuletzt eingegebene Wert selbst (tz.storno[p]) zählt als "heutiger Stand".
      if(alt !== neu){
        if(!tz.stornoHistory[p]) tz.stornoHistory[p] = [];
        const heute = new Date().toLocaleDateString('de-DE');
        const letzter = tz.stornoHistory[p][tz.stornoHistory[p].length-1];
        if(!letzter || letzter.datum !== heute){
          tz.stornoHistory[p].push({ datum: heute, wert: alt });
        }
        // war schon ein Eintrag für heute da: nichts tun, der ursprüngliche Vortages-Wert bleibt korrekt erhalten
      }
      tz.storno[p]=neu;
    }))));
    t.appendChild(stRow);

    // === Storno-Verlauf: kompakte Delta-Anzeige je Produkt (statt Diagramm - bei nur kleinen
    // Tagesunterschieden war ein Liniendiagramm auf gemeinsamer Skala kaum ablesbar) ===
    const hasHistory = Object.values(tz.stornoHistory).some(arr=>arr && arr.length>0);
    if(hasHistory){
      const stChartWrap = document.createElement('div');
      stChartWrap.className = 'cp-chart-card';
      stChartWrap.style.marginTop = '4px';
      stChartWrap.innerHTML = `<div class="cp-chart-title" style="font-size:12px;">📈 Storno-Verlauf</div>`;
      stChartWrap.appendChild(buildStornoDeltaList(tz.stornoHistory, tz.storno, cols));
      sidebar.appendChild(stChartWrap);
    }

    tableWrap.appendChild(t);
    teamLayout.appendChild(tableWrap);
    teamLayout.appendChild(sidebar);
    section.appendChild(teamLayout);
    container.appendChild(section);
  };

  renderTeam('mf', 'MF Trikala — Mobilfunk PK',
    ['BB','SU','BOJ','VVM','TV','MF'],
    {BB:'BB',SU:'SU',BOJ:'HV',VVM:'Avia',TV:'TV',MF:'MF'}
  );
  renderTeam('fn', 'FN Team — Festnetz PK',
    ['BB','SU','BOJ','VVM','TV','MF'],
    {BB:'BB',SU:'SU',BOJ:'BOJ',VVM:'VVM Gesamt',TV:'TV',MF:'MF'}
  );
}


let twMonthOffset = 0;       // 0 = laufender Monat, -1 = Vormonat (Nachträge)
let twSelectedDay = 'total'; // 'total' = Monatsstand, sonst Tag-Nummer als String ('1'..'31')

// Zusatzprodukte je Team (zusätzlich zu den Zielprodukten aus TEAM_CONFIGS), z.B. für Tageswerte und
// Mitarbeiter Ziele. MF-Team: Avia (VVM) und DA. FN-Team: keine (DA wird dort nicht erfasst).
function teamExtraProducts(team){
  return String(team) === 'Trikala01' ? ['VVM', 'DA'] : [];
}
function twMonthKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function twDaysInMonth(d){
  return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
}
// Setzt alle Tageswerte-Einträge des aktuellen Monats für alle Mitarbeiter zurück (leert alle
// Tage), damit für einen neuen Monat wieder bei null angefangen werden kann. Betrifft nur die
// Tages-Einträge selbst - Calls/NPS/LQ (die direkt im Monatsstand eingetragen werden) bleiben
// unangetastet, da sie kein Teil von agent.tageswerte sind.
function twResetMonth(){
  const monthKey = twMonthKey(new Date());
  if(!confirm(`Wirklich den kompletten Monatsstand für ${monthKey} bei allen Mitarbeitern zurücksetzen (Tageswerte, Stückzahlen, Calls, NPS, LQ, CHT)? Das kann nicht rückgängig gemacht werden.`)) return;
  state.agents.forEach(agent=>{
    if(agent.tageswerte && agent.tageswerte[monthKey]) delete agent.tageswerte[monthKey];
    // Auch die daraus berechneten/eingetragenen Monatsstand-Felder leeren, sonst blieben die
    // alten Summen stehen, obwohl die Tageswerte dahinter schon gelöscht sind.
    Object.keys(agent.sales||{}).forEach(p=>{ agent.sales[p] = null; });
    agent.calls = null;
    agent.nps = null;
    agent.lq = null;
    agent.cht = null;
  });
  twSelectedDay = 'total';
  scheduleSave();
  renderTageswerte();
}
document.getElementById('tw-reset-btn').addEventListener('click', twResetMonth);

// Helpsense-Import: überträgt CHT, Calls, NPS, LQ per Pylon-Nummer in den Monatsstand.
// Helpsense-Import: liest Performance- und Quality-Reports (xlsx/csv) direkt im Browser ein
// und überträgt CHT, Calls, NPS, LQ per Pylon-Nummer in den Monatsstand.
// Erkennt automatisch, ob es ein Performance-Report (Spalten: Pylon, CHT, Calls) oder
// Quality-Report (Spalten: user_pylon, nps, ...) ist.
function parseHelpsenseSheet(rows){
  const result = {}; // pylon → {cht, calls, nps, lq}
  if(!rows.length) return result;
  // Header suchen: erste Zeile die 'pylon' enthält
  let headerIdx = rows.findIndex(r => r.some(c => (c||'').toString().toLowerCase().includes('pylon')));
  if(headerIdx === -1) return result;
  const header = rows[headerIdx].map(h => (h||'').toString().trim().toLowerCase());
  console.log('[parseHelpsenseSheet] header:', header);
  
  // Spalten finden - bei kombinierten Dateien gibt es ZWEI Pylon-Spalten
  // (Spalte 'pylon' für Performance, 'user_pylon' für Quality)
  const toNum = v => {
    const s = String(v).trim();
    let n = parseFloat(s.includes(',') ? s.replace(/\./g,'').replace(',','.') : s);
    // Wenn der Wert > 100 ist und eine NPS/LQ-Prozentzahl sein soll, wurde das Komma
    // als Tausender-Trennzeichen fehlinterpretiert (z.B. 7778 statt 77.78) → durch 100 teilen
    return n;
  };
  const toPct = v => {
    const s = String(v).trim();
    // Zahl hat Komma → Dezimaltrennzeichen: "77,78" → 77.78
    if(s.includes(',')) return parseFloat(s.replace(/\./g,'').replace(',','.'));
    const n = parseFloat(s);
    // Wenn SheetJS die Zahl bereits als Integer geliefert hat (z.B. 7778 statt 77.78),
    // wurde das Komma als Tausender gelesen → durch 100 teilen
    if(!isNaN(n) && n > 100) return n / 100;
    return n;
  };
  const perfPylonCol  = header.findIndex(h => h === 'pylon');
  const qualPylonCol  = header.findIndex(h => h === 'user_pylon');
  const chtCol        = header.findIndex(h => h.includes('cht'));
  const callsCol      = header.findIndex(h => h.includes('call'));
  const npsCol        = header.findIndex(h => h === 'nps');
  const lqCol         = header.findIndex(h => h === 'lq') !== -1
                          ? header.findIndex(h => h === 'lq')
                          : header.findIndex(h => h === 'anliegen');

  rows.slice(headerIdx + 1).forEach(row=>{
    // Performance-Daten (Pylon, CHT, Calls)
    if(perfPylonCol !== -1 && row[perfPylonCol]){
      const pylon = parseInt(row[perfPylonCol]);
      if(!isNaN(pylon)){
        if(!result[pylon]) result[pylon] = {};
        if(chtCol   !== -1 && row[chtCol]   !== '' && row[chtCol]   !== null && row[chtCol]   !== undefined) result[pylon].cht   = toNum(row[chtCol]);
        if(callsCol !== -1 && row[callsCol] !== '' && row[callsCol] !== null && row[callsCol] !== undefined) result[pylon].calls = toNum(row[callsCol]);
        // NPS/LQ auch über perfPylonCol lesen (Datei mit nur einer Pylon-Spalte die alle Felder enthält)
        if(qualPylonCol === -1){
          if(npsCol !== -1 && row[npsCol] !== '' && row[npsCol] !== null && row[npsCol] !== undefined) result[pylon].nps = toPct(row[npsCol]);
          if(lqCol  !== -1 && row[lqCol]  !== '' && row[lqCol]  !== null && row[lqCol]  !== undefined) result[pylon].lq  = toPct(row[lqCol]);
        }
      }
    }
    // Quality-Daten (user_pylon, nps, anliegen)
    if(qualPylonCol !== -1 && row[qualPylonCol]){
      const pylon = parseInt(row[qualPylonCol]);
      if(!isNaN(pylon)){
        if(!result[pylon]) result[pylon] = {};
        if(npsCol !== -1 && row[npsCol] !== '' && row[npsCol] !== null && row[npsCol] !== undefined) result[pylon].nps = toPct(row[npsCol]);
        if(lqCol  !== -1 && row[lqCol]  !== '' && row[lqCol]  !== null && row[lqCol]  !== undefined) result[pylon].lq  = toPct(row[lqCol]);
      }
    }
    // Fallback: nur eine Pylon-Spalte (separate Dateien, nur Quality)
    if(perfPylonCol === -1 && qualPylonCol !== -1 && row[qualPylonCol]){
      const pylon = parseInt(row[qualPylonCol]);
      if(!isNaN(pylon)){
        if(!result[pylon]) result[pylon] = {};
        if(npsCol !== -1 && row[npsCol] !== '' && row[npsCol] !== null && row[npsCol] !== undefined) result[pylon].nps = toPct(row[npsCol]);
        if(lqCol  !== -1 && row[lqCol]  !== '' && row[lqCol]  !== null && row[lqCol]  !== undefined) result[pylon].lq  = toPct(row[lqCol]);
      }
    }
  });
  return result;
}

// Fragt (nur in den ersten 10 Tagen eines Monats), ob die Import-Daten zum laufenden Monat oder zum
// gerade abgeschlossenen Vormonat gehören. Liefert 0, -1 oder null (abgebrochen).
function chooseImportMonth(){
  return new Promise(resolve=>{
    const now = new Date();
    const cur = now.toLocaleString('de-DE', {month:'long', year:'numeric'});
    const prev = vormonatDate(now).toLocaleString('de-DE', {month:'long', year:'numeric'});
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:18px;padding:24px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);font-family:Inter,sans-serif;';
    box.innerHTML = `<div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin-bottom:8px;">Für welchen Monat sind die Daten?</div>
      <div style="font-size:13px;color:#64748B;margin-bottom:18px;line-height:1.5;">Anfang des Monats kommen oft noch die endgültigen Werte des Vormonats. Bitte wählen, wohin der Import geschrieben wird.</div>`;
    const mk = (label, sub, val, primary)=>{
      const b = document.createElement('button');
      b.style.cssText = `display:block;width:100%;text-align:left;margin-bottom:10px;padding:11px 14px;border-radius:10px;cursor:pointer;font-family:Inter,sans-serif;border:1px solid ${primary?'var(--tmg)':'#E0E0E0'};background:${primary?'var(--tmg-soft)':'#fff'};`;
      b.innerHTML = `<div style="font-weight:700;font-size:14px;">${label}</div><div style="font-size:12px;color:#64748B;">${sub}</div>`;
      b.addEventListener('click', ()=>{ overlay.remove(); resolve(val); });
      return b;
    };
    box.appendChild(mk(prev, 'Vormonat – endgültige Werte nachtragen', -1, true));
    box.appendChild(mk(cur, 'laufender Monat', 0, false));
    const cancel = document.createElement('button');
    cancel.textContent = 'Abbrechen';
    cancel.style.cssText = 'margin-top:4px;background:none;border:none;color:#64748B;cursor:pointer;font-size:13px;';
    cancel.addEventListener('click', ()=>{ overlay.remove(); resolve(null); });
    box.appendChild(cancel);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  });
}

async function applyHelpsenseData(mergedData){
  // Zielmonat: was oben in den Tageswerten gewählt ist. Steht dort der laufende Monat und wir sind
  // in den ersten 10 Tagen, sicherheitshalber nachfragen (endgültige Vormonatswerte kommen spät).
  let offset = twMonthOffset;
  if(offset === 0 && new Date().getDate() <= 10){
    offset = await chooseImportMonth();
    if(offset === null) return;
  }
  const isPrev = offset === -1;
  const prevDate = vormonatDate();
  let matched = 0, unmatched = [];
  state.agents.forEach(agent=>{
    if(!agent.pylon) return;
    const pylon = parseInt(agent.pylon);
    const data = mergedData[pylon];
    if(!data || Object.keys(data).length === 0){ unmatched.push(`${agent.name} (Pylon ${pylon})`); return; }
    // Vormonat → in den Mitarbeiter-Verlauf dieses Monats; laufender Monat → Monatsstand
    const target = isPrev ? verlaufMonatForEdit(agent, prevDate) : agent;
    if(data.cht   !== undefined && !isNaN(data.cht))   target.cht   = data.cht;
    if(data.calls !== undefined && !isNaN(data.calls)) target.calls = data.calls;
    if(data.nps   !== undefined && !isNaN(data.nps))   target.nps   = data.nps;
    if(data.lq    !== undefined && !isNaN(data.lq))    target.lq    = data.lq;
    if(isPrev) verlaufRecalcCr(agent, target);
    matched++;
  });
  if(isPrev && twMonthOffset !== -1){ twMonthOffset = -1; twSelectedDay = 'total'; } // Ergebnis gleich anzeigen
  scheduleSave();
  renderAll();
  const monatTxt = (isPrev ? prevDate : new Date()).toLocaleString('de-DE', {month:'long', year:'numeric'});
  const unmatchedMsg = unmatched.length ? `\n\nNicht gefunden (keine Pylon-Nr. oder nicht im Report):\n${unmatched.join(', ')}` : '';
  alert(`✅ ${matched} Mitarbeiter für ${monatTxt} importiert.${unmatchedMsg}`);
}

document.getElementById('tw-import-helpsense-input').addEventListener('change', async function(){
  const files = Array.from(this.files);
  if(!files.length) return;
  const mergedData = {};

  for(const file of files){
    const buf = await file.arrayBuffer();
    let rows = [];
    try {
      // Warten bis SheetJS wirklich bereit ist (ist global als XLSX eingebunden)
      if(typeof XLSX === 'undefined') throw new Error('SheetJS nicht geladen');
      const wb = XLSX.read(buf, {type:'array'});
      for(const sheetName of wb.SheetNames){
        const ws = wb.Sheets[sheetName];
        const sheetRows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
        console.log(`[Import] ${file.name} | Sheet: ${sheetName} | Z0:`, sheetRows[0], '| Z1:', sheetRows[1], '| Z2:', sheetRows[2]);
        if(sheetRows.length < 2) continue;
        const parsed = parseHelpsenseSheet(sheetRows);
        console.log(`[Import] ${file.name} parsed:`, parsed);
        Object.keys(parsed).forEach(p=>{
          if(!mergedData[p]) mergedData[p]={};
          Object.keys(parsed[p]).forEach(k=>{ if(parsed[p][k] !== undefined && !isNaN(parsed[p][k])) mergedData[p][k] = parsed[p][k]; });
        });
      }
    } catch(e) {
      // Fallback: Datei als Text lesen (Tab- oder Semikolon-CSV)
      try {
        const text = await file.text();
        const sep = text.includes('\t') ? '\t' : (text.includes(';') ? ';' : ',');
        const rows = text.split(/\r?\n/).map(r=>r.split(sep).map(c=>c.trim().replace(/^"+|"+$/g,'')));
        // Diagnose: zeigt die ersten 3 Zeilen in der Konsole
        console.log('Datei:', file.name, '| Trennzeichen:', sep==='	'?'TAB':sep, '| Zeilen:', rows.length);
        console.log('Zeile 0 (Header):', rows[0]);
        console.log('Zeile 1:', rows[1]);
        if(rows.length < 2 || !rows[0].some(h=>h.toLowerCase().includes('pylon'))){
          console.warn('Header enthält kein "pylon":', rows[0]);
          alert(`"${file.name}" konnte nicht gelesen werden – bitte als .csv speichern und nochmal versuchen.`);
          continue;
        }
        const parsed = parseHelpsenseSheet(rows);
        Object.keys(parsed).forEach(p=>{
          if(!mergedData[p]) mergedData[p]={};
          Object.keys(parsed[p]).forEach(k=>{ if(parsed[p][k] !== undefined && !isNaN(parsed[p][k])) mergedData[p][k] = parsed[p][k]; });
        });
      } catch(e2) {
        alert(`Fehler beim Lesen von "${file.name}". Bitte als .csv speichern und nochmal versuchen.`);
      }
    }
  }

  this.value = '';
  if(!Object.keys(mergedData).length){
    alert('Keine gültigen Daten gefunden. Bitte prüfe, ob die Spalten "Pylon", "CHT", "Calls" usw. vorhanden sind.');
    return;
  }
  applyHelpsenseData(mergedData);
});

// Summiert (Calls/Produkte) bzw. mittelt (NPS/LQ) alle Tageswerte des aktuellen Monats
// und schreibt das Ergebnis in die "echten" Live-Felder (agent.calls/sales/nps/lq),
// damit MA Stand, Team Ziele, CR-Berechnung usw. automatisch den Monatsstand nutzen.
function twRecomputeAgent(agent, cfg){
  const monthKey = twMonthKey(new Date());
  const tw = agent.tageswerte && agent.tageswerte[monthKey];
  if(!tw){ return; }
  const days = Object.keys(tw);
  if(!days.length) return;
  const extraRecompute = teamExtraProducts(Object.keys(TEAM_CONFIGS).find(k => TEAM_CONFIGS[k] === cfg));
  const produkte = [...cfg.products, ...extraRecompute];
  const salesSum = {};
  // Sobald Tageswerte existieren, ist Tageswerte die einzige Quelle für Produktverkäufe:
  // alle Produkte auf 0 zurücksetzen, dann aus den Tageswerten summieren. So werden alte,
  // manuell eingetragene Werte nicht fälschlich angezeigt.
  produkte.forEach(p=>{ salesSum[p]=0; });
  days.forEach(dKey=>{
    const dv = tw[dKey];
    if(!dv) return;
    produkte.forEach(p=>{
      const v = dv.sales ? dv.sales[p] : null;
      if(v!==null && v!==undefined) salesSum[p]+=v;
    });
  });
  produkte.forEach(p=>{ agent.sales[p] = salesSum[p]; });
  // Calls, NPS und LQ werden bewusst NICHT hier berechnet - die trägst du direkt am Monatsstand manuell ein.
}

function renderTageswerte(){

  const monthTabs = document.createElement('div');

  });
  container.appendChild(monthTabs);
  const resetBtn = document.getElementById('tw-reset-btn');
  if(resetBtn){

    resetBtn.style.opacity = isPrev ? '.4' : '';
    resetBtn.title = isPrev ? 'Im Vormonat nicht möglich' : '';
  }
  if(isPrev){
    const pv = document.createElement('div');
    pv.className = 'tw-prev-banner';
    pv.innerHTML = `<b>Du bearbeitest den abgeschlossenen Monat ${viewMonatName}.</b> Hier kannst du fehlende Tage nachtragen und im Monatsstand die endgültigen Werte (Calls, CHT, NPS, LQ) eintragen oder per „📥 Datei importieren“ übernehmen. Alles wird im Mitarbeiter-Verlauf von ${viewMonatName} gespeichert und erscheint in Hall of Fame, Mitarbeiter Verlauf und Monatsabschluss-Diagrammen. Der laufende Monat bleibt unberührt.`;
    container.appendChild(pv);
  }

  // === Tages-Reiter ===
  const dayTabs = document.createElement('div');
  dayTabs.className = 'tw-daytabs';
  const totalBtn = document.createElement('button');
  totalBtn.className = 'tw-daytab tw-daytab-total' + (twSelectedDay==='total' ? ' active' : '');
  totalBtn.textContent = '📊 Monatsstand';
  totalBtn.addEventListener('click', ()=>{ twSelectedDay='total'; renderTageswerte(); });
  dayTabs.appendChild(totalBtn);
  for(let d=1; d<=daysInMonth; d++){
    const btn = document.createElement('button');
    btn.className = 'tw-daytab' + (twSelectedDay===String(d) ? ' active' : '') + (d===todayNum ? ' tw-daytab-today' : '');
    btn.textContent = d;
    btn.addEventListener('click', ()=>{ twSelectedDay=String(d); renderTageswerte(); });
    dayTabs.appendChild(btn);
  }
  container.appendChild(dayTabs);

  const isTotal = twSelectedDay === 'total';
  if(isTotal){
    const hint = document.createElement('div');
    hint.className = 'tw-hint';
    hint.textContent = 'Die Produkt-Spalten werden automatisch aus allen Tages-Seiten dieses Monats summiert (nicht bearbeitbar). Calls, CHT, NPS und LQ trägst du hier direkt manuell ein.' + (isPrev ? ' Gibt es für den Vormonat keine Tageswerte, werden die Stückzahlen aus dem Verlauf angezeigt.' : '');
    container.appendChild(hint);
  }

  Object.keys(TEAM_CONFIGS).forEach(teamId=>{
    const cfg = TEAM_CONFIGS[teamId];
    const teamAgents = state.agents.filter(a => String(a.team) === String(teamId) && a.name.trim()!=='' && a.category !== 'schulung' && a.category !== 'work');
    if(!teamAgents.length) return;

    if(isTotal && !isPrev){ teamAgents.forEach(a=>twRecomputeAgent(a, cfg)); }

    const teamDiv = document.createElement('div');
    teamDiv.className = 'tw-team-wrap';

    // Headline-Block (wird per Scroll-Handler fixed geschaltet)
    const stickyWrap = document.createElement('div');
    stickyWrap.className = 'tw-team-sticky';
    const placeholder = document.createElement('div');
    placeholder.className = 'tw-sticky-placeholder';
    const head = document.createElement('div');
    head.className = 'tw-team-head';
    head.textContent = `${cfg.label} — ${cfg.project}`;
    stickyWrap.appendChild(head);
    // Klon-Spalten-Header (nur sichtbar wenn is-fixed, Breiten werden per JS gesetzt)
    const colHeaderBar = document.createElement('div');
    colHeaderBar.className = 'tw-col-header-bar';
    const colHeaderTable = document.createElement('table');
    colHeaderTable.className = 'tw-col-header-table';
    const colHeaderRow = document.createElement('tr');
    colHeaderTable.appendChild(colHeaderRow);
    colHeaderBar.appendChild(colHeaderTable);
    stickyWrap.appendChild(colHeaderBar);
    teamDiv.appendChild(placeholder);
    teamDiv.appendChild(stickyWrap);

    // Zusätzliche Produkte pro Team in Tageswerte: DA für alle, Avia (VVM) für MF-Team nach SU
    const extraProds = teamExtraProducts(teamId);
    const orderedProducts = displayOrderProducts([...cfg.products, ...extraProds], teamId);
    const productHeaders = orderedProducts.map(p=>productLabel(p, teamId));
    const headers = isTotal
      ? ['Mitarbeiter', 'Calls', 'CHT', ...productHeaders, 'NPS %', 'LQ %']
      : ['Mitarbeiter', ...productHeaders];

    // Klon-Spalten-Header mit gleichen Labels befüllen
    headers.forEach(h=>{
      const th = document.createElement('th');
      th.textContent = h;
      colHeaderRow.appendChild(th);
    });

    const table = document.createElement('table');
    table.className = 'tw-table';

    // thead-Zeile: bleibt in der Tabelle (für korrekte Spaltenbreiten)
    const thead = document.createElement('tr');
    thead.className = 'tw-head-row';
    headers.forEach(h=>{
      const th = document.createElement('th');
      th.textContent = h;
      thead.appendChild(th);
    });
    table.appendChild(thead);

    // Für jede Tabelle eigenes Zellraster für die Mehrfachauswahl
    const cellGrid = [];
    let selStart = null, selEnd = null;
    function clearVisual(){
      cellGrid.forEach(rowArr=>{ if(rowArr) rowArr.forEach(c=>{ if(c) c.td.classList.remove('tw-cell-selected'); }); });
    }
    function updateSelectionVisual(){
      clearVisual();
      const r1 = Math.min(selStart.r, selEnd.r), r2 = Math.max(selStart.r, selEnd.r);
      const c1 = Math.min(selStart.c, selEnd.c), c2 = Math.max(selStart.c, selEnd.c);
      const selected = [];
      for(let r=r1;r<=r2;r++){
        for(let c=c1;c<=c2;c++){
          const cell = cellGrid[r] && cellGrid[r][c];
          if(cell){ cell.td.classList.add('tw-cell-selected'); selected.push(cell); }
        }
      }
      twSelectedCells = selected;
      twClearActiveSelection = clearVisual;
    }

    function mkTwInput(getVal, setVal, readOnly, rowIdx, colIdx){
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.inputMode = 'decimal';
      const v = getVal();
      inp.value = (v===null || v===undefined) ? '' : v;
      inp.placeholder = '–';
      inp.className = 'tw-input';
      inp.disabled = !!readOnly;
      inp.addEventListener('focus', e=>e.target.select());
      inp.addEventListener('change', e=>{
        const raw = e.target.value.trim().replace(',', '.');
        const val = raw === '' ? null : (parseFloat(raw)||0);
        setVal(val);
        scheduleSave();
      });
      td.appendChild(inp);

      if(!readOnly && rowIdx !== undefined && colIdx !== undefined){
        if(!cellGrid[rowIdx]) cellGrid[rowIdx] = [];
        cellGrid[rowIdx][colIdx] = { td, input: inp, setVal };
        td.dataset.twRow = rowIdx;
        td.dataset.twCol = colIdx;
        td.addEventListener('mousedown', e=>{
          e.preventDefault(); // verhindert Browser-Textauswahl über mehrere Felder, wir übernehmen das selbst
          if(twClearActiveSelection && twClearActiveSelection !== clearVisual) twClearActiveSelection();
          twIsDragging = true;
          selStart = {r:rowIdx, c:colIdx};
          selEnd = {r:rowIdx, c:colIdx};
          updateSelectionVisual();
          twActiveTableExtend = (r,c)=>{ selEnd = {r,c}; updateSelectionVisual(); };
          inp.focus();
        });
        td.addEventListener('mouseenter', ()=>{
          if(twIsDragging && selStart){
            selEnd = {r:rowIdx, c:colIdx};
            updateSelectionVisual();
          }
        });
      }
      return td;
    }

    teamAgents.forEach((agent, rowIdx)=>{
      const row = document.createElement('tr');
      row.className = 'tw-row';
      const nameTd = document.createElement('td');
      nameTd.className = 'tw-name';
      nameTd.textContent = agent.name;
      row.appendChild(nameTd);

      if(isTotal){
        // Calls, CHT, NPS, LQ: manuell editierbar. Produkte: automatisch aus den Tages-Seiten summiert (nicht editierbar).
        let col = 0;
        if(isPrev){
          // Vormonat: Werte liegen im Mitarbeiter-Verlauf dieses Monats
          const vmRead = () => agentVerlaufMonat(agent, viewDate.getFullYear(), VL_MONATE[viewDate.getMonth()]) || {};
          const getF = f => () => { const v = vmRead()[f]; return (v === undefined) ? null : v; };
          const setF = f => v => { const md = verlaufMonatForEdit(agent, viewDate); md[f] = v; verlaufRecalcCr(agent, md); };
          const twSums = (agent.tageswerte && agent.tageswerte[monthKey]) ? hrAgentSums(agent, monthKey, orderedProducts) : null;
          row.appendChild(mkTwInput(getF('calls'), setF('calls'), false, rowIdx, col++));
          row.appendChild(mkTwInput(getF('cht'), setF('cht'), false, rowIdx, col++));
          orderedProducts.forEach(p=> row.appendChild(mkTwInput(()=> twSums ? twSums[p] : ((vmRead().sales||{})[p] ?? null), ()=>{}, true)));
          row.appendChild(mkTwInput(getF('nps'), setF('nps'), false, rowIdx, col++));
          row.appendChild(mkTwInput(getF('lq'), setF('lq'), false, rowIdx, col++));
        } else {
        row.appendChild(mkTwInput(()=>agent.calls, v=>{ agent.calls=v; }, false, rowIdx, col++));
        row.appendChild(mkTwInput(()=>agent.cht, v=>{ agent.cht=v; }, false, rowIdx, col++));
        orderedProducts.forEach(p=> row.appendChild(mkTwInput(()=>agent.sales[p], ()=>{}, true)));
        row.appendChild(mkTwInput(()=>agent.nps, v=>{ agent.nps=v; }, false, rowIdx, col++));
        row.appendChild(mkTwInput(()=>agent.lq, v=>{ agent.lq=v; }, false, rowIdx, col++));
        }
      } else {
        // Wichtig: den Tageseintrag NICHT beim bloßen Rendern/Anschauen anlegen, sondern erst,
        // wenn wirklich ein Wert eingetragen wird - sonst erzeugt reines Durchklicken der
        // Tagesreiter leere Einträge, die den Monatsstand-Autosummen später fälschlich auf 0 setzt.
        const getDv = () => (agent.tageswerte && agent.tageswerte[monthKey] && agent.tageswerte[monthKey][twSelectedDay]) || null;
        const ensureDv = () => {
          if(!agent.tageswerte) agent.tageswerte = {};
          if(!agent.tageswerte[monthKey]) agent.tageswerte[monthKey] = {};
          if(!agent.tageswerte[monthKey][twSelectedDay]) agent.tageswerte[monthKey][twSelectedDay] = { sales:{} };
          return agent.tageswerte[monthKey][twSelectedDay];
        };

        orderedProducts.forEach((p, colIdx)=>{
          row.appendChild(mkTwInput(
            ()=>{ const dv = getDv(); return dv && dv.sales ? dv.sales[p] : null; },
            v=>{
              const dv = ensureDv(); if(!dv.sales) dv.sales = {}; dv.sales[p] = v;
              // Monatssumme sofort neu berechnen, damit "Mitarbeiter Ziele" den Wert direkt
              // übernimmt - vorher passierte das erst beim Öffnen der Monatsstand-Seite.
              if(isPrev) syncVormonatSales(agent, now); else twRecomputeAgent(agent, cfg);
            },
            false, rowIdx, colIdx
          ));
        });
      }

      table.appendChild(row);
    });

    // Tabellen-Scroll-Wrapper (nur overflow-x, kein Einfluss auf sticky)
    const tableWrap = document.createElement('div');
    tableWrap.className = 'tw-team';
    tableWrap.appendChild(table);
    teamDiv.appendChild(tableWrap);
    container.appendChild(teamDiv);
  });

  if(!state.agents.some(a=>a.name.trim()!=='')){
    container.appendChild(emptyStateEl('Noch keine Mitarbeiter angelegt', 'Lege zuerst Mitarbeiter im Reiter "Mitarbeiter Ziele" an.'));
  }

  // Scroll-Handler: Team-Headline + Spalten-Klon per JS fixed schalten
  if(window._twScrollCleanup){ window._twScrollCleanup(); window._twScrollCleanup = null; }

  setTimeout(()=>{
    const tabsWrap = document.querySelector('.tabs-sticky-wrap');
    const tabsH = tabsWrap ? tabsWrap.getBoundingClientRect().height : 60;
    const stickyBlocks = document.querySelectorAll('#tageswerte-capture .tw-team-sticky');
    if(!stickyBlocks.length) return;

    // Spaltenbreiten vom echten thead in den Klon übertragen
    function syncColWidths(wrap){
      const realThs = wrap.querySelectorAll('.tw-head-row th');
      const cloneThs = wrap.querySelectorAll('.tw-col-header-table th');
      const tableWrap = wrap.querySelector('.tw-team');
      const cloneBar  = wrap.querySelector('.tw-col-header-bar');
      if(!realThs.length || !cloneThs.length) return;
      realThs.forEach((th, i)=>{
        if(cloneThs[i]) cloneThs[i].style.width = th.getBoundingClientRect().width + 'px';
      });
      // Gesamtbreite der echten Tabelle übernehmen
      const realTable = wrap.querySelector('.tw-table');
      if(realTable && cloneBar){
        wrap.querySelector('.tw-col-header-table').style.width = realTable.getBoundingClientRect().width + 'px';
      }
      // horizontalen Scroll-Offset übernehmen
      if(tableWrap && cloneBar) cloneBar.scrollLeft = tableWrap.scrollLeft;
    }

    function twUpdate(){
      stickyBlocks.forEach(block=>{
        const wrap = block.closest('.tw-team-wrap');
        const ph = wrap && wrap.querySelector('.tw-sticky-placeholder');
        if(!wrap) return;
        const wrapRect = wrap.getBoundingClientRect();
        const blockH = block.offsetHeight;
        if(wrapRect.top < tabsH && wrapRect.bottom > tabsH + blockH){
          if(!block.classList.contains('is-fixed')){
            block.classList.add('is-fixed');
            block.style.top = tabsH + 'px';
            const r = wrap.getBoundingClientRect();
            block.style.left = r.left + 'px';
            block.style.width = r.width + 'px';
            if(ph){ ph.style.height = blockH + 'px'; ph.classList.add('is-active'); }
            syncColWidths(wrap);
          } else {
            const r = wrap.getBoundingClientRect();
            block.style.left = r.left + 'px';
            block.style.width = r.width + 'px';
            syncColWidths(wrap);
          }
        } else {
          block.classList.remove('is-fixed');
          block.style.top = block.style.left = block.style.width = '';
          if(ph){ ph.classList.remove('is-active'); ph.style.height = ''; }
        }
      });
    }

    // Horizontalen Scroll der Tabelle auf den Klon-Header übertragen
    document.querySelectorAll('#tageswerte-capture .tw-team').forEach(tableWrap=>{
      const wrap = tableWrap.closest('.tw-team-wrap');
      tableWrap.addEventListener('scroll', ()=>{
        const cloneBar = wrap && wrap.querySelector('.tw-col-header-bar');
        if(cloneBar) cloneBar.scrollLeft = tableWrap.scrollLeft;
      }, {passive:true});
    });

    // Auf alle möglichen Scroll-Container hören (body/html/window - je nach Browser)
    const scrollTargets = [
      window,
      document.documentElement,
      document.body,
      document.getElementById('view-overview')
    ].filter(Boolean);

    scrollTargets.forEach(t => t.addEventListener('scroll', twUpdate, {passive:true, capture:true}));

    window._twScrollCleanup = ()=>{
      scrollTargets.forEach(t => t.removeEventListener('scroll', twUpdate, {capture:true}));
    };

    twUpdate();
  }, 150);

}

// ============================================================
// HOCHRECHNUNG (ab v138): Wo landet jeder Mitarbeiter am Monatsende, wenn er im bisherigen
// Tempo weitermacht? Basis sind die Tageswerte des laufenden Monats.
//   Prognose = Ist + (Ist / bisherige Arbeitstage) × verbleibende Arbeitstage
// Arbeitstage: Wochentage, an denen im Team gearbeitet wird (Mo–Fr; Samstag, sobald im Monat
// samstags Werte erfasst wurden). Feiertage werden nicht berücksichtigt.
// ============================================================
function hrWorkdayInfo(teamAgents, now){
  const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const mk = twMonthKey(now);
  const workedDays = new Set();
  teamAgents.forEach(a=>{
    const tw = a.tageswerte && a.tageswerte[mk];
    if(!tw) return;
    Object.keys(tw).forEach(d=>{
      const dv = tw[d];
      if(dv && dv.sales && Object.values(dv.sales).some(v => v !== null && v !== undefined)) workedDays.add(parseInt(d));
    });
  });
  const weekdays = new Set([1,2,3,4,5]);
  workedDays.forEach(d=>{ const wd = new Date(y, m, d).getDay(); weekdays.add(wd); });
  const isWork = d => weekdays.has(new Date(y, m, d).getDay());
  const todayDone = workedDays.has(today);
  let elapsed = 0, remaining = 0;
  for(let d=1; d<=daysInMonth; d++){
    if(!isWork(d) && !workedDays.has(d)) continue;
    if(d < today || (d === today && todayDone)) elapsed++;
    else remaining++;
  }
  return { elapsed, remaining, total: elapsed + remaining, saturday: weekdays.has(6), sunday: weekdays.has(0), mk, hasData: workedDays.size > 0 };
}
function hrAgentSums(agent, mk, products){
  const tw = (agent.tageswerte && agent.tageswerte[mk]) || {};
  const sum = {}; products.forEach(p=>{ sum[p] = 0; });
  Object.values(tw).forEach(dv=>{
    if(!dv || !dv.sales) return;
    products.forEach(p=>{ const v = dv.sales[p]; if(typeof v === 'number') sum[p] += v; });
  });
  return sum;
}

          td.innerHTML = `<div class="hr-prog">${fmt(c.prog)}</div><div class="hr-meta">Ist ${fmt(c.ist)} · ohne Ziel</div>`;
        } else {
          td.className = c.pct >= 1 ? 'hr-ok' : (c.pct >= 0.85 ? 'hr-warn' : 'hr-bad');

          td.innerHTML = `<div class="hr-prog">${fmt(c.prog)} <span class="hr-of">/ ${fmt(c.ziel)}</span></div><div class="hr-meta">Ist ${fmt(c.ist)}</div>${need}`;
          td.title = `${productLabel(p, teamId)}: Ist ${fmt(c.ist)}, Prognose ${fmt(c.prog)}, Ziel ${fmt(c.ziel)} (${Math.round(c.pct*100)} %)`;

      const sumTd = document.createElement('td');

      sumTd.textContent = `${r.onTrack}/${r.total}`;

      tr.appendChild(sumTd);
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    block.appendChild(wrap);
    container.appendChild(block);
  });
