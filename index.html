<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Coaching-Board</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#EDF1F4;
  --panel:#FFFFFF;
  --border:#D7DEE4;
  --text:#1C2733;
  --muted:#64748B;
  --teal:#0E7C7B;
  --teal-soft:#E3F1F0;
  --amber:#C2792B;
  --amber-soft:#FBEEDD;
  --red:#B4423A;
  --red-soft:#FBE9E7;
  --sixh:#3B6FA0;
  --sixh-soft:#E4ECF5;
  --helpline:#7C5CBF;
  --helpline-soft:#EFE9F7;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding:32px 24px 80px;}
.wrap{max-width:1320px;margin:0 auto;}

header.board-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:22px;border-bottom:2px solid var(--text);padding-bottom:18px;}
.title-block .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:6px;}
h1{font-family:'Space Grotesk',sans-serif;font-size:28px;margin:0;letter-spacing:-.01em;}
.title-block p{margin:6px 0 0;color:var(--muted);font-size:13.5px;}

.tabs{display:flex;gap:8px;margin-bottom:18px;}
.tab-btn{
  background:var(--panel);border:1px solid var(--border);color:var(--muted);
  padding:9px 18px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;
}
.tab-btn.active{background:var(--text);color:#fff;border-color:var(--text);}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
button.primary{background:var(--text);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;}
button.primary:hover{background:var(--teal);}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--border);padding:10px 16px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;}
button.secondary:hover{border-color:var(--teal);color:var(--teal);}

/* ===== Coaching view (cards) ===== */
.team-block{margin-bottom:26px;}
.team-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin:0 0 8px;}
.targets-legend{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;}
.targets-legend .line{font-family:'IBM Plex Mono',monospace;font-size:11px;}
.targets-legend .cat-label{display:inline-block;min-width:82px;font-weight:700;}
.targets-legend .cat-label.standard{color:var(--muted);}
.targets-legend .cat-label.sixh{color:var(--sixh);}
.targets-legend .cat-label.helpline{color:var(--helpline);}
.targets-legend .vals{color:var(--muted);}

.cat-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;font-weight:700;}
.cat-badge.regular{background:#EEF1F4;color:var(--muted);}
.cat-badge.sixh{background:var(--sixh-soft);color:var(--sixh);}
.cat-badge.helpline{background:var(--helpline-soft);color:var(--helpline);}

.cat-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.cat-dot.sixh{background:var(--sixh);}
.cat-dot.helpline{background:var(--helpline);}

.cards{display:flex;flex-direction:column;gap:14px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.card-top-left{display:flex;align-items:center;gap:12px;flex:1;min-width:200px;flex-wrap:wrap;}
.status-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;background:var(--teal);box-shadow:0 0 0 4px var(--teal-soft);}
.status-dot.warn{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);}
.status-dot.critical{background:var(--red);box-shadow:0 0 0 4px var(--red-soft);}

.name-input{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;border:none;background:transparent;padding:4px 0;outline:none;width:180px;border-bottom:1px solid transparent;}
.name-input:focus{border-bottom:1px solid var(--teal);}

.calls-field{display:flex;flex-direction:column;gap:4px;}
.calls-field label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.calls-field input{width:74px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;background:#FFF7EC;outline:none;}

.remove-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;flex-shrink:0;}
.remove-btn:hover{color:var(--red);}

.metrics-row{display:flex;gap:14px;flex-wrap:wrap;}
.metric-group{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#FAFBFC;}
.metric-group .group-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:8px;}
.metric-group.quality .group-label{color:var(--teal);}
.metric-group.sales .group-label{color:var(--amber);}
.metric-group.extra .group-label{color:var(--muted);}
.metric-group .fields{display:flex;gap:10px;flex-wrap:wrap;}
.metric-field{display:flex;flex-direction:column;gap:4px;}
.metric-field label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.metric-field input{width:56px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;background:#fff;outline:none;}
.metric-field input:focus{border-color:var(--teal);}
.metric-field.wide input{width:150px;font-family:'Inter',sans-serif;font-weight:500;}

.product-block{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:6px;background:#fff;border:1px solid var(--border);}
.product-block .product-name{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;}
.product-block .product-inputs{display:flex;gap:8px;align-items:flex-end;}
.product-block .stk-input{width:52px;border:1px solid var(--border);border-radius:5px;padding:5px 6px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;}
.product-block .stk-input:focus{border-color:var(--teal);outline:none;}
.mini-label{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;}
.cr-readout{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;padding:5px 8px;border-radius:5px;background:var(--teal-soft);color:var(--teal);}
.cr-readout.good{background:var(--teal-soft);color:var(--teal);}
.cr-readout.mid{background:var(--amber-soft);color:var(--amber);}
.cr-readout.zero{background:var(--red-soft);color:var(--red);}

.bottom-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.plan-block{flex:1;min-width:240px;}
.plan-block label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.plan-block textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.4;min-height:54px;resize:vertical;outline:none;background:#FAFBFC;}
.plan-block textarea:focus{border-color:var(--teal);background:#fff;}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 7px;border-radius:5px;background:var(--amber-soft);color:var(--amber);font-weight:600;}
.tag.ok{background:var(--teal-soft);color:var(--teal);}

.empty{color:var(--muted);font-size:13px;font-style:italic;padding:20px 0;text-align:center;}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:10px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;}
.sync-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 10px;border-radius:6px;font-weight:600;}
.sync-idle{background:#F1F4F7;color:var(--muted);}
.sync-syncing{background:var(--amber-soft);color:var(--amber);}
.sync-ok{background:var(--teal-soft);color:var(--teal);}
.sync-error{background:var(--red-soft);color:var(--red);}
.user-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
button.login-btn{background:var(--teal);color:#fff;border:none;padding:8px 14px;border-radius:7px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;}
button.login-btn:hover{opacity:.9;}
button.logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:7px;font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;}


/* ===== Coaching Plan view ===== */
.cp-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.cp-card-header{display:flex;align-items:center;gap:12px;}
.cp-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;flex:1;}
.cp-team{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);padding:3px 8px;border-radius:5px;background:#F1F4F7;}
.cp-plan-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.cp-plan-area{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;min-height:70px;resize:vertical;outline:none;background:#FAFBFC;}
.cp-plan-area:focus{border-color:var(--teal);background:#fff;}
.cp-team-block{margin-bottom:26px;}
.cp-team-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin:0 0 10px;color:var(--text);}

#overview-capture{background:var(--bg);padding:4px;}
.ov-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0 0 4px;}
.ov-sub{font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);margin:0 0 18px;}
.ov-team{margin-bottom:18px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.ov-team-head{background:var(--text);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.ov-team-head .name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
.ov-team-head .targets{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#B8DCDA;}
table.ov-table{width:100%;border-collapse:collapse;background:#fff;}
table.ov-table th{background:#F1F4F7;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;text-align:center;padding:8px 6px;letter-spacing:.05em;}
table.ov-table th:first-child{text-align:left;padding-left:14px;}
table.ov-table td{padding:7px 6px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;border-top:1px solid var(--border);}
table.ov-table td.ov-name{text-align:left;padding-left:14px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;}
table.ov-table tr:nth-child(even) td{background:#FAFBFC;}
.ov-val.good{color:var(--teal);}
.ov-val.mid{color:var(--amber);}
.ov-val.zero{color:var(--red);}
.ov-pill{display:inline-block;padding:3px 9px;border-radius:5px;background:var(--teal-soft);color:var(--teal);}
.ov-pill.good{background:var(--teal-soft);color:var(--teal);}
.ov-pill.mid{background:var(--amber-soft);color:var(--amber);}
.ov-pill.zero{background:var(--red-soft);color:var(--red);}
.ov-foot{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);margin-top:6px;}
</style>
</head>

  <header class="board-header">

  <div class="topbar">
    <span id="sync-status" class="sync-badge sync-idle">Nicht verbunden</span>

  <div id="view-coaching">
    <div class="toolbar">
      <span class="count" id="agent-count">0 Mitarbeiter</span>
      <button class="primary" id="add-agent-btn">+ Mitarbeiter hinzufügen</button>

    <div id="coaching-teams"></div>
  </div>

  <div id="view-coachplan" style="display:none;">
    <div class="toolbar">
      <span class="count" id="cp-count"></span>
    </div>
    <div id="coachplan-container"></div>
  </div>

  <div id="view-overview" style="display:none;">
    <div class="toolbar">
      <span class="count" id="ov-count"></span>
      <button class="primary" id="export-png-btn">Als Bild speichern (WhatsApp)</button>

</div>

// ============================================================
const GRAPH_CLIENT_ID = "27f9c91d-9215-42d2-a38f-5e19bff6c9b4";
const GRAPH_TENANT_ID = "67ffefcf-69ec-414a-9ebd-63e6c9e852b6";
const GRAPH_FOLDER    = "Trikala-Portal";
const GRAPH_FILE      = "coaching-board-data.json";
const REDIRECT_URI    = window.location.origin + window.location.pathname;
const SCOPES          = "Files.ReadWrite User.Read offline_access";

let graphToken = null;
let syncStatus = 'idle';

// ---- PKCE Helpers ----
function base64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function generatePKCE(){
  const verifier = base64url(crypto.getRandomValues(new Uint8Array(32)));
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return { verifier, challenge: base64url(digest) };
}

// ---- Sign In ----
async function signIn(){
  const pkce = await generatePKCE();
  sessionStorage.setItem('pkce_verifier', pkce.verifier);
  const params = new URLSearchParams({
    client_id: GRAPH_CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge: pkce.challenge,
    code_challenge_method: 'S256',
    response_mode: 'query'
  });
  window.location.href = `https://login.microsoftonline.com/${GRAPH_TENANT_ID}/oauth2/v2.0/authorize?${params}`;
}

// ---- Handle redirect back ----
async function handleAuthRedirect(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(!code) return false;
  // Clean URL
  window.history.replaceState({}, '', window.location.pathname);
  const verifier = sessionStorage.getItem('pkce_verifier');
  if(!verifier) return false;
  const body = new URLSearchParams({
    client_id: GRAPH_CLIENT_ID,
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier,
    scope: SCOPES
  });
  const resp = await fetch(`https://login.microsoftonline.com/${GRAPH_TENANT_ID}/oauth2/v2.0/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString()
  });
  const data = await resp.json();
  if(data.access_token){
    graphToken = data.access_token;
    sessionStorage.setItem('graph_token', graphToken);
    if(data.refresh_token) sessionStorage.setItem('refresh_token', data.refresh_token);
    updateLoginUI(true);
    return true;
  }
  return false;
}

async function refreshToken(){
  const rt = sessionStorage.getItem('refresh_token');
  if(!rt) return false;
  const body = new URLSearchParams({
    client_id: GRAPH_CLIENT_ID,
    grant_type: 'refresh_token',
    refresh_token: rt,
    scope: SCOPES
  });
  const resp = await fetch(`https://login.microsoftonline.com/${GRAPH_TENANT_ID}/oauth2/v2.0/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString()
  });
  const data = await resp.json();
  if(data.access_token){
    graphToken = data.access_token;
    sessionStorage.setItem('graph_token', graphToken);
    return true;
  }
  return false;
}

function updateLoginUI(loggedIn){
  const lb = document.getElementById('login-btn');
  const ob = document.getElementById('logout-btn');
  if(lb) lb.style.display = loggedIn ? 'none' : '';
  if(ob) ob.style.display = loggedIn ? '' : 'none';
}

function signOut(){
  sessionStorage.removeItem('graph_token');
  sessionStorage.removeItem('refresh_token');
  sessionStorage.removeItem('pkce_verifier');
  graphToken = null;
  updateLoginUI(false);
  setSyncStatus('idle');
}

async function graphFetch(url, options={}){
  if(!graphToken){ await refreshToken(); }
  const resp = await fetch('https://graph.microsoft.com/v1.0' + url, {
    ...options,
    headers: { 'Authorization': 'Bearer ' + graphToken, 'Content-Type': 'application/json', ...(options.headers||{}) }
  });
  if(resp.status === 401){
    const ok = await refreshToken();
    if(ok) return graphFetch(url, options);
  }
  return resp;
}

async function loadFromSharePoint(){
  setSyncStatus('syncing');
  try {
    const resp = await graphFetch(`/me/drive/root:/${GRAPH_FOLDER}/${GRAPH_FILE}:/content`);
    if(resp.ok){
      const data = await resp.json();
      if(data && data.agents && data.agents.length){
        state = data;
        renderAll();
        setSyncStatus('ok');
        return;
      }
    }
    await saveToSharePoint();
    setSyncStatus('ok');
  } catch(e){
    console.error('SharePoint load error', e);
    setSyncStatus('error');
  }
}

async function saveToSharePoint(){
  if(!graphToken) return;
  setSyncStatus('syncing');
  try {
    await graphFetch(`/me/drive/root:/${GRAPH_FOLDER}/${GRAPH_FILE}:/content`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    });
    setSyncStatus('ok');
  } catch(e){
    console.error('SharePoint save error', e);
    setSyncStatus('error');
  }
}

function setSyncStatus(s){
  syncStatus = s;
  const el = document.getElementById('sync-status');
  if(!el) return;
  const map = {
    idle:    { text: 'Nicht verbunden', cls: 'sync-idle' },
    syncing: { text: 'Speichert …',     cls: 'sync-syncing' },
    ok:      { text: '✓ Gespeichert',   cls: 'sync-ok' },
    error:   { text: '⚠ Sync-Fehler',  cls: 'sync-error' }
  };
  el.textContent = map[s].text;
  el.className = 'sync-badge ' + map[s].cls;
}

function initMsal(){
  // Check for stored token
  const stored = sessionStorage.getItem('graph_token');
  if(stored){ graphToken = stored; updateLoginUI(true); }
  // Handle redirect
  handleAuthRedirect().then(ok=>{
    if(ok) loadFromSharePoint();
    else if(graphToken) loadFromSharePoint();
  });
}

async function graphFetch(url, options={}){
  if(!graphToken) await getToken();
  const resp = await fetch('https://graph.microsoft.com/v1.0' + url, {
    ...options,
    headers: {
      'Authorization': 'Bearer ' + graphToken,
      'Content-Type': 'application/json',
      ...(options.headers||{})
    }
  });
  if(resp.status === 401){ await getToken(); return graphFetch(url, options); }
  return resp;
}

async function loadFromSharePoint(){
  setSyncStatus('syncing');
  try {
    const resp = await graphFetch(`/me/drive/root:/${GRAPH_FOLDER}/${GRAPH_FILE}:/content`);
    if(resp.ok){
      const data = await resp.json();
      if(data && data.agents && data.agents.length){
        state = data;
        renderAll();
        setSyncStatus('ok');
        return;
      }
    }
    await saveToSharePoint();
    setSyncStatus('ok');
  } catch(e){
    console.error('SharePoint load error', e);
    setSyncStatus('error');
  }
}

async function saveToSharePoint(){
  if(!graphToken) return;
  setSyncStatus('syncing');
  try {
    await graphFetch(`/me/drive/root:/${GRAPH_FOLDER}/${GRAPH_FILE}:/content`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    });
    setSyncStatus('ok');
  } catch(e){
    console.error('SharePoint save error', e);
    setSyncStatus('error');
  }
}

function uid(){ return 'a' + Math.random().toString(36).slice(2,9); }

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && parsed.agents && parsed.agents.length){ state = parsed; }
    }
  }catch(e){ /* kein gespeicherter Stand */ }
  initMsal();
  if(!state.agents.length){
    state.agents = SEED_AGENTS.map(a => ({ id: uid(), ...JSON.parse(JSON.stringify(a)) }));
    scheduleSave();
  }
  render();
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
    catch(e){ console.error('Lokales Speichern fehlgeschlagen', e); }
    if(graphToken) saveToSharePoint();
  }, 400);
}

function trafficStatus(val, target){
  if(val >= target) return 'good';
  if(!val || val <= 0) return 'zero';
  return 'mid';
}
function makeAgent(team){
  const cfg = TEAM_CONFIGS[team];
  const sales = {};
  cfg.products.forEach(p=>{ sales[p] = 0; });
  return { id: uid(), name: '', team: team, category: 'regular', calls: 0, nps: 0, lq: 0, sales, coachingplan: '' };
}

function totalStk(agent){
  const cfg = TEAM_CONFIGS[agent.team];
  return cfg.products.reduce((s,p)=> s + (agent.sales[p]||0), 0);
}
function totalCr(agent){
  if(!agent.calls || agent.calls <= 0) return 0;
  return (totalStk(agent) / agent.calls) * 100;
}
function agentTargets(agent){
  const cfg = TEAM_CONFIGS[agent.team];
  return cfg.targets[agent.category || 'regular'];
}
function evaluateAgent(agent){
  const cfg = TEAM_CONFIGS[agent.team];
  const targets = agentTargets(agent);
  const tags = [];
  if(agent.nps && agent.nps > 0 && agent.nps < 70) tags.push('NPS');
  if(agent.lq && agent.lq > 0 && agent.lq < 75) tags.push('LQ');
  cfg.products.forEach((p,i)=>{
    const val = agent.sales[p]||0;
    if(val < targets[i]) tags.push(p + ' Stück');
  });
  if(totalCr(agent) < cfg.crTarget) tags.push('Gesamt-CR');

  let status = 'ok';
  if(tags.length === 1) status = 'warn';
  if(tags.length >= 2) status = 'critical';
  return { tags, status };
}

function numField(labelText, value, onChange){
  const wrap = document.createElement('div');
  wrap.className = 'metric-field';
  const label = document.createElement('label');
  label.textContent = labelText;
  const input = document.createElement('input');
  input.type = 'number';
  input.value = value;
  input.addEventListener('input', e=>{ onChange(parseFloat(e.target.value)||0); scheduleSave(); renderAll(); });
  wrap.appendChild(label); wrap.appendChild(input);
  return wrap;
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tab-coaching').classList.toggle('active', tab==='coaching');
  document.getElementById('tab-coachplan').classList.toggle('active', tab==='coachplan');
  document.getElementById('tab-overview').classList.toggle('active', tab==='overview');
  document.getElementById('view-coaching').style.display = tab==='coaching' ? '' : 'none';
  document.getElementById('view-coachplan').style.display = tab==='coachplan' ? '' : 'none';
  document.getElementById('view-overview').style.display = tab==='overview' ? '' : 'none';
  renderAll();
}
document.getElementById('tab-coaching').addEventListener('click', ()=>switchTab('coaching'));
document.getElementById('tab-coachplan').addEventListener('click', ()=>switchTab('coachplan'));
document.getElementById('tab-overview').addEventListener('click', ()=>switchTab('overview'));

function renderAll(){
  if(currentTab === 'coaching') renderCoaching();
  else if(currentTab === 'coachplan') renderCoachPlan();
  else renderOverview();
}

function renderCoaching(){
  const container = document.getElementById('coaching-teams');
  container.innerHTML = '';
  document.getElementById('agent-count').textContent = state.agents.length + ' Mitarbeiter';

  Object.keys(TEAM_CONFIGS).forEach(teamId=>{
    const cfg = TEAM_CONFIGS[teamId];
    const teamAgents = state.agents.filter(a => String(a.team) === String(teamId));
    const block = document.createElement('div');
    block.className = 'team-block';
    const legendLine = (catKey) => cfg.products.map((p,i)=>`${p} ${cfg.targets[catKey][i]}`).join(' · ') + (catKey==='regular' ? ` · Gesamt-CR ${cfg.crTarget}%` : '');
    block.innerHTML = `
      <div class="team-title">${cfg.label} — ${cfg.project}</div>
      <div class="targets-legend">
        <div class="line"><span class="cat-label standard">Standard</span><span class="vals">${legendLine('regular')}</span></div>
        <div class="line"><span class="cat-label sixh">6-Stündler</span><span class="vals">${legendLine('6h')}</span></div>
        <div class="line"><span class="cat-label helpline">Helpline</span><span class="vals">${legendLine('helpline')}</span></div>
      </div>`;
    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'cards';

    teamAgents.forEach(agent=>{
      const evalRes = evaluateAgent(agent);
      const card = document.createElement('div');
      card.className = 'card';

      const topRow = document.createElement('div');
      topRow.className = 'card-top';
      const topLeft = document.createElement('div');
      topLeft.className = 'card-top-left';
      const dot = document.createElement('div');
      dot.className = 'status-dot' + (evalRes.status !== 'ok' ? ' ' + evalRes.status : '');
      const nameInput = document.createElement('input');
      nameInput.className = 'name-input';
      nameInput.type = 'text';
      nameInput.placeholder = 'Name';
      nameInput.value = agent.name;
      nameInput.addEventListener('input', e=>{ agent.name = e.target.value; scheduleSave(); document.getElementById('agent-count').textContent = state.agents.length + ' Mitarbeiter'; });
      topLeft.appendChild(dot); topLeft.appendChild(nameInput);

      const catSelect = document.createElement('select');
      catSelect.className = 'cat-badge ' + CATEGORY_CSS[agent.category || 'regular'];
      catSelect.style.border = 'none';
      catSelect.style.cursor = 'pointer';
      ['regular','6h','helpline'].forEach(catKey=>{
        const opt = document.createElement('option');
        opt.value = catKey;
        opt.textContent = CATEGORY_LABELS[catKey];
        if((agent.category||'regular') === catKey) opt.selected = true;
        catSelect.appendChild(opt);
      });
      catSelect.addEventListener('change', e=>{
        agent.category = e.target.value;
        scheduleSave();
        renderAll();
      });
      topLeft.appendChild(catSelect);

      const callsField = document.createElement('div');
      callsField.className = 'calls-field';
      callsField.innerHTML = '<label>Calls</label>';
      const callsInput = document.createElement('input');
      callsInput.type = 'number';
      callsInput.value = agent.calls;
      callsInput.addEventListener('input', e=>{ agent.calls = parseFloat(e.target.value)||0; scheduleSave(); renderAll(); });
      callsField.appendChild(callsInput);
      topLeft.appendChild(callsField);

      const crBadgeWrap = document.createElement('div');
      crBadgeWrap.className = 'calls-field';
      crBadgeWrap.innerHTML = '<label>Gesamt-CR</label>';
      const crTotal = totalCr(agent);
      const crBadge = document.createElement('div');
      crBadge.className = 'cr-readout' + (crTotal < cfg.crTarget ? ' bad' : '');
      crBadge.style.width = '74px'; crBadge.style.textAlign = 'center';
      crBadge.textContent = crTotal.toFixed(1) + '%';
      crBadgeWrap.appendChild(crBadge);
      topLeft.appendChild(crBadgeWrap);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn'; removeBtn.textContent = '✕'; removeBtn.title = 'Entfernen';
      removeBtn.addEventListener('click', ()=>{ state.agents = state.agents.filter(a=>a.id!==agent.id); scheduleSave(); renderAll(); });

      topRow.appendChild(topLeft); topRow.appendChild(removeBtn);
      card.appendChild(topRow);

      const metricsRow = document.createElement('div');
      metricsRow.className = 'metrics-row';

      const qualityGroup = document.createElement('div');
      qualityGroup.className = 'metric-group quality';
      qualityGroup.innerHTML = '<div class="group-label">Qualität</div>';
      const qFields = document.createElement('div'); qFields.className = 'fields';
      qFields.appendChild(numField('NPS %', agent.nps, v=>{agent.nps=v;}));
      qFields.appendChild(numField('LQ %', agent.lq, v=>{agent.lq=v;}));
      qualityGroup.appendChild(qFields);
      metricsRow.appendChild(qualityGroup);

      const salesGroup = document.createElement('div');
      salesGroup.className = 'metric-group sales';
      salesGroup.innerHTML = `<div class="group-label">Vertrieb &nbsp; <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 7px;border-radius:5px;background:${crTotal < cfg.crTarget ? 'var(--red-soft);color:var(--red)' : 'var(--teal-soft);color:var(--teal)'};">Gesamt-CR ${crTotal.toFixed(1)}% (Ziel ${cfg.crTarget}%)</span></div>`;
      const salesFields = document.createElement('div'); salesFields.className = 'fields';
      const myTargets = agentTargets(agent);
      cfg.products.forEach((p,i)=>{
        const pBlock = document.createElement('div');
        pBlock.className = 'product-block';
        pBlock.innerHTML = `<div class="product-name">${p}</div><div class="mini-label">Stk (Ziel ${myTargets[i]})</div>`;
        const inputsRow = document.createElement('div'); inputsRow.className = 'product-inputs';
        const stkInput = document.createElement('input');
        stkInput.className = 'stk-input'; stkInput.type = 'number';
        stkInput.value = agent.sales[p]||0;
        stkInput.addEventListener('input', e=>{ agent.sales[p] = parseFloat(e.target.value)||0; scheduleSave(); renderAll(); });
        inputsRow.appendChild(stkInput);
        pBlock.appendChild(inputsRow);
        salesFields.appendChild(pBlock);
      });
      salesGroup.appendChild(salesFields);
      metricsRow.appendChild(salesGroup);

      card.appendChild(metricsRow);

      const tagsDiv = document.createElement('div'); tagsDiv.className = 'tags';
      if(evalRes.tags.length === 0){
        const tag = document.createElement('span'); tag.className = 'tag ok'; tag.textContent = 'Auf Zielkurs';
        tagsDiv.appendChild(tag);
      } else {
        evalRes.tags.forEach(label=>{
          const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = label;
          tagsDiv.appendChild(tag);
        });
      }
      card.appendChild(tagsDiv);
      cardsWrap.appendChild(card);
    });

    block.appendChild(cardsWrap);
    container.appendChild(block);
  });
}

function renderCoachPlan(){
  const container = document.getElementById('coachplan-container');
  container.innerHTML = '';
  const allAgents = state.agents.filter(a => a.name.trim() !== '');
  document.getElementById('cp-count').textContent = allAgents.length + ' Mitarbeiter';

  Object.keys(TEAM_CONFIGS).forEach(teamId=>{
    const cfg = TEAM_CONFIGS[teamId];
    const teamAgents = state.agents.filter(a => String(a.team) === String(teamId) && a.name.trim() !== '');
    if(!teamAgents.length) return;

    const block = document.createElement('div');
    block.className = 'cp-team-block';
    block.innerHTML = `<div class="cp-team-title">${cfg.label} — ${cfg.project}</div>`;

    teamAgents.forEach(agent=>{
      const card = document.createElement('div');
      card.className = 'cp-card';

      const header = document.createElement('div');
      header.className = 'cp-card-header';

      const dot = document.createElement('div');
      const evalRes = evaluateAgent(agent);
      dot.className = 'status-dot' + (evalRes.status !== 'ok' ? ' ' + evalRes.status : '');

      const nameEl = document.createElement('div');
      nameEl.className = 'cp-name';
      nameEl.textContent = agent.name;

      if(agent.category && agent.category !== 'regular'){
        const badge = document.createElement('span');
        badge.className = 'cat-badge ' + CATEGORY_CSS[agent.category];
        badge.textContent = CATEGORY_LABELS[agent.category];
        header.appendChild(dot);
        header.appendChild(nameEl);
        header.appendChild(badge);
      } else {
        header.appendChild(dot);
        header.appendChild(nameEl);
      }

      if(evalRes.tags.length > 0){
        const tagsDiv = document.createElement('div');
        tagsDiv.className = 'tags';
        tagsDiv.style.marginTop = '0';
        evalRes.tags.forEach(label=>{
          const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = label;
          tagsDiv.appendChild(tag);
        });
        header.appendChild(tagsDiv);
      }

      card.appendChild(header);

      const planLabel = document.createElement('div');
      planLabel.className = 'cp-plan-label';
      planLabel.textContent = 'Coachingplan';
      card.appendChild(planLabel);

      const planArea = document.createElement('textarea');
      planArea.className = 'cp-plan-area';
      planArea.placeholder = 'Notizen, Ziele, nächste Schritte...';
      planArea.value = agent.coachingplan || '';
      planArea.addEventListener('input', e=>{ agent.coachingplan = e.target.value; scheduleSave(); });
      card.appendChild(planArea);

      block.appendChild(card);
    });

    container.appendChild(block);
  });
}

function renderOverview(){
  document.getElementById('ov-count').textContent = state.agents.length + ' Mitarbeiter';
  const container = document.getElementById('overview-capture');
  container.innerHTML = '';
  const title = document.createElement('div');
  title.innerHTML = '<div class="ov-title">Team-Übersicht — Vertrieb &amp; Gesamt-CR</div><div class="ov-sub">Inbound Mobilfunk &amp; Festnetz Privatkunden · Stand aktuell</div>';
  container.appendChild(title);

  Object.keys(TEAM_CONFIGS).forEach(teamId=>{
    const cfg = TEAM_CONFIGS[teamId];
    const teamAgents = state.agents.filter(a => String(a.team) === String(teamId) && a.name.trim() !== '');
    if(!teamAgents.length) return;
    const teamDiv = document.createElement('div');
    teamDiv.className = 'ov-team';
    const legendLine = (catKey) => cfg.products.map((p,i)=>`${p} ${cfg.targets[catKey][i]}`).join(' · ') + (catKey==='regular' ? ` · CR ${cfg.crTarget}%` : '');
    teamDiv.innerHTML = `
      <div class="ov-team-head">
        <span class="name">${cfg.label} — ${cfg.project}</span>
      </div>
      <div style="background:#F7F9FA;padding:8px 16px;border-bottom:1px solid var(--border);">
        <div class="line" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);">Standard: ${legendLine('regular')}</div>
        <div class="line" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sixh);">6-Stündler: ${legendLine('6h')}</div>
        <div class="line" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--helpline);">Helpline: ${legendLine('helpline')}</div>
      </div>`;

    const table = document.createElement('table');
    table.className = 'ov-table';
    const thead = document.createElement('tr');
    thead.innerHTML = '<th>Mitarbeiter</th><th>NPS</th>' + cfg.products.map(p=>`<th>${p}</th>`).join('') + '<th>Gesamt-CR</th>';
    table.appendChild(thead);

    teamAgents.forEach(agent=>{
      const tr = document.createElement('tr');
      const myTargets = agentTargets(agent);
      const dotHtml = (agent.category && agent.category !== 'regular') ? `<span class="cat-dot ${CATEGORY_CSS[agent.category]}"></span>` : '';
      let rowHtml = `<td class="ov-name">${dotHtml}${agent.name}</td>`;
      const npsStatus = trafficStatus(agent.nps||0, 70);
      rowHtml += `<td class="ov-val ${npsStatus}">${agent.nps||0}%</td>`;
      cfg.products.forEach((p,i)=>{
        const val = agent.sales[p]||0;
        const status = trafficStatus(val, myTargets[i]);
        rowHtml += `<td class="ov-val ${status}">${val}</td>`;
      });
      const cr = totalCr(agent);
      const crStatus = trafficStatus(parseFloat(cr.toFixed(2)), cfg.crTarget);
      rowHtml += `<td><span class="ov-pill ${crStatus}">${cr.toFixed(2)}%</span></td>`;
      tr.innerHTML = rowHtml;
      table.appendChild(tr);
    });

    teamDiv.appendChild(table);
    container.appendChild(teamDiv);
  });

  const foot = document.createElement('div');
  foot.className = 'ov-foot';
  foot.innerHTML = 'Grün = Ziel erreicht · Rot = unter Ziel &nbsp;·&nbsp; <span class="cat-dot sixh"></span>6-Stündler &nbsp; <span class="cat-dot helpline"></span>Helpline';
  container.appendChild(foot);
}

document.getElementById('add-agent-btn').addEventListener('click', ()=>{
  state.agents.push(makeAgent('Trikala01'));
  scheduleSave();
  renderAll();
});

document.getElementById('export-png-btn').addEventListener('click', ()=>{
  const target = document.getElementById('overview-capture');
  html2canvas(target, { backgroundColor: '#EDF1F4', scale: 2 }).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'team-uebersicht.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

loadState();
