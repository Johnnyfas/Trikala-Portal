}

// ============================================================
// COACHING-VEREINBARUNGEN & FOKUS DER WOCHE (ab v141)
// Zu jedem Coaching kann EINE konkrete Vereinbarung mit Überprüfungsdatum festgehalten werden.
// Ist sie fällig, erscheint sie im "Fokus der Woche" - samt Vorher/Nachher-Vergleich aus den
// Tageswerten. Das Ergebnis der Überprüfung liegt in state.coachReviews[eintragId] (eigener,
// pro Wert abgeglichener Bereich - Coaching-Einträge selbst werden nicht nachträglich verändert).
// ============================================================
function fkIsoDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fkParseDe(s){
  if(!s) return null;
  const m = String(s).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  const i = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(i) return new Date(+i[1], +i[2]-1, +i[3]);
  return null;
}
function fkFmt(d){ return d ? d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'}) : '–'; }
function fkNum(n, dec){ return (Math.round(n * Math.pow(10, dec||1)) / Math.pow(10, dec||1)).toLocaleString('de-DE'); }
// Zu welchem Mitarbeiter gehört ein Coaching-Verlauf-Eintrag?
function fkAgentForCv(key, cv){
  const byId = state.agents.find(a => a.id === key);
  if(byId) return byId;
  if(!cv || !cv.name) return null;
  const team = state.agents.filter(a => String(a.team) === String(cv.team) && a.name);
  const exact = team.find(a => a.name === cv.name);
  if(exact) return exact;
  // ältere Einträge stehen teils nur unter dem Nachnamen → nur bei eindeutigem Treffer zuordnen
  const fuzzy = team.filter(a => vlNameMatches(cv.name, a.name));
  return fuzzy.length === 1 ? fuzzy[0] : null;
}
// Alle Vereinbarungen (neueste zuerst)
function fkVereinbarungen(){
  const out = [];
  const reviews = state.coachReviews || {};
  Object.keys(state.coachverlauf || {}).forEach(key=>{
    const cv = state.coachverlauf[key];
    const agent = fkAgentForCv(key, cv);
    (cv && cv.eintraege || []).forEach(e=>{
      if(!e || !e.vereinbarung) return;
      out.push({ entry: e, agent, review: reviews[e.id] || null, pruef: fkParseDe(e.pruefDatum), coachDate: fkParseDe(e.datum) });
    });
  });
  return out.sort((a,b)=>(b.coachDate||0) - (a.coachDate||0));
}
// Wert eines Monatsfelds (NPS, LQ, ...) nur, wenn er im laufenden Monat eingetragen wurde
function fkCurVal(agent, f, now){
  const v = agent[f];
  if(typeof v !== 'number' || !(v > 0)) return null;
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const ts = agGetTs(agent, 'f|' + f);
  const isOkt26 = now.getFullYear() === 2026 && now.getMonth() === 9;
  return (ts >= monthStart || (ts === 0 && isOkt26)) ? v : null;
}
// Vorher/Nachher: Ø Abschlüsse pro Arbeitstag (Arbeitstag = Tag, an dem im Team Werte erfasst wurden)
function fkWirkung(agent, since, product){
  if(!agent || !since) return null;
  const cfg = TEAM_CONFIGS[agent.team]; if(!cfg) return null;
  const prods = product ? [product] : cfg.products;
  const teamDays = new Set();
  state.agents.filter(a => String(a.team) === String(agent.team)).forEach(a=>{
    Object.keys(a.tageswerte || {}).forEach(mk=>{
      Object.keys(a.tageswerte[mk] || {}).forEach(d=>{
        const dv = a.tageswerte[mk][d];
        if(dv && dv.sales && Object.values(dv.sales).some(v => typeof v === 'number')) teamDays.add(`${mk}-${String(d).padStart(2,'0')}`);
      });
    });
  });
  const val = iso => {
    const mk = iso.slice(0,7), d = String(parseInt(iso.slice(8)));
    const dv = agent.tageswerte && agent.tageswerte[mk] && agent.tageswerte[mk][d];
    if(!dv || !dv.sales) return 0;
    return prods.reduce((s,p)=> s + (typeof dv.sales[p] === 'number' ? dv.sales[p] : 0), 0);
  };
  const sinceIso = fkIsoDate(since);
  const todayIso = fkIsoDate(new Date());
  const days = [...teamDays].sort();
  const before = days.filter(d => d < sinceIso).slice(-10);
  const after = days.filter(d => d > sinceIso && d <= todayIso);
  if(before.length < 2 || after.length < 2) return { tooFew: true, nB: before.length, nA: after.length };
  const avgB = before.reduce((s,d)=>s+val(d),0) / before.length;
  const avgA = after.reduce((s,d)=>s+val(d),0) / after.length;
  return { avgB, avgA, nB: before.length, nA: after.length, label: product ? productLabel(product, agent.team) : 'Abschlüsse gesamt' };
}
function fkWirkungHtml(w){
  if(!w) return '';
  if(w.tooFew) return `<div class="fk-wirkung muted">Vorher/Nachher: noch zu wenig Tageswerte (${w.nB} Tage vorher, ${w.nA} nachher – je mind. 2 nötig)</div>`;
  const diff = w.avgA - w.avgB;
  const pct = w.avgB > 0 ? Math.round(diff / w.avgB * 100) : null;
  const cls = diff > 0.05 ? 'up' : (diff < -0.05 ? 'down' : 'flat');
  const arrow = cls === 'up' ? '▲' : cls === 'down' ? '▼' : '●';
  return `<div class="fk-wirkung ${cls}">Ø ${w.label} pro Arbeitstag: <b>${fkNum(w.avgB,2)} → ${fkNum(w.avgA,2)}</b> ${arrow}${pct !== null ? ` ${pct > 0 ? '+' : ''}${pct} %` : ''} <span>(${w.nB} Tage vorher / ${w.nA} nachher)</span></div>`;
}

  const filters = document.createElement('div');

  [['alle','Alle Teams'], ...Object.keys(TEAM_CONFIGS).map(t=>[t, TEAM_CONFIGS[t].label])].forEach(([v,l])=>{
    const b = document.createElement('button');
    b.className = 'fk-chip' + (fkTeamFilter === v ? ' active' : '');
    b.textContent = l;
    b.addEventListener('click', ()=>{ fkTeamFilter = v; renderFokus(); });
    filters.appendChild(b);
  });
  filters.insertBefore(buildLeaderFilter(()=>renderFokus()), filters.firstChild);
  head.appendChild(filters);
  container.appendChild(head);

  // ---------- 1) Fällige Überprüfungen ----------
  const alleV = fkVereinbarungen().filter(v => v.agent && inTeam(v.agent));
  const faellig = alleV.filter(v => !v.review && v.pruef && fkIsoDate(v.pruef) <= todayIso)
    .sort((a,b)=> a.pruef - b.pruef);
  const sec1 = document.createElement('div');
  sec1.className = 'fk-section';
  sec1.innerHTML = `<div class="fk-sec-title">⏰ Fällige Überprüfungen <span>${faellig.length}</span></div>`;
  if(!faellig.length){
    sec1.innerHTML += `<div class="fk-empty">Keine fälligen Vereinbarungen. Tipp: Beim Erfassen eines Coachings unter „🤝 Vereinbarung & Nachkontrolle“ ein konkretes Verhalten festhalten – dann erinnert dich das Board hier an die Überprüfung.</div>`;
  }
  faellig.forEach(v=>{
    const card = document.createElement('div');
    card.className = 'fk-card fk-due';
    const overdue = Math.round((new Date(todayIso) - new Date(fkIsoDate(v.pruef))) / 86400000);
    const w = fkWirkung(v.agent, v.coachDate, v.entry.fokusProdukt || null);
    card.innerHTML = `
      <div class="fk-card-top">
        <div><div class="fk-name">${v.agent.name}</div>
        <div class="fk-meta">${TEAM_CONFIGS[v.agent.team]?.label || ''} · Coaching am ${fkFmt(v.coachDate)}${v.entry.coach ? ' von ' + v.entry.coach : ''} · fällig ${overdue > 0 ? 'seit ' + overdue + ' Tag' + (overdue>1?'en':'') : 'heute'}</div></div>
      </div>
      <div class="fk-vereinbarung">🤝 ${v.entry.vereinbarung}</div>
      ${fkWirkungHtml(w)}
      <div class="fk-q">Wurde die Vereinbarung umgesetzt? (z.B. nach dem nächsten Mithören)</div>`;
    const actions = document.createElement('div');
    actions.className = 'fk-actions';
    [['umgesetzt','✓ Umgesetzt','ok'],['teilweise','½ Teilweise','warn'],['nicht','✗ Nicht umgesetzt','bad']].forEach(([st,lbl,cls])=>{
      const b = document.createElement('button');
      b.className = 'fk-btn ' + cls;
      b.textContent = lbl;
      b.addEventListener('click', ()=>fkSetReview(v.entry.id, st));
      actions.appendChild(b);
    });
    const nb = document.createElement('button');
    nb.className = 'fk-btn';
    nb.textContent = '🗣️ Folge-Coaching erfassen';
    nb.title = 'Öffnet ein neues Coaching mit derselben Vereinbarung als Vorlage';
    nb.addEventListener('click', ()=>fkOpenCoachingForm(v.agent.id, { vereinbarung: v.entry.vereinbarung, fokusProdukt: v.entry.fokusProdukt || '' }));
    actions.appendChild(nb);
    actions.appendChild(kiPrepButton(v.agent.id));
    card.appendChild(actions);
    sec1.appendChild(card);
  });
  container.appendChild(sec1);

  // ---------- 2) Wen coachen? ----------
  const agents = state.agents.filter(a => a.name && a.name.trim() && a.category !== 'schulung' && a.category !== 'work' && inTeam(a));
  const teamInfo = {};
  Object.keys(TEAM_CONFIGS).forEach(t=>{
    const ta = state.agents.filter(a => String(a.team) === t && a.name && a.name.trim() && a.category !== 'schulung' && a.category !== 'work');
    teamInfo[t] = hrWorkdayInfo(ta, now);
  });
  const prevD = vormonatDate(now);
  const openV = new Set(alleV.filter(v => !v.review && v.pruef && fkIsoDate(v.pruef) > todayIso).map(v => v.agent.id));
  const planned = {};
  (state.coachingPlan || []).forEach(p=>{ if(p && p.agentId && p.datum && p.datum >= todayIso && (!planned[p.agentId] || p.datum < planned[p.agentId])) planned[p.agentId] = p.datum; });

  const rated = agents.map(agent=>{
    const cfg = TEAM_CONFIGS[agent.team];
    const info = teamInfo[agent.team];
    const reasons = []; let score = 0; let onTrack = null, avgPct = 1, nT = 0;
    if(cfg && info && info.hasData && info.elapsed >= 3){
      const targets = agentTargets(agent);
      const ist = hrAgentSums(agent, info.mk, cfg.products);
      onTrack = 0; let pctSum = 0;
      cfg.products.forEach((p,i)=>{
        const ziel = targets[i] || 0; if(!ziel) return;
        const prog = ist[p] + (ist[p] / info.elapsed) * info.remaining;
        const pct = prog / ziel; nT++; pctSum += Math.min(pct, 1.5);
        if(pct >= 1){ onTrack++; return; }
        if(pct < 0.85){
          const perDay = info.remaining > 0 ? Math.max(0, (ziel - ist[p]) / info.remaining) : 0;
          reasons.push({ cls: pct < 0.6 ? 'bad' : 'warn', text: `${productLabel(p, agent.team)}: Prognose ${fkNum(prog)} von ${ziel}${info.remaining ? ` · braucht ${fkNum(perDay)}/Tag` : ''}` });
          score += (0.85 - pct) * 40;
        }
      });
      avgPct = nT ? pctSum / nT : 1;
    }
    if(cfg){
      const nps = fkCurVal(agent, 'nps', now), lq = fkCurVal(agent, 'lq', now);
      if(nps !== null && nps < cfg.npsTarget){ reasons.push({ cls: nps < cfg.npsTarget - 8 ? 'bad' : 'warn', text: `NPS ${fkNum(nps)} % (Ziel ${cfg.npsTarget} %)` }); score += (cfg.npsTarget - nps) * 1.5; }
      const prevNps = (agentVerlaufMonat(agent, prevD.getFullYear(), VL_MONATE[prevD.getMonth()]) || {}).nps;
      if(nps !== null && prevNps > 0 && prevNps - nps >= 5){ reasons.push({ cls: 'warn', text: `NPS gefallen: ${fkNum(prevNps)} → ${fkNum(nps)} %` }); score += 10; }
      if(lq !== null && cfg.lqTarget && lq < cfg.lqTarget){ reasons.push({ cls: 'warn', text: `LQ ${fkNum(lq)} % (Ziel ${cfg.lqTarget} %)` }); score += (cfg.lqTarget - lq) * 1.2; }
    }
    const last = fkParseDe(agent.coachingDatum);
    const daysSince = last ? Math.round((new Date(todayIso) - new Date(fkIsoDate(last))) / 86400000) : null;
    if(daysSince === null){ reasons.push({ cls: 'info', text: 'Noch kein Coaching erfasst' }); score += 8; }
    else if(daysSince > 30){ reasons.push({ cls: 'info', text: `Letztes Coaching vor ${daysSince} Tagen` }); score += Math.min(20, 6 + (daysSince - 30) / 3); }
    const notes = [];
    if(planned[agent.id]){ notes.push(`📅 Coaching geplant am ${fkFmt(fkParseDe(planned[agent.id]))}`); score *= 0.5; }
    if(leaderFilter === 'alle' && agent.fuehrungskraft) notes.unshift('👤 ' + agent.fuehrungskraft);
    if(openV.has(agent.id)) notes.push('🤝 Vereinbarung läuft');
    const lh = fingerLastHebel(agent);
    if(lh) notes.push(`🎯 letzter Hebel: ${lh.finger.icon} ${lh.finger.name} (${lh.datum.slice(0,6)})`);
    return { agent, reasons, score, notes, onTrack, nT, avgPct };
  });

  const coachen = rated.filter(r => r.score >= 12 && r.reasons.some(x => x.cls !== 'info')).sort((a,b)=>b.score - a.score);
  const sec2 = document.createElement('div');
  sec2.className = 'fk-section';
  sec2.innerHTML = `<div class="fk-sec-title">🔎 Wen diese Woche coachen? <span>${coachen.length}</span></div>`;
  if(!coachen.length){
    sec2.innerHTML += `<div class="fk-empty">Aktuell gibt es keine auffälligen Rückstände. ${Object.values(teamInfo).some(i=>i.hasData && i.elapsed < 3) ? 'Die Hochrechnung startet ab dem 3. Arbeitstag des Monats.' : ''}</div>`;
  }
  const limit = fkShowAll ? coachen.length : 8;
  coachen.slice(0, limit).forEach((r, idx)=>{
    const card = document.createElement('div');
    card.className = 'fk-card';
    card.innerHTML = `
      <div class="fk-card-top">
        <div class="fk-rank">${idx+1}</div>
        <div style="flex:1;min-width:0;"><div class="fk-name">${r.agent.name}${r.agent.category && r.agent.category !== 'regular' ? ` <span class="hr-cat">${CATEGORY_LABELS[r.agent.category] || r.agent.category}</span>` : ''}</div>
        <div class="fk-meta">${TEAM_CONFIGS[r.agent.team]?.label || ''}${r.onTrack !== null ? ` · auf Kurs bei ${r.onTrack}/${r.nT} Zielen` : ''}${r.notes.length ? ' · ' + r.notes.join(' · ') : ''}</div></div>
      </div>
      <div class="fk-reasons">${r.reasons.map(x=>`<span class="fk-reason ${x.cls}">${x.text}</span>`).join('')}</div>`;
    const actions = document.createElement('div');
    actions.className = 'fk-actions';
    const b = document.createElement('button');
    b.className = 'fk-btn primary';
    b.textContent = '🗣️ Coaching erfassen';
    b.addEventListener('click', ()=>fkOpenCoachingForm(r.agent.id));
    actions.appendChild(b);
    actions.appendChild(kiPrepButton(r.agent.id));
    card.appendChild(actions);
    sec2.appendChild(card);
  });
  if(coachen.length > 8){
    const more = document.createElement('button');
    more.className = 'fk-more';
    more.textContent = fkShowAll ? 'Weniger anzeigen' : `Alle ${coachen.length} anzeigen`;
    more.addEventListener('click', ()=>{ fkShowAll = !fkShowAll; renderFokus(); });
    sec2.appendChild(more);
  }
  container.appendChild(sec2);

  // ---------- 3) Anerkennung verdient ----------
  const lob = [];
  rated.forEach(r=>{
    const cfg = TEAM_CONFIGS[r.agent.team];
    const nps = cfg ? fkCurVal(r.agent, 'nps', now) : null;
    if(r.onTrack !== null && r.nT && r.onTrack >= Math.min(4, r.nT) && (nps === null || nps >= cfg.npsTarget)){
      lob.push({ agent: r.agent, text: `Auf Kurs bei ${r.onTrack}/${r.nT} Zielen${nps !== null ? ` · NPS ${fkNum(nps)} %` : ''}`, sort: 2 + r.avgPct });
    }
  });
  alleV.filter(v => v.review && v.review.status === 'umgesetzt' && v.review.datum >= fkIsoDate(new Date(now.getTime() - 14*86400000))).forEach(v=>{
    if(lob.some(l => l.agent.id === v.agent.id)) return;
    lob.push({ agent: v.agent, text: `Vereinbarung umgesetzt: „${v.entry.vereinbarung.length > 60 ? v.entry.vereinbarung.slice(0,57) + '…' : v.entry.vereinbarung}“`, sort: 1 });
  });
  lob.sort((a,b)=>b.sort - a.sort);
  const sec3 = document.createElement('div');
  sec3.className = 'fk-section';
  sec3.innerHTML = `<div class="fk-sec-title">👏 Anerkennung verdient <span>${lob.length}</span></div>
    <div class="fk-hint">Positives Feedback stärkt das Selbstvertrauen – oft der Schlüssel, damit Mitarbeiter Verkaufschancen auch wirklich ansprechen.</div>`;
  if(!lob.length) sec3.innerHTML += `<div class="fk-empty">Noch niemand mit mind. 4 Zielen auf Kurs.</div>`;
  const lobWrap = document.createElement('div');
  lobWrap.className = 'fk-lob';
  lob.slice(0, 8).forEach(l=>{
    const el = document.createElement('div');
    el.className = 'fk-lob-item';
    el.innerHTML = `<b>${l.agent.name}</b><span>${l.text}</span>`;
    lobWrap.appendChild(el);
  });
  sec3.appendChild(lobWrap);
  container.appendChild(sec3);

  // ---------- Team-Analyse 5-Finger-Pitch ----------
  container.appendChild(buildFingerTeamAnalyse(fkTeamFilter, a => fkMatchesLeader(a, leaderFilter)));

  // ---------- 4) Laufende Vereinbarungen ----------
  const laufend = alleV.filter(v => !v.review && v.pruef && fkIsoDate(v.pruef) > todayIso).sort((a,b)=>a.pruef - b.pruef);
  const erledigt = alleV.filter(v => v.review).slice(0, 10);
  if(laufend.length || erledigt.length){
    const sec4 = document.createElement('div');
    sec4.className = 'fk-section';
    sec4.innerHTML = `<div class="fk-sec-title">🤝 Laufende Vereinbarungen <span>${laufend.length}</span></div>`;
    const list = document.createElement('div');
    list.className = 'fk-list';
    laufend.forEach(v=>{
      list.innerHTML += `<div class="fk-list-row"><b>${v.agent.name}</b><span class="fk-list-text">${v.entry.vereinbarung}</span><span class="fk-list-date">Überprüfung ${fkFmt(v.pruef)}</span></div>`;
    });
    if(erledigt.length){
      const stTxt = { umgesetzt: '✓ umgesetzt', teilweise: '½ teilweise', nicht: '✗ nicht umgesetzt' };
      list.innerHTML += `<div class="fk-list-sub">Zuletzt überprüft</div>`;
      erledigt.forEach(v=>{
        list.innerHTML += `<div class="fk-list-row"><b>${v.agent.name}</b><span class="fk-list-text">${v.entry.vereinbarung}</span><span class="fk-list-date st-${v.review.status}">${stTxt[v.review.status] || v.review.status} · ${fkFmt(fkParseDe(v.review.datum))}</span></div>`;
      });
    }
    sec4.appendChild(list);
    container.appendChild(sec4);
  }
  updateFokusBadge();
}

// Beobachtungsbogen (je Finger 3 konkret beobachtbare Punkte), daraus automatisch ein
// Gesprächsleitfaden für das Feedback (Selbsteinschätzung → Stärke → EIN Hebel → Übung →

const FINGER_MODEL = [
  { key:'daumen', icon:'①', name:'Daumen', thema:'Einstellung & Mut',

    vereinbarung:'Jedes Angebot mit „Das bedeutet für Sie …“ an den Bedarf des Kunden knüpfen' },

    staerke:'Führt sicher zum Abschluss',

    vereinbarung:'Nach jedem Angebot eine klare Abschlussfrage stellen' }
];
const FINGER_VAL = { ok: 2, half: 1, nok: 0 };
// Punktzahl je Finger (0–2) aus einer Bewertung {d1:'ok', ...}; null = nicht bewertet
function fingerScores(bew){
  const out = {};
  FINGER_MODEL.forEach(f=>{
    const vals = f.anchors.map(a => bew && bew[a.id]).filter(v => v in FINGER_VAL).map(v => FINGER_VAL[v]);
    out[f.key] = vals.length ? vals.reduce((s,v)=>s+v,0) / vals.length : null;
  });
  return out;
}
// Stärke (bester Finger, mind. 1,5) und Hebel (schwächster Finger, unter 1,5; bei Gleichstand der
// "frühere" Finger - Einstellung vor Technik)
function fingerAnalyse(bew){
  const sc = fingerScores(bew);
  const rated = FINGER_MODEL.filter(f => sc[f.key] !== null);
  if(!rated.length) return null;
  let best = null, weak = null;
  rated.forEach(f=>{
    if(sc[f.key] >= 1.5 && (!best || sc[f.key] > sc[best.key])) best = f;
    if(sc[f.key] < 1.5 && (!weak || sc[f.key] < sc[weak.key])) weak = f;
  });
  return { scores: sc, staerke: best, hebel: weak };
}
function fingerColor(v){ return v === null || v === undefined ? '#E5E7EB' : (v >= 1.5 ? 'var(--teal)' : (v >= 0.75 ? 'var(--amber)' : 'var(--red)')); }
// kompaktes 5-Balken-Profil
function fingerBarsHtml(sc, small){
  return `<div class="fg-bars${small?' small':''}">` + FINGER_MODEL.map(f=>{
    const v = sc ? sc[f.key] : null;
    const h = v === null || v === undefined ? 8 : Math.max(8, Math.round(v / 2 * 100));
    return `<div class="fg-bar" title="${f.name} – ${f.thema}: ${v === null || v === undefined ? 'nicht bewertet' : Math.round(v/2*100) + ' %'}"><div class="fg-bar-track"><div class="fg-bar-fill" style="height:${h}%;background:${fingerColor(v)};"></div></div><span>${f.icon}</span></div>`;
  }).join('') + `</div>`;
}

// ---- Formular-Abschnitt: Beobachtungsbogen + Live-Gesprächsleitfaden ----
function buildFingerSection(state0, onSuggestVereinbarung){
  const bew = state0.bew, notes = state0.notes;
  const wrap = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'cf-section-title';
  title.textContent = '🖐️ Beobachtung nach dem 5-Finger-Pitch';
  wrap.appendChild(title);
  const hint = document.createElement('div');
  hint.className = 'cf-ver-hint';
  hint.textContent = 'Beim Mithören je Punkt bewerten: ✓ gezeigt · ½ teilweise · ✗ nicht gezeigt. Nicht Beobachtetes einfach leer lassen. Daraus entsteht unten automatisch dein Leitfaden für das Feedback-Gespräch.';
  wrap.appendChild(hint);

  const grid = document.createElement('div');
  grid.className = 'fg-grid';
  const guide = document.createElement('div');
  guide.className = 'fg-guide';

  const refreshGuide = ()=>{ guide.innerHTML = ''; guide.appendChild(buildFeedbackGuide(bew, notes, onSuggestVereinbarung)); };

  FINGER_MODEL.forEach(f=>{
    const box = document.createElement('div');
    box.className = 'fg-box';
    const h = document.createElement('div');
    h.className = 'fg-box-head';
    h.innerHTML = `<span class="fg-icon">${f.icon}</span><div><b>${f.name}</b><span>${f.thema}</span></div><div class="fg-score"></div>`;
    box.appendChild(h);
    const scoreEl = h.querySelector('.fg-score');
    const updScore = ()=>{
      const v = fingerScores(bew)[f.key];
      scoreEl.textContent = v === null ? '' : Math.round(v/2*100) + ' %';
      scoreEl.style.color = fingerColor(v);
    };
    f.anchors.forEach(a=>{
      const row = document.createElement('div');
      row.className = 'fg-row';
      const lbl = document.createElement('span');
      lbl.className = 'fg-row-text';
      lbl.textContent = a.text;
      const btns = document.createElement('div');
      btns.className = 'fg-btns';
      [['ok','✓'],['half','½'],['nok','✗']].forEach(([v,t])=>{
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'fg-btn fg-' + v + (bew[a.id] === v ? ' active' : '');
        b.textContent = t;
        b.title = v === 'ok' ? 'gezeigt' : v === 'half' ? 'teilweise' : 'nicht gezeigt';
        b.addEventListener('click', ()=>{
          bew[a.id] = bew[a.id] === v ? undefined : v;
          if(bew[a.id] === undefined) delete bew[a.id];
          [...btns.children].forEach(x=>x.classList.remove('active'));
          if(bew[a.id]) b.classList.add('active');
          updScore(); refreshGuide();
        });
        btns.appendChild(b);
      });
      row.appendChild(lbl); row.appendChild(btns);
      box.appendChild(row);
    });
    const note = document.createElement('input');
    note.type = 'text';
    note.className = 'fg-note';
    note.placeholder = 'Beispiel aus dem Call (optional) – z.B. was genau gesagt wurde';
    note.value = notes[f.key] || '';
    note.addEventListener('input', ()=>{ notes[f.key] = note.value; refreshGuide(); });
    box.appendChild(note);
    updScore();

  });
  wrap.appendChild(grid);

  const gTitle = document.createElement('div');
  gTitle.className = 'cf-section-title';
  gTitle.textContent = '🗣️ So führst du das Feedback-Gespräch';
  wrap.appendChild(gTitle);

}
function buildFeedbackGuide(bew, notes, onSuggestVereinbarung){
  const el = document.createElement('div');
  const an = fingerAnalyse(bew);
  if(!an){
    el.innerHTML = `<div class="fg-guide-empty">Bewerte oben beim Mithören die Punkte – dann erscheint hier Schritt für Schritt, worüber du sprichst: welche Stärke du lobst, an welchem einen Punkt ihr arbeitet und mit welcher Übung.</div>`;
    return el;
  }
  const gezeigt = f => f.anchors.filter(a => bew[a.id] === 'ok').map(a => a.text);
  const fehlt = f => f.anchors.filter(a => bew[a.id] === 'nok' || bew[a.id] === 'half').map(a => (bew[a.id] === 'half' ? '½ ' : '✗ ') + a.text);
  const steps = [];
  steps.push({ t:'Selbsteinschätzung zuerst', b:'Frag: <i>„Wie lief der Call aus deiner Sicht? Was lief gut, was würdest du beim nächsten Mal anders machen?“</i> Erst zuhören – wer sich selbst einschätzt, nimmt Feedback viel besser an.' });
  if(an.staerke){
    const ex = notes[an.staerke.key] ? ` Beispiel aus dem Call: <i>„${notes[an.staerke.key]}“</i>` : '';
    steps.push({ t:`Stärke anerkennen: ${an.staerke.icon} ${an.staerke.name}`, b:`<b>${an.staerke.staerke}.</b> Konkret benennen, was gut war:<ul>${gezeigt(an.staerke).map(x=>`<li>${x}</li>`).join('')}</ul>${ex}` });
  } else {
    steps.push({ t:'Stärke anerkennen', b:'Noch kein Finger klar stark bewertet – such trotzdem <b>eine</b> Sache aus dem Call, die gut war, und benenne sie konkret. Lob vor Kritik baut Unsicherheit ab.' });
  }
  if(an.hebel){
    const ex = notes[an.hebel.key] ? ` Beispiel aus dem Call: <i>„${notes[an.hebel.key]}“</i>` : '';
    steps.push({ t:`Genau EIN Hebel: ${an.hebel.icon} ${an.hebel.name} – ${an.hebel.thema}`, b:`Nur diesen Punkt ansprechen, nicht alles auf einmal:<ul>${fehlt(an.hebel).map(x=>`<li>${x}</li>`).join('')}</ul>${ex} Frag nach: <i>„${an.hebel.frage}“</i>` });
    steps.push({ t:'Kurz üben (2–3 Minuten)', b: an.hebel.uebung });
    const vorschlag = an.hebel.vereinbarung;
    const s5 = { t:'Vereinbarung festhalten', b:`Gemeinsam ein konkretes Verhalten vereinbaren – am besten in den Worten des Mitarbeiters. Vorschlag: <b>„${vorschlag}“</b>`, btn: vorschlag };
    steps.push(s5);
  } else {
    steps.push({ t:'Kein klarer Hebel', b:'Alle bewerteten Punkte wurden gut gezeigt. Nutze das Gespräch für Anerkennung und frag, was der Mitarbeiter selbst als Nächstes verbessern möchte – oder hör einen weiteren Call mit anderem Anliegen.' });
  }
  const ol = document.createElement('ol');
  ol.className = 'fg-steps';
  steps.forEach(s=>{
    const li = document.createElement('li');
    li.innerHTML = `<div class="fg-step-t">${s.t}</div><div class="fg-step-b">${s.b}</div>`;
    if(s.btn && onSuggestVereinbarung){
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'fk-btn';
      b.style.marginTop = '6px';
      b.textContent = '↓ Als Vereinbarung übernehmen';
      b.addEventListener('click', ()=>onSuggestVereinbarung(s.btn));
      li.appendChild(b);
    }
    ol.appendChild(li);
  });
  el.appendChild(ol);
  return el;
}

// ---- Entwicklungsprofil je Mitarbeiter (Coaching-Verlauf) ----
function buildFingerProfile(eintraege){
  const rated = (eintraege||[]).filter(e => e && e.fingerBewertung && Object.keys(e.fingerBewertung).length)
    .sort((a,b)=> (fkParseDe(b.datum)||0) - (fkParseDe(a.datum)||0));
  if(!rated.length) return null;
  const latest = fingerAnalyse(rated[0].fingerBewertung);
  const prev = rated[1] ? fingerScores(rated[1].fingerBewertung) : null;
  const el = document.createElement('div');
  el.className = 'fg-profile';
  const trend = FINGER_MODEL.map(f=>{
    const a = latest.scores[f.key], b = prev ? prev[f.key] : null;
    if(a === null || b === null || b === undefined) return '';
    const d = a - b;
    return Math.abs(d) < 0.01 ? '' : `<span class="fg-trend ${d>0?'up':'down'}">${f.icon} ${d>0?'▲':'▼'}</span>`;
  }).join('');
  el.innerHTML = `<div class="fg-profile-left">${fingerBarsHtml(latest.scores)}</div>
    <div class="fg-profile-right">
      <div class="fg-profile-title">Entwicklungsprofil · letztes Coaching ${rated[0].datum}${rated.length > 1 ? ` · ${rated.length} bewertete Coachings` : ''}</div>
      ${latest.staerke ? `<div>💪 Stärke: <b>${latest.staerke.name}</b> – ${latest.staerke.thema}</div>` : ''}
      ${latest.hebel ? `<div>🎯 Hebel: <b>${latest.hebel.name}</b> – ${latest.hebel.thema}</div>` : ''}
      ${trend ? `<div class="fg-trends">Seit dem Coaching davor: ${trend}</div>` : ''}
    </div>`;
  return el;
}
// Letzter Hebel eines Mitarbeiters (für "Wen coachen?")
function fingerLastHebel(agent){
  let best = null;
  Object.keys(state.coachverlauf || {}).forEach(key=>{
    const cv = state.coachverlauf[key];
    if(fkAgentForCv(key, cv) !== agent) return;
    (cv.eintraege||[]).forEach(e=>{
      if(!e.fingerBewertung || !Object.keys(e.fingerBewertung).length) return;
      const d = fkParseDe(e.datum);
      if(!best || (d && d > best.d)) best = { d, e };
    });
  });
  if(!best) return null;
  const an = fingerAnalyse(best.e.fingerBewertung);
  return an && an.hebel ? { finger: an.hebel, datum: best.e.datum } : null;
}
// ---- Team-Analyse: häufigste Lücken der letzten 60 Tage ----
function buildFingerTeamAnalyse(teamFilter, agentFilter){
  const since = new Date(Date.now() - 60*86400000);
  const counts = {}; // anchorId → {n, gap}
  const fingerSum = {}; FINGER_MODEL.forEach(f=>{ fingerSum[f.key] = { s:0, n:0 }; });
  let nCoachings = 0;
  Object.keys(state.coachverlauf || {}).forEach(key=>{
    const cv = state.coachverlauf[key];
    const agent = fkAgentForCv(key, cv);
    const team = agent ? agent.team : cv.team;
    if(teamFilter !== 'alle' && String(team) !== teamFilter) return;
    if(agentFilter && (!agent || !agentFilter(agent))) return;
    (cv.eintraege||[]).forEach(e=>{
      if(!e.fingerBewertung || !Object.keys(e.fingerBewertung).length) return;
      const d = fkParseDe(e.datum); if(d && d < since) return;
      nCoachings++;
      Object.keys(e.fingerBewertung).forEach(id=>{
        const v = e.fingerBewertung[id]; if(!(v in FINGER_VAL)) return;
        if(!counts[id]) counts[id] = { n:0, gap:0 };
        counts[id].n++; if(v !== 'ok') counts[id].gap++;
      });
      const sc = fingerScores(e.fingerBewertung);
      FINGER_MODEL.forEach(f=>{ if(sc[f.key] !== null){ fingerSum[f.key].s += sc[f.key]; fingerSum[f.key].n++; } });
    });
  });
  const sec = document.createElement('div');
  sec.className = 'fk-section';
  sec.innerHTML = `<div class="fk-sec-title">🖐️ Team-Analyse 5-Finger-Pitch <span>${nCoachings} Coaching${nCoachings===1?'':'s'} · 60 Tage</span></div>`;
  if(!nCoachings){
    sec.innerHTML += `<div class="fk-empty">Sobald Coachings mit dem Beobachtungsbogen erfasst werden, zeigt das Board hier, wo das Team insgesamt am meisten Unterstützung braucht – ideal für die Wahl des nächsten Workshop-Themas.</div>`;
    return sec;
  }
  const avg = {}; FINGER_MODEL.forEach(f=>{ avg[f.key] = fingerSum[f.key].n ? fingerSum[f.key].s / fingerSum[f.key].n : null; });
  const anchorById = {}; FINGER_MODEL.forEach(f=>f.anchors.forEach(a=>{ anchorById[a.id] = { a, f }; }));
  const gaps = Object.keys(counts).filter(id => anchorById[id] && counts[id].n >= 2)
    .map(id => ({ id, pct: counts[id].gap / counts[id].n, n: counts[id].n }))
    .filter(g => g.pct > 0).sort((a,b)=> b.pct - a.pct).slice(0, 3);
  const box = document.createElement('div');
  box.className = 'fg-team';
  box.innerHTML = `<div>${fingerBarsHtml(avg)}</div><div class="fg-team-gaps">
    <div class="fg-profile-title">Häufigste Lücken</div>
    ${gaps.length ? gaps.map(g=>`<div class="fg-gap"><b>${Math.round(g.pct*100)} %</b><span>${anchorById[g.id].f.icon} ${anchorById[g.id].a.text}</span><em>${g.n} Bewertungen</em></div>`).join('') : '<div class="fk-hint">Noch zu wenige Bewertungen (je Punkt mind. 2).</div>'}
    ${gaps.length ? `<div class="fk-hint" style="margin-top:8px;">💡 Workshop-Idee: ${anchorById[gaps[0].id].f.name} – ${anchorById[gaps[0].id].f.thema}. Übung: ${anchorById[gaps[0].id].f.uebung}</div>` : ''}
  </div>`;
  sec.appendChild(box);
  return sec;
}

// ============================================================
// ZUORDNUNG MITARBEITER → FÜHRUNGSKRAFT (ab v144)
// agent.fuehrungskraft = Name aus der Rollenliste im Standort-Überblick. Wird wie alle
// Mitarbeiterfelder pro Wert abgeglichen. Filter "Mitarbeiter von …" in Fokus der Woche und
// Hochrechnung; im Coaching-Formular stehen die eigenen Mitarbeiter oben.
// ============================================================
const FK_ROLE_ORDER = [['teamleiter','Teamleiter'], ['salescoach','Sales Coach'], ['qualitaetscoach','Qualitätscoach'], ['standortleiter','Standortleiter']];
function fkNorm(n){ return String(n || '').trim().toLowerCase(); }
// Alle Führungskräfte aus der Rollenliste: [{name, rolle}]
function fkAllLeaders(){
  const fk = state.fuehrungskraefte || {};
  const out = [], seen = new Set();
  FK_ROLE_ORDER.forEach(([key, label])=>{
    (Array.isArray(fk[key]) ? fk[key] : []).forEach(n=>{
      const name = String(n || '').trim();
      if(!name || seen.has(fkNorm(name))) return;
      seen.add(fkNorm(name));
      out.push({ name, rolle: label });
    });
  });
  return out;
}
// Eigener Name ohne Nachfrage-Dialog (Login-Name oder gespeicherter Coach-Name)
function fkMyName(){
  // currentUserName wird erst weiter unten im Skript angelegt - beim allerersten Zeichnen gibt es ihn noch nicht
  let u = '';
  try{ u = currentUserName || ''; }catch(e){ u = ''; }
  if(u) return u;
  try{ return localStorage.getItem('coach_display_name') || ''; }catch(e){ return ''; }
}
// Passt der eigene Name zu einer Führungskraft in der Liste? (auch "Ioannis" ↔ "Ioannis Fasoulas")
function fkMyLeaderName(){
  const me = fkNorm(fkMyName());
  if(!me) return '';
  const leaders = fkAllLeaders();
  const exact = leaders.find(l => fkNorm(l.name) === me);
  if(exact) return exact.name;
  const part = leaders.filter(l => fkNorm(l.name).startsWith(me + ' ') || me.startsWith(fkNorm(l.name) + ' '));
  return part.length === 1 ? part[0].name : '';
}
// Gewählter Filter (pro Browser gemerkt): 'alle' | '__ohne' | Name
function fkGetLeaderFilter(){
  let v = null;
  try{ v = localStorage.getItem('fk_leader_filter'); }catch(e){}
  if(v === null){ v = fkMyLeaderName() ? fkMyLeaderName() : 'alle'; }
  if(v !== 'alle' && v !== '__ohne' && !fkAllLeaders().some(l => l.name === v)) v = 'alle';
  return v;
}
function fkSetLeaderFilter(v){ try{ localStorage.setItem('fk_leader_filter', v); }catch(e){} }
function fkMatchesLeader(agent, filter){
  if(filter === 'alle') return true;
  if(filter === '__ohne') return !agent.fuehrungskraft || !fkAllLeaders().some(l => fkNorm(l.name) === fkNorm(agent.fuehrungskraft));
  return fkNorm(agent.fuehrungskraft) === fkNorm(filter);
}
// Auswahlfeld "Mitarbeiter von …" (für Fokus/Hochrechnung)
function buildLeaderFilter(onChange){
  const wrap = document.createElement('label');
  wrap.className = 'fk-leader-filter';
  wrap.innerHTML = '<span>👤 Mitarbeiter von</span>';
  const sel = document.createElement('select');
  const cur = fkGetLeaderFilter();
  const me = fkMyLeaderName();
  const counts = {};
  state.agents.forEach(a=>{ if(a.name && a.name.trim()) counts[fkNorm(a.fuehrungskraft)] = (counts[fkNorm(a.fuehrungskraft)]||0) + 1; });
  const opts = [['alle','Alle Führungskräfte']]
    .concat(fkAllLeaders().map(l => [l.name, `${l.name}${l.name === me ? ' (ich)' : ''} · ${l.rolle} · ${counts[fkNorm(l.name)]||0} MA`]))
    .concat([['__ohne','Ohne Zuordnung']]);
  sel.innerHTML = opts.map(([v,t]) => `<option value="${String(v).replace(/"/g,'&quot;')}" ${v===cur?'selected':''}>${t}</option>`).join('');
  sel.addEventListener('change', ()=>{ fkSetLeaderFilter(sel.value); onChange(); });
  wrap.appendChild(sel);
  return wrap;
}
// Auswahlfeld auf der Mitarbeiterkarte
function buildAgentLeaderSelect(agent){
  const row = document.createElement('div');
  row.className = 'fk-assign-row';
  const leaders = fkAllLeaders();
  const sel = document.createElement('select');
  sel.className = 'fk-assign';
  const cur = agent.fuehrungskraft || '';
  const known = leaders.some(l => l.name === cur);
  sel.innerHTML = `<option value="">– keine Führungskraft –</option>` +
    leaders.map(l => `<option value="${l.name.replace(/"/g,'&quot;')}" ${l.name===cur?'selected':''}>${l.name} (${l.rolle})</option>`).join('') +
    (cur && !known ? `<option value="${cur.replace(/"/g,'&quot;')}" selected>${cur} (nicht mehr in der Rollenliste)</option>` : '');
  sel.title = leaders.length ? 'Welche Führungskraft coacht diesen Mitarbeiter?' : 'Zuerst oben bei den Rollen Namen eintragen';
  sel.addEventListener('change', ()=>{ agent.fuehrungskraft = sel.value; scheduleSave(); });
  row.innerHTML = '<span>👤</span>';
  row.appendChild(sel);
  return row;
}

// ---- Unterreiter "Team-Zuordnung" im Coaching-Dashboard ----
let zoTeamFilter = 'alle';
let zoNurOhne = false;
let zoLeaderFilter = 'alle';
const zoSelected = new Set();
function renderZuordnung(){
  const container = document.getElementById('zuordnung-container');
  if(!container) return;
  container.innerHTML = '';
  const leaders = fkAllLeaders();
  const named = state.agents.filter(a => a.name && a.name.trim() && a.category !== 'work');
  const known = a => leaders.some(l => fkNorm(l.name) === fkNorm(a.fuehrungskraft));

  const head = document.createElement('div');
  head.className = 'fk-head';
  head.innerHTML = `<div><div class="fk-title">👥 Team-Zuordnung</div>
    <div class="fk-sub">Lege fest, welche Führungskraft welche Mitarbeiter coacht. Danach sieht jede Führungskraft im Fokus der Woche und in der Hochrechnung automatisch ihre eigenen Mitarbeiter. Die Namen der Führungskräfte kommen aus den Rollen im Standort-Überblick.</div></div>`;
  container.appendChild(head);

  if(!leaders.length){
    const e = document.createElement('div');
    e.className = 'fk-empty';
    e.innerHTML = 'Es sind noch keine Führungskräfte eingetragen. Trage sie zuerst im <b>Standort-Überblick</b> bei den Rollen (Teamleiter, Sales Coach, …) ein.';
    const b = document.createElement('button');
    b.className = 'fk-btn primary';
    b.style.marginTop = '10px';
    b.textContent = 'Zum Standort-Überblick';
    b.addEventListener('click', ()=>switchTab('coaching'));
    e.appendChild(document.createElement('br'));
    e.appendChild(b);
    container.appendChild(e);
    return;
  }

  // Übersicht je Führungskraft (anklickbar = filtern)
  const sum = document.createElement('div');
  sum.className = 'zo-summary';
  const ohne = named.filter(a => !known(a)).length;
  [...leaders.map(l => ({ v: l.name, t: l.name, sub: l.rolle, n: named.filter(a => fkNorm(a.fuehrungskraft) === fkNorm(l.name)).length })),
   { v: '__ohne', t: 'Ohne Zuordnung', sub: ohne ? 'bitte zuordnen' : 'alle zugeordnet ✓', n: ohne, warn: ohne > 0 }].forEach(x=>{
    const c = document.createElement('button');
    c.className = 'zo-sum-card' + (zoLeaderFilter === x.v ? ' active' : '') + (x.warn ? ' warn' : '');
    c.innerHTML = `<b>${x.n}</b><span>${x.t}</span><em>${x.sub}</em>`;
    c.addEventListener('click', ()=>{ zoLeaderFilter = zoLeaderFilter === x.v ? 'alle' : x.v; renderZuordnung(); });
    sum.appendChild(c);
  });
  container.appendChild(sum);

  // Filter + Sammel-Zuordnung
  const bar = document.createElement('div');
  bar.className = 'zo-bar';
  const chips = document.createElement('div');
  chips.className = 'fk-filters';
  [['alle','Alle Teams'], ...Object.keys(TEAM_CONFIGS).map(t=>[t, TEAM_CONFIGS[t].label])].forEach(([v,l])=>{
    const b = document.createElement('button');
    b.className = 'fk-chip' + (zoTeamFilter === v ? ' active' : '');
    b.textContent = l;
    b.addEventListener('click', ()=>{ zoTeamFilter = v; renderZuordnung(); });
    chips.appendChild(b);
  });
  const ohneChip = document.createElement('button');
  ohneChip.className = 'fk-chip' + (zoNurOhne ? ' active' : '');
  ohneChip.textContent = 'Nur ohne Zuordnung';
  ohneChip.addEventListener('click', ()=>{ zoNurOhne = !zoNurOhne; renderZuordnung(); });
  chips.appendChild(ohneChip);
  bar.appendChild(chips);

  const bulk = document.createElement('div');
  bulk.className = 'zo-bulk';
  const bulkSel = document.createElement('select');
  bulkSel.className = 'fk-assign';
  bulkSel.innerHTML = `<option value="">Ausgewählte zuordnen an …</option>` + leaders.map(l => `<option value="${l.name.replace(/"/g,'&quot;')}">${l.name} (${l.rolle})</option>`).join('') + `<option value="__none">– Zuordnung entfernen –</option>`;
  const bulkBtn = document.createElement('button');
  bulkBtn.className = 'fk-btn primary';
  bulkBtn.textContent = `Übernehmen (${zoSelected.size})`;
  bulkBtn.disabled = !zoSelected.size;
  bulkBtn.addEventListener('click', ()=>{
    if(!bulkSel.value || !zoSelected.size) return;
    const val = bulkSel.value === '__none' ? '' : bulkSel.value;
    state.agents.forEach(a=>{ if(zoSelected.has(a.id)) a.fuehrungskraft = val; });
    zoSelected.clear();
    scheduleSave();
    renderZuordnung();
  });
  bulk.appendChild(bulkSel); bulk.appendChild(bulkBtn);
  bar.appendChild(bulk);
  container.appendChild(bar);

  // Liste je Team
  Object.keys(TEAM_CONFIGS).forEach(teamId=>{
    if(zoTeamFilter !== 'alle' && zoTeamFilter !== teamId) return;
    let list = named.filter(a => String(a.team) === teamId);
    if(zoNurOhne) list = list.filter(a => !known(a));
    if(zoLeaderFilter === '__ohne') list = list.filter(a => !known(a));
    else if(zoLeaderFilter !== 'alle') list = list.filter(a => fkNorm(a.fuehrungskraft) === fkNorm(zoLeaderFilter));
    if(!list.length) return;
    list.sort((a,b)=>a.name.localeCompare(b.name));
    const block = document.createElement('div');
    block.className = 'hr-team';
    const allSel = list.every(a => zoSelected.has(a.id));
    block.innerHTML = `<div class="hr-team-head"><span>${TEAM_CONFIGS[teamId].label} — ${TEAM_CONFIGS[teamId].project}</span><span class="hr-days">${list.length} Mitarbeiter</span></div>`;
    const t = document.createElement('table');
    t.className = 'zo-table';
    const hr = document.createElement('tr');
    hr.innerHTML = `<th style="width:36px;"><input type="checkbox" ${allSel ? 'checked' : ''} title="Alle auswählen"></th><th>Mitarbeiter</th><th>Kategorie</th><th>Führungskraft</th>`;
    hr.querySelector('input').addEventListener('change', e=>{
      list.forEach(a=>{ if(e.target.checked) zoSelected.add(a.id); else zoSelected.delete(a.id); });
      renderZuordnung();
    });
    t.appendChild(hr);
    list.forEach(a=>{
      const tr = document.createElement('tr');
      if(!known(a)) tr.className = 'zo-ohne';
      const cb = document.createElement('td');
      cb.innerHTML = `<input type="checkbox" ${zoSelected.has(a.id) ? 'checked' : ''}>`;
      cb.querySelector('input').addEventListener('change', e=>{
        if(e.target.checked) zoSelected.add(a.id); else zoSelected.delete(a.id);
        bulkBtn.textContent = `Übernehmen (${zoSelected.size})`;
        bulkBtn.disabled = !zoSelected.size;
      });
      const nm = document.createElement('td');
      nm.className = 'zo-name';
      nm.textContent = a.name;
      const cat = document.createElement('td');
      cat.innerHTML = `<span class="hr-cat" style="margin:0;">${CATEGORY_LABELS[a.category || 'regular'] || a.category}</span>`;
      const fkTd = document.createElement('td');
      const sel = buildAgentLeaderSelect(a).querySelector('select');
      sel.addEventListener('change', ()=>{ renderZuordnung(); });
      fkTd.appendChild(sel);
      tr.appendChild(cb); tr.appendChild(nm); tr.appendChild(cat); tr.appendChild(fkTd);
      t.appendChild(tr);
    });
    block.appendChild(t);
    container.appendChild(block);
  });
  if(!container.querySelector('.zo-table')){
    const e = document.createElement('div');
    e.className = 'fk-empty';
    e.textContent = zoNurOhne || zoLeaderFilter === '__ohne' ? 'Alle Mitarbeiter sind einer Führungskraft zugeordnet ✓' : 'Keine Mitarbeiter für diese Auswahl.';
    container.appendChild(e);
  }
}

// Sammelt pro Mitarbeiter alle relevanten Daten (richtig zugeordnet, auch ältere Einträge unter
// Nachnamen) - inkl. Tageswerte/Hochrechnung, 5-Finger-Bewertungen, Vereinbarungen mit Wirkung,
// Tagesziele und zuständige Führungskraft. Wird von "KI Analyse" und "Coaching vorbereiten" genutzt.
// ============================================================
function kiEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function kiInlineMd(s){
  return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
}
// Markdown (Überschriften, Listen, Tabellen, fett/kursiv) → HTML; Text wird vorher maskiert
function kiRenderMarkdown(text){
  const lines = kiEsc(text || '').split('\n');
  let html = '', i = 0, inList = false;
  while(i < lines.length){
    const line = lines[i];
    if(/^\s*\|.*\|\s*$/.test(line)){
      if(inList){ html += '</ul>'; inList = false; }
      const tl = [];
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ tl.push(lines[i]); i++; }
      const rows = tl.filter(l => !/^\s*\|[\s:|-]+\|\s*$/.test(l)).map(l => l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
      if(rows.length) html += '<table class="ki-table"><thead><tr>' + rows[0].map(c=>`<th>${kiInlineMd(c)}</th>`).join('') + '</tr></thead><tbody>' +
        rows.slice(1).map(r=>'<tr>' + r.map(c=>`<td>${kiInlineMd(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
      continue;
    }
    let m;
    if((m = /^###\s+(.*)/.exec(line)) || (m = /^##\s+(.*)/.exec(line)) || (m = /^#\s+(.*)/.exec(line))){
      if(inList){ html += '</ul>'; inList = false; }
      html += `<h4 class="ki-h">${kiInlineMd(m[1])}</h4>`; i++; continue;
    }
    if(/^\s*---+\s*$/.test(line)){ if(inList){ html += '</ul>'; inList = false; } html += '<hr class="ki-hr">'; i++; continue; }
    if((m = /^\s*(?:[-*]|\d+\.)\s+(.*)/.exec(line))){
      if(!inList){ html += '<ul class="ki-list">'; inList = true; }
      html += `<li>${kiInlineMd(m[1])}</li>`; i++; continue;
    }
    if(inList){ html += '</ul>'; inList = false; }
    if(line.trim() === ''){ html += '<div class="ki-gap"></div>'; i++; continue; }
    html += `<p class="ki-p">${kiInlineMd(line)}</p>`; i++;
  }
  if(inList) html += '</ul>';
  return html;
}

// Alle Coaching-/Workshop-/Gesprächseinträge eines Mitarbeiters (neueste zuerst)
function kiAgentEntries(agent){
  const del = new Set(state.deletedEntryIds || []);
  const out = [];
  Object.keys(state.coachverlauf || {}).forEach(key=>{
    const cv = state.coachverlauf[key];
    if(fkAgentForCv(key, cv) !== agent) return;
    (cv.eintraege || []).forEach(e=>{ if(e && !del.has(e.id)) out.push(e); });
  });
  return out.sort((a,b)=>(fkParseDe(b.datum)||0) - (fkParseDe(a.datum)||0));
}
// Monatsverlauf aus allen zugehörigen Verlaufs-Einträgen, chronologisch
function kiAgentMonths(agent){
  const months = {};
  verlaufEntriesForAgent(agent).forEach(vl=>{
    Object.keys(vl.monate || {}).forEach(k=>{
      const key = /^\d{4}-/.test(k) ? k : '2026-' + k;
      if(!months[key]) months[key] = vl.monate[k];
    });
  });
  const ord = k => { const [j, m] = k.split('-'); return parseInt(j) * 100 + VL_MONATE.indexOf(m); };
  return Object.keys(months).sort((a,b)=>ord(a) - ord(b)).map(k=>{
    const md = months[k] || {};
    const sales = md.sales || {};
    const r = { monat: k };
    ['cr','nps','lq','calls','cht'].forEach(f=>{ if(typeof md[f] === 'number' && md[f] > 0) r[f] = Math.round(md[f]*100)/100; });
    const stk = Object.values(sales).reduce((s,v)=>s + (typeof v === 'number' ? v : 0), 0);
    if(stk) { r.stueck_gesamt = stk; r.stueck = sales; }
    return r;
  }).filter(r => Object.keys(r).length > 1);
}
function kiTeamFingerGaps(teamId){
  const counts = {};
  Object.keys(state.coachverlauf || {}).forEach(key=>{
    const cv = state.coachverlauf[key];
    const ag = fkAgentForCv(key, cv);
    if(!ag || String(ag.team) !== String(teamId)) return;
    (cv.eintraege||[]).forEach(e=>{
      Object.entries(e.fingerBewertung || {}).forEach(([id,v])=>{
        if(!(v in FINGER_VAL)) return;
        if(!counts[id]) counts[id] = { n:0, gap:0 };
        counts[id].n++; if(v !== 'ok') counts[id].gap++;
      });
    });
  });
  const txt = {}; FINGER_MODEL.forEach(f=>f.anchors.forEach(a=>{ txt[a.id] = `${f.name}: ${a.text}`; }));
  return Object.keys(counts).filter(id=>txt[id] && counts[id].n >= 2)
    .map(id=>({ punkt: txt[id], nicht_oder_teilweise_gezeigt_prozent: Math.round(counts[id].gap / counts[id].n * 100), bewertungen: counts[id].n }))
    .sort((a,b)=>b.nicht_oder_teilweise_gezeigt_prozent - a.nicht_oder_teilweise_gezeigt_prozent).slice(0, 5);
}
// Daten eines Mitarbeiters für die KI
function kiAgentData(agent, now, teamInfo){
  const cfg = TEAM_CONFIGS[agent.team];
  const targets = agentTargets(agent);
  const r1 = n => Math.round(n * 10) / 10;
  const d = {
    name: agent.name,
    team: agent.team,
    kategorie: CATEGORY_LABELS[agent.category || 'regular'] || agent.category,
    fuehrungskraft: agent.fuehrungskraft || null,
    ziele: Object.assign({ nps: cfg.npsTarget, lq: cfg.lqTarget, cr: cfg.crTarget },
      { produkte: Object.fromEntries(cfg.products.map((p,i)=>[productLabel(p, agent.team), targets[i] || 0])) })
  };
  // laufender Monat (NPS/LQ/Calls/CHT nur, wenn in diesem Monat eingetragen)
  const akt = { monat: now.toLocaleString('de-DE', {month:'long', year:'numeric'}) };
  ['calls','nps','lq','cht'].forEach(f=>{ const v = fkCurVal(agent, f, now); if(v !== null) akt[f] = v; });
  const info = teamInfo[agent.team];
  if(info && info.hasData){
    const ist = hrAgentSums(agent, info.mk, cfg.products);
    akt.stueck_bisher = Object.fromEntries(cfg.products.map(p=>[productLabel(p, agent.team), ist[p]]));
    const stk = cfg.products.filter(p => p !== 'BOJ').reduce((s,p)=>s + ist[p], 0);
    if(akt.calls) akt.cr = r1(stk / akt.calls * 100);
    if(info.elapsed >= 2){
      akt.hochrechnung = { arbeitstag: info.elapsed, von: info.total, prognose_monatsende: Object.fromEntries(cfg.products.map((p,i)=>{
        const prog = ist[p] + (ist[p] / info.elapsed) * info.remaining;
        return [productLabel(p, agent.team), { prognose: r1(prog), ziel: targets[i] || 0, prozent: targets[i] ? Math.round(prog / targets[i] * 100) : null }];
      })) };
    }
  }
  d.aktueller_monat = akt;
  d.monatsverlauf = kiAgentMonths(agent);
  // Coachings mit 5-Finger-Auswertung und Vereinbarung
  const reviews = state.coachReviews || {};
  const entries = kiAgentEntries(agent);
  const last = entries.find(e => e.stil !== 'Workshop');
  d.letztes_coaching = last ? last.datum : 'noch keins';
  d.coachings = entries.slice(0, 8).map(e=>{
    const c = { datum: e.datum, art: e.stil || 'Coaching' };
    if(e.thema) c.thema = e.thema;
    if(e.coach) c.coach = e.coach;
    if(e.workshopTitel) c.workshop = e.workshopTitel;
    if(e.text && e.text !== '(Coaching ohne Notiz)') c.notiz = e.text.length > 500 ? e.text.slice(0, 500) + '…' : e.text;
    if(typeof e.performance === 'number') c.performance_note = e.performance + '/10';
    const nok = Object.entries(e.checkliste || {}).filter(([k,v]) => v === 'nok').map(([k]) => k);
    if(nok.length) c.leitfaden_nicht_erfuellt = nok;
    if(e.fingerBewertung && Object.keys(e.fingerBewertung).length){
      const an = fingerAnalyse(e.fingerBewertung);
      const anchors = {}; FINGER_MODEL.forEach(f=>f.anchors.forEach(a=>{ anchors[a.id] = `${f.name}: ${a.text}`; }));
      c.fuenf_finger = {
        werte_prozent: Object.fromEntries(FINGER_MODEL.filter(f => an.scores[f.key] !== null).map(f => [f.name, Math.round(an.scores[f.key] / 2 * 100)])),
        staerke: an.staerke ? an.staerke.name + ' – ' + an.staerke.thema : null,
        hebel: an.hebel ? an.hebel.name + ' – ' + an.hebel.thema : null,
        nicht_gezeigt: Object.entries(e.fingerBewertung).filter(([k,v]) => v === 'nok').map(([k]) => anchors[k]).filter(Boolean),
        teilweise: Object.entries(e.fingerBewertung).filter(([k,v]) => v === 'half').map(([k]) => anchors[k]).filter(Boolean)
      };
      if(e.fingerNotizen && Object.keys(e.fingerNotizen).length) c.fuenf_finger.beispiele = e.fingerNotizen;
    }
    if(e.vereinbarung){
      const rv = reviews[e.id];
      c.vereinbarung = { text: e.vereinbarung, ueberpruefen_am: e.pruefDatum || null, ergebnis: rv ? rv.status : 'noch offen' };
      if(e.fokusProdukt) c.vereinbarung.fokus_produkt = productLabel(e.fokusProdukt, agent.team);
      const w = fkWirkung(agent, fkParseDe(e.datum), e.fokusProdukt || null);
      if(w && !w.tooFew) c.vereinbarung.wirkung = `Ø ${w.label}/Arbeitstag ${r1(w.avgB)} → ${r1(w.avgA)} (${w.nB} Tage vorher, ${w.nA} nachher)`;
    }
    return c;
  });
  const tz = (state.tagesziele || []).filter(z => z.agentId === agent.id).slice().sort((a,b)=>(b.datum||'').localeCompare(a.datum||'')).slice(0, 5);
  if(tz.length) d.tagesziele = tz.map(z => ({ datum: z.datum, ziel: z.produkte, erreicht: z.erreicht || {} }));
  return d;
}
// Gesamter Kontext; agents = Liste der einzubeziehenden Mitarbeiter
function buildKIContextFor(agents){
  const now = new Date();
  const teamInfo = {};
  Object.keys(TEAM_CONFIGS).forEach(t=>{
    const ta = state.agents.filter(a => String(a.team) === t && a.name && a.name.trim() && a.category !== 'schulung' && a.category !== 'work');
    teamInfo[t] = hrWorkdayInfo(ta, now);
  });
  const ctx = { stand: now.toLocaleDateString('de-DE', {weekday:'long', day:'2-digit', month:'long', year:'numeric'}), teams: {} };
  Object.keys(TEAM_CONFIGS).forEach(teamId=>{
    const cfg = TEAM_CONFIGS[teamId];
    const list = agents.filter(a => String(a.team) === teamId);
    const key = teamId === 'Trikala01' ? 'mf' : 'fn';
    const team = { name: cfg.label + ' — ' + cfg.project, ziele: { cr: cfg.crTarget, nps: cfg.npsTarget, lq: cfg.lqTarget } };
    const ma = state.monatsabschluss && state.monatsabschluss[key] || {};
    const maOut = {};
    Object.keys(ma).forEach(m=>{
      const md = ma[m]; if(!md) return;
      const o = {};
      if(md.crGesamtErreicht) o.cr_gesamt = md.crGesamtErreicht;
      if(md.crGesamtZiel) o.cr_ziel = md.crGesamtZiel;
      if(md.nps_ist) o.nps_ist = md.nps_ist;
      if(md.nps_plan) o.nps_plan = md.nps_plan;
      if(md.erreicht && Object.values(md.erreicht).some(v=>v>0)) o.erreicht = md.erreicht;
      if(md.plan && Object.values(md.plan).some(v=>v>0)) o.planmenge = md.plan;
      if(Object.keys(o).length) maOut[m] = o;
    });
    if(Object.keys(maOut).length) team.monatsabschluss = maOut;
    const tzd = state.teamziele && state.teamziele[key];
    if(tzd) team.team_ziele_aktuell = { monat: tzd.monat, cr_monat: tzd.crMonat, cr_ziel: tzd.crZiel, soll: tzd.soll, ist: tzd.ist };
    const gaps = kiTeamFingerGaps(teamId);
    if(gaps.length) team.haeufigste_5_finger_luecken = gaps;
    if(list.length) team.mitarbeiter = list.map(a => kiAgentData(a, now, teamInfo));
    if(list.length || agents.length === 0) ctx.teams[teamId] = team;
    else ctx.teams[teamId] = { name: team.name, hinweis: 'Mitarbeiter dieses Teams sind in dieser Frage nicht enthalten.' };
  });
  return ctx;
}
// Datenbasis für die freie KI-Analyse: erwähnte Namen > gewählter Umfang
let kiScope = 'alle';
function kiAgentsForQuestion(question){
  const named = state.agents.filter(a => a.name && a.name.trim() && a.category !== 'work');
  const q = ' ' + question.toLowerCase() + ' ';
  const hit = named.filter(a=>{
    const n = a.name.toLowerCase().trim();
    if(q.includes(n)) return true;
    return n.split(/\s+/).filter(p => p.length >= 4).some(p => new RegExp('[^a-zäöüß]' + p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '[^a-zäöüß]').test(q));
  });
  if(hit.length) return { agents: hit, grund: 'genannte Mitarbeiter: ' + hit.map(a=>a.name).join(', ') };
  const base = named.filter(a => a.category !== 'schulung');
  if(kiScope === 'meine'){
    const me = fkMyLeaderName();
    if(me) return { agents: base.filter(a => fkNorm(a.fuehrungskraft) === fkNorm(me)), grund: 'meine Mitarbeiter (' + me + ')' };
  }
  if(TEAM_CONFIGS[kiScope]) return { agents: base.filter(a => String(a.team) === kiScope), grund: 'Team ' + TEAM_CONFIGS[kiScope].label };
  return { agents: base, grund: 'alle Mitarbeiter' };
}
function kiSystemPrompt(ctx, auftrag){
  const me = fkMyName() || 'eine Führungskraft';
  const zielText = Object.keys(TEAM_CONFIGS).map(t => `- ${t} = ${TEAM_CONFIGS[t].project} (CR-Ziel ${TEAM_CONFIGS[t].crTarget} %, NPS-Ziel ${TEAM_CONFIGS[t].npsTarget} %, LQ-Ziel ${TEAM_CONFIGS[t].lqTarget} %)`).join('\n');
  return `Du bist ein erfahrener Salescoach-Assistent für ein Telekom-Inbound-Callcenter (Mobilfunk & Festnetz Privatkunden, CHO Group, Standort Trikala).
Fragen stellt: ${me}. Heute ist ${ctx.stand}.

${auftrag}

DATEN (JSON, nur die für diese Frage relevanten Mitarbeiter):
${JSON.stringify(ctx)}

ERKLÄRUNG DER DATEN:
${zielText}
- ziele.produkte = Stückzahl-Ziele je Produkt für diesen Mitarbeiter (abhängig von Kategorie Standard/6-Stündler/Helpline)
- aktueller_monat: NPS/LQ/Calls/CHT nur, wenn in diesem Monat schon eingetragen; stueck_bisher aus den Tageswerten; hochrechnung = Prognose zum Monatsende im bisherigen Tempo
- monatsverlauf = abgeschlossene/archivierte Monate (für Trends)
- coachings (neueste zuerst): fuenf_finger = Beobachtung nach dem 5-Finger-Pitch des Salescoaches (Daumen = Einstellung/Mut inkl. Brückensatz, Zeigefinger = Produktwissen, Mittelfinger = Bedarfsanalyse, Ringfinger = Kundennutzen, Kleiner Finger = Abschluss/Einwände); hebel = schwächster Finger; vereinbarung.ergebnis = umgesetzt/teilweise/nicht/noch offen; vereinbarung.wirkung = Vorher/Nachher aus den Tageswerten
- leitfaden_nicht_erfuellt = Schritte des Gesprächsleitfadens, die beim Coaching nicht erfüllt waren
- haeufigste_5_finger_luecken = Team-Muster der letzten Coachings

REGELN:
- Nenne echte Namen und konkrete Zahlen aus den Daten. Erfinde nichts. Fehlen Daten (z.B. kein NPS diesen Monat, keine Coachings), sag das kurz und offen, statt zu raten.
- Markiere Kennzahlen mit 🟢 (Ziel erreicht), 🟡 (knapp darunter, bis ca. 15 %) oder 🔴 (deutlich darunter). Symbole: ✅ Stärke, ⚠️ Schwachstelle, 💡 Empfehlung, 📈/📉 Trend.
- Interpretiere statt nachzuerzählen: Stärken zuerst, Schwachstellen begründen (Muster über mehrere Coachings, 5-Finger-Hebel, Wirkung von Vereinbarungen), zu jeder Schwachstelle EIN konkreter nächster Coaching-Schritt.
- Beziehe den 5-Finger-Pitch ein: Welcher Finger ist wiederholt der Engpass? Hat eine Vereinbarung gewirkt?
- Bei vielen Mitarbeitern kompakt bleiben (Tabelle + nur die wichtigsten Punkte je Person), damit die Antwort vollständig bleibt.
- Antworte auf Deutsch, klar und ohne unnötige Fachbegriffe.`;
}
async function kiCall(system, messages, maxTokens){
  const appToken = getKIAppToken();
  if(!appToken) throw new Error('Bitte zuerst im Reiter „KI Analyse“ das Zugangs-Passwort eingeben.');
  let uid = '';
  try{ uid = currentUserId || currentUserName || ''; }catch(e){ uid = ''; }
  const response = await fetch(KI_PROXY_URL + '/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-app-token': appToken, 'x-user-id': uid || fkMyName() || 'unbekannt' },
    body: JSON.stringify({ system, messages, max_tokens: maxTokens })
  });
  if(!response.ok){
    const err = await response.json().catch(()=>({}));
    if(response.status === 429) throw new Error(err.error?.message || 'Tageslimit erreicht. Bitte morgen wieder versuchen.');
    throw new Error(err.error?.message || ('HTTP ' + response.status));
  }
  const data = await response.json();
  let text = (data.content || []).map(c => c.text || '').join('') || 'Keine Antwort erhalten.';
  if(data.stop_reason === 'max_tokens') text += '\n\n⚠️ *Die Antwort wurde wegen ihrer Länge abgeschnitten. Stell die Frage enger (z.B. ein Team, „meine Mitarbeiter“ oder einzelne Namen).*';
  return text;
}

// Knopf "Coaching vorbereiten" (zeigt an, wenn es von heute schon eine Vorbereitung gibt)
function kiPrepButton(agentIdOrFn, cls){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = cls || 'fk-btn';
  const getId = typeof agentIdOrFn === 'function' ? agentIdOrFn : ()=>agentIdOrFn;
  const label = ()=>{
    const ag = state.agents.find(a => a.id === getId());
    const has = ag && ag.kiVorbereitung && ag.kiVorbereitung.datum === new Date().toLocaleDateString('de-DE');
    b.textContent = has ? '🤖 Vorbereitung ansehen' : '🤖 Coaching vorbereiten';
    b.title = has ? 'Heute bereits erstellt – kostet keine weitere KI-Anfrage' : 'KI-Vorbereitung für dieses Coaching (1 der täglichen KI-Anfragen)';
  };
  label();
  b.addEventListener('click', ()=>{ const id = getId(); if(id) kiPrepareCoaching(id); });
  b._refreshLabel = label;
  return b;
}
// ---- Coaching vorbereiten (ein Mitarbeiter) ----
async function kiPrepareCoaching(agentId, force){
  const agent = state.agents.find(a => a.id === agentId);
  if(!agent) return;
  const overlay = document.createElement('div');
  overlay.className = 'ki-prep-overlay';
  const box = document.createElement('div');
  box.className = 'ki-prep-box';
  overlay.appendChild(box);
  overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  const show = (prep, loading, error)=>{
    box.innerHTML = `<div class="ki-prep-head"><div><div class="ki-prep-title">🤖 Coaching-Vorbereitung</div>
      <div class="ki-prep-sub">${kiEsc(agent.name)} · ${kiEsc(TEAM_CONFIGS[agent.team]?.label || '')}${prep ? ` · erstellt ${kiEsc(prep.datum)}${prep.von ? ' von ' + kiEsc(prep.von) : ''}` : ''}</div></div>
      <button class="ki-prep-x" title="Schließen">✕</button></div>`;
    box.querySelector('.ki-prep-x').addEventListener('click', ()=>overlay.remove());
    const body = document.createElement('div');
    body.className = 'ki-prep-body ki-msg assistant';
    if(loading) body.innerHTML = '<p class="ki-p">🤔 Die KI wertet Zahlen, Coachings, 5-Finger-Bewertungen und Vereinbarungen aus …</p>';
    else if(error) body.innerHTML = `<p class="ki-p">⚠️ ${kiEsc(error)}</p>`;
    else body.innerHTML = kiRenderMarkdown(prep.text);
    box.appendChild(body);
    if(!loading){
      const act = document.createElement('div');
      act.className = 'fk-actions';
      const go = document.createElement('button');
      go.className = 'fk-btn primary';
      go.textContent = '🗣️ Coaching jetzt erfassen';
      go.addEventListener('click', ()=>{ overlay.remove(); switchTab('coachdash'); fkOpenCoachingForm(agent.id); });
      act.appendChild(go);
      if(prep){
        const re = document.createElement('button');
        re.className = 'fk-btn';
        re.textContent = '↻ Neu erstellen';
        re.title = 'Verbraucht eine der täglichen KI-Anfragen';
        re.addEventListener('click', ()=>{ overlay.remove(); kiPrepareCoaching(agent.id, true); });
        act.appendChild(re);
      }
      box.appendChild(act);
    }
  };
  const cached = agent.kiVorbereitung;
  const today = new Date().toLocaleDateString('de-DE');
  if(cached && cached.text && !force && cached.datum === today){ show(cached); return; }
  show(null, true);
  try{
    const ctx = buildKIContextFor([agent]);
    const system = kiSystemPrompt(ctx, `AUFGABE: Bereite die Führungskraft auf ihr nächstes Coaching mit ${agent.name} vor. Die Führungskräfte haben keine Coaching-Ausbildung – die Vorbereitung muss sofort umsetzbar sein. Höchstens ca. 300 Wörter, genau diese Abschnitte:
### Kurzbild
2–3 Sätze: Wo steht ${agent.name} gerade (Zahlen + Trend)?
### Letzte Vereinbarung
Was war vereinbart, wurde es umgesetzt, hat es gewirkt (Vorher/Nachher)? Falls keine: kurz sagen.
### Muster aus den Coachings
Wiederkehrender Engpass (5-Finger-Hebel, Leitfaden, Notizen) und eine klare Stärke.
### Fokus für dieses Coaching
GENAU EIN Hebel mit Begründung aus den Daten.
### Gesprächseinstieg
Eine offene Frage zur Selbsteinschätzung, wörtlich formuliert.
### Übung (2–3 Minuten)
Eine konkrete Mini-Übung zum Hebel.
### Vorschlag Vereinbarung
Ein konkretes, beobachtbares Verhalten in einem Satz.`);
    const text = await kiCall(system, [{ role:'user', content: `Bitte bereite mein Coaching mit ${agent.name} vor.` }], 1600);
    const prep = { text, datum: today, von: fkMyName() || '' };
    agent.kiVorbereitung = prep;
    scheduleSave();
    overlay.remove();
    kiPrepareCoaching(agent.id);
  }catch(e){
    show(null, false, 'Fehler bei der KI-Vorbereitung: ' + e.message);
  }
}

function renderOverview(){
  document.getElementById('ov-count').textContent = state.agents.length + ' Mitarbeiter';
  const container = document.getElementById('overview-capture');
  container.innerHTML = '';
  const watermark = document.createElement('div');
  watermark.className = 'ov-watermark';
  watermark.textContent = 'STANDORT-PORTAL';
  container.appendChild(watermark);
  const title = document.createElement('div');
  title.innerHTML = '<div class="ov-title">Team-Übersicht — Vertrieb &amp; Gesamt-CR</div><div class="ov-sub">Inbound Mobilfunk &amp; Festnetz Privatkunden · Stand aktuell</div>';
  container.appendChild(title);

  Object.keys(TEAM_CONFIGS).forEach(teamId=>{
    const cfg = TEAM_CONFIGS[teamId];
    const teamAgents = state.agents.filter(a => String(a.team) === String(teamId) && a.name.trim() !== '' && a.category !== 'schulung' && a.category !== 'work');
    if(!teamAgents.length) return;
    const teamDiv = document.createElement('div');
    teamDiv.className = 'ov-team';
    teamDiv.id = 'ov-team-' + teamId;
    // Angezeigte Produkte (inkl. team-spezifische Extras wie DA und ggf. VVM für MF-Team)
    const extraProdsOv = teamExtraProducts(teamId);
    const displayedProducts = displayOrderProducts([...cfg.products, ...extraProdsOv], teamId);
    const legendLine = (catKey) => {
      const targets = cfg.targets[catKey];
      return displayedProducts.map(p=>{
        const origIdx = cfg.products.indexOf(p);
        const target = origIdx !== -1 ? targets[origIdx] : '';
        const lbl = productLabel(p, teamId);
        return target !== '' ? `${lbl} ${target}` : null;
      }).filter(Boolean).join(' · ') + (catKey==='regular' ? ` · CR ${cfg.crTarget}%` : '');
    };
    teamDiv.innerHTML = `
      <div class="ov-team-head">
        <span class="name">${cfg.label} — ${cfg.project}</span>
      </div>
      <div style="background:#F7F9FA;padding:14px 16px;border-bottom:1px solid var(--border);text-align:center;">
        <div style="font-family:'Inter',-apple-system,sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Ziele</div>
        <div class="line" style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:#8A6D00;margin-bottom:4px;">8-Stündler: ${legendLine('regular')}</div>
        <div class="line" style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--sixh);margin-bottom:4px;">6-Stündler: ${legendLine('6h')}</div>
        <div class="line" style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--helpline);">Helpline: ${legendLine('helpline')}</div>
      </div>`;

    const totalCols = 1 + 1 + 2 + cfg.products.length + 1 + 1;
    // Namensspalte: exakt so breit wie der längste Name in diesem Team (statt fest/prozentual),
    // damit alle übrigen Spalten bei jedem Mitarbeiter an derselben Stelle beginnen. Die restlichen
    // Spalten bleiben flexibel (fr) und teilen sich den verbleibenden Platz.
    const nameFont = "600 12px 'Inter', -apple-system, sans-serif";
    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');
    measureCtx.font = nameFont;
    const longestNameWidth = teamAgents.reduce((max,a)=>Math.max(max, measureCtx.measureText(a.name||'').width), 30);
    const nameColWidth = Math.ceil(longestNameWidth + 20 /* Zell-Padding links */ + 18 /* Pill-Padding */ + 4 /* Zell-Padding rechts */ + 6 /* Puffer */) + 'px';
    // +2 = NPS + LQ, +1 = CR, +2 = Calls + CHT
    // v152: Mindestbreiten je Spaltenart, damit Produkt- und CR-Spalten nie zusammengedrückt werden
    const gridCols = `${nameColWidth} repeat(2, minmax(78px,1fr)) repeat(${displayedProducts.length}, minmax(46px,1fr)) minmax(70px,1fr) repeat(2, minmax(78px,1fr))`;

    function buildGrid(agentsSubset){
      const grid = document.createElement('div');
      grid.className = 'ov-grid';
      grid.style.setProperty('--ov-cols', gridCols);
      grid.style.flex = '1 1 0';
      grid.style.minWidth = '0';

      const headerRow = document.createElement('div');
      headerRow.className = 'ov-header-row';
      headerRow.style.gridTemplateColumns = gridCols;
      headerRow.innerHTML =
        `<div class="ov-cell name-cell head">Mitarbeiter</div>` +
        `<div class="ov-cell qual-cell head">NPS<span style="font-size:9px;font-weight:400;">Ziel ${cfg.npsTarget}%</span></div>` +
        `<div class="ov-cell qual-cell head">LQ<span style="font-size:9px;font-weight:400;">Ziel ${cfg.lqTarget}%</span></div>` +
        displayedProducts.map(p=>{
          const lbl = productLabel(p, teamId);
          // Lange Namen mit "+" umbrechen (z.B. "VVM+NVM" → "VVM<br>+<br>NVM")
          const fmt = lbl.includes('+') ? lbl.split('+').join('<br>+<br>') : lbl;
          return `<div class="ov-cell sales-cell head">${fmt}</div>`;
        }).join('') +
        `<div class="ov-cell cr-cell head">★ CR<span style="font-size:9px;font-weight:400;">Ziel ${cfg.crTarget}%</span></div>` +
        `<div class="ov-cell qual-cell head cht-group-start cht-group-first">Calls</div>` +
        `<div class="ov-cell qual-cell head cht-group-end cht-group-first">CHT</div>`;
      grid.appendChild(headerRow);

      agentsSubset.forEach((agent, agentIdx)=>{
        const isLastRow = agentIdx === agentsSubset.length - 1;
        const row = document.createElement('div');
        row.className = 'ov-data-row';
        row.style.gridTemplateColumns = gridCols;
        const myTargets = agentTargets(agent);
        const npsTarget = cfg.npsTarget || 70;
        const lqTarget  = cfg.lqTarget  || 75;
        const npsVal = (agent.nps === null || agent.nps === undefined) ? null : agent.nps;
        const npsClass = npsVal !== null && npsVal >= npsTarget ? 'good' : npsVal === null ? '' : 'zero';
        const lqVal = (agent.lq === null || agent.lq === undefined) ? null : agent.lq;
        const lqClass = lqVal !== null && lqVal >= lqTarget ? 'good' : lqVal === null ? '' : 'zero';
        const cr = totalCr(agent);
        const crRedThreshold = teamId === 'Trikala01' ? 4 : 7;
        const crValRounded = parseFloat(cr.toFixed(2));
        const crStatus = crValRounded < crRedThreshold ? 'zero' : (crValRounded >= cfg.crTarget ? 'good' : 'mid');

        const catBg = agent.category === '6h' ? 'background:rgba(59,111,160,.14);color:var(--sixh);' :
                     agent.category === 'helpline' ? 'background:rgba(124,92,191,.14);color:var(--helpline);' :
                     agent.category === 'work' ? 'background:rgba(102,187,106,.18);color:#2E7D32;' :
                     'background:rgba(252,211,77,.28);color:#8A6D00;';
        let html = `<div class="ov-cell name-cell"><span class="ov-name-pill" style="${catBg}">${agent.name}</span></div>`;
        html += `<div class="ov-cell qual-cell"><span class="ov-badge ${npsClass}">${npsVal === null ? '–' : npsVal.toFixed(1)+'%'}</span></div>`;
        html += `<div class="ov-cell qual-cell"><span class="ov-badge ${lqClass}">${lqVal === null ? '–' : lqVal.toFixed(1)+'%'}</span></div>`;
        displayedProducts.forEach((p)=>{
          const i = cfg.products.indexOf(p);
          const val = agent.sales[p];
          const isNull = (val === null || val === undefined);
          // Für Extraprodukte (DA, VVM) die nicht in cfg.products sind: feste Farb-Logik
          // DA: 0 → rot, 1–9 → orange (mid), 10+ → grün
          const status = isNull ? 'zero' : (i === -1 ? (val >= 10 ? 'good' : val >= 1 ? 'mid' : 'zero') : trafficStatus(val, myTargets[i]));
          html += `<div class="ov-cell sales-cell"><span class="ov-badge ov-badge-glass ${status}" style="font-size:14px;">${isNull ? '0' : Math.round(val)}</span></div>`;
        });
        html += `<div class="ov-cell cr-cell"><span class="ov-badge ${crStatus}">${cr.toFixed(1)}%</span></div>`;
        html += `<div class="ov-cell qual-cell cht-group-start${isLastRow?' cht-group-last':''}"><span class="ov-badge ${agent.calls===null||agent.calls===undefined?'':'good'}">${(agent.calls===null||agent.calls===undefined) ? '–' : Math.round(agent.calls)}</span></div>`;
        const chtVal = (agent.cht === null || agent.cht === undefined) ? null : agent.cht;
        const chtStatus = chtVal === null ? '' : (chtVal <= 550 ? 'good' : chtVal <= 680 ? 'mid' : 'zero');
        html += `<div class="ov-cell qual-cell cht-group-end${isLastRow?' cht-group-last':''}"><span class="ov-badge ${chtStatus}">${chtVal === null ? '–' : Math.round(chtVal)}</span></div>`;
        row.innerHTML = html;
        grid.appendChild(row);
      });
      return grid;
    }

    const half = Math.ceil(teamAgents.length / 2);
    const leftAgents = teamAgents.slice(0, half);
    const rightAgents = teamAgents.slice(half);

    const columnsWrap = document.createElement('div');
    columnsWrap.className = 'ov-columns-wrap';
    columnsWrap.appendChild(buildGrid(leftAgents));
    if(rightAgents.length){
      const divider = document.createElement('div');
      divider.className = 'ov-column-divider';
      columnsWrap.appendChild(divider);
      columnsWrap.appendChild(buildGrid(rightAgents));
    }

    teamDiv.appendChild(columnsWrap);
    container.appendChild(teamDiv);
  });

  const foot = document.createElement('div');
  foot.className = 'ov-foot';
  foot.innerHTML = 'Grün = Ziel erreicht · Rot = unter Ziel &nbsp;·&nbsp; <span style="background:#E4ECF5;color:var(--sixh);padding:1px 6px;border-radius:4px;font-size:11px;">6-Stündler</span> &nbsp; <span style="background:#EFE9F7;color:var(--helpline);padding:1px 6px;border-radius:4px;font-size:11px;">Helpline</span>';
  container.appendChild(foot);
}

// Pylon-Nummern (und, falls in derselben Datei enthalten, CHT) aus einer Helpsense-CSV importieren
// und automatisch den bestehenden Mitarbeitern zuordnen (nach Nachnamen, mit Vornamens-Initiale
// zur Unterscheidung bei gleichen Nachnamen, z.B. "Antoniou I.").
function parsePylonCsv(text){
  const rows = text.split(/\r?\n/).map(r=>r.trim()).filter(r=>r && r !== ';;');
  const entries = [];
  rows.forEach(row=>{
    const parts = row.split(';').map(p=>p.trim());
    if(parts.length < 2) return;
    if(parts[0].toLowerCase() === 'fullname') return; // Kopfzeile überspringen
    const fullname = parts[0];
    const pylon = parts[1];
    const cht = parts[2];
    if(!fullname || !pylon || !/^\d+$/.test(pylon)) return;
    const nameParts = fullname.split(' ').filter(Boolean);
    if(nameParts.length < 2) return;
    const lastName = nameParts[nameParts.length - 1];
    const firstName = nameParts.slice(0, -1).join(' ');
    entries.push({ fullname, lastName, firstInitial: firstName.charAt(0).toUpperCase(), pylon, cht: (cht && /^\d+$/.test(cht)) ? cht : null });
  });
  return entries;
}

function matchPylonEntry(agentName, entries){
  // Board-Namen sind entweder nur der Nachname ("Mitsiou") oder bei Dopplungen
  // "Nachname Vorname-Initiale." (z.B. "Antoniou I.")
  const m = agentName.match(/^(.+?)\s+([A-ZÄÖÜ])\.?$/);
  const baseLast = (m ? m[1] : agentName).trim();
  const initial = m ? m[2] : null;
  const candidates = entries.filter(e=>e.lastName.toLowerCase() === baseLast.toLowerCase());
  if(!candidates.length) return null;
  if(candidates.length === 1) return candidates[0];
  if(initial){
    const exact = candidates.find(e=>e.firstInitial === initial);
    if(exact) return exact;
  }
  return null; // mehrdeutig, nicht automatisch zuordnen
}
