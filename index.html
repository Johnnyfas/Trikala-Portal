function renderWorkshops(){
  const container = document.getElementById('workshops-container');
  if(!container) return;
  container.innerHTML = '';

  // Alle Workshop-Einträge sammeln und nach workshopId gruppieren
  const groups = {};
  Object.values(state.coachverlauf).forEach(cv=>{
    (cv.eintraege||[]).forEach(e=>{
      if(e.stil !== 'Workshop') return;
      const key = e.workshopId || e.id;
      if(!groups[key]){
        groups[key] = {
          id: key,
          titel: e.workshopTitel || '(ohne Titel)',
          datum: e.datum,
          thema: e.thema,
          dauer: e.dauer,
          coach: e.coach,
          text: e.text,
          teilnehmer: []
        };
      }
      groups[key].teilnehmer.push({ name: cv.name, team: cv.team, entryId: e.id });
    });
  });

  const list = Object.values(groups).sort((a,b)=>{
    const da = (a.datum||'').split('.').reverse().join('-');
    const db = (b.datum||'').split('.').reverse().join('-');
    return db.localeCompare(da);
  });

  if(!list.length){
    container.appendChild(emptyStateEl('Noch keine Workshops erfasst', 'Lege einen über "+ Neues Coaching → Workshop (Gruppe)" an.'));
    return;
  }

  list.forEach(ws=>{
    const block = document.createElement('div');
    block.className = 'cv-agent-block';

    const head = document.createElement('div');
    head.className = 'cv-agent-head';
    head.innerHTML = `<span class="cv-agent-name">👥 ${ws.titel}</span><span style="font-size:11px;opacity:.85;">${ws.datum} · ${ws.teilnehmer.length} Teilnehmer</span>`;
    block.appendChild(head);

    const body = document.createElement('div');
    body.className = 'cv-entry';

    // Meta-Zeile
    const top = document.createElement('div');
    top.className = 'cv-entry-top';
    const meta = document.createElement('div');
    meta.className = 'cv-entry-meta';
    const dateEl = document.createElement('span');
    dateEl.className = 'cv-entry-date';
    dateEl.textContent = ws.datum;
    meta.appendChild(dateEl);
    if(ws.coach){
      const b = document.createElement('span');
      b.className = 'cv-meta-badge';
      b.style.cssText = 'background:var(--tmg)22;color:var(--tmg);';
      b.textContent = '👤 ' + ws.coach;
      meta.appendChild(b);
    }
    if(ws.thema){
      const themeColor = COACH_THEMEN_COLORS[ws.thema] || '#888';
      const b = document.createElement('span');
      b.className = 'cv-meta-badge';
      b.style.cssText = `background:${themeColor}22;color:${themeColor};`;
      b.textContent = ws.thema;
      meta.appendChild(b);
    }
    if(ws.dauer){
      const b = document.createElement('span');
      b.className = 'cv-meta-badge';
      b.textContent = ws.dauer + ' Min';
      meta.appendChild(b);
    }
    top.appendChild(meta);

    const delBtn = document.createElement('button');
    delBtn.className = 'cv-entry-delete';
    delBtn.innerHTML = '🗑';
    delBtn.title = 'Workshop löschen (bei allen Teilnehmern)';
    delBtn.addEventListener('click', ()=>{
      if(!confirm(`Workshop "${ws.titel}" bei allen ${ws.teilnehmer.length} Teilnehmern löschen?`)) return;
      ws.teilnehmer.forEach(t=>{
        markDeleted(t.entryId);
        const realCv = Object.values(state.coachverlauf).find(v => v.name === t.name && v.team === t.team);
        if(realCv) realCv.eintraege = (realCv.eintraege||[]).filter(e=>e.id !== t.entryId);
      });
      scheduleSave();
      renderWorkshops();
    });
    top.appendChild(delBtn);
    body.appendChild(top);

    // Teilnehmerliste
    const partWrap = document.createElement('div');
    partWrap.className = 'ws-list-participants';
    ws.teilnehmer
      .sort((a,b)=>a.name.localeCompare(b.name))
      .forEach(t=>{
        const chip = document.createElement('span');
        chip.className = 'ws-list-chip';
        const teamLabel = TEAM_CONFIGS[t.team]?.label || t.team;
        chip.textContent = `${t.name} · ${teamLabel || ''}`;
        partWrap.appendChild(chip);
      });
    body.appendChild(partWrap);

    // Notizen
    if(ws.text){
      const textEl = document.createElement('div');
      textEl.className = 'cv-entry-text';
      textEl.textContent = ws.text;
      body.appendChild(textEl);
    }

    block.appendChild(body);
    container.appendChild(block);
  });
}

        const cls = days<=7?'freq-ok':days<=14?'freq-warn':'freq-late';

      }
      row.innerHTML = `<span class="rr-name">${a.name}</span>${badge}`;
      box.appendChild(row);
    });
    freqWrap.appendChild(box);
  });
  container.appendChild(freqWrap);
}


const COACH_THEMEN = ['Sales','Qualität','Allgemein','Second Nature'];
const COACH_THEMEN_COLORS = { 'Allgemein':'#E20074', 'Qualität':'#3B6FA0', 'Sales':'#C2792B', 'Second Nature':'#7C5CBF' };
let cpShowForm = false;
let cpFormType = 'coaching'; // 'coaching' (Einzel) oder 'workshop' (Gruppe)

function computeCoachStats(){
  const countByTeam = {}, dauerByTeam = {};
  Object.values(TEAM_CONFIGS).forEach(cfg=>{ countByTeam[cfg.label]=0; dauerByTeam[cfg.label]=0; });
  const themen = {}; COACH_THEMEN.forEach(t=>themen[t]=0);
  const checklistStats = {};
  CHECKLIST_ITEMS.forEach(item=>{ checklistStats[item] = { ok:0, nok:0, na:0 }; });
  Object.values(state.coachverlauf).forEach(cv=>{
    const cfg = TEAM_CONFIGS[cv.team];
    const label = cfg ? cfg.label : null;
    (cv.eintraege||[]).filter(e=>e.stil !== 'Workshop' && e.stil !== 'Einzelgespräch').forEach(e=>{
      if(label && countByTeam.hasOwnProperty(label)){
        countByTeam[label]++;
        dauerByTeam[label] += (e.dauer||0);
      }
      const th = (e.thema && themen.hasOwnProperty(e.thema)) ? e.thema : 'Allgemein';
      themen[th]++;
      if(e.checkliste){
        CHECKLIST_ITEMS.forEach(item=>{
          const v = e.checkliste[item];
          if(v === 'ok') checklistStats[item].ok++;
          else if(v === 'nok') checklistStats[item].nok++;
          else if(v === 'na') checklistStats[item].na++;
        });
      }
    });
  });
  return { countByTeam, dauerByTeam, themen, checklistStats };
}

function buildChecklistOverview(checklistStats){
  const wrap = document.createElement('div');
  wrap.className = 'cp-chart-card';
  wrap.style.marginTop = '16px';

  const rows = CHECKLIST_ITEMS.map(item=>{
    const s = checklistStats[item];
    const bewertet = s.ok + s.nok; // "na" zählt nicht als Bewertung
    const nokPct = bewertet > 0 ? Math.round((s.nok / bewertet) * 100) : null;
    return { item, ...s, bewertet, nokPct };
  }).filter(r => r.bewertet > 0)
    .sort((a,b) => b.nokPct - a.nokPct);

  let html = `<div class="cp-chart-title">📋 Leitfaden-Auswertung — häufigste Schwachstellen im Team</div>`;
  if(!rows.length){
    html += `<div class="empty">Noch keine bewerteten Checklisten vorhanden.</div>`;
  } else {
    html += `<div class="cp-checklist-overview">`;
    rows.forEach(r=>{
      const color = r.nokPct >= 40 ? 'var(--red)' : r.nokPct >= 20 ? '#C2792B' : 'var(--teal)';
      html += `
        <div class="cp-co-row">
          <div class="cp-co-label">${r.item}</div>
          <div class="cp-co-bar-track"><div class="cp-co-bar-fill" style="width:${r.nokPct}%;background:${color};"></div></div>
          <div class="cp-co-pct" style="color:${color};">${r.nokPct}%</div>
          <div class="cp-co-count">(${r.nok} von ${r.bewertet})</div>
        </div>`;
    });
    html += `</div>`;
  }
  wrap.innerHTML = html;
  return wrap;
}

function buildBarChart(title, dataObj, colorMap, unitSuffix){
  unitSuffix = unitSuffix || '';
  const wrap = document.createElement('div');
  wrap.className = 'cp-chart-card';
  const values = Object.values(dataObj);
  const max = Math.max(1, ...values);
  let html = `<div class="cp-chart-title">${title}</div><div class="cp-bar-row">`;
  Object.entries(dataObj).forEach(([label,val])=>{
    const pct = Math.max(2, Math.round((val/max)*100));
    const color = colorMap[label] || 'var(--tmg)';
    html += `<div class="cp-bar-col">
      <div class="cp-bar-value">${val}${unitSuffix}</div>
      <div class="cp-bar-track"><div class="cp-bar-fill" style="height:${pct}%;background:${color};"></div></div>
      <div class="cp-bar-label">${label}</div>
    </div>`;
  });
  html += '</div>';
  wrap.innerHTML = html;
  return wrap;
}

function buildPieChart(title, dataObj, colorMap){
  const wrap = document.createElement('div');
  wrap.className = 'cp-chart-card';
  const total = Object.values(dataObj).reduce((a,b)=>a+b,0);
  let acc = 0;
  const stops = Object.entries(dataObj).map(([label,val])=>{
    const start = total ? acc/total*360 : 0;
    acc += val;
    const end = total ? acc/total*360 : 0;
    const color = colorMap[label] || '#ccc';
    return `${color} ${start}deg ${end}deg`;
  }).join(', ');
  let html = `<div class="cp-chart-title">${title}</div>
    <div class="cp-pie-wrap">
      <div class="cp-pie" style="background:${total ? `conic-gradient(${stops})` : '#F1F4F7'};"></div>
      <div class="cp-pie-legend">`;
  Object.entries(dataObj).forEach(([label,val])=>{
    const pct = total ? Math.round(val/total*100) : 0;
    const color = colorMap[label] || '#ccc';
    html += `<div class="cp-legend-row"><span class="cp-legend-dot" style="background:${color};"></span>${label} <strong>${pct}%</strong></div>`;
  });
  html += '</div></div>';
  wrap.innerHTML = html;
  return wrap;
}

  btnOk.type = 'button'; btnOk.className = 'cf-check-btn cf-check-ok'; btnOk.innerHTML = '✓'; btnOk.title = 'Erfüllt';
  const btnNok = document.createElement('button');
  btnNok.type = 'button'; btnNok.className = 'cf-check-btn cf-check-nok'; btnNok.innerHTML = '✕'; btnNok.title = 'Nicht erfüllt';
  const btnNa = document.createElement('button');
  btnNa.type = 'button'; btnNa.className = 'cf-check-btn cf-check-na'; btnNa.innerHTML = '?'; btnNa.title = 'Nicht bewertet';

  function refresh(){
    [btnOk,btnNok,btnNa].forEach(b=>b.classList.remove('active'));
    const v = checklistState[label];
    if(v==='ok') btnOk.classList.add('active');
    else if(v==='nok') btnNok.classList.add('active');
    else if(v==='na') btnNa.classList.add('active');
  }
  btnOk.addEventListener('click', ()=>{ checklistState[label] = checklistState[label]==='ok' ? null : 'ok'; refresh(); });
  btnNok.addEventListener('click', ()=>{ checklistState[label] = checklistState[label]==='nok' ? null : 'nok'; refresh(); });
  btnNa.addEventListener('click', ()=>{ checklistState[label] = checklistState[label]==='na' ? null : 'na'; refresh(); });
  refresh();

  row.appendChild(lbl); row.appendChild(btnOk); row.appendChild(btnNok); row.appendChild(btnNa);
  return row;
}

    allBtn.addEventListener('click', ()=>{
      const boxes = teamBlock.querySelectorAll('input[type=checkbox]');
      const allChecked = Array.from(boxes).every(b=>b.checked);
      boxes.forEach(b=>{
        b.checked = !allChecked;
        if(b.checked) selectedIds.add(b.value); else selectedIds.delete(b.value);
      });
      allBtn.textContent = allChecked ? 'Alle auswählen' : 'Alle abwählen';
      updateCount();
    });
    head.appendChild(headLabel);
    head.appendChild(allBtn);
    teamBlock.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'ws-agent-grid';
    teamAgents.forEach(a=>{
      const lab = document.createElement('label');
      lab.className = 'ws-agent-chip';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = a.id;
      cb.addEventListener('change', ()=>{
        if(cb.checked) selectedIds.add(a.id); else selectedIds.delete(a.id);
        lab.classList.toggle('checked', cb.checked);
        updateCount();
      });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(a.name));
      grid.appendChild(lab);
    });
    teamBlock.appendChild(grid);
    partBox.appendChild(teamBlock);
  });
  wrap.appendChild(partBox);

  const countLabel = document.createElement('div');

  btnRow.className = 'cf-btn-row';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'primary';
  saveBtn.textContent = '💾 Workshop speichern';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'secondary';
  cancelBtn.textContent = '✕ Abbrechen';

  saveBtn.addEventListener('click', ()=>{
    if(!selectedIds.size){ alert('Bitte mindestens einen Teilnehmer auswählen.'); return; }
    if(!titelInput.value.trim()){
      titelInput.style.borderColor = 'var(--red)';
      titelInput.focus();
      return;
    }
    const datum = new Date().toLocaleDateString('de-DE');
    const coachName = getCoachName();
    const workshopId = uid(); // gemeinsame ID für alle Teilnehmer-Einträge
    selectedIds.forEach(agentId=>{
      const agent = state.agents.find(a=>a.id===agentId);
      if(!agent) return;
      if(!state.coachverlauf[agent.id]){
        state.coachverlauf[agent.id] = { name: agent.name, team: agent.team, eintraege: [] };
      }
      state.coachverlauf[agent.id].eintraege.unshift({
        id: uid(),
        datum: datum,
        text: notesArea.value.trim() || '(Workshop ohne Notiz)',
        thema: themaSel.value,
        dauer: parseInt(dauerInput.value)||0,
        stil: 'Workshop',
        workshopTitel: titelInput.value.trim(),
        workshopId: workshopId,
        teilnehmerAnzahl: selectedIds.size,
        coach: coachName
      });
      agent.coachingDatum = datum;
    });
    scheduleSave();
    cpShowForm = false;
    cpFormType = 'coaching';
    renderAll();
  });

  btnRow.appendChild(saveBtn);
  btnRow.appendChild(cancelBtn);
  wrap.appendChild(btnRow);

  return wrap;
}

function buildTageszielForm(prefill){

  wrap.className = 'cp-form cf-wrap';

      const ta = allAgents.filter(a=>a.team===teamId);

  // Datum
  const datumInp = document.createElement('input');
  datumInp.type = 'date';
  datumInp.className = 'cp-form-input';
  datumInp.value = prefill ? prefill.datum : new Date().toISOString().slice(0,10);

  const row1 = document.createElement('div');
  row1.className = 'cp-form-row';
  row1.appendChild(labeledField('Mitarbeiter', agentSel));
  row1.appendChild(labeledField('Datum', datumInp));
  wrap.appendChild(row1);

  // Produkte
  const prodTitle = document.createElement('div');
  prodTitle.className = 'cf-section-title';
  prodTitle.textContent = '📦 Produkte & Stückzahlen';
  wrap.appendChild(prodTitle);

  const prodGrid = document.createElement('div');
  prodGrid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px;';

  const produktState = {}; // key → {aktiv, anzahl}
  TAGESZIEL_PRODUKTE.forEach(prod=>{
    produktState[prod] = { aktiv: prefill ? (prefill.produkte[prod]?.aktiv||false) : false, anzahl: prefill ? (prefill.produkte[prod]?.anzahl||1) : 1 };
    const cell = document.createElement('div');
    cell.style.cssText = 'display:flex;flex-direction:column;gap:4px;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;user-select:none;transition:background .15s,border-color .15s;';
    const updateCellStyle = () => {
      cell.style.background = produktState[prod].aktiv ? 'rgba(226,0,116,.09)' : '';
      cell.style.borderColor = produktState[prod].aktiv ? '#E20074' : 'var(--border)';
      numInp.disabled = !produktState[prod].aktiv;
      numInp.style.opacity = produktState[prod].aktiv ? '1' : '0.35';
    };
    const topRow = document.createElement('div');
    topRow.style.cssText = 'display:flex;align-items:center;gap:6px;';
    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.checked = produktState[prod].aktiv;
    chk.style.accentColor = '#E20074';
    chk.addEventListener('change', ()=>{ produktState[prod].aktiv = chk.checked; updateCellStyle(); });
    const lbl = document.createElement('span');
    lbl.textContent = prod;
    lbl.style.cssText = 'font-weight:700;font-size:14px;';
    topRow.appendChild(chk); topRow.appendChild(lbl);
    const numInp = document.createElement('input');
    numInp.type = 'number';
    numInp.min = 1; numInp.value = produktState[prod].anzahl;
    numInp.className = 'cp-form-input';
    numInp.style.cssText = 'width:60px;padding:3px 6px;font-size:13px;margin:0;';
    numInp.placeholder = 'Anz.';
    numInp.addEventListener('input', ()=>{ produktState[prod].anzahl = parseInt(numInp.value)||1; });
    cell.appendChild(topRow); cell.appendChild(numInp);
    cell.addEventListener('click', e=>{ if(e.target===chk||e.target===numInp) return; chk.checked=!chk.checked; produktState[prod].aktiv=chk.checked; updateCellStyle(); });
    updateCellStyle();
    prodGrid.appendChild(cell);
  });
  wrap.appendChild(prodGrid);

  // Buttons
  const btnRow = document.createElement('div');
  btnRow.className = 'cf-btn-row';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'primary';
  saveBtn.textContent = prefill ? '💾 Aktualisieren' : '🎯 Ziel speichern';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'secondary';
  cancelBtn.textContent = '✕ Abbrechen';

  saveBtn.addEventListener('click', ()=>{
    const agent = state.agents.find(a=>a.id===agentSel.value);
    if(!agent){ alert('Bitte einen Mitarbeiter wählen.'); return; }
    if(!datumInp.value){ alert('Bitte ein Datum wählen.'); return; }
    const aktiveProdukte = TAGESZIEL_PRODUKTE.filter(p=>produktState[p].aktiv);
    if(!aktiveProdukte.length){ alert('Bitte mindestens ein Produkt auswählen.'); return; }
    const produkteObj = {};
    aktiveProdukte.forEach(p=>{ produkteObj[p] = { aktiv:true, anzahl: produktState[p].anzahl }; });
    if(prefill){
      const idx = state.tagesziele.findIndex(z=>z.id===prefill.id);
      if(idx!==-1) state.tagesziele[idx] = { ...prefill, agentId:agent.id, agentName:agent.name, agentTeam:agent.team, datum:datumInp.value, produkte:produkteObj };
    } else {
      state.tagesziele.unshift({ id:uid(), agentId:agent.id, agentName:agent.name, agentTeam:agent.team, datum:datumInp.value, produkte:produkteObj, erreicht:{}, erstelltAm: new Date().toISOString() });
    }
    scheduleSave();
    cpShowForm = false;
    cpFormType = 'coaching';
    cpPrefill = null;
    switchCoachDashSub('tagesziele');
  });
  cancelBtn.addEventListener('click', ()=>{
    cpShowForm = false;
    cpFormType = 'coaching';
    cpPrefill = null;
    switchCoachDashSub('tagesziele');
  });
  btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);
  wrap.appendChild(btnRow);
  return wrap;
}

function buildTageszielVerlauf(){

  ziele.forEach(z=>{
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;';

    // Kopfzeile
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;';
    const nameSpan = document.createElement('span');

    datumSpan.style.cssText = 'font-size:12px;color:var(--text-muted);';
    const teamSpan = document.createElement('span');
    teamSpan.textContent = TEAM_CONFIGS[z.agentTeam]?.label || z.agentTeam;
    teamSpan.style.cssText = 'font-size:11px;background:rgba(226,0,116,.1);color:#E20074;border-radius:4px;padding:2px 7px;';

    const leftInfo = document.createElement('div');
    leftInfo.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;';
    leftInfo.appendChild(nameSpan); leftInfo.appendChild(teamSpan); leftInfo.appendChild(datumSpan);

    // Aktionsbuttons
    const actBtns = document.createElement('div');
    actBtns.style.cssText = 'display:flex;gap:6px;';
    const editBtn = document.createElement('button');
    editBtn.textContent = '✏️';
    editBtn.title = 'Bearbeiten';
    editBtn.style.cssText = 'background:none;border:1px solid var(--border);border-radius:6px;padding:2px 7px;cursor:pointer;font-size:12px;';
    editBtn.addEventListener('click', ()=>{
      cpFormType = 'tagesziel';
      cpShowForm = true;
      cpPrefill = z;
      switchCoachDashSub('coachplan');
    });
    const delBtn = document.createElement('button');
    delBtn.textContent = '🗑️';
    delBtn.title = 'Löschen';
    delBtn.style.cssText = 'background:none;border:1px solid var(--border);border-radius:6px;padding:2px 7px;cursor:pointer;font-size:12px;';
    delBtn.addEventListener('click', ()=>{
      if(!confirm(`Tages Ziel für ${z.agentName} vom ${d.toLocaleDateString('de-DE')} wirklich löschen?`)) return;
      markDeleted(z.id);
      state.tagesziele = (state.tagesziele||[]).filter(x=>x.id!==z.id);
      scheduleSave(); renderCoachPlan();
    });
    actBtns.appendChild(editBtn); actBtns.appendChild(delBtn);
    head.appendChild(leftInfo); head.appendChild(actBtns);
    card.appendChild(head);

    // Produkte: Ziel-Anzahl + Erreicht-Anzahl eingeben
    const aktivProds = Object.keys(z.produkte).filter(p=>z.produkte[p]?.aktiv);
    const prodGrid = document.createElement('div');
    prodGrid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;';
    aktivProds.forEach(prod=>{
      if(!z.erreicht) z.erreicht = {};
      const zielAnz = z.produkte[prod].anzahl || 0;
      // null = noch nicht eingetragen, Zahl = eingetragen (auch 0)
      const gespeichert = z.erreicht[prod];
      const hatWert = typeof gespeichert === 'number';
      const istAnz = hatWert ? gespeichert : null;

      const getStatus = (v) => {
        if(v === null) return 'leer';       // noch nichts eingetragen → neutral
        if(v >= zielAnz && zielAnz > 0) return 'erreicht';   // grün
        if(v > 0) return 'teil';            // gelb
        return 'null';                      // 0 eingetragen → rot
      };
      const getCellStyle = (s) => ({
        leer:     { border:'var(--border)',  bg:'var(--card-bg)',          icon:'—' },
        erreicht: { border:'#4CAF50',        bg:'rgba(76,175,80,.1)',       icon:'✅' },
        teil:     { border:'#FFA726',        bg:'rgba(255,167,38,.1)',      icon:'🟡' },
        null:     { border:'#E53935',        bg:'rgba(229,57,53,.08)',      icon:'🔴' },
      }[s]);

      let status = getStatus(istAnz);
      let cs = getCellStyle(status);

      const cell = document.createElement('div');
      cell.style.cssText = `display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:8px;border:1.5px solid ${cs.border};background:${cs.bg};transition:border-color .2s,background .2s;`;

      // Produktname + Ziel
      const topLine = document.createElement('div');
      topLine.style.cssText = 'display:flex;align-items:center;justify-content:space-between;';
      const prodName = document.createElement('span');
      prodName.style.cssText = 'font-weight:700;font-size:14px;';
      prodName.textContent = prod;
      const zielBadge = document.createElement('span');
      zielBadge.style.cssText = 'font-size:11px;color:var(--text-muted);';
      zielBadge.textContent = `Ziel: ${zielAnz}`;
      topLine.appendChild(prodName); topLine.appendChild(zielBadge);
      cell.appendChild(topLine);

      // Ist-Eingabe
      const inputRow = document.createElement('div');
      inputRow.style.cssText = 'display:flex;align-items:center;gap:6px;';
      const istLabel = document.createElement('span');
      istLabel.style.cssText = 'font-size:12px;color:var(--text-muted);white-space:nowrap;';
      istLabel.textContent = 'Ist:';
      const numInp = document.createElement('input');
      numInp.type = 'number';
      numInp.min = 0;
      numInp.placeholder = '—';
      if(hatWert) numInp.value = istAnz;
      numInp.className = 'cp-form-input';
      numInp.style.cssText = 'width:60px;padding:3px 6px;font-size:13px;margin:0;';
      const statusIcon = document.createElement('span');
      statusIcon.style.cssText = 'font-size:16px;min-width:20px;';
      statusIcon.textContent = cs.icon;

      numInp.addEventListener('input', ()=>{
        if(!z.erreicht) z.erreicht = {};
        const raw = numInp.value.trim();
        const v = raw === '' ? null : (parseInt(raw) >= 0 ? parseInt(raw) : null);
        z.erreicht[prod] = v === null ? undefined : v;
        const s = getStatus(v);
        const c = getCellStyle(s);
        cell.style.borderColor = c.border;
        cell.style.background = c.bg;
        statusIcon.textContent = c.icon;
        scheduleSave();
      });

      inputRow.appendChild(istLabel); inputRow.appendChild(numInp); inputRow.appendChild(statusIcon);
      cell.appendChild(inputRow);
      prodGrid.appendChild(cell);
    });
    card.appendChild(prodGrid);

    // Fortschritt — nur Felder mit eingetragenem Wert zählen
    const total = aktivProds.length;
    const done = aktivProds.filter(p=>{
      const zielAnz = z.produkte[p].anzahl || 0;
      const v = z.erreicht?.[p];
      return typeof v === 'number' && v >= zielAnz && zielAnz > 0;
    }).length;
    if(total>0){
      const progressWrap = document.createElement('div');
      progressWrap.style.cssText = 'margin-top:8px;';
      const bar = document.createElement('div');
      bar.style.cssText = 'height:4px;border-radius:4px;background:var(--border);overflow:hidden;';
      const fill = document.createElement('div');
      fill.style.cssText = `height:100%;width:${Math.round(done/total*100)}%;background:${done===total?'#4CAF50':'#E20074'};transition:width .3s;`;
      bar.appendChild(fill);
      const pct = document.createElement('span');
      pct.style.cssText = 'font-size:11px;color:var(--text-muted);';
      pct.textContent = `${done} / ${total} Ziele erreicht`;
      progressWrap.appendChild(bar); progressWrap.appendChild(pct);
      card.appendChild(progressWrap);
    }

    section.appendChild(card);
  });
  return section;
}

// ===== Zielerinnerung/Alarm: Mitarbeiter lange ohne Coaching + fallende CR =====
function buildAlertBanner(){
  const now = new Date();
  const allAgents = state.agents.filter(a=>a.name.trim()!=='');
  let noCoachingCount = 0;
  let fallingCrCount = 0;
  const MONATE_ORDER = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const aktuellerMonatName = now.toLocaleString('de-DE', {month:'long'});

  allAgents.forEach(a=>{
    let daysSince = null;
    if(a.coachingDatum){
      const parts = a.coachingDatum.split('.');
      if(parts.length===3){
        const dt = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
        if(!isNaN(dt)) daysSince = Math.floor((now-dt)/(1000*60*60*24));
      }
    }
    const laengereZeitOhne = (daysSince===null || daysSince>14);
    if(laengereZeitOhne) noCoachingCount++;

    if(laengereZeitOhne){
      const vlEntry = Object.values(state.verlauf).find(v=>v.name===a.name && v.team===a.team);
      if(vlEntry && vlEntry.monate){
        const monKeys = Object.keys(vlEntry.monate).filter(k=>k.split('-')[1]!==aktuellerMonatName).sort((x,y)=>{
          const [ya,ma]=x.split('-'); const [yb,mb]=y.split('-');
          if(ya!==yb) return ya.localeCompare(yb);
          return MONATE_ORDER.indexOf(ma)-MONATE_ORDER.indexOf(mb);
        });
        const ref = monKeys[monKeys.length-1];
        if(ref){
          const davor = vlEntry.monate[ref].cr || 0;
          const jetzt = totalCr(a);
          if(davor>0 && (jetzt-davor) < -0.5) fallingCrCount++;
        }
      }
    }
  });

  if(noCoachingCount===0) return null;
  const banner = document.createElement('div');
  banner.className = 'cp-alert-banner';
  banner.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
    <span><strong>${noCoachingCount} Mitarbeiter</strong> seit über 14 Tagen ohne Coaching${fallingCrCount>0 ? ` — bei <strong>${fallingCrCount}</strong> davon fällt aktuell die CR` : ''}.</span>`;
  return banner;
}

// ===== Automatische Prioritätenliste: Wen zuerst coachen =====
function buildPriorityList(){
  const now = new Date();
  const allAgents = state.agents.filter(a=>a.name.trim()!=='');
  const scored = allAgents.map(a=>{
    const cfg = TEAM_CONFIGS[a.team];
    const cr = totalCr(a);
    const crGap = Math.max(0, (cfg?.crTarget||0) - cr);
    let daysSince = 999;
    if(a.coachingDatum){
      const parts = a.coachingDatum.split('.');
      if(parts.length===3){
        const dt = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
        if(!isNaN(dt)) daysSince = Math.floor((now-dt)/(1000*60*60*24));
      }
    }
    const cv = Object.values(state.coachverlauf).find(v=>v.name===a.name && v.team===a.team);
    let weaknessCount = 0;
    if(cv && cv.eintraege){
      const nokCount = {};
      cv.eintraege.forEach(e=>{
        if(!e.checkliste) return;
        Object.keys(e.checkliste).forEach(k=>{ if(e.checkliste[k]==='nok') nokCount[k]=(nokCount[k]||0)+1; });
      });
      weaknessCount = Object.values(nokCount).filter(n=>n>=2).length;
    }
    const score = crGap*3 + Math.min(daysSince,60)*0.5 + weaknessCount*4;
    return { agent:a, crGap, daysSince, weaknessCount, score, cfg };
  }).filter(x=>x.score > 0.5);

  scored.sort((x,y)=>y.score-x.score);
  const top5 = scored.slice(0,5);

  const wrap = document.createElement('div');
  wrap.className = 'cp-chart-card';
  wrap.style.marginTop = '16px';
  let html = `<div class="cp-chart-title">🎯 Wen zuerst coachen — Top 5 mit größtem Hebel</div>`;
  if(!top5.length){
    html += `<div class="empty">Aktuell kein dringender Handlungsbedarf erkennbar.</div>`;
  } else {
    html += `<div class="cp-priority-list">`;
    top5.forEach((x,i)=>{
      const reasons = [];
      if(x.crGap>0.5) reasons.push(`CR ${x.crGap.toFixed(1)} Pkt. unter Ziel`);
      if(x.daysSince>=999) reasons.push('noch nie gecoacht');
      else if(x.daysSince>14) reasons.push(`${x.daysSince} Tage ohne Coaching`);
      if(x.weaknessCount>0) reasons.push(`${x.weaknessCount} wiederkehrende Schwachstelle${x.weaknessCount>1?'n':''}`);
      html += `<div class="cp-priority-row">
        <span class="cp-priority-rank">${i+1}</span>
        <span class="cp-priority-name">${x.agent.name}</span>
        <span class="cp-priority-team">${x.cfg?.label||x.agent.team}</span>
        <span class="cp-priority-reasons">${reasons.join(' · ')}</span>
      </div>`;
    });
    html += `</div>`;
  }
  wrap.innerHTML = html;
  return wrap;
}

// ===== Coaching-Wirksamkeit: CR vor dem ersten Coaching vs. heute =====
function buildEffectivenessSection(){
  const MONATE_ORDER = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const allAgents = state.agents.filter(a=>a.name.trim()!=='');
  const rows = [];
  allAgents.forEach(a=>{
    const cv = Object.values(state.coachverlauf).find(v=>v.name===a.name && v.team===a.team);
    if(!cv || !cv.eintraege || !cv.eintraege.length) return;
    const sorted = cv.eintraege.slice().sort((x,y)=>{
      const dx=(x.datum||'').split('.').reverse().join('-');
      const dy=(y.datum||'').split('.').reverse().join('-');
      return dx.localeCompare(dy);
    });
    const erstesCoaching = sorted[0];
    const parts = (erstesCoaching.datum||'').split('.');
    if(parts.length!==3) return;
    const coachingDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
    if(isNaN(coachingDate)) return;
    const coachingMonatName = coachingDate.toLocaleString('de-DE',{month:'long'});
    const vlEntry = Object.values(state.verlauf).find(v=>v.name===a.name && v.team===a.team);
    if(!vlEntry || !vlEntry.monate) return;
    const monKeys = Object.keys(vlEntry.monate).sort((x,y)=>{
      const [ya,ma]=x.split('-'); const [yb,mb]=y.split('-');
      if(ya!==yb) return ya.localeCompare(yb);
      return MONATE_ORDER.indexOf(ma)-MONATE_ORDER.indexOf(mb);
    });
    const coachingKey = `${parts[2]}-${coachingMonatName}`;
    const idx = monKeys.indexOf(coachingKey);
    const vorherKey = idx > 0 ? monKeys[idx-1] : (idx===0 ? monKeys[0] : null);
    if(!vorherKey) return;
    const crVorher = vlEntry.monate[vorherKey].cr || 0;
    if(!crVorher) return;
    const crJetzt = totalCr(a);
    rows.push({ name:a.name, crVorher, crJetzt, diff: crJetzt-crVorher });
  });

  const wrap = document.createElement('div');
  wrap.className = 'cp-chart-card';
  wrap.style.marginTop = '16px';
  let html = `<div class="cp-chart-title">📈 Coaching-Wirksamkeit — CR vor dem ersten Coaching vs. heute</div>`;
  if(!rows.length){
    html += `<div class="empty">Noch nicht genug Daten (braucht mind. 1 Coaching + Verlaufsdaten aus dem Monat davor).</div>`;
  } else {
    const avgDiff = rows.reduce((s,r)=>s+r.diff,0)/rows.length;
    html += `<div style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);margin-bottom:10px;">Ø Veränderung nach Coaching: <strong style="color:${avgDiff>=0?'var(--teal)':'var(--red)'};">${avgDiff>=0?'+':''}${avgDiff.toFixed(1)} Prozentpunkte</strong></div>`;
    html += `<div class="cp-eff-list">`;
    rows.sort((a,b)=>b.diff-a.diff).forEach(r=>{
      const color = r.diff>=0 ? 'var(--teal)' : 'var(--red)';
      html += `<div class="cp-eff-row">
        <span class="cp-eff-name">${r.name}</span>
        <span class="cp-eff-vals">${r.crVorher.toFixed(1)}% → ${r.crJetzt.toFixed(1)}%</span>
        <span class="cp-eff-diff" style="color:${color};">${r.diff>=0?'▲':'▼'} ${Math.abs(r.diff).toFixed(1)} Pkt.</span>
      </div>`;
    });
    html += `</div>`;
  }
  wrap.innerHTML = html;
  return wrap;
}

let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let calSelectedDate = null;

function renderTermineKalender(){
  const container = document.getElementById('termine-container');
  container.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'cal-header';
  const prevBtn = document.createElement('button'); prevBtn.className = 'cal-nav-btn'; prevBtn.textContent = '◀';
  const nextBtn = document.createElement('button'); nextBtn.className = 'cal-nav-btn'; nextBtn.textContent = '▶';
  const MONTH_NAMES = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const monthLabel = document.createElement('div');
  monthLabel.className = 'cal-month-label';
  monthLabel.textContent = MONTH_NAMES[calMonth] + ' ' + calYear;
  prevBtn.addEventListener('click', ()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderTermineKalender(); });
  nextBtn.addEventListener('click', ()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderTermineKalender(); });
  header.appendChild(prevBtn); header.appendChild(monthLabel); header.appendChild(nextBtn);
  container.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d=>{
    const wd = document.createElement('div'); wd.className = 'cal-weekday'; wd.textContent = d;
    grid.appendChild(wd);
  });

  const firstOfMonth = new Date(calYear, calMonth, 1);
  const startWeekday = (firstOfMonth.getDay()+6)%7;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  const byDate = {};
  (state.coachingPlan||[]).forEach(p=>{
    if(!p.datum) return;
    (byDate[p.datum] = byDate[p.datum]||[]).push(p);
  });

  for(let i=0;i<startWeekday;i++){
    const empty = document.createElement('div'); empty.className = 'cal-cell cal-cell-empty'; grid.appendChild(empty);
  }
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if(dateStr === todayStr) cell.classList.add('cal-cell-today');
    if(dateStr === calSelectedDate) cell.classList.add('cal-cell-selected');
    const dayNum = document.createElement('div'); dayNum.className = 'cal-day-num'; dayNum.textContent = day;
    cell.appendChild(dayNum);
    (byDate[dateStr]||[]).forEach(p=>{
      const chip = document.createElement('div');
      chip.className = 'cal-chip';
      const themeColor = COACH_THEMEN_COLORS[p.thema] || '#888';
      chip.style.cssText = `background:${themeColor}22;color:${themeColor};`;
      chip.textContent = p.name;
      cell.appendChild(chip);
    });
    cell.addEventListener('click', ()=>{ calSelectedDate = (calSelectedDate===dateStr) ? null : dateStr; renderTermineKalender(); });
    grid.appendChild(cell);
  }
  container.appendChild(grid);

  // Detailliste für ausgewählten Tag (oder alle, wenn kein Tag ausgewählt ist)
  const detailTitle = document.createElement('div');
  detailTitle.className = 'cp-list-title';
  const selLabel = calSelectedDate ? new Date(calSelectedDate).toLocaleDateString('de-DE', {weekday:'long', day:'2-digit', month:'long', year:'numeric'}) : null;
  detailTitle.textContent = calSelectedDate ? `📅 Termine am ${selLabel}` : '📅 Alle geplanten Termine';
  container.appendChild(detailTitle);

  const relevant = calSelectedDate
    ? (byDate[calSelectedDate] || [])
    : (state.coachingPlan||[]).slice().sort((a,b)=>(a.datum||'').localeCompare(b.datum||''));

  if(!relevant.length){
    container.appendChild(emptyStateEl(calSelectedDate ? 'Keine Termine an diesem Tag' : 'Keine geplanten Coachings'));
    return;
  }

  const list = document.createElement('div');
  list.className = 'cp-plan-list';
  relevant.forEach(p=>list.appendChild(buildPlanRow(p)));
  container.appendChild(list);
}


// Kompakte Delta-Anzeige je Produkt: letzter bekannter Wert -> aktueller Wert, mit Differenz.
// Ersetzt das frühere Liniendiagramm, das bei nur kleinen Tagesunterschieden auf einer
// gemeinsamen 0-Skala kaum ablesbar war.
// Öffnet ein Popup mit der kompletten Tages-für-Tag-Liste eines einzelnen Produkts.
function showStornoHistoryPopup(productLabel, stornoHistory, stornoCurrent){
  const heute = new Date().toLocaleDateString('de-DE');
  const parseDatum = (s) => { const parts = s.split('.'); return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); };

  const hist = (stornoHistory||[]).slice();
  const pts = hist.map(hh=>({datum:hh.datum, wert:hh.wert}));
  pts.push({datum: heute, wert: stornoCurrent||0});
  const byDate = {};
  pts.forEach(pt=>{ byDate[pt.datum] = pt.wert; });
  const dateKeys = Object.keys(byDate).sort((a,b)=>parseDatum(a)-parseDatum(b));

  const overlay = document.createElement('div');
  overlay.className = 'chart-overlay';
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  const popup = document.createElement('div');
  popup.className = 'chart-popup';
  popup.style.maxWidth = '480px';

  const closeBtn = document.createElement('button');
  closeBtn.className = 'chart-popup-close';
  closeBtn.innerHTML = '×';
  closeBtn.addEventListener('click', ()=>overlay.remove());
  popup.appendChild(closeBtn);

  const titleEl = document.createElement('div');
  titleEl.className = 'chart-popup-title';
  titleEl.textContent = `Storno-Verlauf — ${productLabel}`;
  popup.appendChild(titleEl);

  const table = document.createElement('table');
  table.className = 'storno-history-table';
  const thead = document.createElement('tr');
  ['Datum','Wert','Änderung ggü. Vortag'].forEach(h=>{
    const th = document.createElement('th'); th.textContent = h; thead.appendChild(th);
  });
  table.appendChild(thead);

  dateKeys.forEach((d,i)=>{
    const row = document.createElement('tr');
    const val = byDate[d];
    const tdDate = document.createElement('td'); tdDate.textContent = d;
    const tdVal = document.createElement('td'); tdVal.textContent = val.toFixed(1) + '%';
    const tdDiff = document.createElement('td');
    if(i===0){
      tdDiff.textContent = '–';
      tdDiff.className = 'storno-history-diff eq';
    } else {
      const diff = val - byDate[dateKeys[i-1]];
      const isFlat = Math.abs(diff) < 0.05;
      const arrow = isFlat ? '—' : (diff > 0 ? '▲' : '▼');
      const cls = isFlat ? 'eq' : (diff > 0 ? 'bad' : 'good');
      tdDiff.textContent = `${arrow} ${Math.abs(diff).toFixed(1)} Pp`;
      tdDiff.className = 'storno-history-diff ' + cls;
    }
    row.appendChild(tdDate); row.appendChild(tdVal); row.appendChild(tdDiff);
    table.appendChild(row);
  });

  popup.appendChild(table);
  overlay.appendChild(popup);
  document.body.appendChild(overlay);
}


function buildStornoDeltaList(stornoHistory, stornoCurrent, cols){
  const heute = new Date().toLocaleDateString('de-DE');
  const parseDatum = (s) => { const parts = s.split('.'); return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); };
  const palette = ['#E20074','#3B6FA0','#0E7C7B','#C2792B','#7C5CBF','#B4423A'];

  const wrap = document.createElement('div');
  wrap.className = 'storno-delta-list';

  cols.forEach((p,pi)=>{
    const hist = (stornoHistory[p]||[]).slice();
    const pts = hist.map(hh=>({datum:hh.datum, wert:hh.wert}));
    pts.push({datum: heute, wert: stornoCurrent[p]||0});
    const byDate = {};
    pts.forEach(pt=>{ byDate[pt.datum] = pt.wert; });
    const dateKeys = Object.keys(byDate).sort((a,b)=>parseDatum(a)-parseDatum(b));
    const color = palette[pi % palette.length];

    const row = document.createElement('div');
    row.className = 'storno-delta-row';
    row.style.cursor = 'pointer';
    row.title = 'Klicken für die komplette Tages-Historie';
    row.addEventListener('click', ()=>showStornoHistoryPopup(p, stornoHistory[p]||[], stornoCurrent[p]||0));

    const labelEl = document.createElement('span');
    labelEl.className = 'storno-delta-label';
    labelEl.innerHTML = `<span class="storno-delta-dot" style="background:${color};"></span>${p}`;
    row.appendChild(labelEl);

    const valsEl = document.createElement('span');
    valsEl.className = 'storno-delta-vals';

    if(dateKeys.length < 2){
      const cur = byDate[dateKeys[0]] || 0;
      valsEl.innerHTML = `<span class="storno-delta-current">${cur.toFixed(1)}%</span> <span class="storno-delta-nohist">(noch keine Vergleichsbasis)</span>`;
    } else {
      const prev = byDate[dateKeys[dateKeys.length-2]];
      const cur = byDate[dateKeys[dateKeys.length-1]];
      const diff = cur - prev;
      // Storno: niedriger ist besser - Anstieg = schlecht (rot), Rückgang = gut (grün)
      const isFlat = Math.abs(diff) < 0.05;
      const arrow = isFlat ? '—' : (diff > 0 ? '▲' : '▼');
      const cls = isFlat ? 'eq' : (diff > 0 ? 'bad' : 'good');
      valsEl.innerHTML = `${prev.toFixed(1)}% → <span class="storno-delta-current">${cur.toFixed(1)}%</span> <span class="storno-delta-diff ${cls}">${arrow} ${Math.abs(diff).toFixed(1)} Pp</span>`;
    }
    row.appendChild(valsEl);
    wrap.appendChild(row);
  });

  return wrap;
}

function drawStornoTrendChart(cnv, stornoHistory, stornoCurrent, cols){
  const ctx = cnv.getContext('2d');
  const dprC = window.devicePixelRatio||1;
  const w = cnv.offsetWidth || 600;
  const h = 220;
  cnv.width = w*dprC; cnv.height = h*dprC; cnv.style.width=w+'px'; cnv.style.height=h+'px';
  ctx.scale(dprC,dprC);
  ctx.clearRect(0,0,w,h);

  const heute = new Date().toLocaleDateString('de-DE');
  const parseDatum = (s) => { const parts = s.split('.'); return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`); };

  const series = {};
  const allDatesSet = new Set();
  cols.forEach(p=>{
    const hist = (stornoHistory[p]||[]).slice();
    const pts = hist.map(hh=>({datum:hh.datum, wert:hh.wert}));
    pts.push({datum: heute, wert: stornoCurrent[p]||0});
    pts.sort((a,b)=>parseDatum(a.datum)-parseDatum(b.datum));
    series[p] = pts;
    pts.forEach(pt=>allDatesSet.add(pt.datum));
  });
  const dateList = Array.from(allDatesSet).sort((a,b)=>parseDatum(a)-parseDatum(b));

  if(dateList.length < 2){
    ctx.fillStyle = '#94A3B8';
    ctx.font = '12px Inter';
    ctx.textAlign = 'center';
    ctx.fillText('Noch nicht genug Verlaufsdaten (mind. 2 unterschiedliche Tage nötig)', w/2, h/2);
    return;
  }

  const palette = ['#E20074','#3B6FA0','#0E7C7B','#C2792B','#7C5CBF','#B4423A'];
  const pad = {l:42, r:112, t:16, b:26};
  const chartW = w - pad.l - pad.r;
  const chartH = h - pad.t - pad.b;

  function valueAt(p, dateStr){
    const pts = series[p];
    let val = pts[0].wert;
    for(const pt of pts){ if(parseDatum(pt.datum) <= parseDatum(dateStr)) val = pt.wert; else break; }
    return val;
  }

  const allVals = [];
  cols.forEach(p=> dateList.forEach(d=> allVals.push(valueAt(p,d))));
  const maxVal = Math.max(...allVals, 5) * 1.15;

  ctx.strokeStyle = '#F0F0F2';
  ctx.fillStyle = '#94A3B8';
  ctx.font = '9px Inter';
  ctx.textAlign = 'right';
  for(let i=0;i<=4;i++){
    const val = (maxVal*i/4);
    const y = pad.t + chartH - (i/4)*chartH;
    ctx.fillText(val.toFixed(0)+'%', pad.l-6, y+3);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+chartW,y); ctx.stroke();
  }

  cols.forEach((p,pi)=>{
    const color = palette[pi % palette.length];
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    dateList.forEach((d,i)=>{
      const x = pad.l + (i/(dateList.length-1))*chartW;
      const v = valueAt(p,d);
      const y = pad.t + chartH - (v/maxVal)*chartH;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.stroke();
    const lastV = valueAt(p, dateList[dateList.length-1]);
    const lastY = pad.t + chartH - (lastV/maxVal)*chartH;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(pad.l+chartW, lastY, 3, 0, Math.PI*2); ctx.fill();
  });

  ctx.fillStyle = '#64748B';
  ctx.font = '9px Inter';
  ctx.textAlign = 'center';
  const showIdx = dateList.length <= 6 ? dateList.map((_,i)=>i) : [0, Math.floor(dateList.length/2), dateList.length-1];
  showIdx.forEach(i=>{
    const x = pad.l + (i/(dateList.length-1))*chartW;
    ctx.fillText(dateList[i], x, h-6);
  });

  ctx.textAlign = 'left';
  ctx.font = 'bold 10px Inter';
  cols.forEach((p,pi)=>{
    const color = palette[pi % palette.length];
    const y = pad.t + pi*16;
    ctx.fillStyle = color;
    ctx.fillRect(pad.l+chartW+10, y, 10, 10);
    ctx.fillStyle = '#1C2733';
    ctx.fillText(p, pad.l+chartW+24, y+9);
  });
}


// ===== Mitarbeiter-Verlauf: Diagramme als SVG (v155) – passen sich der Kastenbreite an, Werte an jedem Monat =====
function vlRender(el, build){
  if(!el) return;
  const big = !!el.closest('.chart-popup');
  const w = Math.max(260, Math.round(el.clientWidth || (el.parentElement && el.parentElement.clientWidth) || 420));
  el.innerHTML = build(w, big ? Math.max(320, Math.round(w*0.45)) : 230);
}
function vlMonthLabel(m){
  if(String(m).includes('-')){ const [y, mn] = String(m).split('-'); return { mon: mn.substring(0,3), yr: y }; }
  return { mon: String(m).substring(0,3), yr: '' };
}
function vlNiceMax(dataMax, minMax){
  const raw = Math.max(dataMax*1.12, minMax||1);
  const m = Math.pow(10, Math.floor(Math.log10(raw/4)));
  const f = (raw/4)/m; const step = (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m;
  const n = Math.max(3, Math.ceil(raw/step));
  return { max: n*step, n };
}
function vlFrame(w, h, monate, pad){
  const T = "font-family:Inter,sans-serif;";
  const fs = w >= 600 ? 12 : 10;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;overflow:visible;">`;
  return { svg, T, fs };
}
function vlLineSVG(w, h, o){
  const pad = {l:38, r:16, t:30, b:34};
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b, n = o.monate.length;
  const vals = o.values.map(v=>parseFloat(v)||0);
  const dataMax = Math.max(0, ...vals);
  const sc = o.fixedMax ? { max:o.fixedMax, n:4 } : vlNiceMax(Math.max(dataMax, (o.target||0)*1.1), o.percent ? 5 : 10);
  const inset = 14;
  const xPos = i => pad.l + inset + (n>1 ? i/(n-1)*(cw-2*inset) : (cw-2*inset)/2);
  const yPos = v => pad.t + ch - (v/sc.max)*ch;
  let { svg, T, fs } = vlFrame(w, h);
  const gap = n>1 ? (cw-2*inset)/(n-1) : cw;
  const vfs = gap < 30 ? fs-1.5 : fs;   // bei vielen Monaten etwas kleinere Zahlen
  for(let i=0;i<=sc.n;i++){
    const tv = sc.max*i/sc.n, y = pad.t + ch - (i/sc.n)*ch;
    const lbl = (Number.isInteger(tv) ? tv : tv.toFixed(1)).toLocaleString('de-DE') + (o.percent ? '%' : '');
    svg += `<line x1="${pad.l}" y1="${y}" x2="${pad.l+cw}" y2="${y}" style="stroke:var(--border);" ${i? 'stroke-dasharray="2 4"' : ''}/>`;
    svg += `<text x="${pad.l-6}" y="${y+3.5}" text-anchor="end" font-size="${fs-1}" style="${T}fill:var(--muted);">${lbl}</text>`;
  }
  if(o.target){
    const yZ = yPos(o.target);
    svg += `<line x1="${pad.l}" y1="${yZ}" x2="${pad.l+cw}" y2="${yZ}" stroke="#E20074" stroke-width="1.2" stroke-dasharray="5 4" opacity=".7"/>`;
    // Ziel-Legende oben rechts (statt direkt an der Linie, wo sie mit Punkten kollidieren kann)
    const lx = pad.l + cw - (String(o.targetLabel||'').length * (fs-1) * 0.6) - 4;
    svg += `<line x1="${lx-20}" y1="${pad.t-12}" x2="${lx-6}" y2="${pad.t-12}" stroke="#E20074" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    svg += `<text x="${pad.l+cw}" y="${pad.t-8}" text-anchor="end" font-size="${fs-1}" font-weight="600" fill="#E20074" style="${T}">${o.targetLabel||''}</text>`;
  }
  let prevYr = null;
  o.monate.forEach((m,i)=>{
    const L = vlMonthLabel(m), x = xPos(i);
    svg += `<text x="${x}" y="${h-pad.b+16}" text-anchor="middle" font-size="${fs-1}" style="${T}fill:var(--muted);">${L.mon}</text>`;
    if(L.yr && L.yr !== prevYr){ svg += `<text x="${x}" y="${h-pad.b+28}" text-anchor="middle" font-size="${fs-2}" font-weight="600" style="${T}fill:var(--muted);opacity:.75;">${L.yr}</text>`; prevYr = L.yr; }
  });
  const pts = vals.map((v,i)=>({v,i,x:xPos(i),y:yPos(v)})).filter(p => !(o.skipZero && p.v === 0));
  if(pts.length > 1) svg += `<path d="${pts.map((p,j)=>(j?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, j)=>{
    const ok = o.target ? p.v >= o.target : true;
    const col = ok ? 'var(--good)' : '#E20074';
    // Zahl über dem Punkt; liegt der Punkt sehr weit oben, darunter
    const ty = p.y - 9 < pad.t - 2 ? p.y + vfs + 7 : p.y - 9;
    svg += `<circle cx="${p.x}" cy="${p.y}" r="${j===pts.length-1?4.2:3.4}" style="fill:${col};stroke:var(--panel);" stroke-width="1.5"/>`;
    svg += `<text x="${p.x}" y="${ty}" text-anchor="middle" font-size="${vfs}" font-weight="700" style="${T}fill:var(--text);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round;">${o.fmt(p.v)}</text>`;
  });
  return svg + '</svg>';
}
function vlBarSVG(w, h, o){
  const pad = {l:38, r:10, t:22, b:34};
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b, n = o.monate.length;
  const vals = o.values.map(v=>parseFloat(v)||0);
  const sc = vlNiceMax(Math.max(0, ...vals), 600);
  let { svg, T, fs } = vlFrame(w, h);
  const slot = cw/n, bw = Math.max(8, Math.min(34, slot*0.62));
  const vfs = slot < 30 ? fs-1.5 : fs;
  const col = v => v <= 550 ? 'var(--good)' : v <= 680 ? 'var(--warn)' : 'var(--bad)';
  for(let i=0;i<=sc.n;i++){
    const tv = sc.max*i/sc.n, y = pad.t + ch - (i/sc.n)*ch;
    svg += `<line x1="${pad.l}" y1="${y}" x2="${pad.l+cw}" y2="${y}" style="stroke:var(--border);" ${i? 'stroke-dasharray="2 4"' : ''}/>`;
    svg += `<text x="${pad.l-6}" y="${y+3.5}" text-anchor="end" font-size="${fs-1}" style="${T}fill:var(--muted);">${Math.round(tv)}</text>`;
  }
  let prevYr = null;
  o.monate.forEach((m,i)=>{
    const cx = pad.l + (i+0.5)*slot, v = vals[i], L = vlMonthLabel(m);
    if(v > 0){
      const bh = v/sc.max*ch, by = pad.t + ch - bh;
      svg += `<rect x="${cx-bw/2}" y="${by}" width="${bw}" height="${bh}" rx="3" style="fill:${col(v)};"/>`;
      svg += `<text x="${cx}" y="${by-5}" text-anchor="middle" font-size="${vfs}" font-weight="700" style="${T}fill:${col(v)};font-variant-numeric:tabular-nums;">${Math.round(v)}</text>`;
    }
    svg += `<text x="${cx}" y="${h-pad.b+16}" text-anchor="middle" font-size="${fs-1}" style="${T}fill:var(--muted);">${L.mon}</text>`;
    if(L.yr && L.yr !== prevYr){ svg += `<text x="${cx}" y="${h-pad.b+28}" text-anchor="middle" font-size="${fs-2}" font-weight="600" style="${T}fill:var(--muted);opacity:.75;">${L.yr}</text>`; prevYr = L.yr; }
  });
  return svg + '</svg>';
}

function showChartPopup(title, drawFn){
  const overlay = document.createElement('div');
  overlay.className = 'chart-overlay';
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  const popup = document.createElement('div');
  popup.className = 'chart-popup';

  const closeBtn = document.createElement('button');
  closeBtn.className = 'chart-popup-close';
  closeBtn.innerHTML = '×';
  closeBtn.addEventListener('click', ()=>overlay.remove());

  const titleEl = document.createElement('div');
  titleEl.className = 'chart-popup-title';
  titleEl.textContent = title;

  const zoomBar = document.createElement('div');
  zoomBar.className = 'chart-zoom-bar';
  const zoomOutBtn = document.createElement('button');
  zoomOutBtn.className = 'chart-zoom-btn'; zoomOutBtn.textContent = '−';
  const zoomLabel = document.createElement('span');
  zoomLabel.className = 'chart-zoom-label'; zoomLabel.textContent = '100%';
  const zoomInBtn = document.createElement('button');
  zoomInBtn.className = 'chart-zoom-btn'; zoomInBtn.textContent = '+';
  const zoomResetBtn = document.createElement('button');
  zoomResetBtn.className = 'chart-zoom-btn chart-zoom-reset'; zoomResetBtn.textContent = '⟲';
  zoomResetBtn.title = 'Zurücksetzen';
  zoomBar.appendChild(zoomOutBtn);
  zoomBar.appendChild(zoomLabel);
  zoomBar.appendChild(zoomInBtn);
  zoomBar.appendChild(zoomResetBtn);

  const viewport = document.createElement('div');
  viewport.className = 'chart-zoom-viewport';
  const canvas = document.createElement('div'); // v155: SVG statt Canvas (Name der Variable bleibt für Zoom/Pan)
  canvas.className = 'vl-chart-host vl-chart-host-big';
  canvas.style.transformOrigin = 'center center';
  viewport.appendChild(canvas);

  popup.appendChild(closeBtn);
  popup.appendChild(titleEl);
  popup.appendChild(zoomBar);
  popup.appendChild(viewport);
  overlay.appendChild(popup);
  document.body.appendChild(overlay);

  // Zoom & Pan Zustand
  let scale = 1, panX = 0, panY = 0;
  let dragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;
  const MIN_SCALE = 1, MAX_SCALE = 4;

  function applyTransform(){
    canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    zoomLabel.textContent = Math.round(scale*100) + '%';
    viewport.style.cursor = scale > 1 ? 'grab' : 'default';
  }
  function clampPan(){
    // grobe Begrenzung, damit man den Chart nicht komplett wegzieht
    const maxOffset = (scale - 1) * 300 + 40;
    panX = Math.max(-maxOffset, Math.min(maxOffset, panX));
    panY = Math.max(-maxOffset, Math.min(maxOffset, panY));
  }
  function setScale(newScale){
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
    if(scale === 1){ panX = 0; panY = 0; }
    clampPan();
    applyTransform();
  }

  zoomInBtn.addEventListener('click', ()=>setScale(scale + 0.25));
  zoomOutBtn.addEventListener('click', ()=>setScale(scale - 0.25));
  zoomResetBtn.addEventListener('click', ()=>setScale(1));

  viewport.addEventListener('wheel', e=>{
    e.preventDefault();
    setScale(scale + (e.deltaY < 0 ? 0.2 : -0.2));
  }, { passive:false });

  viewport.addEventListener('mousedown', e=>{
    if(scale <= 1) return;
    dragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    panStartX = panX; panStartY = panY;
    viewport.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    panX = panStartX + (e.clientX - dragStartX);
    panY = panStartY + (e.clientY - dragStartY);
    clampPan();
    applyTransform();
  });
  window.addEventListener('mouseup', ()=>{ dragging = false; if(scale>1) viewport.style.cursor='grab'; });

  // Touch (Pinch-Zoom + Ziehen)
  let touchStartDist = null, touchStartScale = 1;
  viewport.addEventListener('touchstart', e=>{
    if(e.touches.length === 2){
      touchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      touchStartScale = scale;
    } else if(e.touches.length === 1 && scale > 1){
      dragging = true;
      dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
      panStartX = panX; panStartY = panY;
    }
  }, { passive:true });
  viewport.addEventListener('touchmove', e=>{
    if(e.touches.length === 2 && touchStartDist){
      const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      setScale(touchStartScale * (dist/touchStartDist));
    } else if(e.touches.length === 1 && dragging){
      panX = panStartX + (e.touches[0].clientX - dragStartX);
      panY = panStartY + (e.touches[0].clientY - dragStartY);
      clampPan();
      applyTransform();
    }
  }, { passive:true });
  viewport.addEventListener('touchend', ()=>{ dragging = false; touchStartDist = null; });

  setTimeout(()=>{
    drawFn(canvas);
    applyTransform();
  }, 50);
}


const MONATE_ORDER = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
let vlSelectedAgent = {};

  cancelBtn.addEventListener('click', ()=>overlay.remove());

  const saveBtn = document.createElement('button');
  saveBtn.textContent = '✓ Speichern';
  saveBtn.style.cssText = 'padding:9px 18px;border-radius:8px;border:none;background:var(--tmg);color:#fff;font-family:"Inter",sans-serif;font-weight:600;font-size:13px;cursor:pointer;';
  saveBtn.addEventListener('click', ()=>{

    if(!state.verlauf) state.verlauf = {};
    state.agents.forEach(agent => {
      if(!agent.name.trim()) return;
      // In den fest verknüpften Verlaufs-Eintrag des Mitarbeiters schreiben (nicht per Name)
      const vlEntry = verlaufTargetEntry(agent);

function renderVerlauf(){
  const container = document.getElementById('verlauf-container');
  container.innerHTML = '';

  // Hilfsfunktion: aktuellen vollen Namen (Vorname + Nachname) für einen Verlaufs-Eintrag holen
  function getVerlaufDisplayName(av){
    // Suche den aktuellen Agenten in state.agents anhand team + Name-Match
    const current = state.agents.find(a => a.team === av.team && (
      a.name === av.name ||
      a.name.split(' ')[0] === av.name ||
      a.name.endsWith(' ' + av.name) ||
      av.name.endsWith(' ' + a.name.split(' ')[0])
    ));
    return current ? current.name : av.name;
  }

  // ===== TOP 5 / BOTTOM 5 (Durchschnitt über alle vorhandenen Monate) =====
  try {
  const rankOuter = document.createElement('div');
  rankOuter.className = 'ranking-outer';

  function avgFromVerlauf(agent, field){
    // Fuzzy-Match: voller Name, nur Nachname, oder Nachname stimmt überein
    const entry = Object.values(state.verlauf).find(v => v.team===agent.team && (
      v.name === agent.name ||
      agent.name.startsWith(v.name + ' ') ||
      agent.name.endsWith(' ' + v.name) ||
      v.name.startsWith(agent.name + ' ') ||
      v.name.endsWith(' ' + agent.name)
    ));
    if(!entry) return null;
    const vals = Object.values(entry.monate||{}).map(m=>m[field]).filter(v=>v !== undefined && v !== null && v > 0);
    if(!vals.length) return null;
    return vals.reduce((s,v)=>s+v,0)/vals.length;
  }

  Object.keys(TEAM_CONFIGS).forEach(teamId => {
    const cfg = TEAM_CONFIGS[teamId];
    const teamAgents = state.agents.filter(a => a.team === teamId && a.category !== 'schulung' && a.category !== 'work');
    if(!teamAgents.length) return;

    const rankWrap = document.createElement('div');
    rankWrap.className = 'ranking-wrap';

    const mkRankBox = (title, emoji, agents, valFn, colorFn) => {
      const box = document.createElement('div');
      box.className = 'ranking-box';
      box.innerHTML = `<div class="rb-title">${emoji} ${title} — ${cfg.label}</div>`;
      if(!agents.length){
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Noch keine Verlaufsdaten.';
        box.appendChild(empty);
      }
      agents.forEach((a,i) => {
        const row = document.createElement('div');
        row.className = 'ranking-row';
        const val = valFn(a);
        row.innerHTML = `<span class="rr-rank">${i+1}.</span><span class="rr-name">${getVerlaufDisplayName(a)}</span><span class="rr-val" style="color:${colorFn(val)}">${val}</span>`;
        box.appendChild(row);
      });
      return box;
    };

    // Ø CR über alle Monate
    const withCr = teamAgents.map(a=>({agent:a, avg:avgFromVerlauf(a,'cr')})).filter(x=>x.avg!==null);
    const crSorted = withCr.sort((a,b)=>b.avg-a.avg);
    rankWrap.appendChild(mkRankBox('Ø CR (alle Monate)', '🏆', crSorted.slice(0,5).map(x=>x.agent),
      a => avgFromVerlauf(a,'cr').toFixed(2)+'%', v => '#0A7C70'));
    rankWrap.appendChild(mkRankBox('Coaching Bedarf (Ø CR)', '⚠️', crSorted.slice(-5).reverse().map(x=>x.agent),
      a => avgFromVerlauf(a,'cr').toFixed(2)+'%', v => '#B4423A'));

    // Ø NPS über alle Monate
    const withNps = teamAgents.map(a=>({agent:a, avg:avgFromVerlauf(a,'nps')})).filter(x=>x.avg!==null);
    const npsSorted = withNps.sort((a,b)=>b.avg-a.avg);
    rankWrap.appendChild(mkRankBox('Ø NPS (alle Monate)', '🏆', npsSorted.slice(0,5).map(x=>x.agent),
      a => avgFromVerlauf(a,'nps').toFixed(1)+'%', v => '#0A7C70'));
    rankWrap.appendChild(mkRankBox('Coaching Bedarf (Ø NPS)', '⚠️', npsSorted.slice(-5).reverse().map(x=>x.agent),
      a => avgFromVerlauf(a,'nps').toFixed(1)+'%', v => '#B4423A'));

    rankOuter.appendChild(rankWrap);
  });
  container.appendChild(rankOuter);
  } catch(e) {
    console.error('Fehler bei den Ranglisten:', e);
    showSyncDebug('⚠️ Fehler bei den Ranglisten: ' + e.message, true);
  }

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'vl-toolbar';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'vl-save-btn';
  saveBtn.textContent = '📸 Aktuellen Monat speichern';
  saveBtn.addEventListener('click', saveMonatSnapshot);
  toolbar.appendChild(saveBtn);
  const infoSpan = document.createElement('span');
  infoSpan.style.cssText = 'font-family:"Inter",sans-serif;font-size:12px;color:var(--muted);';
  const gespeicherteSnapshots = Object.keys(state.verlauf||{}).length;
  infoSpan.textContent = gespeicherteSnapshots > 0 ? `${gespeicherteSnapshots} Mitarbeiter mit Verlaufsdaten` : 'Noch keine Snapshots gespeichert';
  toolbar.appendChild(infoSpan);
  container.appendChild(toolbar);

  if(!state.verlauf || Object.keys(state.verlauf).length === 0){
    const empty = document.createElement('div');
    empty.className = 'vl-no-data';
    empty.textContent = 'Noch keine Verlaufsdaten vorhanden. Klicke auf "Aktuellen Monat speichern" um den ersten Snapshot zu erstellen.';
    container.appendChild(empty);
    return;
  }

  // Teams
  Object.keys(TEAM_CONFIGS).forEach(teamId => {
    const cfg = TEAM_CONFIGS[teamId];
    const teamAgents = Object.values(state.verlauf).filter(v => v.team === teamId);
    if(!teamAgents.length) return;

    const teamBlock = document.createElement('div');
    teamBlock.className = 'vl-team-block';
    teamBlock.innerHTML = `<div class="vl-team-title">${cfg.label} — ${cfg.project}</div>`;

    // Mitarbeiter-Auswahl
    const agentToolbar = document.createElement('div');
    agentToolbar.className = 'vl-toolbar';
    agentToolbar.innerHTML = '<label style="font-family:Inter,sans-serif;font-size:13px;font-weight:600;">Mitarbeiter: </label>';
    const sel = document.createElement('select');
    sel.className = 'vl-agent-select';
    teamAgents.forEach(av => {
      const opt = document.createElement('option');
      opt.value = av.name + '_' + av.team;
      opt.textContent = getVerlaufDisplayName(av);
      if(vlSelectedAgent[teamId] === opt.value) opt.selected = true;
      sel.appendChild(opt);
    });
    if(!vlSelectedAgent[teamId]) vlSelectedAgent[teamId] = teamAgents[0].name + '_' + teamAgents[0].team;
    sel.addEventListener('change', e => { vlSelectedAgent[teamId] = e.target.value; renderVerlauf(); });
    agentToolbar.appendChild(sel);
    teamBlock.appendChild(agentToolbar);

    const agentKey = vlSelectedAgent[teamId];
    const [selName, ...selTeamParts] = agentKey.split('_');
    const selTeam = selTeamParts.join('_');
    const agentData = state.verlauf[agentKey] || Object.values(state.verlauf).find(v=>v.name===selName && v.team===selTeam);
    if(!agentData){ container.appendChild(teamBlock); return; }

    const MONATE_NAMEN = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    // Keys können "April" oder "2024-April" sein
    const alleMonatKeys = Object.keys(agentData.monate);
    const monate = alleMonatKeys.sort((a, b) => {
      // Sortierung: Jahr-Monat Format
      const parseKey = k => {
        const parts = k.split('-');
        if(parts.length === 2){ const [j,m] = parts; return parseInt(j)*100 + MONATE_NAMEN.indexOf(m); }
        return 2024*100 + MONATE_NAMEN.indexOf(k);
      };
      return parseKey(a) - parseKey(b);
    });
    if(!monate.length){
      teamBlock.innerHTML += '<div class="vl-no-data">Keine Monatsdaten für diesen Mitarbeiter.</div>';
      container.appendChild(teamBlock);
      return;
    }

    // 3 Diagramme: Stückzahl, CR, NPS
    const chartsRow = document.createElement('div');
    chartsRow.className = 'vl-charts-row';

    // Diagramm 1: Gesamt Stückzahl
    const chartWrap1 = document.createElement('div');

    chartWrap1.addEventListener('click', ()=>showChartPopup(agentDisplayName+' — Gesamt Stückzahl', c=>drawStkChart(c, monate, stkValues, stkZiel, agentData, cfg)));
    const canvas1 = document.createElement('div'); canvas1.className = 'vl-chart-host';
    canvas1.height = 200;
    chartWrap1.appendChild(canvas1);
    chartsRow.appendChild(chartWrap1);

    // Diagramm 2: CR
    const chartWrap = document.createElement('div');
    chartWrap.className = 'vl-chart-wrap';
    chartWrap.innerHTML = `<div class="vl-chart-title">${agentDisplayName} — Gesamt-CR Entwicklung</div>`;
    chartWrap.addEventListener('click', ()=>showChartPopup(agentDisplayName+' — Gesamt-CR Entwicklung', c=>drawCRChart(c, monate, crValues, cfg, agentData)));
    const canvas = document.createElement('div'); canvas.className = 'vl-chart-host';
    canvas.height = 200;
    chartWrap.appendChild(canvas);
    chartsRow.appendChild(chartWrap);

    // Diagramm 3: NPS
    const chartWrapNPS = document.createElement('div');
    chartWrapNPS.className = 'vl-chart-wrap';
    chartWrapNPS.innerHTML = `<div class="vl-chart-title">${agentDisplayName} — NPS Entwicklung</div>`;
    chartWrapNPS.addEventListener('click', ()=>showChartPopup(agentDisplayName+' — NPS Entwicklung', c=>drawNPSChart(c, monate, npsValues, cfg, agentData)));
    const canvasNPS = document.createElement('div'); canvasNPS.className = 'vl-chart-host';
    canvasNPS.height = 200;
    chartWrapNPS.appendChild(canvasNPS);
    chartsRow.appendChild(chartWrapNPS);

    // Diagramm 4: CHT
    const chtValues = monate.map(m => agentData.monate[m].cht || null);
    const hasChtData = chtValues.some(v => v !== null && v > 0);
    if(hasChtData){
      const chartWrapCHT = document.createElement('div');
      chartWrapCHT.className = 'vl-chart-wrap';
      chartWrapCHT.innerHTML = `<div class="vl-chart-title">${agentDisplayName} — CHT Entwicklung</div>`;
      chartWrapCHT.addEventListener('click', ()=>showChartPopup(agentDisplayName+' — CHT Entwicklung', c=>drawCHTChart(c, monate, chtValues)));

    teamBlock.appendChild(chartsRow);

    // Chart mit Canvas zeichnen

    // Stückzahl-Diagramm
    const stkValues = monate.map(m => {
      const md = agentData.monate[m];
      return Object.values(md.sales||{}).reduce((s,v)=>s+v,0);
    });
    // Echte Kategorie des Mitarbeiters ermitteln (wird auch für die Tabelle unten genutzt)
    const matchingAgentForCharts = state.agents.find(a => a.team === teamId && (
      a.name === agentData.name ||
      a.name.split(' ')[0] === agentData.name ||
      a.name.endsWith(' ' + agentData.name)
    ));
    const agentCategoryForCharts = (matchingAgentForCharts && matchingAgentForCharts.category) || 'regular';
    const stkZiel = agentTargets({team:teamId,category:agentCategoryForCharts}).reduce((s,v)=>s+v,0);

    function drawStkChart(el, monate, stkValues, stkZiel, agentData, cfg){
      vlRender(el, (w,h)=>vlLineSVG(w, h, { monate, values: stkValues, target: stkZiel, targetLabel: 'Ziel '+stkZiel, color:'#0E7C7B', fmt: v=>String(Math.round(v)) }));
    }
    function drawCRChart(el, monate, crValues, cfg, agentData){
      vlRender(el, (w,h)=>vlLineSVG(w, h, { monate, values: crValues, target: cfg.crTarget, targetLabel: 'Ziel '+cfg.crTarget+'%', color:'#0E7C7B', percent:true, fmt: v=>v.toFixed(1).replace('.',',') }));
    }
    function drawNPSChart(el, monate, npsValues, cfg, agentData){
      const ziel = cfg.npsTarget || 70;
      vlRender(el, (w,h)=>vlLineSVG(w, h, { monate, values: npsValues, target: ziel, targetLabel: 'Ziel '+ziel+'%', color:'#5B6FA6', percent:true, fixedMax:100, skipZero:true, fmt: v=>v.toFixed(1).replace('.',',') }));
    }
    function drawCHTChart(el, monate, chtValues){
      vlRender(el, (w,h)=>vlBarSVG(w, h, { monate, values: chtValues.map(v=>v||0) }));
    }

    // Charts zeichnen
    setTimeout(()=>{ drawStkChart(canvas1, monate, stkValues, stkZiel, agentData, cfg); }, 50);
    setTimeout(()=>{ drawCRChart(canvas, monate, crValues, cfg, agentData); }, 50);
    setTimeout(()=>{ drawNPSChart(canvasNPS, monate, npsValues, cfg, agentData); }, 50);

    // Tabelle mit allen Monaten
    const t = document.createElement('table');
    t.className = 'vl-table';
    const prods = cfg.products;
    t.innerHTML = `<tr><th>Monat</th>${prods.map(p=>`<th>${p}</th>`).join('')}<th>CR</th><th>Calls</th><th>CHT</th><th>NPS</th><th>Trend</th></tr>`;
    monate.forEach(m => {
      const md = agentData.monate[m];
      const cr = md.cr || 0;
      const crOk = cr >= cfg.crTarget;
      const tr = document.createElement('tr');
      let html = `<td>${m.includes('-') ? m.split('-')[1]+' '+m.split('-')[0] : m}</td>`;
      prods.forEach((p,i) => {
        const val = (md.sales && md.sales[p]) || 0;
        const tgt = agentTargets({team:teamId, category:agentCategoryForCharts})[i];
        const cls = val >= tgt ? 'ok' : val > 0 ? 'mid' : 'bad';
        html += `<td><span class="vl-badge ${cls}">${Math.round(val)}</span></td>`;
      });
      html += `<td><span class="vl-badge ${crOk?'ok':'bad'}">${cr.toFixed(2)}%</span></td>`;
      html += `<td><span class="vl-badge">${Math.round(md.calls||0)}</span></td>`;
      const chtVal = (md.cht === null || md.cht === undefined) ? null : md.cht;
      const chtCls = chtVal === null ? '' : (chtVal <= 550 ? 'ok' : chtVal <= 680 ? 'mid' : 'bad');
      html += `<td><span class="vl-badge ${chtCls}">${chtVal === null ? '–' : Math.round(chtVal)}</span></td>`;
      html += `<td><span class="vl-badge ${(md.nps||0)>=cfg.npsTarget?'ok':'bad'}">${(md.nps||0).toFixed(1)}%</span></td>`;
      // Trend: Vergleich mit Vormonat
      const prevM = monate[monate.indexOf(m)-1];
      let trendHtml = '<span class="trend-flat">—</span>';
      if(prevM){
        const prevCr = agentData.monate[prevM].cr||0;
        const diff = cr - prevCr;
        if(Math.abs(diff) >= 0.1){
          const cls = diff>0?'trend-up':'trend-down';
          const arrow = diff>0?'▲':'▼';
          trendHtml = `<span class="${cls}">${arrow} ${Math.abs(diff).toFixed(2)}%</span>`;
        }
      }
      html += `<td>${trendHtml}</td>`;
      tr.innerHTML = html;
      t.appendChild(tr);
    });
    teamBlock.appendChild(t);
    container.appendChild(teamBlock);
  });
}

// Gibt die Hintergrundfarbe für einen CR%-Wert zurück, passend zu den CR-Stufen aus "Team Ziele"
// (crZiel1/crZiel2/crZiel3 in state.teamziele). Global nutzbar (auch in Monatsabschluss), damit
// dieselben Farben verwendet werden wie in Team Ziele.
function crStuffeProd(p, val, tz){
  const v = parseFloat(val)||0;
  const s1 = parseFloat((tz.crZiel1 && tz.crZiel1[p])||0);
  const s2 = parseFloat((tz.crZiel2 && tz.crZiel2[p])||0);
  // Stufe 3 nur für das MF-Produkt
  const s3 = (p === 'MF' && tz.crZiel3) ? parseFloat(tz.crZiel3[p]||0) : null;
  if(s3 !== null && v >= s3) return 'background:var(--st3-bg);color:var(--st3-fg);';
  if(v >= s2) return 'background:var(--st2-bg);color:var(--st2-fg);';
  if(v >= s1) return 'background:var(--st1-bg);color:var(--st1-fg);';
  return 'background:var(--st0-bg);color:var(--st0-fg);';
}

function renderMonatsabschluss(){
  const container = document.getElementById('monatsabschluss-container');
  container.innerHTML = '';
  const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  // ===== VERLAUFS-DIAGRAMME =====
  const chartsWrap = document.createElement('div');
  chartsWrap.className = 'ma-charts-wrap';

  const makeSVGChart = (datasets, isPercent, w, h, fixedMax) => {
    // v152: ruhigeres Diagramm – Werte nur am letzten Punkt, alle anderen beim Drüberfahren (Tooltip)
    const pad = {l:44,r:26,t:42,b:30};
    const cw = w-pad.l-pad.r; const ch = h-pad.t-pad.b;
    const allVals = datasets.flatMap(d=>d.values.filter(v=>v>0));
    // „Schöne“ Achsenwerte (z.B. 0/250/500/750/1000) und nie Werte außerhalb des Diagramms
    const dataMax = allVals.length ? Math.max(...allVals) : 0;
    const niceStep = raw => { const m = Math.pow(10, Math.floor(Math.log10(raw||1))); const f = raw/m; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m; };
    let maxVal, nTicks = 4;
    if(fixedMax && dataMax*1.08 <= fixedMax){ maxVal = fixedMax; }
    else {
      const raw = Math.max(dataMax*1.08, isPercent ? 5 : 10);
      const step = niceStep(raw/5);
      nTicks = Math.max(3, Math.ceil(raw/step));
      maxVal = nTicks*step;
    }
    if(isPercent && maxVal > 100 && dataMax <= 100){ maxVal = 100; nTicks = 4; }
    const labels = datasets[0].labels;
    const inset = 18; // Abstand zur Achse, damit die ersten Zahlen nicht mit der Achsenbeschriftung kollidieren
    const xPos = (i) => pad.l + inset + (labels.length>1 ? (i/(labels.length-1))*(cw-2*inset) : (cw-2*inset)/2);
    const yPos = (v) => pad.t + ch - (v/maxVal)*ch;
    const fmt = v => isPercent ? v.toFixed(1).replace('.',',')+'%' : String(Math.round(v));
    const T = 'font-family:Inter,sans-serif;';
    const fs = w >= 600 ? 12 : 10;   // Schriftgröße: im großen Pop-up etwas größer

    let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;overflow:visible;">`;
    for(let i=0;i<=nTicks;i++){
      const y = pad.t + ch - (i/nTicks)*ch;
      const tv = maxVal*i/nTicks; const val = isPercent ? (Number.isInteger(tv)?tv:tv.toFixed(1)).toString().replace('.',',')+'%' : Math.round(tv).toLocaleString('de-DE');
      svg += `<line x1="${pad.l}" y1="${y}" x2="${pad.l+cw}" y2="${y}" style="stroke:var(--border);" stroke-width="1"${i===0?'':' stroke-dasharray="2 4"'}/>`;
      svg += `<text x="${pad.l-8}" y="${y+3.5}" text-anchor="end" font-size="10" style="${T}fill:var(--muted);font-variant-numeric:tabular-nums;">${val}</text>`;
    }
    labels.forEach((m,i)=>{
      svg += `<text x="${xPos(i)}" y="${h-8}" text-anchor="middle" font-size="${fs}" style="${T}fill:var(--muted);">${m.substring(0,3)}</text>`;
    });
    // Werte an jedem Punkt: pro Monat steht der Wert der oberen Linie über, der unteren unter dem Punkt
    const ptsBy = datasets.map(ds => ds.values.map((v,i)=>({v,i,x:xPos(i),y:yPos(v)})).filter(p=>p.v>0));
    datasets.forEach((ds, k)=>{
      const pts = ptsBy[k];
      if(!pts.length) return;
      const path = pts.map((p,j)=>`${j===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      svg += `<path d="${path}" stroke="${ds.color}" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
    });
    datasets.forEach((ds, k)=>{
      ptsBy[k].forEach((p,j)=>{
        const last = j === ptsBy[k].length-1;
        const others = ptsBy.filter((_,o)=>o!==k).map(arr=>arr.find(q=>q.i===p.i)).filter(Boolean);
        const below = others.some(q => q.y < p.y || (q.y === p.y && k > 0));
        let ty = below ? p.y + fs + 6 : p.y - 8;
        if(ty < pad.t - 6) ty = p.y + fs + 6;
        if(ty > pad.t + ch - 2 && !below) ty = p.y - 8;
        svg += `<circle cx="${p.x}" cy="${p.y}" r="${last?4:3}" fill="${ds.color}" style="stroke:var(--panel);" stroke-width="1.5"/>`;
        svg += `<text x="${p.x}" y="${ty}" text-anchor="middle" font-size="${fs}" font-weight="${last?700:600}" fill="${ds.color}" style="${T}font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round;">${fmt(p.v)}</text>`;
        svg += `<circle class="ma-pt" cx="${p.x}" cy="${p.y}" r="10" fill="transparent" data-tip="${ds.label} · ${labels[p.i]}: ${fmt(p.v)}"/>`;
      });
    });
    let lx = pad.l;
    datasets.forEach(ds=>{
      svg += `<rect x="${lx}" y="6" width="10" height="10" rx="3" fill="${ds.color}"/>`;
      svg += `<text x="${lx+15}" y="15" font-size="11" font-weight="600" style="${T}fill:var(--text);">${ds.label}</text>`;
      lx += ds.label.length * 7 + 30;
    });
    svg += '</svg>';
    return svg;
  };

  // Wrapper: SVG in div einbetten statt Canvas
  const drawMAChart = (cnv, datasets, isPercent) => {
    // cnv kann Canvas oder div sein - wir ersetzen es durch SVG
    const parent = cnv.parentElement;

  const availMonate = MONATE.filter(m=>state.monatsabschluss.mf[m]||state.monatsabschluss.fn[m]);

  const mkBox = (title, buildFn, isPercent, fixedMax) => {
