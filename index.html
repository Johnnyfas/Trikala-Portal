<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Trikala-Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#F5F5F5;
  --panel:#FFFFFF;
  --border:#E0E0E0;
  --text:#1C2733;
  --muted:#64748B;
  --teal:#0E7C7B;
  --teal-soft:#E3F1F0;
  --amber:#C2792B;
  --amber-soft:#FBEEDD;
  --red:#B4423A;
  --red-soft:#FBE9E7;
  --sixh:#3B6FA0;
  --sixh-soft:#E4ECF5;
  --helpline:#7C5CBF;
  --helpline-soft:#EFE9F7;
  /* Telekom Farben */
  --tmg:#E20074;
  --tmg-soft:#FCE4F1;
  --tmg-dark:#B5005C;
  --tmg-gray:#6C6C6C;
  --tmg-light:#F2F2F2;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding:32px 24px 80px;}
.wrap{max-width:1320px;margin:0 auto;}

header.board-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:22px;border-bottom:2px solid var(--text);padding-bottom:18px;}
.title-block .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tmg);font-weight:600;margin-bottom:6px;}
h1{font-family:'Space Grotesk',sans-serif;font-size:28px;margin:0;letter-spacing:-.01em;}
.title-block p{margin:6px 0 0;color:var(--muted);font-size:13.5px;}

.tabs{display:flex;gap:8px;margin-bottom:18px;}
.tab-btn{
  background:var(--panel);border:1px solid var(--border);color:var(--muted);
  padding:9px 18px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;
}
.tab-btn.active{background:var(--text);color:#fff;border-color:var(--text);}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
button.primary{background:var(--tmg);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;}
button.primary:hover{background:var(--tmg-dark);}
button.secondary{background:#fff;color:var(--text);border:1px solid var(--border);padding:10px 16px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;}
button.secondary:hover{border-color:var(--teal);color:var(--teal);}

/* ===== Coaching view (cards) ===== */
.team-block{margin-bottom:26px;}
.team-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin:0 0 8px;}
.targets-legend{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;}
.targets-legend .line{font-family:'IBM Plex Mono',monospace;font-size:11px;}
.targets-legend .cat-label{display:inline-block;min-width:82px;font-weight:700;}
.targets-legend .cat-label.standard{color:var(--tmg-gray);}
.targets-legend .cat-label.sixh{color:var(--sixh);}
.targets-legend .cat-label.helpline{color:var(--helpline);}
.targets-legend .vals{color:var(--muted);}

.cat-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;font-weight:700;}
.cat-badge.regular{background:#EEF1F4;color:var(--muted);}
.cat-badge.sixh{background:var(--sixh-soft);color:var(--sixh);}
.cat-badge.helpline{background:var(--helpline-soft);color:var(--helpline);}

.cat-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.cat-dot.sixh{background:var(--sixh);}
.cat-dot.helpline{background:var(--helpline);}

.cards{display:flex;flex-direction:column;gap:14px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.card-top-left{display:flex;align-items:center;gap:12px;flex:1;min-width:200px;flex-wrap:wrap;}
.status-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;background:var(--teal);box-shadow:0 0 0 4px var(--teal-soft);}
.status-dot.warn{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);}
.status-dot.critical{background:var(--red);box-shadow:0 0 0 4px var(--red-soft);}

.name-input{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;border:none;background:transparent;padding:4px 0;outline:none;width:180px;border-bottom:1px solid transparent;}
.name-input:focus{border-bottom:1px solid var(--teal);}

.calls-field{display:flex;flex-direction:column;gap:4px;}
.calls-field label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.calls-field input{width:74px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;background:#FFF7EC;outline:none;}

.remove-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;flex-shrink:0;}
.remove-btn:hover{color:var(--red);}

.metrics-row{display:flex;gap:14px;flex-wrap:wrap;}
.metric-group{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#FAFBFC;}
.metric-group .group-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:8px;}
.metric-group.quality .group-label{color:var(--teal);}
.metric-group.sales .group-label{color:var(--amber);}
.metric-group.extra .group-label{color:var(--muted);}
.metric-group .fields{display:flex;gap:10px;flex-wrap:wrap;}
.metric-field{display:flex;flex-direction:column;gap:4px;}
.metric-field label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.metric-field input{width:56px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;background:#fff;outline:none;}
.metric-field input:focus{border-color:var(--teal);}
.metric-field.wide input{width:150px;font-family:'Inter',sans-serif;font-weight:500;}

.product-block{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:6px;background:#fff;border:1px solid var(--border);}
.product-block .product-name{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;}
.product-block .product-inputs{display:flex;gap:8px;align-items:flex-end;}
.product-block .stk-input{width:52px;border:1px solid var(--border);border-radius:5px;padding:5px 6px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;}
.product-block .stk-input:focus{border-color:var(--teal);outline:none;}
.mini-label{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;}
.cr-readout{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;padding:5px 8px;border-radius:5px;background:var(--teal-soft);color:var(--teal);}
.cr-readout.good{background:var(--teal-soft);color:var(--teal);}
.cr-readout.mid{background:var(--amber-soft);color:var(--amber);}
.cr-readout.zero{background:var(--red-soft);color:var(--red);}

.bottom-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.plan-block{flex:1;min-width:240px;}
.plan-block label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.plan-block textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.4;min-height:54px;resize:vertical;outline:none;background:#FAFBFC;}
.plan-block textarea:focus{border-color:var(--teal);background:#fff;}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 7px;border-radius:5px;background:var(--amber-soft);color:var(--amber);font-weight:600;}
.tag.ok{background:var(--teal-soft);color:var(--teal);}

.empty{color:var(--muted);font-size:13px;font-style:italic;padding:20px 0;text-align:center;}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:10px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;}
.sync-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 10px;border-radius:6px;font-weight:600;}
.sync-idle{background:#F1F4F7;color:var(--muted);}
.sync-syncing{background:var(--amber-soft);color:var(--amber);}
.sync-ok{background:var(--tmg-soft);color:var(--tmg);}
.sync-error{background:var(--red-soft);color:var(--red);}
.user-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
button.login-btn{background:var(--tmg);color:#fff;border:none;padding:8px 14px;border-radius:7px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;}
button.login-btn:hover{background:var(--tmg-dark);}
button.logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:7px;font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;}



/* ===== Team Ziele ===== */
.tz-section{margin-bottom:28px;}
.tz-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin:0 0 12px;color:var(--text);}
.tz-table{width:100%;border-collapse:collapse;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.07);}
.tz-table td,.tz-table th{padding:9px 12px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;text-align:center;border:1px solid rgba(255,255,255,0.15);}
.tz-table td.tz-label{text-align:left;font-family:'Inter',sans-serif;font-size:13px;}
.tz-table td input{width:100%;background:transparent;border:none;outline:none;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;text-align:center;color:inherit;-moz-appearance:textfield;}
.tz-table td input::-webkit-outer-spin-button,.tz-table td input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.tz-table td input:focus{background:rgba(255,255,255,0.3);border-radius:4px;}
.tz-row-header{background:linear-gradient(135deg,var(--tmg) 0%,var(--tmg-dark) 100%);color:#fff;}
.tz-row-header td{font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9FC5C4;}
.tz-row-date{background:#F8F9FA;color:var(--muted);}
.tz-row-soll{background:#E8F5E9;color:#2E7D32;}
.tz-row-ist{background:#FFF3E0;color:#E65100;}
.tz-row-noch{background:#F3E5F5;color:#6A1B9A;}
.tz-row-cr{background:#CE93D8;color:#4A148C;}
.tz-row-crziel1{background:#81C784;color:#1B5E20;}
.tz-row-crziel2{background:#4CAF50;color:#fff;}
.tz-row-crziel3{background:#1B5E20;color:#fff;}
.tz-row-storno{background:#FFD54F;color:#E65100;}
.tz-row-gesamt{background:#29B6F6;color:#01579B;}


/* Gesamt CR Kasten */
.tz-team-layout{display:flex;gap:20px;align-items:flex-start;}
.tz-table-wrap{flex:1;min-width:0;}
.cr-sidebar{display:flex;flex-direction:column;gap:12px;min-width:160px;}
.cr-box{border-radius:16px;padding:16px 20px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.10);position:relative;overflow:hidden;}
.cr-box::before{content:'';position:absolute;top:-20px;right:-20px;width:70px;height:70px;border-radius:50%;opacity:.15;background:currentColor;}
.cr-box .cr-box-label{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;opacity:.75;}
.cr-box .cr-box-val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700;line-height:1;}
.cr-box .cr-box-val input{background:transparent;border:none;outline:none;font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700;width:100%;text-align:center;color:inherit;}
.cr-box.gestern{background:linear-gradient(135deg,#FFF8E1,#FFE082);color:#E65100;}
.cr-box.monat{background:linear-gradient(135deg,#E8F5E9,#A5D6A7);color:#1B5E20;}
.cr-box.ziel{background:linear-gradient(135deg,#E3F2FD,#90CAF9);color:#0D47A1;}


/* ===== Monatsabschluss ===== */
.ma-section{margin-bottom:32px;}
.ma-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin:0 0 12px;color:var(--text);}
.ma-month-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.ma-month-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);}
.ma-month-btn.active{background:var(--tmg);color:#fff;border-color:var(--tmg);}
.ma-table{width:100%;border-collapse:collapse;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.07);}
.ma-table th{background:#1C2733;color:#9FC5C4;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:11px 14px;text-align:center;}
.ma-table th:first-child{text-align:left;}
.ma-table td{padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;text-align:center;border-bottom:1px solid #F5F7F9;}
.ma-table td:first-child{font-family:'Inter',sans-serif;font-weight:700;color:var(--text);text-align:left;}
.ma-table tr:last-child td{border-bottom:none;}
.ma-table tr:nth-child(even) td{background:#FAFBFC;}
.ma-badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;}
.ma-badge.ok{background:#E6F7F4;color:#0A7C70;}
.ma-badge.bad{background:#FEF0EF;color:#B4423A;}
.ma-badge.neutral{background:#F1F4F7;color:#64748B;}
.ma-nps-row td{background:#EDF8FF !important;color:#0D47A1;}
.ma-table tr.ma-row-plan td{background:#F5F0FF;}
.ma-table tr.ma-row-erreicht td{background:#F0FFF8;}
.ma-table tr.ma-row-cr td{background:#FFF8F0;}
.ma-table tr.ma-row-crziel td{background:#FFF0F5;}
.ma-table tr.ma-row-storno td{background:#FFFBF0;}
.ma-table tr.ma-row-plan td:first-child{color:#6B21A8;font-weight:700;}
.ma-table tr.ma-row-erreicht td:first-child{color:#166534;font-weight:700;}
.ma-table tr.ma-row-cr td:first-child{color:#9A3412;font-weight:700;}
.ma-table tr.ma-row-crziel td:first-child{color:#9D174D;font-weight:700;}
.ma-table tr.ma-row-storno td:first-child{color:#92400E;font-weight:700;}
.ma-input{background:transparent;border:none;outline:none;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;text-align:center;width:70px;color:inherit;}


/* ===== Mitarbeiter Verlauf ===== */
.vl-section{margin-bottom:28px;}
.vl-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.vl-save-btn{background:var(--tmg);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;}
.vl-save-btn:hover{background:var(--tmg-dark);}
.vl-month-select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);font-family:'Inter',sans-serif;font-size:13px;outline:none;}
.vl-team-block{margin-bottom:32px;}
.vl-team-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin:0 0 12px;color:var(--text);}
.vl-agent-select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);font-family:'Inter',sans-serif;font-size:13px;min-width:200px;outline:none;}
.vl-chart-wrap{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.07);margin-bottom:20px;}
.vl-chart-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin:0 0 14px;color:var(--text);}
.vl-table{width:100%;border-collapse:collapse;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.vl-table th{background:#1C2733;color:#9FC5C4;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:10px 12px;text-align:center;}
.vl-table th:first-child{text-align:left;}
.vl-table td{padding:9px 12px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;text-align:center;border-bottom:1px solid #F5F7F9;}
.vl-table td:first-child{font-family:'Inter',sans-serif;font-weight:700;text-align:left;}
.vl-table tr:last-child td{border-bottom:none;}
.vl-table tr:nth-child(even) td{background:#FAFBFC;}
.vl-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11.5px;font-weight:700;}
.vl-badge.ok{background:#E6F7F4;color:#0A7C70;}
.vl-badge.bad{background:#FEF0EF;color:#B4423A;}
.vl-badge.mid{background:#FEF3E8;color:#B87030;}
.vl-no-data{color:var(--muted);font-style:italic;font-size:13px;padding:20px 0;}
canvas.vl-canvas{width:100%;max-height:280px;}


/* Diagramm Zoom Popup */
.chart-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.chart-popup{background:#fff;border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:90vw;max-width:900px;position:relative;}
.chart-popup-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin:0 0 16px;color:var(--text);}
.chart-popup canvas{width:100% !important;height:400px !important;}
.chart-popup-close{position:absolute;top:16px;right:16px;background:var(--tmg);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
.vl-chart-wrap{cursor:zoom-in;transition:box-shadow 0.2s;}
.vl-chart-wrap:hover{box-shadow:0 6px 24px rgba(0,0,0,0.14);}


/* ===== Neue Features ===== */
.ranking-wrap{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.ranking-box{flex:1;min-width:240px;background:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 2px 12px rgba(0,0,0,0.07);}
.ranking-box .rb-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.ranking-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F5F7F9;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
.ranking-row:last-child{border-bottom:none;}
.ranking-row .rr-rank{color:var(--muted);font-size:11px;width:20px;}
.ranking-row .rr-name{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;flex:1;}
.ranking-row .rr-val{font-weight:700;}
.trend-up{color:#4CAF50;}
.trend-down{color:#E20074;}
.trend-flat{color:#64748B;}
.coaching-freq-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;}
.freq-ok{background:#E6F7F4;color:#0A7C70;}
.freq-warn{background:#FEF3E8;color:#B87030;}
.freq-late{background:#FEF0EF;color:#B4423A;}
.avg-line-label{font-size:9px;font-family:Inter,sans-serif;fill:#64748B;}


/* ===== Coaching Verlauf ===== */
.cv-agent-block{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.07);margin-bottom:16px;overflow:hidden;}
.cv-agent-head{background:linear-gradient(135deg,var(--tmg),var(--tmg-dark));color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;}
.cv-agent-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
.cv-entry{padding:14px 18px;border-bottom:1px solid #F5F7F9;display:flex;gap:14px;}
.cv-entry:last-child{border-bottom:none;}
.cv-entry-date{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--muted);min-width:90px;padding-top:2px;}
.cv-entry-text{font-family:'Inter',sans-serif;font-size:13px;color:var(--text);line-height:1.5;flex:1;white-space:pre-wrap;}
.cv-entry-delete{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;opacity:.5;}
.cv-entry-delete:hover{opacity:1;color:var(--red);}
.cv-empty{color:var(--muted);font-style:italic;font-size:13px;padding:16px 18px;}
.cv-filter{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.cv-filter select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);font-family:'Inter',sans-serif;font-size:13px;outline:none;}
.cv-filter input{padding:8px 12px;border-radius:8px;border:1px solid var(--border);font-family:'Inter',sans-serif;font-size:13px;outline:none;flex:1;min-width:150px;}

/* ===== Coaching Plan view ===== */
.cp-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.cp-card-header{display:flex;align-items:center;gap:12px;}
.cp-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;flex:1;}
.cp-team{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);padding:3px 8px;border-radius:5px;background:#F1F4F7;}
.cp-plan-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.cp-plan-area{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;min-height:70px;resize:vertical;outline:none;background:#FAFBFC;}
.cp-plan-area:focus{border-color:var(--teal);background:#fff;}
.cp-team-block{margin-bottom:26px;}
.cp-team-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin:0 0 10px;color:var(--text);}

#overview-capture{background:var(--bg);padding:4px;}
.ov-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:0 0 4px;color:var(--text);}
.ov-sub{font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);margin:0 0 20px;}
.ov-team{margin-bottom:24px;border-radius:20px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,0.08);}
.ov-team-head{background:linear-gradient(135deg,var(--tmg) 0%,var(--tmg-dark) 100%);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.ov-team-head .name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;letter-spacing:-.01em;}
.ov-team-head .targets{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#FFB3D9;}
.ov-grid{width:100%;background:#fff;font-size:0;}
.ov-header-row,.ov-data-row{display:grid;align-items:stretch;}
.ov-header-row{border-bottom:2px solid #EEF1F4;}
.ov-data-row{border-bottom:1px solid #F5F7F9;}
.ov-data-row:last-child{border-bottom:none;}
.ov-data-row:hover{background:#FAFBFC;}
.ov-cell{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;padding:9px 6px;text-align:center;display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
.ov-cell.head{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.05em;padding:10px 6px;flex-direction:column;gap:2px;}
.ov-cell.name-cell{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:var(--text);text-align:left;justify-content:flex-start;padding-left:18px;flex:0 1 auto;white-space:nowrap;}
.ov-cell.name-cell.head{justify-content:flex-start;padding-left:18px;}
.ov-cell.qual-cell{flex:0 0 78px;background:#F8FEFE;min-width:78px;}
.ov-cell.qual-cell.head{background:#F2FAF9;color:#0A7C70;border-bottom:2px solid #B8E0DC;}
.ov-cell.sales-cell{flex:0 0 80px;background:#FEFCF8;}
.ov-cell.sales-cell.head{background:#FDF9F4;color:#B87030;border-bottom:2px solid #F0D5B0;font-size:13px;font-weight:700;}
.ov-cell.cr-cell{flex:0 0 90px;background:#F8FEFE;}
.ov-cell.cr-cell.head{background:#F2FAF9;color:#0A7C70;border-bottom:2px solid #B8E0DC;}
.ov-badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.ov-badge.good{background:#E6F7F4;color:#0A7C70;}
.ov-badge.mid{background:#FEF3E8;color:#B87030;}
.ov-badge.zero{background:#FEF0EF;color:#B4423A;}
.ov-foot{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:12px;}
</style>
</head>

    ...options,

      'Content-Type': 'application/json',
      ...(options.headers||{})
    }
  });
  if(resp.status === 401){ await getToken(); return graphFetch(url, options); }
  return resp;
}

// Excel Live-Ticker Sync (Juli-Tab)
// Spalten: A=Name, B=Calls, C=MF NG, E=SU, G=BB, I=TV, K=VVM, Q=GESAMT CR, R=NPS
// ============================================================
const EXCEL_FILES = {
  "Trikala01": { path: "Trikala-Portal/MF ScozTR_01 Live Ticker.xlsx", sheet: "Juli" },
  "Trikala06": { path: "Trikala-Portal/FN ScozTR_06 Live Ticker.xlsx", sheet: "Juli" }
};

async function loadFromExcel(){
  if(!graphToken) return;
  setSyncStatus('syncing');
  let totalUpdated = 0;

  for(const [teamId, cfg] of Object.entries(EXCEL_FILES)){
    try {
      const url = `/me/drive/root:/${cfg.path}:/workbook/worksheets/${cfg.sheet}/range(address='A5:S80')`;
      const resp = await graphFetch(url);
      if(!resp.ok){
        console.error(`Excel ${teamId} fehlgeschlagen:`, resp.status, await resp.text());
        continue;
      }
      const data = await resp.json();
      const rows = data.values || [];

      rows.forEach(row => {
        const name = (row[0] || '').toString().trim();
        if(!name) return;
        const agent = state.agents.find(a =>
          a.name.trim().toLowerCase() === name.toLowerCase() &&
          String(a.team) === String(teamId)
        );
        if(!agent) return;
        if(row[1] !== null && row[1] !== '') agent.calls = parseFloat(row[1]) || 0;
        if(row[2] !== null && row[2] !== '') agent.sales['MF']  = parseFloat(row[2]) || 0;
        if(row[4] !== null && row[4] !== '') agent.sales['SU']  = parseFloat(row[4]) || 0;
        if(row[6] !== null && row[6] !== '') agent.sales['BB']  = parseFloat(row[6]) || 0;
        if(row[8] !== null && row[8] !== '') agent.sales['TV']  = parseFloat(row[8]) || 0;
        const vvmKey = agent.team === 'Trikala06' ? 'VVM+NVM' : 'VVM+BOJ';
        if(row[10] !== null && row[10] !== '') agent.sales[vvmKey] = parseFloat(row[10]) || 0;
        if(row[17] !== null && row[17] !== '' && parseFloat(row[17]) > 0) agent.nps = parseFloat(row[17]);
        if(row[18] !== null && row[18] !== '' && parseFloat(row[18]) > 0) agent.lq  = parseFloat(row[18]);
        totalUpdated++;
      });
    } catch(e){
      console.error(`Excel ${teamId} Fehler:`, e);
    }
  }

  if(totalUpdated > 0){
    renderAll();
    scheduleSave();
    setSyncStatus('ok');
    const now = new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    const lbl = document.getElementById('excel-sync-label');
    if(lbl) lbl.textContent = `Excel: ${totalUpdated} MA · ${now}`;
  } else {
    setSyncStatus('error');
  }
}

function uid(){ return 'a' + Math.random().toString(36).slice(2,9); }

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && parsed.agents && parsed.agents.length){ state = parsed; }
    }
  }catch(e){ /* kein gespeicherter Stand */ }
  initMsal();
  if(!state.agents.length){
    state.agents = SEED_AGENTS.map(a => ({ id: uid(), ...JSON.parse(JSON.stringify(a)) }));
    scheduleSave();
  }
  renderAll();
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
    catch(e){ console.error('Lokales Speichern fehlgeschlagen', e); }
    if(graphToken) saveToSharePoint();
  }, 400);
}

function trafficStatus(val, target){
  if(val >= target) return 'good';
  if(!val || val <= 0) return 'zero';
  return 'mid';
}
function makeAgent(team){
  const cfg = TEAM_CONFIGS[team];
  const sales = {};
  cfg.products.forEach(p=>{ sales[p] = 0; });
  return { id: uid(), name: '', team: team, category: 'regular', calls: 0, nps: 0, lq: 0, sales, coachingplan: '' };
}

function totalStk(agent){
  const cfg = TEAM_CONFIGS[agent.team];
  return cfg.products.reduce((s,p)=> s + (agent.sales[p]||0), 0);
}
function totalCr(agent){
  if(!agent.calls || agent.calls <= 0) return 0;
  return (totalStk(agent) / agent.calls) * 100;
}
function agentTargets(agent){
  const cfg = TEAM_CONFIGS[agent.team];
  return cfg.targets[agent.category || 'regular'];
}
function evaluateAgent(agent){
  const cfg = TEAM_CONFIGS[agent.team];
  const targets = agentTargets(agent);
  const tags = [];
  if(agent.nps && agent.nps > 0 && agent.nps < cfg.npsTarget) tags.push('NPS');
  if(agent.lq && agent.lq > 0 && agent.lq < cfg.lqTarget) tags.push('LQ');
  cfg.products.forEach((p,i)=>{
    const val = agent.sales[p]||0;
    if(val < targets[i]) tags.push(p + ' Stück');
  });
  if(totalCr(agent) < cfg.crTarget) tags.push('Gesamt-CR');

  let status = 'ok';
  if(tags.length === 1) status = 'warn';
  if(tags.length >= 2) status = 'critical';
  return { tags, status };
}

function numField(labelText, value, onChange, step){
  const wrap = document.createElement('div');
  wrap.className = 'metric-field';
  const label = document.createElement('label');
  label.textContent = labelText;
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = step ? 'decimal' : 'numeric';
  const parsed = parseFloat(value) || 0;
  input.value = step ? parsed.toFixed(2) : Math.round(parsed).toString();
  input.addEventListener('change', e=>{ onChange(parseFloat(e.target.value.replace(',','.'))||0); scheduleSave(); renderAll(); });
  wrap.appendChild(label); wrap.appendChild(input);
  return wrap;
}

let cvSelectedTeam = 'all';
let cvSearchText = '';

function renderCoachVerlauf(){
  const container = document.getElementById('coachverlauf-container');
  container.innerHTML = '';

  // Filter-Leiste
  const filter = document.createElement('div');
  filter.className = 'cv-filter';

  const teamSel = document.createElement('select');
  teamSel.innerHTML = '<option value="all">Alle Teams</option>' +
    Object.entries(TEAM_CONFIGS).map(([k,v])=>`<option value="${k}" ${cvSelectedTeam===k?'selected':''}>${v.label}</option>`).join('');
  teamSel.addEventListener('change', e=>{ cvSelectedTeam=e.target.value; renderCoachVerlauf(); });

  const search = document.createElement('input');
  search.placeholder = 'Mitarbeiter suchen...';
  search.value = cvSearchText;
  search.addEventListener('input', e=>{ cvSearchText=e.target.value; renderCoachVerlauf(); });

  const countEl = document.createElement('span');
  countEl.style.cssText = 'font-family:"Inter",sans-serif;font-size:12px;color:var(--muted);';

  filter.appendChild(teamSel);
  filter.appendChild(search);
  filter.appendChild(countEl);
  container.appendChild(filter);

  // Einträge anzeigen
  let totalEntries = 0;
  const entries = Object.values(state.coachverlauf)
    .filter(cv => {
      if(cvSelectedTeam !== 'all' && cv.team !== cvSelectedTeam) return false;
      if(cvSearchText && !cv.name.toLowerCase().includes(cvSearchText.toLowerCase())) return false;
      return cv.eintraege && cv.eintraege.length > 0;
    })
    .sort((a,b) => {
      // Neuestes Coaching zuerst
      const da = a.eintraege[0]?.datum.split('.').reverse().join('-') || '';
      const db = b.eintraege[0]?.datum.split('.').reverse().join('-') || '';
      return db.localeCompare(da);
    });

  if(entries.length === 0){
    const empty = document.createElement('div');
    empty.style.cssText = 'color:var(--muted);font-style:italic;font-size:13px;padding:20px 0;';
    empty.textContent = 'Noch keine Coaching-Einträge vorhanden.';
    container.appendChild(empty);
    return;
  }

  entries.forEach(cv => {
    totalEntries += cv.eintraege.length;
    const block = document.createElement('div');
    block.className = 'cv-agent-block';

    const head = document.createElement('div');
    head.className = 'cv-agent-head';
    const teamLabel = TEAM_CONFIGS[cv.team]?.label || cv.team;
    head.innerHTML = `<span class="cv-agent-name">${cv.name}</span><span style="font-size:11px;opacity:.8;">${teamLabel} · ${cv.eintraege.length} Coaching${cv.eintraege.length>1?'s':''}</span>`;
    block.appendChild(head);

    cv.eintraege.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'cv-entry';

      const dateEl = document.createElement('div');
      dateEl.className = 'cv-entry-date';
      dateEl.textContent = entry.datum;

      const textEl = document.createElement('div');
      textEl.className = 'cv-entry-text';
      textEl.textContent = entry.text;

      const delBtn = document.createElement('button');
      delBtn.className = 'cv-entry-delete';
      delBtn.innerHTML = '🗑';
      delBtn.title = 'Eintrag löschen';
      delBtn.addEventListener('click', ()=>{
        const agentKey = Object.keys(state.coachverlauf).find(k=>state.coachverlauf[k]===cv);
        cv.eintraege = cv.eintraege.filter(e=>e.id!==entry.id);
        scheduleSave();
        renderCoachVerlauf();
      });

      row.appendChild(dateEl);
      row.appendChild(textEl);
      row.appendChild(delBtn);
      block.appendChild(row);
    });

    container.appendChild(block);
  });

  countEl.textContent = `${entries.length} Mitarbeiter · ${totalEntries} Einträge`;
}

        if(!state.coachverlauf[agentKey]){
          state.coachverlauf[agentKey] = { name: agent.name, team: agent.team, eintraege: [] };
        }
        state.coachverlauf[agentKey].eintraege.unshift({
          datum: datum,
          text: text || '(Coaching ohne Notiz)',
          id: uid()
        });

        agent.coachingplan = '';

      coachFooter.appendChild(coachBtn);
      card.appendChild(coachFooter);

      block.appendChild(card);

    container.appendChild(block);
